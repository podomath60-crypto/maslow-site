<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="theme-color" content="#f7f9fc">
  <title>전국 물류창고 검색 | MASLOW</title>
  <link rel="stylesheet" href="/warehouse/warehouse.css">
</head>
<body>
  <main class="page-shell">
    <section class="top-panel panel">
      <div class="topbar">
        <div class="title-wrap">
          <div class="brand">MASLOW LOGISTICS DATABASE</div>
          <div class="title-line">
            <h1>전국 물류창고 검색</h1>
            <span id="resultCount" class="result-count">0건</span>
          </div>
          <p>지역·유형·면적을 빠르게 조합하고, 정렬은 누른 순서대로 중복 적용합니다.</p>
        </div>
        <div class="search-tools">
          <label class="search-box">
            <span class="search-icon">⌕</span>
            <input id="keywordInput" type="search" autocomplete="off" placeholder="상호명 · 사업자번호 · 주소 · 취급품목">
          </label>
          <button id="resetAllBtn" class="reset-btn" type="button">초기화</button>
        </div>
      </div>

      <div id="activeFilters" class="active-filters summary-bar" hidden></div>
      <div id="activeSorts" class="active-sorts summary-bar" hidden></div>

      <div class="toolbar-grid">
        <section class="filter-card region-card">
          <div class="section-head compact">
            <h2>광역시도</h2>
            <button id="clearRegionBtn" class="text-btn" type="button">해제</button>
          </div>
          <div id="regionChips" class="chip-grid region-chips"></div>
        </section>

        <section class="filter-card mix-card">
          <div class="section-block">
            <div class="section-head compact">
              <h2>창고 유형</h2>
              <button id="clearTypeBtn" class="text-btn" type="button">해제</button>
            </div>
            <div id="typeChips" class="chip-row"></div>
          </div>

          <div class="section-block">
            <div class="section-head compact">
              <h2>총면적</h2>
              <button id="clearAreaBtn" class="text-btn" type="button">해제</button>
            </div>
            <div id="areaChips" class="chip-row"></div>
          </div>
        </section>

        <section class="filter-card sort-card">
          <div class="section-head compact sort-head">
            <div class="sort-head-left">
              <h2>다중 정렬</h2>
              <span class="sort-guide">누른 순서가 우선</span>
            </div>
            <button id="clearSortBtn" class="text-btn" type="button">해제</button>
          </div>
          <div id="sortChips" class="chip-row sort-chips"></div>
        </section>
      </div>
    </section>

    <section class="results-panel panel">
      <div class="results-head compact-head">
        <div class="results-left">
          <strong id="resultCaption" class="result-caption"></strong>
        </div>
        <div class="view-tools">
          <label class="page-size-label">표시
            <select id="pageSizeSelect">
              <option value="50">50개</option>
              <option value="100" selected>100개</option>
              <option value="200">200개</option>
            </select>
          </label>
        </div>
      </div>

      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th class="col-no">#</th>
              <th>상호명</th>
              <th>소재지</th>
              <th class="num">총면적</th>
              <th class="num">일반</th>
              <th class="num">냉동·냉장</th>
              <th>취급품목</th>
              <th class="col-action">보기</th>
            </tr>
          </thead>
          <tbody id="resultBody"></tbody>
        </table>
      </div>
      <div id="emptyState" class="empty-state" hidden>조건에 맞는 창고가 없습니다.</div>
      <div id="pagination" class="pagination"></div>
    </section>
  </main>

  <div id="detailBackdrop" class="detail-backdrop" hidden></div>
  <aside id="detailDrawer" class="detail-drawer" aria-hidden="true">
    <div class="drawer-head">
      <div>
        <div class="drawer-eyebrow">WAREHOUSE DETAIL</div>
        <h2 id="detailName"></h2>
      </div>
      <button id="closeDetailBtn" class="close-btn" type="button" aria-label="닫기">×</button>
    </div>
    <div id="detailContent" class="drawer-content"></div>
  </aside>

  <script src="/search/bjdong-codes.js"></script>
  <script src="/assets/region/region-compat.js"></script>
  <script src="/assets/warehouse/warehouse-meta.js"></script>
  <script src="/assets/warehouse/warehouse-data.js"></script>
  <script src="/assets/warehouse/warehouse-address.js"></script>
  <script src="/warehouse/warehouse.js"></script>
</body>
</html>
