/* Carpet guide behavior:
   - Initial state keeps the centered rectangular overlay.
   - Once docking starts, the overlay box/text disappear and only the carpet flies.
   - Docked state remains carpet-only and clickable for reload. */
.mapCarpetHero{
  transform-origin:50% 58%;
  animation:carpetOnlyFlutter 2.2s ease-in-out infinite!important;
}
.mapGuide.mapGuideDocking,
.mapGuide.mapGuideDocked{
  background:transparent!important;
  border:0!important;
  box-shadow:none!important;
  backdrop-filter:none!important;
  -webkit-backdrop-filter:none!important;
  padding:0!important;
  border-radius:0!important;
  overflow:visible!important;
}
.mapGuide.mapGuideDocking strong,
.mapGuide.mapGuideDocking span,
.mapGuide.mapGuideDocked strong,
.mapGuide.mapGuideDocked span{
  display:none!important;
}
.mapGuide.mapGuideDocking .mapCarpetHero{
  animation:carpetDockHeroJourneyClean 3s cubic-bezier(.22,.72,.18,1) both!important;
}
.mapGuide.mapGuideDocked .mapCarpetHero{
  animation:carpetOnlyDockedFlutter 2.4s ease-in-out infinite!important;
}
@keyframes carpetOnlyFlutter{
  0%,100%{transform:translateY(0) rotate(-3deg)}
  18%{transform:translateY(-5px) rotate(3deg)}
  38%{transform:translateY(2px) rotate(-4deg)}
  58%{transform:translateY(-7px) rotate(4deg)}
  78%{transform:translateY(1px) rotate(-3deg)}
}
@keyframes carpetOnlyDockedFlutter{
  0%,100%{transform:translateY(0) rotate(-3deg)}
  25%{transform:translateY(-3px) rotate(3deg)}
  50%{transform:translateY(1px) rotate(-4deg)}
  75%{transform:translateY(-2px) rotate(2deg)}
}

<script>
const $=id=>document.getElementById(id);
const startInput=$('start'), visitsInput=$('visits'), endInput=$('end'), returnChk=$('returnToStart');
const statusEl=$('status'), totalTimeEl=$('totalTime'), resultEl=$('result'), panelBody=$('panelBody');
const mapWrap=$('mapWrap'), mapGuide=$('mapGuide');
let naverMap=null, markers=[], polylines=[], latestResult=null;
let routeRunSeq=0;

function dockMapGuide(){
  if(!mapGuide||mapGuide.classList.contains('mapGuideDocked')||mapGuide.classList.contains('mapGuideDocking'))return;
  mapGuide.classList.remove('hide');

  const wrapRect=mapWrap.getBoundingClientRect();
  const carpet=mapGuide.querySelector('.mapCarpetHero');
  const guideRect=mapGuide.getBoundingClientRect();
  const carpetRect=carpet?carpet.getBoundingClientRect():guideRect;
  const isMobile=window.matchMedia('(max-width:760px)').matches;

  const startW=carpetRect.width||guideRect.width;
  const startH=carpetRect.height||guideRect.height;
  const startX=carpetRect.left-wrapRect.left+startW/2;
  const startY=carpetRect.top-wrapRect.top+startH/2;

  const endW=isMobile?44:67;
  const endH=endW;
  const endLeft=isMobile?12:14;
  const endTop=isMobile?6:14;
  const endX=endLeft+endW/2;
  const endY=endTop+endH/2;

  // One continuous cubic Bezier curve: P0(start) -> P1(right/up) -> P2(right/down loop) -> P3(dock).
  // No straight-line keyframe segments, so the carpet rides one smooth butterfly-like curve.
  const p0={x:startX,y:startY};
  const p1={x:Math.min(wrapRect.width-24,startX+wrapRect.width*.34),y:Math.max(24,startY-wrapRect.height*.34)};
  const p2={x:Math.min(wrapRect.width-24,startX+wrapRect.width*.50),y:Math.min(wrapRect.height-24,startY+wrapRect.height*.34)};
  const p3={x:endX,y:endY};

  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  const bezier=(a,b,c,d,t)=>{
    const mt=1-t;
    return mt*mt*mt*a+3*mt*mt*t*b+3*mt*t*t*c+t*t*t*d;
  };
  const lerp=(a,b,t)=>a+(b-a)*t;
  const duration=3000;
  let startedAt=0;

  mapGuide.classList.add('mapGuideDocking');
  mapGuide.style.left=(startX-startW/2)+'px';
  mapGuide.style.top=(startY-startH/2)+'px';
  mapGuide.style.width=startW+'px';
  mapGuide.style.height=startH+'px';
  mapGuide.style.transform='translate3d(0,0,0)';
  if(carpet){
    carpet.style.width=startW+'px';
    carpet.style.maxWidth=startW+'px';
    carpet.style.transform='translate3d(0,0,0) rotate(-3deg)';
  }

  function step(ts){
    if(!startedAt)startedAt=ts;
    const raw=Math.min(1,(ts-startedAt)/duration);
    const t=ease(raw);
    const x=bezier(p0.x,p1.x,p2.x,p3.x,t);
    const y=bezier(p0.y,p1.y,p2.y,p3.y,t);
    const w=lerp(startW,endW,t);
    const h=lerp(startH,endH,t);

    mapGuide.style.left=(x-w/2)+'px';
    mapGuide.style.top=(y-h/2)+'px';
    mapGuide.style.width=w+'px';
    mapGuide.style.height=h+'px';
    mapGuide.style.padding='0';
    mapGuide.style.border='0';
    mapGuide.style.background='transparent';
    mapGuide.style.boxShadow='none';
    mapGuide.style.transform='translate3d(0,0,0)';

    if(carpet){
      const wing=Math.sin(raw*Math.PI*4)*2.4;
      const settle=lerp(1,.35,t);
      const angle=lerp(-3, -3 + wing*settle, 1);
      carpet.style.width=w+'px';
      carpet.style.maxWidth=w+'px';
      carpet.style.transform=`translate3d(0,0,0) rotate(${angle}deg)`;
    }

    if(raw<1){
      requestAnimationFrame(step);
      return;
    }

    mapGuide.classList.add('mapGuideDocked');
    mapGuide.classList.remove('mapGuideDocking');
    mapGuide.style.left=endLeft+'px';
    mapGuide.style.top=endTop+'px';
    mapGuide.style.width=endW+'px';
    mapGuide.style.height=endH+'px';
    mapGuide.style.padding='';
    mapGuide.style.border='';
    mapGuide.style.background='';
    mapGuide.style.boxShadow='';
    mapGuide.style.transform='';
    if(carpet){
      carpet.style.width='';
      carpet.style.maxWidth='';
      carpet.style.transform='';
    }
  }
  requestAnimationFrame(step);
}
if(mapWrap&&mapGuide){
  mapWrap.addEventListener('pointerdown',e=>{
    if(mapGuide.contains(e.target))return;
    dockMapGuide();
  },{capture:true});
  mapGuide.addEventListener('click',e=>{
    if(!mapGuide.classList.contains('mapGuideDocked'))return;
    e.preventDefault();
    e.stopPropagation();
    window.location.reload();
  });
}

function esc(v){return String(v||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function normalizeAddress(v){return String(v||'').trim().replace(/\s+/g,' ')}
function uniqueLines(text){const seen=new Set(), out=[];String(text||'').replace(/\r/g,'\n').split(/[\n,]+/).map(normalizeAddress).filter(Boolean).forEach(a=>{const key=a.toLowerCase();if(!seen.has(key)){seen.add(key);out.push(a)}});return out}
function formatVisitsInput(addComma=false){const items=uniqueLines(visitsInput.value);visitsInput.value=items.length?items.join(', ')+(addComma?', ':''):''}
function showStatus(msg,type=''){statusEl.className='status show'+(type?' '+type:'');statusEl.innerHTML=esc(msg)}
function showProgress(msg,done,total){const pct=total?Math.round(done/total*100):0;statusEl.className='status show';statusEl.innerHTML=`${esc(msg)}<div class="progress"><span style="width:${pct}%"></span></div>`}
function formatDuration(ms){const minutes=Math.max(0,Math.round(Number(ms||0)/60000));const h=Math.floor(minutes/60),m=minutes%60;return h?(m?`${h}시간 ${m}분`:`${h}시간`):`${m}분`}
function formatDistance(m){const n=Number(m||0);return n>=1000?`${(n/1000).toFixed(n>=10000?0:1)}km`:`${Math.round(n)}m`}
function coordKey(a,b){return `${a.id}->${b.id}`}
function hasCoord(p){return p&&Number.isFinite(Number(p.lat))&&Number.isFinite(Number(p.lng))}
function getNaverMaps(){return window.naver&&window.naver.maps?window.naver.maps:null}
function setBusy(b){$('findRoute').disabled=b;startInput.disabled=b;visitsInput.disabled=b;endInput.disabled=b||returnChk.checked;returnChk.disabled=b;if($('currentStart'))$('currentStart').disabled=b;if($('officeEnd'))$('officeEnd').disabled=b||returnChk.checked;if($('currentEnd'))$('currentEnd').disabled=b||returnChk.checked}
function resetResult(){latestResult=null;totalTimeEl.textContent='--';resultEl.classList.remove('show');clearMap();mapGuide.classList.remove('hide')}
function scrollPanelTop(){if(panelBody)panelBody.scrollTo({top:0,behavior:'auto'})}
function focusPanelTopSoon(){scrollPanelTop();setTimeout(scrollPanelTop,0);setTimeout(scrollPanelTop,80)}

function parseInputs(){
  const start=normalizeAddress(startInput.value);
  const visits=uniqueLines(visitsInput.value);
  const returnChecked=returnChk.checked;
  const typedEnd=normalizeAddress(endInput.value);
  const sameStartEnd=!returnChecked&&start&&typedEnd&&start.toLowerCase()===typedEnd.toLowerCase();
  const returnToStart=returnChecked||sameStartEnd;
  const end=returnToStart?start:typedEnd;

  if(!start)throw new Error('출발지를 입력하세요.');
  if(visits.length>8)throw new Error('경유지는 최대 8개까지 계산합니다.');
  if(!returnToStart&&!end)throw new Error('도착지를 입력하거나 출발지로 복귀를 체크하세요.');
  if(returnToStart&&!visits.length)throw new Error('출발지와 도착지가 같거나 출발지로 복귀하는 계산은 경유지가 1개 이상 필요합니다.');

  return {start,visits,end,returnToStart,sameStartEnd};
}

async function geocodeAddress(address,label,index,total){
  showProgress(`주소 좌표 변환 중 ${index}/${total} · ${label}`,index-1,total);
  const res=await fetch('/api/route-setting/geocode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:address})});
  const data=await res.json().catch(()=>null);
  if(!res.ok||!data||!data.ok||!data.item){
    const err=new Error(`${label} 주소를 찾지 못했습니다: ${address}`);
    err.code='GEOCODE_NOT_FOUND';
    err.label=label;
    err.address=address;
    throw err;
  }
  return {...data.item,address,originalAddress:address,resolvedAddress:data.item.resolvedAddress||data.item.jibunAddress||data.item.roadAddress||data.item.address||address,label};
}

function showAddressLookupError(err){
  const label=err&&err.label?err.label:'입력한';
  const address=err&&err.address?err.address:'';
  totalTimeEl.textContent='--';
  latestResult=null;
  $('resultSummary').textContent='주소 확인 필요';
  $('routeList').innerHTML=`<div class="addressErrorBox"><strong>주소를 찾지 못해 최단경로 계산을 중단했습니다.</strong><div>${esc(label)} 주소 형식을 확인해 주세요.</div>${address?`<div class="addressErrorAddress">${esc(address)}</div>`:''}<div class="addressErrorGuide">도로명주소나 지번주소를 시/군/구까지 포함해 다시 입력한 뒤 최단경로 찾기를 눌러 주세요.</div></div>`;
  resultEl.classList.add('show');
  focusPanelTopSoon();
  showStatus(`주소를 찾지 못했습니다. ${label} 주소 형식을 확인해 주세요.${address?' · '+address:''}`,'err');
}

async function directionBetween(a,b){
  const res=await fetch('/api/route-setting/directions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({start:{lat:a.lat,lng:a.lng},goal:{lat:b.lat,lng:b.lng}})});
  const data=await res.json().catch(()=>null);
  if(!res.ok||!data||!data.ok||!data.summary){
    const err=new Error(`${a.label} → ${b.label} 구간 시간을 확인하지 못했습니다.`);
    err.code='DIRECTION_FAILED';
    err.from=a;
    err.to=b;
    err.status=res.status;
    err.responseMessage=data&&data.message?data.message:'';
    throw err;
  }
  return data;
}

function showDirectionLookupError(err){
  const from=err&&err.from?err.from:null;
  const to=err&&err.to?err.to:null;
  const fromLabel=from&&(from.label||from.id)?(from.label||from.id):'출발';
  const toLabel=to&&(to.label||to.id)?(to.label||to.id):'도착';
  const fromAddress=from?(from.address||from.originalAddress||from.resolvedAddress||''):'';
  const toAddress=to?(to.address||to.originalAddress||to.resolvedAddress||''):'';
  totalTimeEl.textContent='--';
  latestResult=null;
  $('resultSummary').textContent='시간 조회 확인 필요';
  $('routeList').innerHTML=`<div class="addressErrorBox"><strong>구간 시간을 확인하지 못해 최단경로 계산을 중단했습니다.</strong><div>${esc(fromLabel)} → ${esc(toLabel)} 구간 차량 경로를 확인해 주세요.</div><div class="addressErrorAddress">${esc(fromLabel)}: ${esc(fromAddress)}<br>${esc(toLabel)}: ${esc(toAddress)}</div><div class="addressErrorGuide">주소 좌표 변환은 완료됐지만, 네이버 경로/시간 조회에서 이 구간 응답이 실패했습니다. 두 지점이 차량 경로로 연결되는지, 주소가 실제 진입 가능한 위치인지 확인해 주세요.</div></div>`;
  resultEl.classList.add('show');
  focusPanelTopSoon();
  showStatus(`구간 시간을 확인하지 못했습니다. ${fromLabel} → ${toLabel} 구간을 확인해 주세요.`,'err');
}

async function mapLimit(items,limit,worker,onProgress){
  const results=new Array(items.length);let next=0,done=0;
  async function run(){while(next<items.length){const i=next++;results[i]=await worker(items[i],i);done++;if(onProgress)onProgress(done,items.length,items[i],i)}}
  await Promise.all(Array.from({length:Math.min(limit,items.length)},run));
  return results;
}

function permutations(arr){
  const res=[];const used=new Array(arr.length).fill(false);const cur=[];
  function backtrack(){if(cur.length===arr.length){res.push(cur.slice());return}for(let i=0;i<arr.length;i++){if(used[i])continue;used[i]=true;cur.push(arr[i]);backtrack();cur.pop();used[i]=false}}
  backtrack();return res;
}

function evaluateBest(start,visits,end,matrix){
  let best=null;const orders=permutations(visits);
  for(const order of orders){
    const route=[start,...order,end];let durationMs=0,distanceM=0,segments=[],ok=true;
    for(let i=0;i<route.length-1;i++){
      const from=route[i],to=route[i+1];const d=matrix.get(coordKey(from,to));
      if(!d){ok=false;break}
      durationMs+=Number(d.summary.durationMs||0);distanceM+=Number(d.summary.distanceM||0);
      segments.push({from,to,summary:d.summary,path:d.path||[]});
    }
    if(!ok)continue;
    if(!best||durationMs<best.durationMs)best={route,durationMs,distanceM,segments,orderCount:orders.length};
  }
  if(!best)throw new Error('추천 순서를 계산하지 못했습니다.');
  return best;
}

function makeRouteLabel(point,idx,total,returnToStart){
  if(idx===0)return {label:'A',type:'start',text:`출발지: ${point.address}`};
  if(idx===total-1)return {label:returnToStart?'A':'Z',type:returnToStart?'start':'end',text:returnToStart?'출발지 복귀':`도착지: ${point.address}`};
  return {label:String(idx),type:'stop',text:point.address};
}

function routeTextHtml(meta){
  if(meta.type==='start'&&meta.text.startsWith('출발지: '))return `<span class="muted">출발지:</span> ${esc(meta.text.replace('출발지: ',''))}`;
  if(meta.type==='end'&&meta.text.startsWith('도착지: '))return `<span class="muted">도착지:</span> ${esc(meta.text.replace('도착지: ',''))}`;
  return esc(meta.text);
}

function renderResult(best,returnToStart){

    const meta=makeRouteLabel(p,i,best.route.length,returnToStart);

    const segmentHtml=seg?`<div class="segmentBetween"><div class="segmentBlank"></div><div class="segmentRight"><span class="segmentBracket" aria-hidden="true"></span><div class="segmentText">${esc(seg.summary.durationText)} · ${esc(seg.summary.distanceText)}</div><button class="segOpen" type="button" data-seg="${i}" title="이 구간 네이버 경로 조회" aria-label="${esc(seg.from.address)}에서 ${esc(seg.to.address)} 구간 네이버 경로 조회">🚗</button></div></div>`:'';
    return `<div class="routeItem"><div class="routeMain"><strong class="routeBadge ${badgeClass}">${esc(meta.label)}</strong><div class="routeText">${routeTextHtml(meta)}</div></div>${segmentHtml}</div>`;
  }).join('');
  $('routeList').querySelectorAll('.segOpen').forEach(btn=>{btn.onclick=()=>openSegmentNaver(Number(btn.dataset.seg))});
  resultEl.classList.add('show');

function makeIcon(label,type){const maps=getNaverMaps();const color=type==='start'?'#03c75a':type==='stop'?'#2563eb':'#111827';return {content:`<div style="width:36px;height:36px;border-radius:999px 999px 999px 0;transform:rotate(-45deg);background:${color};border:3px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.22);display:grid;place-items:center"><span style="transform:rotate(45deg);color:#fff;font-weight:950;font-size:12px">${esc(label)}</span></div>`,anchor:maps?new maps.Point(18,36):undefined}}
function clearMap(){markers.forEach(m=>m.setMap(null));polylines.forEach(l=>l.setMap(null));markers=[];polylines=[]}
function refreshMap(){const maps=getNaverMaps();if(!maps||!naverMap)return;setTimeout(()=>{try{maps.Event.trigger(naverMap,'resize')}catch(e){}},60);setTimeout(()=>{try{maps.Event.trigger(naverMap,'resize')}catch(e){}},260)}
function renderMapResult(best,returnToStart){
  const maps=getNaverMaps();if(!maps||!naverMap)return;clearMap();mapGuide.classList.add('hide');
  const bounds=new maps.LatLngBounds();
  best.route.forEach((p,i)=>{if(returnToStart&&i===best.route.length-1)return;const meta=makeRouteLabel(p,i,best.route.length,returnToStart);const pos=new maps.LatLng(p.lat,p.lng);bounds.extend(pos);markers.push(new maps.Marker({position:pos,map:naverMap,title:`${meta.label}. ${p.address}`,icon:makeIcon(meta.label,meta.type)}))});
  best.segments.forEach(seg=>{const path=(seg.path&&seg.path.length?seg.path:[seg.from,seg.to]).filter(hasCoord);if(path.length){polylines.push(new maps.Polyline({map:naverMap,path:path.map(x=>new maps.LatLng(x.lat,x.lng)),strokeColor:'#0f172a',strokeWeight:4,strokeOpacity:.58,strokeStyle:'solid'}))}});
  try{if(best.route.length>1)naverMap.fitBounds(bounds,{top:70,right:70,bottom:70,left:70});else naverMap.setCenter(new maps.LatLng(best.route[0].lat,best.route[0].lng));}catch(e){}
  refreshMap();
}

function pointForNaver(p,name){return `${p.lng},${p.lat},${encodeURIComponent(name||p.address)},,ADDRESS_POI`}
function buildNaverDirectionsUrl(){
  if(!latestResult)return '#';
  const r=latestResult.route;const returnToStart=latestResult.returnToStart;const start=r[0];const goal=r[r.length-1];
  const waypointPoints=r.slice(1,-1).map(p=>pointForNaver(p,p.address||p.resolvedAddress||'경유지')).join(':')||'-';
  const goalName=returnToStart?(start.address||start.resolvedAddress||'출발지 복귀'):(goal.address||goal.resolvedAddress||'도착지');
  return `https://map.naver.com/p/directions/${pointForNaver(start,start.address||start.resolvedAddress||'출발지')}/${pointForNaver(goal,goalName)}/${waypointPoints}/car`;
}
function buildSegmentDirectionsUrl(segment,idx){
  if(!segment)return '#';
  const fromName=segment.from.address||segment.from.resolvedAddress||'출발지';
  const toName=segment.to.address||segment.to.resolvedAddress||'도착지';
  return `https://map.naver.com/p/directions/${pointForNaver(segment.from,fromName)}/${pointForNaver(segment.to,toName)}/-/car`;
}
function openSegmentNaver(idx){
  if(!latestResult||!latestResult.segments||!latestResult.segments[idx])return;
  const url=buildSegmentDirectionsUrl(latestResult.segments[idx],idx);
  if(url&&url!=='#')window.open(url,'_blank','noopener,noreferrer');
}
function resultText(){
  if(!latestResult)return '';
  const r=latestResult;const lines=[];lines.push('최단 경로 결과','');lines.push(`총 예상 운행시간: ${formatDuration(r.durationMs)}`);lines.push(`총 예상 거리: ${formatDistance(r.distanceM)}`,'');lines.push('추천 순서');
  r.route.forEach((p,i)=>{const meta=makeRouteLabel(p,i,r.route.length,r.returnToStart);lines.push(`${meta.label}. ${meta.text}`)});lines.push('','구간별 시간');
  r.segments.forEach((s,i)=>{const from=makeRouteLabel(s.from,i,r.route.length,r.returnToStart).label;const to=makeRouteLabel(s.to,i+1,r.route.length,r.returnToStart).label;lines.push(`${from} → ${to}: ${s.summary.durationText} · ${s.summary.distanceText}`)});
  return lines.join('\n');
}

async function findRoute(){
  const runId=++routeRunSeq;
  const assertActive=()=>{
    if(runId!==routeRunSeq){
      const err=new Error('이전 최단경로 계산을 중단했습니다.');
      err.code='ROUTE_CANCELLED';
      throw err;
    }
  };
  try{
    resetResult();
    showStatus('최단경로 계산을 시작합니다. 주소 좌표를 확인하는 중입니다.');
    focusPanelTopSoon();
    setBusy(true);
    const input=parseInputs();
    const labels=input.returnToStart
      ? ['A',...input.visits.map((_,i)=>String.fromCharCode(66+i))]
      : ['A',...input.visits.map((_,i)=>String.fromCharCode(66+i)),'Z'];
    const raw=input.returnToStart
      ? [input.start,...input.visits]
      : [input.start,...input.visits,input.end];
    const totalGeo=raw.length;const resolved=[];
    for(let i=0;i<raw.length;i++){
      assertActive();
      const item=await geocodeAddress(raw[i],labels[i],i+1,totalGeo);
      assertActive();
      if(!hasCoord(item)){
        const err=new Error(`${labels[i]} 주소 좌표를 확인하지 못했습니다: ${raw[i]}`);
        err.code='GEOCODE_NOT_FOUND';
        err.label=labels[i];
        err.address=raw[i];
        throw err;
      }
      resolved.push(item);
    }
    assertActive();
    const start={id:'A',role:'start',...resolved[0]};
    const visits=resolved.slice(1,1+input.visits.length).map((p,i)=>({id:`V${i+1}`,role:'visit',...p}));
    const end=input.returnToStart?start:{id:'Z',role:'end',...resolved[resolved.length-1]};
    const nodes=input.returnToStart?[start,...visits]:[start,...visits,end];
    const pairs=[];
    if(!visits.length){
      pairs.push([start,end]);
    }else{
      for(const a of nodes){for(const b of nodes){if(a.id!==b.id)pairs.push([a,b])}}
    }
    const matrix=new Map();
    await mapLimit(pairs,4,async(pair)=>{
      assertActive();
      const [a,b]=pair;
      const data=await directionBetween(a,b);
      assertActive();
      matrix.set(coordKey(a,b),data);
      return data;
    },(done,total,pair)=>{
      if(runId!==routeRunSeq)return;
      showProgress(`구간 시간 조회 중 ${done}/${total} · ${pair[0].label||pair[0].id} → ${pair[1].label||pair[1].id}`,done,total);
    });
    assertActive();
    showStatus('추천 순서 계산 중...');
    const best=evaluateBest(start,visits,end,matrix);
    assertActive();
    showStatus(`${best.orderCount.toLocaleString('ko-KR')}개 경로 검토 후 최적 경로 도출 완료`,'ok');
    renderResult(best,input.returnToStart);
  }catch(e){
    if(e&&e.code==='GEOCODE_NOT_FOUND'){
      routeRunSeq++;
      showAddressLookupError(e);
    }else if(e&&e.code==='DIRECTION_FAILED'){
      routeRunSeq++;
      showDirectionLookupError(e);
    }else if(e&&e.code==='ROUTE_CANCELLED'){
      return;
    }else{
      routeRunSeq++;
      showStatus(e.message||'최단경로 계산 중 오류가 발생했습니다.','err');
    }
  }finally{if(runId===routeRunSeq)setBusy(false);endInput.disabled=returnChk.checked}
}

function waitForNaverMaps(retry=0){const maps=getNaverMaps();const el=$('naverMap');if(maps&&el&&el.clientWidth>0&&el.clientHeight>0){naverMap=new maps.Map(el,{center:new maps.LatLng(35.9676,126.7367),zoom:11});$('mapStatus').textContent='네이버 지도 연결됨';refreshMap();return}if(retry<35){setTimeout(()=>waitForNaverMaps(retry+1),120);return}$('mapStatus').textContent='지도 연결 실패';showStatus('네이버 지도 객체 또는 지도 영역 크기를 확인하지 못했습니다.','err')}
async function initNaverMap(){try{const cfg=await fetch('/api/route-setting/config').then(r=>r.json());if(!cfg.ok||!cfg.clientId)throw new Error(cfg.message||'지도 Client ID가 없습니다.');const script=document.createElement('script');script.src=`https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${encodeURIComponent(cfg.clientId)}`;script.async=true;script.onload=()=>waitForNaverMaps();script.onerror=()=>{$('mapStatus').textContent='지도 연결 실패';showStatus('네이버 지도 스크립트 로딩 실패','err')};document.head.appendChild(script)}catch(e){$('mapStatus').textContent='지도 연결 대기';showStatus(e.message,'err')}}


function getCurrentPositionOnce(){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation){
      reject(new Error('이 브라우저에서는 현재 위치 기능을 사용할 수 없습니다.'));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos=>resolve(pos),
      err=>{
        if(err&&err.code===1)reject(new Error('위치 권한이 차단되어 있습니다. 브라우저 위치 권한을 허용해 주세요.'));
        else if(err&&err.code===2)reject(new Error('현재 위치를 확인하지 못했습니다. GPS 또는 위치 서비스를 확인해 주세요.'));
        else if(err&&err.code===3)reject(new Error('현재 위치 확인 시간이 초과되었습니다. 다시 시도해 주세요.'));
        else reject(new Error('현재 위치를 가져오지 못했습니다.'));
      },
      {enableHighAccuracy:true,timeout:10000,maximumAge:30000}
    );
  });
}

async function reverseGeocode(lat,lng){
  const res=await fetch('/api/route-setting/reverse-geocode',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({lat,lng})
  });
  const data=await res.json().catch(()=>null);
  if(!res.ok||!data||!data.ok||!data.item){
    throw new Error((data&&data.message)||'현재 위치 주소 변환에 실패했습니다.');
  }
  return data.item;
}

async function setCurrentLocationTo(target){
  const isEnd=target==='end';
  const btn=$(isEnd?'currentEnd':'currentStart');
  const targetInput=isEnd?endInput:startInput;
  try{
    if(isEnd&&returnChk.checked){
      showStatus('출발지로 복귀가 체크되어 있어 도착지를 입력할 수 없습니다.','err');
      return;
    }
    if(btn)btn.disabled=true;
    showStatus('현재 위치 확인 중...');
    const pos=await getCurrentPositionOnce();
    const lat=pos.coords.latitude;
    const lng=pos.coords.longitude;
    showStatus('현재 위치를 주소로 변환 중...');
    const item=await reverseGeocode(lat,lng);
    targetInput.value=item.address||`현재위치: ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
    resetResult();
    showStatus(`현재 위치를 ${isEnd?'도착지':'출발지'}에 입력했습니다.`,'ok');
    const maps=getNaverMaps();
    if(maps&&naverMap){
      naverMap.setCenter(new maps.LatLng(lat,lng));
      naverMap.setZoom(Math.max(naverMap.getZoom ? naverMap.getZoom() : 14,14));
      refreshMap();
    }
  }catch(e){
    showStatus(e.message||'현재 위치를 가져오지 못했습니다.','err');
  }finally{
    if(btn)btn.disabled=false;
    if(isEnd&&returnChk.checked&&btn)btn.disabled=true;
  }
}

function setCurrentLocationAsStart(){return setCurrentLocationTo('start')}
function setCurrentLocationAsEnd(){return setCurrentLocationTo('end')}


returnChk.onchange=()=>{endInput.disabled=returnChk.checked;if($('officeEnd'))$('officeEnd').disabled=returnChk.checked;if($('currentEnd'))$('currentEnd').disabled=returnChk.checked;if(returnChk.checked)endInput.value='';resetResult()};
[startInput,endInput].forEach(el=>el.addEventListener('input',resetResult));
function normalizePastedVisits(value){
  return String(value||'')
    .replace(/\r/g,'\n')
    .replace(/\n+/g,', ')
    .replace(/,\s*,+/g,', ')
    .replace(/\s+,/g,',')
    .replace(/,\s*/g,', ');
}

function addCommaAfterVisitPaste(){
  let value=normalizePastedVisits(visitsInput.value).trim();
  if(!value){
    visitsInput.value='';
    return;
  }
  value=value.replace(/,+\s*$/,'');
  visitsInput.value=value+', ';
  visitsInput.selectionStart=visitsInput.selectionEnd=visitsInput.value.length;
}

let visitValueBeforeInput=visitsInput.value;
let visitPasteTimer=null;

function scheduleVisitPasteComma(){
  clearTimeout(visitPasteTimer);
  visitPasteTimer=setTimeout(()=>{
    addCommaAfterVisitPaste();
    visitValueBeforeInput=visitsInput.value;
    resetResult();
  },80);
}

visitsInput.addEventListener('beforeinput',()=>{
  visitValueBeforeInput=visitsInput.value;
});

visitsInput.addEventListener('paste',e=>{
  const pasted=(e.clipboardData||window.clipboardData)?.getData('text')||'';

  if(pasted){
    e.preventDefault();
    const s=visitsInput.selectionStart||0;
    const t=visitsInput.selectionEnd||s;
    visitsInput.value=visitsInput.value.slice(0,s)+pasted+visitsInput.value.slice(t);
    addCommaAfterVisitPaste();
    visitValueBeforeInput=visitsInput.value;
    visitsInput.focus();
    resetResult();
    return;
  }

  // 일부 모바일은 clipboardData 없이 기본 붙여넣기만 수행되므로 input 변화량에서 한 번 더 잡는다.
  scheduleVisitPasteComma();
});

visitsInput.addEventListener('input',e=>{
  const before=visitValueBeforeInput||'';
  const current=visitsInput.value;
  const increased=current.length-before.length;

  const isPaste =
    e.inputType==='insertFromPaste' ||
    e.inputType==='insertFromDrop' ||
    increased>=5;

  if(isPaste){
    scheduleVisitPasteComma();
    return;
  }

  visitValueBeforeInput=visitsInput.value;
  resetResult();
});

visitsInput.addEventListener('blur',()=>{
  visitValueBeforeInput=visitsInput.value;
  resetResult();
});

const mobilePanelHandle=$('mobilePanelHandle');
const mobilePanelDragZone=$('mobilePanelDragZone');
const mobilePanelRoot=document.querySelector('.app');
const mobilePanelStates={top:88,middle:50,bottom:10};
let mobilePanelDragActive=false;

function isMobileLayout(){
  return !!(window.matchMedia&&window.matchMedia('(max-width:760px)').matches);
}

function clampMapPercent(value){
  return Math.max(10,Math.min(88,value));
}

function setMobileMapPercent(value){
  if(!isMobileLayout())return;
  mobilePanelRoot.style.setProperty('--mobile-panel-top',`${clampMapPercent(value)}vh`);
  setTimeout(refreshMap,80);
}

function setMobilePanelState(state){
  if(!isMobileLayout())return;
  const nextState=mobilePanelStates[state]!==undefined?state:'middle';
  mobilePanelRoot.dataset.mobilePanelState=nextState;
  setMobileMapPercent(mobilePanelStates[nextState]);
}

function nearestMobilePanelState(percent){
  const states=Object.entries(mobilePanelStates);
  let best=states[0];
  for(const item of states){
    if(Math.abs(item[1]-percent)<Math.abs(best[1]-percent))best=item;
  }
  return best[0];
}

function pointerY(e){
  if(e.touches&&e.touches.length)return e.touches[0].clientY;
  if(e.changedTouches&&e.changedTouches.length)return e.changedTouches[0].clientY;
  return e.clientY;
}


function installMobilePullRefreshGuard(){
  const panelEl=document.querySelector('.panel');
  if(!panelBody||!panelEl)return;
  let startY=0;
  let startX=0;
  let startScrollTop=0;
  let targetScrollable=null;

  const findScrollable=el=>{
    let node=el;
    while(node&&node!==document.body&&node!==document.documentElement){
      const style=window.getComputedStyle(node);
      const canScrollY=/(auto|scroll)/.test(style.overflowY)&&node.scrollHeight>node.clientHeight+1;
      if(canScrollY)return node;
      node=node.parentElement;
    }
    return panelBody;
  };

  const isFormControl=el=>!!(el&&el.closest&&el.closest('input,textarea,select,button'));

  panelEl.addEventListener('touchstart',e=>{
    if(!isMobileLayout()||!e.touches||e.touches.length!==1)return;
    if(isFormControl(e.target))return;
    const t=e.touches[0];
    startY=t.clientY;
    startX=t.clientX;
    targetScrollable=findScrollable(e.target);
    startScrollTop=targetScrollable?targetScrollable.scrollTop:0;
  },{passive:true});

  panelEl.addEventListener('touchmove',e=>{
    if(!isMobileLayout()||!e.touches||e.touches.length!==1)return;
    if(isFormControl(e.target))return;
    const t=e.touches[0];
    const dy=t.clientY-startY;
    const dx=t.clientX-startX;
    if(Math.abs(dx)>Math.abs(dy))return;

    const scroller=targetScrollable||panelBody;
    const atTop=scroller.scrollTop<=0;
    const atBottom=scroller.scrollTop+scroller.clientHeight>=scroller.scrollHeight-1;

    // 패널 내부 스크롤이 더 갈 곳이 없을 때 브라우저 전체로 드래그가 넘어가면
    // 모바일 pull-to-refresh / 화면 새로고침이 걸릴 수 있어 여기서 끊는다.
    if((atTop&&dy>0)||(atBottom&&dy<0)||startScrollTop<=0&&dy>0){
      e.preventDefault();
    }
  },{passive:false});
}

installMobilePullRefreshGuard();

const mobilePanelDragSurface=mobilePanelDragZone||mobilePanelHandle;
if(mobilePanelDragSurface){
  const startDrag=e=>{
    if(!isMobileLayout())return;
    mobilePanelDragActive=true;
    mobilePanelRoot.dataset.mobilePanelState='dragging';
    mobilePanelDragSurface.setPointerCapture&&e.pointerId!==undefined&&mobilePanelDragSurface.setPointerCapture(e.pointerId);
    e.preventDefault();
  };
  const moveDrag=e=>{
    if(!mobilePanelDragActive||!isMobileLayout())return;
    const y=pointerY(e);
    const percent=clampMapPercent((y/window.innerHeight)*100);
    mobilePanelRoot.style.setProperty('--mobile-panel-top',`${percent}vh`);
    refreshMap();
    e.preventDefault();
  };
  const endDrag=e=>{
    if(!mobilePanelDragActive)return;
    mobilePanelDragActive=false;
    const y=pointerY(e);
    const percent=clampMapPercent((y/window.innerHeight)*100);
    setMobilePanelState(nearestMobilePanelState(percent));
    e.preventDefault();
  };

  mobilePanelDragSurface.addEventListener('pointerdown',startDrag);
  window.addEventListener('pointermove',moveDrag,{passive:false});
  window.addEventListener('pointerup',endDrag,{passive:false});
  window.addEventListener('pointercancel',endDrag,{passive:false});
}

window.addEventListener('resize',()=>{
  if(isMobileLayout()){
    const current=parseFloat(getComputedStyle(mobilePanelRoot).getPropertyValue('--mobile-panel-top'))||mobilePanelStates.middle;
    setMobileMapPercent(current);
  }else{
    mobilePanelRoot.style.removeProperty('--mobile-panel-top');
    delete mobilePanelRoot.dataset.mobilePanelState;
  }
});
