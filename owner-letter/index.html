    /* 매수·임차의향서: 제공된 원본 양식의 구조와 여백을 그대로 재현 */
    .intent-document{position:relative;min-height:255mm;padding:10mm 8mm 4mm;font-family:"Malgun Gothic","맑은 고딕","NanumGothic",Arial,sans-serif;color:#000;font-size:14.5px;line-height:1.5;letter-spacing:-.015em}
    .intent-crop{position:absolute;top:2mm;width:16px;height:16px;pointer-events:none}
    .intent-crop::before,.intent-crop::after{content:"";position:absolute;background:#c9c9c9}

    .intent-editable.type-value{min-width:440px}
    .intent-editable.sign-value{min-width:40px;text-align:center}
    .intent-legal-table{width:100%;border-collapse:collapse;table-layout:fixed;margin-bottom:17px;font-size:14px}

    .intent-legal-table th{font-weight:500;letter-spacing:.08em;background:#fff}
    .intent-legal-table .legal-label{width:72px}
    .intent-legal-table .legal-reg-label{width:108px}
    .intent-legal-table .legal-reg-value{width:145px}
    .intent-legal-table .legal-address-label{width:72px}
    .intent-intro{margin-top:14px;font-size:14px;line-height:1.65}
    .intent-intro-line{display:grid;grid-template-columns:22px minmax(0,1fr);align-items:baseline}
    .intent-below{text-align:center;margin:31px 0 34px;font-size:14px;letter-spacing:.85em;padding-left:.85em}
    .intent-details{display:grid;gap:25px;font-size:14px;line-height:1.55}
    .intent-detail-row{display:grid;grid-template-columns:20px 68px 14px minmax(0,1fr);column-gap:0;align-items:baseline}
    .intent-detail-key{width:68px;display:flex;align-items:baseline;justify-content:space-between;font-weight:400;letter-spacing:0;white-space:nowrap}
    .intent-detail-colon{width:14px;text-align:center;font-weight:400}
    .intent-area-pair{display:inline-flex;align-items:baseline;gap:1px;white-space:nowrap}
    .intent-area-pair .area-input{min-width:24px;max-width:110px;text-align:left;font-weight:400;padding:0}
    .intent-area-pair .area-input[data-unit="pyeong"]{min-width:20px;max-width:85px}
    .intent-notice{margin-top:39px;font-size:14px}
    .intent-sign{margin-top:54px;text-align:center;font-size:14px;white-space:nowrap}
    .intent-sign .intent-editable:hover,.intent-sign .intent-editable:focus{background:#fff4bf!important}
    .saved-list{padding:12px;display:grid;gap:10px;max-height:calc(100vh - 180px);overflow:auto}
    .saved-empty{padding:16px;border:1px dashed #cfc6b7;border-radius:16px;text-align:center;font-size:12px;font-weight:900;color:#81796d;line-height:1.5;background:#fffdf8}
    .saved-card{border:1px solid var(--line);border-radius:16px;background:#fffdf8;padding:13px;box-shadow:0 10px 22px rgba(38,32,22,.05)}
    .saved-card.active{border-color:var(--olive);background:#f3f6ea}
    .saved-title{font-size:13px;font-weight:1000;letter-spacing:-.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .saved-meta{margin-top:6px;color:#6f675b;font-size:11px;font-weight:800;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .saved-buttons{display:flex;gap:6px;margin-top:10px}
    .saved-buttons button{height:30px;border-radius:10px;border:1px solid #d8cfbf;background:#fff;font-size:11px;font-weight:1000;flex:1}
    .saved-buttons .danger{color:#b42318;border-color:#f0c5bf;background:#fff8f6}
    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;font-size:13px;font-weight:900;padding:12px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.2s ease;z-index:50;box-shadow:0 18px 40px rgba(0,0,0,.22)}

    @media(max-width:1180px){.layout{grid-template-columns:240px minmax(520px,1fr)}.right-panel{grid-column:1/-1}.saved-list{max-height:none;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}.letter-paper{width:200mm}}
    @media(max-width:860px){.app{padding:12px}.topbar{height:auto;align-items:flex-start}.top-actions{display:flex}.top-actions .ghost-link:not(.epost-link),.top-actions .mini-btn{display:none}.layout{display:block}.panel{margin-bottom:12px;border-radius:20px}.center-panel{padding:10px;min-height:auto}.paper-wrap{justify-content:flex-start}.letter-paper{width:210mm;transform:scale(.64);transform-origin:top left;margin-bottom:-104mm}.brand-title{font-size:22px}.brand-sub{font-size:12px}.type-list{grid-template-columns:1fr}.meta-grid{grid-template-columns:1fr}}
    @media print{
      @page{size:A4;margin:0}

      body *{visibility:hidden!important}
      .letter-paper,.letter-paper *{visibility:visible!important}
      .letter-paper{position:absolute!important;left:0!important;top:0!important;width:210mm!important;min-height:297mm!important;max-width:none!important;transform:none!important;zoom:1!important;margin:0!important;box-shadow:none!important;border:none!important;background:#fff!important;padding:15mm 17mm 13mm!important}
      [contenteditable="true"]{box-shadow:none!important;background:transparent!important;outline:none!important;border:none!important;text-decoration:none!important}
      .editable-placeholder.is-empty:not(:focus)::before{border-bottom:1px dotted #aaa!important}
      .intent-editable:hover,.intent-editable:focus{background:transparent!important}
      .intent-crop::before,.intent-crop::after{background:#c9c9c9!important}
    }
  </style>

  <div class="app">

      buyer:{label:'매입 문의 안내',title:'실수요자 매입 검토 관련 연락 요청',boxTitle:'매입 검토 내용',boxRows:[['희망 용도',''],['희망 면적',''],['희망 조건',''],['요청 사항','']],body:['안녕하세요. 매슬로우공인중개사사무소입니다.','저희 사무소는 공장, 창고, 토지 등 산업용 부동산을 전문적으로 검토하고 중개하는 공인중개사무소입니다.','최근 해당 지역 내 공장·창고·토지 매입을 검토하는 실수요자의 문의가 있어 등기부상 소유자님께 정중히 연락드립니다.','본 우편은 소유자님의 매도 의사를 확인하기 위한 안내이며, 매매가 확정되었거나 특정 조건을 강요하는 내용은 아닙니다.','검토 의향이 있으시다면 편하게 연락 주시면 됩니다. (공인중개사 박성연 010-5407-0444)']},
      listing:{label:'매물 소개 제안',title:'공장·창고·토지 매물 상담 안내',boxTitle:'대상 부동산 개요',boxRows:[['소 재 지',''],['__AREA__',''],['용도 지역',''],['이용 상황',''],['참고 사항','']],body:['안녕하세요. 매슬로우공인중개사사무소입니다.','저희 사무소는 공장, 창고, 토지 등 산업용 부동산을 중심으로 매수자와 임차인의 실제 조건을 확인한 뒤 매물을 소개하고 있습니다.','소유자님께서 해당 부동산의 매도, 임대, 시세 확인, 향후 거래 가능성 검토를 원하실 경우 편하게 연락 주시면 됩니다. (공인중개사 박성연 010-5407-0444)','상담 과정에서는 소유자님의 의사와 조건을 우선으로 확인하며, 원치 않으시는 경우 거래 진행이나 추가 연락은 하지 않습니다.']},
      purchaseIntent:{layout:'intent',label:'매수의향서',title:'부동산 매수의향서',action:'매매',contract:'매매계약',priceLabel:'매 매 가',price:'210억원'},
      leaseIntent:{layout:'intent',label:'임차의향서',title:'부동산 임차의향서',action:'임차',contract:'임대차계약',priceLabel:'임 대 가',price:'보증금 2억원 / 월 차임 2,250만원'}
    };
    let currentType='general';
    let currentId=null;
    const draftByType={};
    const paper=document.getElementById('letterPaper');
    const savedList=document.getElementById('savedList');
    function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
    function today(){const d=new Date(); return `${d.getFullYear()}. ${String(d.getMonth()+1).padStart(2,'0')}. ${String(d.getDate()).padStart(2,'0')}.`;}
    function editable(html,cls='',placeholder=''){
      const val=String(html||'');
      const empty=!val.trim();
      return `<div class="${cls}${placeholder?' editable-placeholder':''}${empty&&placeholder?' is-empty':''}" contenteditable="true" spellcheck="false" data-placeholder="${esc(placeholder)}">${esc(val)}</div>`;
    }
    function inlineEditable(value,cls=''){
      return `<span class="intent-editable ${cls}" contenteditable="true" spellcheck="false">${esc(value)}</span>`;
    }
    function intentLabel(text,cls='intent-header-label'){
      return `<div class="${cls}">${[...text].map(ch=>`<span>${esc(ch)}</span>`).join('')}</div>`;
    }
    function todayKorean(){
      const d=new Date();
      return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;
    }
    function areaInput(area,unit,value=''){
      const safe=esc(value);
      return `<span class="area-input${safe?'':' editable-placeholder is-empty'}" contenteditable="true" spellcheck="false" data-placeholder=" " data-area="${area}" data-unit="${unit}">${safe}</span>`;
    }
    function areaRowHtml(){
      return `<div class="box-row area-row"><div class="box-label" contenteditable="true" spellcheck="false">토지 면적</div><div class="area-pair">${areaInput('land','m2')}<span class="area-unit">㎡</span><span class="area-unit">(</span>${areaInput('land','pyeong')}<span class="area-unit">평)</span></div><div class="box-label" contenteditable="true" spellcheck="false">건물 면적</div><div class="area-pair">${areaInput('building','m2')}<span class="area-unit">㎡</span><span class="area-unit">(</span>${areaInput('building','pyeong')}<span class="area-unit">평)</span></div></div>`;
    }
    function updateEmptyState(root=paper){
      root.querySelectorAll('.editable-placeholder').forEach(el=>{
        const empty=(el.textContent||'').replace(/\u00a0/g,'').trim()==='';
        el.classList.toggle('is-empty', empty);
      });
    }
    function parseAreaNumber(text){
      const n=parseFloat(String(text||'').replace(/,/g,'').replace(/[^0-9.]/g,''));
      return Number.isFinite(n)?n:null;
    }
    function formatAreaNumber(n){
      if(!Number.isFinite(n)) return '';
      const rounded=Math.round(n*100)/100;
      return rounded.toLocaleString('ko-KR',{maximumFractionDigits:2});
    }
    function syncAreaInput(el){
      if(!el.classList.contains('area-input') || el.dataset.syncing==='1') return;
      const area=el.dataset.area;
      const unit=el.dataset.unit;
      const pair=paper.querySelector(`.area-input[data-area="${area}"][data-unit="${unit==='m2'?'pyeong':'m2'}"]`);
      if(!pair) return;
      const value=parseAreaNumber(el.textContent);
      pair.dataset.syncing='1';
      if(value===null){
        pair.textContent='';
      }else if(unit==='m2'){
        pair.textContent=formatAreaNumber(value/3.305785);
      }else{
        pair.textContent=formatAreaNumber(value*3.305785);
      }
      pair.dataset.syncing='0';
      updateEmptyState();
    }
    function attachEditableState(){
      paper.querySelectorAll('[contenteditable="true"]').forEach(el=>{
        el.addEventListener('input',()=>{syncAreaInput(el); updateEmptyState(); draftByType[currentType]=paper.innerHTML;});
        el.addEventListener('focus',()=>{el.classList.remove('is-empty');});
        el.addEventListener('blur',()=>{updateEmptyState(); draftByType[currentType]=paper.innerHTML;});
      });
      updateEmptyState();
    }
    function intentOrnamentHtml(){
      return `<div class="intent-ornament" aria-hidden="true"><svg viewBox="0 0 92 30" role="img"><g fill="none" stroke="#222" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M46 27 C44 20 43 14 46 7 C49 14 48 20 46 27"/><path d="M46 22 C37 20 31 16 27 10 C34 10 40 13 46 18"/><path d="M46 22 C55 20 61 16 65 10 C58 10 52 13 46 18"/><path d="M35 18 C28 17 23 13 20 8 C26 8 31 11 35 15"/><path d="M57 18 C64 17 69 13 72 8 C66 8 61 11 57 15"/><path d="M28 13 C22 12 17 9 14 5 C19 5 24 7 28 10"/><path d="M64 13 C70 12 75 9 78 5 C73 5 68 7 64 10"/><path d="M40 10 C36 8 34 5 34 2 C38 3 41 5 43 8"/><path d="M52 10 C56 8 58 5 58 2 C54 3 51 5 49 8"/><path d="M39 25 C31 25 25 23 20 19"/><path d="M53 25 C61 25 67 23 72 19"/></g><circle cx="46" cy="5" r="2.2" fill="#222"/></svg></div>`;
    }
    function buildIntentHtml(t){
      const propertyName='대호창고';
      const signCompany='㈜인천로지스틱스';
      return `
        <div class="intent-document">
          <span class="intent-crop left" aria-hidden="true"></span><span class="intent-crop right" aria-hidden="true"></span>
          ${intentOrnamentHtml()}
          <div class="doc-title intent-title">${esc(t.title)}</div>
          <div class="intent-header-lines">
            <div class="intent-header-row">${intentLabel('발신일')}<div class="intent-header-colon">:</div>${inlineEditable(todayKorean(),'js-intent-date')}</div>
            <div class="intent-header-row">${intentLabel('발신인')}<div class="intent-header-colon">:</div>${inlineEditable('주식회사 인천로지스틱스','js-intent-sender')}</div>
            <div class="intent-header-row">${intentLabel('수신인')}<div class="intent-header-colon">:</div>${inlineEditable('대호창고 주식회사','js-recipient')}</div>
            <div class="intent-header-row">${intentLabel('중개대리인')}<div class="intent-header-colon">:</div><span>매슬로우공인중개사사무소</span></div>
          </div>
          <table class="intent-legal-table" aria-label="법인 정보">
            <tr><th class="legal-label">법인명</th><td>${inlineEditable('','block')}</td><th class="legal-reg-label">법인등록번호</th><td class="legal-reg-value">${inlineEditable('-','block')}</td></tr>
            <tr><th class="legal-address-label">주&nbsp;&nbsp;&nbsp;소</th><td colspan="3">${inlineEditable('','block')}</td></tr>
          </table>
          <div class="intent-intro">
            <div class="intent-intro-line"><span>1.</span><span>귀 사의 무궁한 발전을 기원합니다.</span></div>
            <div class="intent-intro-line"><span>2.</span><span>당사는 귀 사 소유의 ${inlineEditable(propertyName,'property-name')}를 ${esc(t.action)}하기 위하여 검토중에 있습니다.</span></div>
            <div class="intent-intro-line"><span>3.</span><span>원만한 ${esc(t.contract)}을 위하여 원활한 협조와 정보제공을 요청드립니다.</span></div>
          </div>
          <div class="intent-below">- 아 래 -</div>
          <div class="intent-details">
            <div class="intent-detail-row"><span>가.</span>${intentLabel('종류','intent-detail-key')}<span class="intent-detail-colon">:</span>${inlineEditable('토지 및 해당 지번 토지의 지상에 있는 모든 건축물 및 구조물 일체','type-value')}</div>
            <div class="intent-detail-row"><span>나.</span>${intentLabel(t.priceLabel.replace(/\s/g,''),'intent-detail-key')}<span class="intent-detail-colon">:</span>${inlineEditable(t.price,'price-value')}</div>
            <div class="intent-detail-row"><span>다.</span>${intentLabel('주소','intent-detail-key')}<span class="intent-detail-colon">:</span>${inlineEditable('인천광역시 중구 항동7가 91-1(축항대로 240)','address-value js-property')}</div>
            <div class="intent-detail-row"><span>라.</span>${intentLabel('면적','intent-detail-key')}<span class="intent-detail-colon">:</span><span class="intent-area-pair">${areaInput('intent','m2','10,744.8')}<span>㎡(</span>${areaInput('intent','pyeong','3250')}<span>평).</span></span></div>
          </div>
          <div class="intent-notice">상기 정보 및 계약의 조건 등은 추후 당사자 협의에 따라 달라질 수 있습니다.</div>
          <div class="intent-sign">${inlineEditable(signCompany,'sign-value')} 대표이사 ${inlineEditable('조 상 철','sign-value')}</div>
        </div>`;
    }
    function buildTemplate(type, reset=false){
      if(!reset && currentType && paper.innerHTML) draftByType[currentType]=paper.innerHTML;
      currentType=type; currentId=null;
      if(!reset && draftByType[type]){
        paper.innerHTML=draftByType[type];
      }else{
        const t=templates[type]||templates.general;
        if(t.layout==='intent'){
          paper.innerHTML=buildIntentHtml(t);
        }else{
          paper.innerHTML=`
          <div class="doc-top">
            <div class="doc-left">
              <div class="doc-brand" contenteditable="true" spellcheck="false">${officeInfo.brand}</div>
              <div class="doc-office-name" contenteditable="true" spellcheck="false">${officeInfo.name}</div>
              <div class="doc-specialty" contenteditable="true" spellcheck="false">${officeInfo.specialty}</div>
            </div>
            <div class="doc-office" contenteditable="true" spellcheck="false">대표 ${officeInfo.owner}<br>등록번호 ${officeInfo.regNo}<br>${officeInfo.address}<br>TEL. ${officeInfo.phone}</div>
          </div>
          ${editable(t.title,'doc-title')}
          <div class="meta-grid">
            <div class="meta-row"><div class="meta-label">수신인</div>${editable('','meta-value js-recipient','수신인')}</div>
            <div class="meta-row"><div class="meta-label">발송일</div>${editable(today(),'meta-value')}</div>
            <div class="meta-row full"><div class="meta-label">수신 주소</div>${editable('','meta-value','수신 주소')}</div>
            <div class="meta-row full"><div class="meta-label">대상 부동산</div>${editable('','meta-value js-property','대상 부동산 소재지')}</div>
          </div>
          <div class="body">${t.body.map(p=>editable(p,'')).join('')}</div>
          <div class="info-box"><div class="box-title" contenteditable="true" spellcheck="false">${esc(t.boxTitle)}</div><div class="box-grid">${t.boxRows.map(row=>row[0]==='__AREA__'?areaRowHtml():`<div class="box-row"><div class="box-label" contenteditable="true" spellcheck="false">${esc(row[0])}</div>${editable(row[1],'box-value','입력')}</div>`).join('')}</div></div>
          <div class="notice" contenteditable="true" spellcheck="false">본 안내를 원하지 않으시는 경우 연락 주시면 추가 우편 발송을 중단하겠습니다. 본 우편은 소유자님의 의사를 확인하기 위한 안내이며, 특정 거래 조건을 강요하는 내용이 아닙니다.</div>
          <div class="sign" contenteditable="true" spellcheck="false">감사합니다.<br><br>${officeInfo.name}</div>
          <div class="footer-block"><div class="footer-qr"><img src="./homepage-qr.jpg" alt="홈페이지 QR"><div>홈페이지</div></div><div class="footer-info" contenteditable="true" spellcheck="false">${officeInfo.name} · 대표 공인중개사 ${officeInfo.owner} · 등록번호 ${officeInfo.regNo}<br>${officeInfo.address} · TEL. ${officeInfo.phone} · E-Mail ${officeInfo.email}</div></div>`;
        }
        draftByType[type]=paper.innerHTML;
      }
      document.querySelectorAll('.type-card').forEach(b=>b.classList.toggle('active',b.dataset.type===type));
      attachEditableState();
    }
    function getSaved(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch(e){return []}}
    function setSaved(items){localStorage.setItem(STORAGE_KEY,JSON.stringify(items));}
    function cleanText(el){return (el?.innerText||'').replace(/\s+/g,' ').trim();}
    function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.classList.remove('show'),1700)}
    function saveCurrent(){
      updateEmptyState();
      draftByType[currentType]=paper.innerHTML;
      const items=getSaved();
      if(!currentId && items.length>=10){toast('저장함이 가득 찼습니다. 기존 문서를 삭제하세요.');return;}
      const title=cleanText(paper.querySelector('.doc-title'))||templates[currentType].title;
      const recipient=cleanText(paper.querySelector('.js-recipient'))||'수신인 미입력';
      const property=cleanText(paper.querySelector('.js-property'))||'대상 부동산 미입력';
      const doc={id:currentId||('letter_'+Date.now()),type:currentType,title,recipient,property,html:paper.innerHTML,updatedAt:new Date().toISOString()};
      const next=items.filter(x=>x.id!==doc.id); next.unshift(doc); setSaved(next.slice(0,10)); currentId=doc.id; renderSaved(); toast('저장했습니다.');
    }
    function renderSaved(){
      const items=getSaved();
      if(!items.length){savedList.innerHTML='<div class="saved-empty">저장된 문서가 없습니다.<br>중앙 문서를 편집한 뒤 저장하세요.</div>';return;}
      savedList.innerHTML=items.map(item=>{const d=new Date(item.updatedAt);const date=`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;return `<div class="saved-card ${item.id===currentId?'active':''}" data-id="${esc(item.id)}"><div class="saved-title">${esc(item.title)}</div><div class="saved-meta">${date} · ${esc(item.recipient)}<br>${esc(item.property)}</div><div class="saved-buttons"><button type="button" data-act="load" data-id="${esc(item.id)}">불러오기</button><button type="button" class="danger" data-act="delete" data-id="${esc(item.id)}">삭제</button></div></div>`}).join('');
    }
    function loadSaved(id){const item=getSaved().find(x=>x.id===id); if(!item)return; if(currentType && paper.innerHTML) draftByType[currentType]=paper.innerHTML; currentId=item.id; currentType=item.type||'general'; paper.innerHTML=item.html; draftByType[currentType]=item.html; document.querySelectorAll('.type-card').forEach(b=>b.classList.toggle('active',b.dataset.type===currentType)); attachEditableState(); renderSaved(); toast('불러왔습니다.');}
    function deleteSaved(id){if(!confirm('저장한 문서를 삭제할까요?'))return; setSaved(getSaved().filter(x=>x.id!==id)); if(currentId===id)currentId=null; renderSaved(); toast('삭제했습니다.');}
    document.querySelectorAll('.type-card').forEach(btn=>btn.addEventListener('click',()=>buildTemplate(btn.dataset.type)));
    document.getElementById('newBtn').onclick=()=>buildTemplate(currentType,true); document.getElementById('newTopBtn').onclick=()=>buildTemplate(currentType,true);
    document.getElementById('saveBtn').onclick=saveCurrent;
    document.getElementById('pdfBtn').onclick=()=>{updateEmptyState(); window.print();}; document.getElementById('pdfTopBtn').onclick=()=>{updateEmptyState(); window.print();};
    savedList.addEventListener('click',e=>{const btn=e.target.closest('button'); if(!btn)return; const id=btn.dataset.id; if(btn.dataset.act==='load')loadSaved(id); if(btn.dataset.act==='delete')deleteSaved(id);});
    buildTemplate('general'); renderSaved();
  </script>
</body>
