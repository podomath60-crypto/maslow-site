<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>신·구 코드 원시 조회 테스트</title>
<style>
:root{--bg:#f4f6f9;--panel:#fff;--line:#d8dee8;--text:#17202c;--muted:#667085;--blue:#1769e0;--ok:#087443;--bad:#b42318;--code:#0d1625}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif}.wrap{max-width:1160px;margin:auto;padding:28px 16px 48px}h1{margin:0 0 8px;font-size:28px}.sub{color:var(--muted);line-height:1.6}.notice{margin:14px 0 20px;padding:13px 15px;border:1px solid #efc84a;background:#fff8d8;border-radius:10px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.head{padding:16px 18px;border-bottom:1px solid var(--line);font-weight:900}.body{padding:18px}.field{margin-bottom:13px}label{display:block;margin-bottom:6px;font-size:13px;font-weight:800}input,select{width:100%;padding:11px 12px;border:1px solid #c8d0dc;border-radius:9px;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btns,.presets{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:900;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#edf2f7;color:#27364a}.preset{border:1px solid #cad3df;background:#fff;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800;cursor:pointer}.status{margin-top:14px;padding:11px 13px;border-radius:9px;display:none;font-weight:800}.status.show{display:block}.status.ok{background:#e8f7ef;color:var(--ok)}.status.bad{background:#feeceb;color:var(--bad)}.status.run{background:#eaf2ff;color:#174ea6}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:12px}.metric{border:1px solid var(--line);border-radius:9px;padding:11px}.metric span{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.metric strong{word-break:break-all}.title{font-size:13px;font-weight:900;margin:15px 0 7px}pre{margin:0;max-height:440px;overflow:auto;background:var(--code);color:#e6edf3;border-radius:10px;padding:13px;font:12px/1.55 Consolas,monospace;white-space:pre-wrap;word-break:break-word}.full{grid-column:1/-1}.assert{padding:10px 12px;border-radius:9px;border:1px solid var(--line);font-size:13px;font-weight:800;margin-bottom:8px}.assert.ok{background:#effbf5;color:var(--ok);border-color:#a8dfc3}.assert.bad{background:#fff0ef;color:var(--bad);border-color:#f3b7b2}.assert.warn{background:#fff8e7;color:#8a6200;border-color:#f2d38a}@media(max-width:820px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<main class="wrap">
<h1>신·구 코드 원시 조회 테스트</h1>
<div class="sub">입력한 신주소·구주소와 bcode 또는 19자리 PNU를 현재 GAS에 각각 독립적으로 1회만 보냅니다.</div>
<div class="notice">주소 변환 없음 · 후보 생성 없음 · 호환 없음 · 폴백 없음 · 재조회 없음 · 병합 없음</div>
<div class="grid">
<section class="card">
<div class="head">원시 입력</div>
<div class="body">
<div class="field"><label>조회 종류</label><select id="mode"><option value="building">건축물·토지 통합조회</option><option value="land">토지 PNU 직접조회</option></select></div>
<div id="buildingFields">
<div class="field"><label>지번주소</label><input id="jibun" placeholder="주소를 입력하세요"></div>
<div class="field"><label>도로명주소 (선택)</label><input id="road" placeholder="선택 입력"></div>
<div class="row"><div class="field"><label>bcode 10자리</label><input id="bcode" maxlength="10" inputmode="numeric"></div><div class="field"><label>주소 종류</label><select id="addrType"><option value="JIBUN">JIBUN</option><option value="ROAD">ROAD</option></select></div></div>
</div>
<div id="landFields" hidden>
<div class="field"><label>PNU 19자리</label><input id="pnu" maxlength="19" inputmode="numeric"></div>
<div class="field"><label>표시용 주소 (선택)</label><input id="landAddress"></div>
</div>
<div class="title">빠른 테스트값</div><div class="presets" id="presets"></div>
<div class="btns" style="margin-top:16px"><button class="btn primary" id="send">GAS 직접 1회 조회</button><button class="btn secondary" id="reset">초기화</button></div>
<div id="status" class="status"></div>
</div>
</section>
<section class="card">
<div class="head">결과 요약</div>
<div class="body">
<div class="metrics"><div class="metric"><span>요청 횟수</span><strong id="count">0</strong></div><div class="metric"><span>소요시간</span><strong id="duration">-</strong></div><div class="metric"><span>응답 codeInfo</span><strong id="resCode">-</strong></div><div class="metric"><span>응답 PNU</span><strong id="resPnu">-</strong></div></div>
<div id="assertions"><div class="assert warn">아직 조회하지 않았습니다.</div></div>
<div class="title">원본 응답</div><pre id="response">{}</pre>
</div>
</section>
<section class="card full"><div class="head">전송 payload</div><div class="body"><pre id="request">{}</pre></div></section>
</div>
</main>
<script>
(function(){
'use strict';
var GAS_URL='https://script.google.com/macros/s/AKfycbznhBvYFIv_GKeNoGIPFTi_mIXXH04BOvYrb4ZN9dk_Cc4Xjir3TP_vL3bbPrLLxgg2/exec';
var mode=document.getElementById('mode'), buildingFields=document.getElementById('buildingFields'), landFields=document.getElementById('landFields');
var requestEl=document.getElementById('request'), responseEl=document.getElementById('response'), statusEl=document.getElementById('status');
var countEl=document.getElementById('count'), durationEl=document.getElementById('duration'), resCodeEl=document.getElementById('resCode'), resPnuEl=document.getElementById('resPnu'), assertionsEl=document.getElementById('assertions');
var requestCount=0;
function digits(v){return String(v||'').replace(/\D/g,'')} function text(v){return String(v==null?'':v).trim()} function pretty(v){return JSON.stringify(v,null,2)}
function setStatus(t,k){statusEl.textContent=t||'';statusEl.className='status'+(t?' show '+k:'')}
function payload(){
 if(mode.value==='land'){
  var p=digits(document.getElementById('pnu').value); if(p.length!==19) throw new Error('PNU 19자리를 입력하세요.');
  var a=text(document.getElementById('landAddress').value);
  return {action:'fetchLandInfoBySearchResult',pnu:p,queryAddress:a,lookupAddress:a,address:a};
 }
 var j=text(document.getElementById('jibun').value), r=text(document.getElementById('road').value), b=digits(document.getElementById('bcode').value), t=document.getElementById('addrType').value;
 if(b.length!==10) throw new Error('bcode 10자리를 입력하세요.'); if(!j&&!r) throw new Error('주소를 입력하세요.');
 var q=t==='ROAD'?(r||j):(j||r);
 return {action:'fetchPublicPropertyBySearchResult',jibunAddress:j,roadAddress:r,lookupAddress:q,bcode:b,queryAddress:q,queryAddressType:t};
}
function jsonpOnce(params){return new Promise(function(resolve,reject){
 var cb='raw_cb_'+Date.now()+'_'+Math.floor(Math.random()*100000), script=document.createElement('script'), done=false, timer;
 function clean(){try{delete window[cb]}catch(e){} if(timer)clearTimeout(timer); if(script.parentNode)script.parentNode.removeChild(script)}
 window[cb]=function(data){if(done)return;done=true;clean();resolve(data)};
 script.onerror=function(){if(done)return;done=true;clean();reject(new Error('GAS 직접 JSONP 호출 실패'))};
 var p=Object.assign({},params,{callback:cb,_ts:Date.now()}), qs=new URLSearchParams(); Object.keys(p).forEach(function(k){qs.set(k,p[k]==null?'':String(p[k]))});
 script.src=GAS_URL+'?'+qs.toString(); document.body.appendChild(script);
 timer=setTimeout(function(){if(done)return;done=true;clean();reject(new Error('GAS 직접 JSONP 시간 초과'))},15000);
});}
function responseCode(d){var c=d&&d.codeInfo;if(!c)return'';var s=digits(c.sigunguCd),b=digits(c.bjdongCd);return s.length===5&&b.length===5?s+b:''}
function responsePnu(d){return text(d&&(d.pnu||(d.land&&d.land.pnu))||'')}
function renderAssertions(req,res){var rows=[];rows.push({k:requestCount===1?'ok':'bad',t:'실제 요청 '+requestCount+'회'});rows.push({k:(!('bcodeCandidates' in req)&&!('pnuCandidates' in req))?'ok':'bad',t:'후보 배열 없음'});
 if(req.bcode){var rc=responseCode(res);rows.push({k:rc?(rc===req.bcode?'ok':'bad'):'warn',t:rc?('요청 bcode '+req.bcode+' / 응답 codeInfo '+rc):'응답 codeInfo 없음'});}
 if(req.pnu){var rp=responsePnu(res);rows.push({k:rp?(rp===req.pnu?'ok':'bad'):'warn',t:rp?('요청 PNU '+req.pnu+' / 응답 PNU '+rp):'응답 PNU 없음'});}
 rows.push({k:res&&res.ok?'ok':'bad',t:'응답 ok: '+String(!!(res&&res.ok))+' · '+text(res&&res.message||res&&res.error||'')}); assertionsEl.innerHTML=rows.map(function(x){return '<div class="assert '+x.k+'">'+x.t.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</div>'}).join('');}
async function send(){var req;try{req=payload()}catch(e){setStatus(e.message,'bad');return}requestCount=0;requestEl.textContent=pretty(req);responseEl.textContent='{}';countEl.textContent='0';durationEl.textContent='-';resCodeEl.textContent='-';resPnuEl.textContent='-';assertionsEl.innerHTML='<div class="assert warn">조회 중</div>';setStatus('입력값을 그대로 GAS에 1회 전송 중입니다.','run');document.getElementById('send').disabled=true;var st=performance.now();try{requestCount=1;var res=await jsonpOnce(req);var ms=Math.round(performance.now()-st);responseEl.textContent=pretty(res);countEl.textContent='1';durationEl.textContent=ms+'ms';resCodeEl.textContent=responseCode(res)||'-';resPnuEl.textContent=responsePnu(res)||'-';renderAssertions(req,res);setStatus('조회 완료','ok')}catch(e){var er={ok:false,error:e.message};responseEl.textContent=pretty(er);countEl.textContent=String(requestCount);durationEl.textContent=Math.round(performance.now()-st)+'ms';renderAssertions(req,er);setStatus(e.message,'bad')}finally{document.getElementById('send').disabled=false}}
var presets=[
['순천 신주소','building','전남광주통합특별시 순천시 해룡면 신대리 2037','전남광주통합특별시 순천시 해룡면 신대로 10','1215031022',''],
['순천 구주소','building','전라남도 순천시 해룡면 신대리 2037','전라남도 순천시 해룡면 신대로 10','4615031022',''],
['광주 신주소','building','전남광주통합특별시 동구 대인동 7-1','전남광주통합특별시 동구 독립로 268','1221010100',''],
['광주 구주소','building','광주광역시 동구 대인동 7-1','광주광역시 동구 독립로 268','2911010100',''],
['인천 신주소','building','인천광역시 제물포구 중앙동1가 3-1','','2812510800',''],
['인천 구주소','building','인천광역시 중구 중앙동1가 3-1','','2811010100',''],
['순천 신PNU','land','전남광주통합특별시 순천시 해룡면 신대리 2037','','','1215031022120370000'],
['순천 구PNU','land','전라남도 순천시 해룡면 신대리 2037','','','4615031022120370000'],
['분당 PNU','land','경기도 성남시 분당구 정자동 178-1','','','4113510300111780001']];
presets.forEach(function(p){var b=document.createElement('button');b.className='preset';b.type='button';b.textContent=p[0];b.onclick=function(){mode.value=p[1];mode.dispatchEvent(new Event('change'));if(p[1]==='land'){document.getElementById('landAddress').value=p[2];document.getElementById('pnu').value=p[5]}else{document.getElementById('jibun').value=p[2];document.getElementById('road').value=p[3];document.getElementById('bcode').value=p[4]}try{requestEl.textContent=pretty(payload())}catch(e){}};document.getElementById('presets').appendChild(b)});
mode.onchange=function(){buildingFields.hidden=mode.value!=='building';landFields.hidden=mode.value!=='land'};document.getElementById('send').onclick=send;document.getElementById('reset').onclick=function(){location.reload()};
})();
</script>
</body></html>
