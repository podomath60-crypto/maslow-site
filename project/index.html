<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- SEO: 관리자/작업용 페이지 검색 제외 -->

  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />

  <title>Maslow Headquarters Dashboard</title>
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Maslow Korea" />
  <meta property="og:title" content="Maslow Headquarters Dashboard" />
  <meta property="og:description" content="Maslow Headquarters Dashboard" />

  <meta property="og:image" content="https://www.maslowkorea.site/dashboard/assets/og-maslow-headquarters-dashboard.png" />
  <meta property="og:image:secure_url" content="https://www.maslowkorea.site/dashboard/assets/og-maslow-headquarters-dashboard.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Maslow Headquarters Dashboard" />
  <meta name="twitter:description" content="Maslow Headquarters Dashboard" />
  <meta name="twitter:image" content="https://www.maslowkorea.site/dashboard/assets/og-maslow-headquarters-dashboard.png" />
  <meta name="twitter:image:alt" content="Maslow Headquarters Dashboard OG image" />
  <style>
    :root{
      --bg:#ffffff;
      --line:#e6ebf1;
      --text:#111318;
      --muted:#67707b;
      --blue:#0f7cff;
      --shadow:0 14px 30px rgba(15,23,42,.05);
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      padding:0;
      background:#fff;
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo",sans-serif !important;
      letter-spacing:-0.02em;
    }
    a{text-decoration:none;color:inherit}
    button,input{font:inherit}
    button{border:none;background:none;cursor:pointer}
    img{display:block;max-width:100%}

    .page{min-height:100vh;background:linear-gradient(180deg,#ffffff 0%,#f9fbff 100%)}
    .shell{width:100%;max-width:980px;margin:0 auto;padding:0 20px 48px}

    .topbar{
      position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
      min-height:76px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
      border-bottom:1px solid rgba(230,235,241,.9)
    }
    .topbar-left{
      display:flex;
      align-items:center;
      justify-content:flex-start;
      width:auto;
      min-width:120px;
      flex:0 0 auto;
    }
    .topbar-right{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      flex:1 1 auto;
      min-width:0;
    }
    .topbar-greeting{
      display:inline-flex;
      align-items:center;
      min-height:44px;
      padding:0 4px;
      font-size:15px;
      font-weight:800;
      color:#5f6873;
      letter-spacing:-0.03em;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:100%;
    }
    .brand-link{display:inline-flex;align-items:center;min-height:44px;padding:0 4px;font-size:18px;font-weight:900;color:#111}

    .brand-icons{
      display:flex;
      align-items:center;
      gap:10px;
    }
    .brand-icon-link{
      width:42px;
      height:42px;
      border-radius:14px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      background:#fff;
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      transition:transform .18s ease, box-shadow .18s ease;
      flex:0 0 42px;
    }
    .brand-icon-link:hover{
      transform:translateY(-1px);
      box-shadow:0 18px 34px rgba(15,23,42,.08);
    }
    .brand-icon-link svg{
      width:26px;
      height:26px;
      display:block;
    }
    .brand-icon-factory{
      color:#3a8fe6;
      border-color:#cfe2ff;
      background:#eef6ff;
    }
    .brand-icon-building{
      color:#b8841a;
      border-color:#ead7aa;
      background:#fff8e8;
    }
    .brand-icon-vfactory{
      border:none;
      background:transparent;
      box-shadow:none;
      padding:0;
      overflow:visible;
    }
    .brand-icon-vfactory:hover{
      box-shadow:none;
    }
    .brand-icon-vfactory img{
      width:42px;
      height:42px;
      object-fit:cover;
      border-radius:14px;
      transform:scale(1.12);
      transform-origin:center;
      flex:0 0 auto;
    }
    .brand-icon-naverblog{
      background:#19ce60;
      border-color:#19ce60;
      color:#fff;
      font-size:24px;
      font-weight:1000;
      letter-spacing:-0.04em;
      line-height:1;
      font-family:Arial, Helvetica, sans-serif;
    }

    .brand-icon-ownerletter{
      background:#6f7f3f;
      border-color:#6f7f3f;
      color:#fff;
      font-size:24px;
      font-weight:1000;
      letter-spacing:-0.04em;
      line-height:1;
      font-family:Arial, Helvetica, sans-serif;
    }

    .brand-icon-warehouse{
      background:#5b1b6e;
      border-color:#5b1b6e;
      color:#fff;
      font-size:24px;
      font-weight:1000;
      letter-spacing:-0.04em;
      line-height:1;
      font-family:Arial, Helvetica, sans-serif;
    }
    .brand-icon-warehouse:hover{
      background:#471253;
      border-color:#471253;
    }
    .brand-icon-taxcheckup{
      width:63px;
      height:42px;
      flex:0 0 63px;
      border-radius:14px;
      background:#183a8f;
      border-color:#183a8f;
      color:#fff;
      font-size:18px;
      font-weight:1000;
      letter-spacing:-0.03em;
      line-height:1;
      font-family:Arial,Helvetica,sans-serif;
    }
    .brand-icon-taxcheckup .tax-mobile-label{display:none}

    .brand-icon-dashboardlink{
      width:156px;
      min-width:156px;
      flex:0 0 156px;
      background:#00f97c;
      border-color:#00f97c;
      color:#07150d;
      padding-left:18px;
      padding-right:18px;
      box-sizing:border-box;
      letter-spacing:-0.045em;
      white-space:nowrap;
      overflow:visible;
    }
    .brand-icon-dashboardlink .tax-full-label{display:inline}
    .brand-icon-dashboardlink .tax-mobile-label{display:none}
    .dashboard-refresh-btn{
      padding:0;
      overflow:hidden;
    }
    .dashboard-refresh-btn img{
      width:100%;
      height:100%;
      object-fit:cover;
      border-radius:14px;
    }

    .hero-spacer{height:18px}
    .panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0 18px}
    .panel-card{
      position:relative;display:flex;flex-direction:column;justify-content:space-between;
      min-height:132px;padding:22px 22px 20px;border:1px solid var(--line);border-radius:28px;
      background:#fff;box-shadow:var(--shadow);text-align:left;transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease
    }
    .panel-card:hover{transform:translateY(-2px);box-shadow:0 18px 34px rgba(15,23,42,.08)}
    .panel-card.primary{background:linear-gradient(180deg,#f7fbff 0%,#eef6ff 100%);border-color:#cfe2ff}
    .panel-eyebrow{font-size:12px;font-weight:900;color:#7d8792;letter-spacing:.08em;text-transform:uppercase}
    .panel-title{margin-top:10px;font-size:30px;line-height:1.08;font-weight:900;color:#111318;letter-spacing:-0.05em}
    .panel-desc{margin-top:10px;font-size:14px;line-height:1.65;color:#66707a;font-weight:700}

    .panel-card.desktop-only{display:none}
    .panel-title-row{display:flex;align-items:center;gap:12px;margin-top:10px}
    .panel-title-row .panel-title{margin-top:0}
    .panel-icon-svg{width:42px;height:42px;flex:0 0 42px;display:block;filter:drop-shadow(0 5px 8px rgba(15,23,42,.10))}
    .panel-card.compact-link{min-height:132px}

    .panel-icon-wrap{
      display:flex;
      align-items:center;
      gap:10px;
      margin-top:2px;
    }
    .panel-icon{
      width:28px;
      height:28px;
      color:#6e7883;
      flex:0 0 28px;
    }

    .search-wrap{margin:0 0 14px}
    .search-box{
      display:flex;
      align-items:center;
      gap:12px;
      width:min(230px,100%);
      min-height:60px;
      padding:0 18px;
      border:1.5px solid #d9e4ef;
      border-radius:999px;
      background:#fff;
      box-shadow:0 8px 20px rgba(15,23,42,.03);
      transition:width .24s ease, box-shadow .24s ease, border-color .24s ease;
    }
    .search-box:focus-within{
      width:min(100%, 720px);
      border-color:#bfdcff;
      box-shadow:0 12px 24px rgba(15,124,255,.08)
    }
    .search-icon{flex:0 0 auto;font-size:18px;color:#7b8794;width:auto}
    .search-input{
      flex:1 1 auto;
      width:100%;
      border:none;
      outline:none;
      background:transparent;
      color:#111318;
      font-size:17px;
      font-weight:800;
      letter-spacing:-0.03em
    }
    .search-input::placeholder{color:rgba(123,135,148,.55);font-weight:600}
    .search-input[contenteditable]{
      min-height:24px;
      display:flex;
      align-items:center;
      cursor:text;
      white-space:nowrap;
      overflow:hidden;
    }
    .search-input[contenteditable]:empty::before{
      content:attr(data-placeholder);
      color:rgba(123,135,148,.55);
      font-weight:600;
      pointer-events:none;
    }

    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 18px}
    .chip-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .filter-chip{
      min-height:36px;padding:0 14px;border-radius:999px;border:1px solid #dbe5ee;background:#fff;
      color:#5d6670;font-size:14px;font-weight:900;letter-spacing:-0.02em;transition:.18s ease
    }
    .filter-chip.active{background:#0f7cff;border-color:#0f7cff;color:#fff;box-shadow:0 10px 20px rgba(15,124,255,.16)}
    .toolbar-meta{font-size:13px;color:#7b8794;font-weight:800;letter-spacing:-0.02em}

    .group{margin:0 0 26px}
    .group-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px;padding:0 2px}
    .group-title{font-size:22px;line-height:1.2;font-weight:900;color:#202227;letter-spacing:-0.04em}
    .group-count{font-size:13px;color:#7b8794;font-weight:900}

    .card-list{display:grid;grid-template-columns:1fr;gap:12px}
    .property-card{border:1px solid var(--line);border-radius:24px;background:#fff;box-shadow:var(--shadow);overflow:hidden}
    .project-dashboard-card{cursor:pointer}
    .project-dashboard-card .property-main{display:block;padding:20px 22px 18px;cursor:pointer}
    .project-dashboard-card .card-content{display:grid;gap:12px}
    .project-dashboard-card .card-title{font-size:30px;line-height:1.14;font-weight:1000;letter-spacing:-.065em;color:#111318}
    .project-card-meta{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;font-size:12px;line-height:1.45;color:#8a94a3;font-weight:850;letter-spacing:-.02em}
    .property-card.is-card-refreshing{position:relative}
    .property-card.is-card-refreshing::before{
      content:'';position:absolute;inset:0;z-index:4;background:rgba(255,255,255,.66);backdrop-filter:blur(1px);-webkit-backdrop-filter:blur(1px)
    }
    .property-card.is-card-refreshing::after{
      content:'수정내용 반영중';position:absolute;left:50%;top:50%;z-index:5;transform:translate(-50%,-50%);
      min-height:34px;padding:0 14px 0 38px;border-radius:999px;background:#fff;color:#0f7cff;border:1px solid #cfe2ff;
      box-shadow:0 12px 24px rgba(15,124,255,.16);font-size:12px;font-weight:900;white-space:nowrap
    }
    .property-card.is-card-refreshing .property-main::after{
      content:'';position:absolute;left:calc(50% - 42px);top:50%;z-index:6;width:14px;height:14px;margin-top:-7px;
      border-radius:50%;border:2px solid #cfe2ff;border-top-color:#0f7cff;animation:cardRefreshSpin .72s linear infinite
    }
    @keyframes cardRefreshSpin{to{transform:rotate(360deg)}}
    .property-main{
      display:grid;grid-template-columns:112px 1fr;gap:14px;padding:14px;align-items:start;cursor:default
    }
    .thumb{width:112px;height:112px;border-radius:18px;background:#edf2f7 center/cover no-repeat;overflow:hidden;flex:0 0 112px}
    .property-copy-thumb{
      cursor:pointer;
      -webkit-user-select:none;
      user-select:none;
      -webkit-touch-callout:none;
      touch-action:manipulation;
    }
    .property-edit-link{cursor:pointer}
    .property-edit-link:hover{text-decoration:underline}
    .card-content{min-width:0;display:grid;gap:8px}
    .title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .card-title{
      margin:0;font-size:24px;line-height:1.16;font-weight:900;color:#17191d;letter-spacing:-0.05em;word-break:keep-all
    }
    .status-chip{
      flex:0 0 auto;min-height:24px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:900;
      display:inline-flex;align-items:center;justify-content:center;white-space:nowrap
    }
    .status-chip.visible{background:#eef5ff;color:#0f7cff;border:1px solid #cfe2ff}
    .status-chip.hidden{background:#f3f5f8;color:#7f8792;border:1px solid #dde3ea}
    .address-map-row{display:flex;align-items:flex-start;gap:6px;min-width:0;line-height:1.55}
    .card-address{font-size:15px;line-height:1.55;color:#505862;font-weight:700;word-break:keep-all;min-width:0;flex:1 1 auto}
    .address-map-actions{display:inline-flex;flex-direction:column;align-items:center;gap:3px;flex:0 0 22px;margin-top:1px;margin-left:auto}
    .dashboard-map-btn{
      width:22px;height:22px;border:0;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;
      box-shadow:0 2px 6px rgba(15,23,42,.13);cursor:pointer;line-height:1;padding:0;vertical-align:middle;flex:0 0 22px
    }
    .dashboard-map-btn svg{width:14px;height:14px;display:block}
    .dashboard-map-btn.ddangya-map-btn{background:#f97316}
    .dashboard-map-btn.ddangya-map-btn:hover{background:#ea580c}
    .dashboard-map-btn.naver-map-btn{background:#0b7cff}
    .dashboard-map-btn.naver-map-btn:hover{background:#075fd1}
    .dashboard-map-btn:focus{outline:none;box-shadow:0 0 0 3px rgba(37,99,235,.16)}
    .card-deal-price{
      font-size:15px;
      line-height:1.5;
      font-weight:900;
      color:#ff3c3c;
      letter-spacing:-0.03em;
      word-break:keep-all;
    }
    .card-meta{font-size:13px;line-height:1.5;color:#7b8794;font-weight:800;letter-spacing:-0.02em}
    .card-meta strong{color:#4f5863;font-weight:900}

    .card-bottom{border-top:1px solid #eef2f6;padding:10px 14px 12px;display:grid;gap:10px}
    .action-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .action-left{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
    .mini-btn{
      min-height:34px;padding:0 12px;border-radius:999px;border:1px solid #dce6f1;background:#fff;
      color:#111318;font-size:13px;font-weight:900;letter-spacing:-0.02em
    }
    .mini-btn.visibility-btn{
      min-height:30px;
      padding:0 7px;
      font-size:12px;
      border-radius:999px;
      flex:0 0 auto;
    }
    .mini-btn.blue{border-color:#cfe2ff;background:#eef5ff;color:#0f7cff}
    .mini-btn.gray{border-color:#dde3ea;background:#f4f6f8;color:#6e7782}
    .mini-btn.square{border-radius:10px;padding:0 8px;min-height:34px;font-size:16px;font-weight:800;letter-spacing:-0.03em;display:inline-flex;align-items:center;justify-content:center;gap:2px;white-space:nowrap}
    .mini-btn.edit-square{border-color:#b9dcff;background:#ecf6ff;color:#3a8fe6}
    .mini-btn.memo-square{border-color:#e8dc7e;background:#fff4a8;color:#7a6500}
    .memo-btn-wrap{position:relative;display:inline-flex;align-items:center;overflow:visible;flex:0 0 auto}
    .memo-new-star{position:absolute;top:-2px;right:-7px;z-index:20;color:#1677ff;font-size:12px;line-height:1;font-weight:900;background:transparent;border-radius:0;box-shadow:none;text-shadow:0 0 2px #fff,0 0 2px #fff;pointer-events:none}
    .mini-btn.share-square{border-color:#cde8b0;background:#e9f8d7;color:#5e8d1b}
    .mini-btn.compact{min-height:30px;padding:0 10px;font-size:12px;border-radius:999px;flex:0 0 auto}
    .mini-btn.visibility-text-btn{
      min-height:34px;
      padding:0 4px;
      border:none;
      background:transparent;
      border-radius:0;
      color:#5f6873;
      font-size:16px;
      font-weight:800;
      letter-spacing:-0.03em;
      flex:0 0 auto;
      white-space:nowrap;
    }
    .mini-btn.visibility-text-btn.active-show{
      color:#0f7cff;
    }
    .mini-btn .btn-emoji,
    .mini-btn .btn-text{
      display:inline;
      line-height:1;
    }

    .memo-modal{
      position:fixed;
      inset:0;
      z-index:12160;
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:rgba(17,24,39,.22);
      backdrop-filter:blur(3px);
      -webkit-backdrop-filter:blur(3px);
    }
    .memo-modal.show{display:flex}
    .memo-modal-card{
      width:min(440px, calc(100vw - 28px));
      min-height:320px;
      padding:22px 20px 18px;
      border:1px solid #f1e3a8;
      border-radius:18px;
      background:#fff8bf;
      box-shadow:0 18px 40px rgba(15,23,42,.18);
      display:grid;
      gap:12px;
      transform:rotate(-0.4deg);
    }
    .memo-modal-head{font-size:22px;font-weight:900;color:#6f5a00}
    .memo-textarea{
      width:100%;min-height:220px;resize:vertical;border:none;outline:none;background:transparent;
      color:#5d4b00;font-size:17px;line-height:1.65;font-family:inherit;font-weight:600;
    }
    .memo-textarea::placeholder{color:rgba(93,75,0,.25)}
    .memo-modal-actions{display:flex;justify-content:flex-end;gap:16px}
    .memo-btn{min-height:32px;padding:0 4px;border:none;background:transparent;font-size:15px;font-weight:700;color:#7a6500}
    .memo-btn.primary{color:#0f7cff}

    .property-copy-modal{
      position:fixed;
      inset:0;
      z-index:12170;
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:rgba(15,23,42,.35);
      backdrop-filter:blur(4px);
      -webkit-backdrop-filter:blur(4px);
    }
    .property-copy-modal.show{display:flex}
    .property-copy-card{
      width:min(420px, calc(100vw - 32px));
      padding:24px 22px 20px;
      border:1px solid #dbe7f4;
      border-radius:22px;
      background:#fff;
      box-shadow:0 22px 58px rgba(15,23,42,.24);
      display:grid;
      gap:14px;
    }
    .property-copy-head{font-size:22px;font-weight:1000;color:#17191d;letter-spacing:-0.04em}
    .property-copy-desc{font-size:15px;line-height:1.65;color:#5f6873;font-weight:750;letter-spacing:-0.03em;white-space:pre-line}
    .property-copy-number{
      padding:10px 12px;
      border-radius:14px;
      background:#f5f8fc;
      color:#3f4852;
      font-size:13px;
      line-height:1.45;
      font-weight:900;
      word-break:break-all;
    }
    .property-copy-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:2px}
    .property-copy-btn{
      min-height:40px;
      padding:0 16px;
      border-radius:999px;
      border:1px solid #dce6f1;
      background:#fff;
      color:#4f5863;
      font-size:14px;
      font-weight:950;
      letter-spacing:-0.02em;
    }
    .property-copy-btn.primary{border-color:#0f7cff;background:#0f7cff;color:#fff}

    .channel-row{
      display:grid;
      grid-template-columns:repeat(9, 56px);
      justify-content:flex-start;
      gap:8px;
    }
    .channel-icon{
      position:relative;
      aspect-ratio:1 / 1;
      width:56px;
      min-width:56px;
      max-width:56px;
      min-height:56px;
      max-height:56px;
      height:56px;
      margin:0;
      border-radius:14px;
      border:1px solid #e4eaf1;
      background:#fafcff;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0;
      overflow:hidden;
      flex:0 0 56px;
    }
    .channel-favicon{
      position:absolute;
      left:50%;
      top:50%;
      width:90%;
      height:90%;
      transform:translate(-50%, -50%);
      object-fit:cover;
      border-radius:4px;
      flex:none
    }
    .site-chip{
      position:relative;
      aspect-ratio:1 / 1;
      width:56px;
      min-width:56px;

  <script>
    const dashboardRoot = document.getElementById('dashboardRoot');
    const toolbarMeta = document.getElementById('toolbarMeta');
    const searchInput = document.getElementById('searchInput');
    const createBtn = document.getElementById('goProjectCreateBtn');
    const topbarGreeting = document.getElementById('topbarGreeting');

    const PROJECT_AUTH_STORAGE_KEY = 'MK_ADMIN_DASHBOARD_UNLOCKED_V1';
    const PROJECT_PASSWORD_MAP = {
      '6857': '한정인 이사',
      '0444': '박성연 대표',
      '1053': '나득균 팀장',
      '8198': '이유나 팀장'
    };

    const lockOverlay = document.getElementById('lockOverlay');
    const lockInput = document.getElementById('lockInput');
    const lockBtn = document.getElementById('lockBtn');
    const lockError = document.getElementById('lockError');

    function updateProjectGreeting(name){
      if(!topbarGreeting) return;
      topbarGreeting.textContent = name ? (name + '님, 반갑습니다.') : 'PROJECT';
    }

    function unlockProjectPage(){
      const pw = String(lockInput && lockInput.value || '').trim();
      const matched = PROJECT_PASSWORD_MAP[pw];
      if(!matched){
        if(lockError) lockError.textContent = '비밀번호가 올바르지 않습니다.';
        return;
      }
      localStorage.setItem(PROJECT_AUTH_STORAGE_KEY, matched);
      updateProjectGreeting(matched);
      if(lockOverlay) lockOverlay.style.display = 'none';
    }

    if(lockBtn) lockBtn.addEventListener('click', unlockProjectPage);
    if(lockInput) lockInput.addEventListener('keydown', function(e){
      if(e.key === 'Enter') unlockProjectPage();
    });

    const restoredProjectUser = localStorage.getItem(PROJECT_AUTH_STORAGE_KEY) || '';
    if(restoredProjectUser){
      updateProjectGreeting(restoredProjectUser);
      if(lockOverlay) lockOverlay.style.display = 'none';
    }else{
      updateProjectGreeting('');
      if(lockInput) window.setTimeout(function(){ lockInput.focus(); }, 80);
    }
    if(createBtn) createBtn.addEventListener('click', function(){ location.href = '/matching?mode=new'; });
    ['calendarBtn','goKrasBtn','goRfineBtn','goFactoryOnBtn','goListingLookupBtn','goPropertyTrackerBtn','goDdangyaBtn','goPriceLookupBtn'].forEach(function(id){
      const btn = document.getElementById(id);
      if(!btn) return;
      btn.addEventListener('click', function(){
        const map = {
          calendarBtn:'#',
          goKrasBtn:'https://www.kras.go.kr/mainView.do',
          goRfineBtn:'https://new.rfine.kr/Pos/index.php',
          goFactoryOnBtn:'https://www.factoryon.go.kr/geon/map/map.do',
          goListingLookupBtn:'/listings/',
          goPropertyTrackerBtn:'/tracker/',
          goDdangyaBtn:'https://www.ddangya.com/',
          goPriceLookupBtn:'/realtylistings/'
        };
        const href = map[id] || '#';
        if(href === '#') return;
        if(/^https?:/.test(href)) window.open(href, '_blank', 'noopener');
        else location.href = href;
      });
    });
    const PUBLIC_PROPERTY_GAS_URL = 'https://script.google.com/macros/s/AKfycbznhBvYFIv_GKeNoGIPFTi_mIXXH04BOvYrb4ZN9dk_Cc4Xjir3TP_vL3bbPrLLxgg2/exec';
    const projectDashboardState = {
      allProjects: [],
      visibleProjects: [],
      filters: { sort:'default', status:'all', deal:'all' },
      loading: false,
      error: ''
    };

    function escapeHtml(value){
      return String(value == null ? '' : value)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#39;');
    }
    function escapeAttr(value){ return escapeHtml(value); }
    function oneLine(value){ return String(value == null ? '' : value).replace(/\s+/g,' ').trim(); }
    function firstText(){
      for(let i=0;i<arguments.length;i++){
        const v = oneLine(arguments[i]);
        if(v) return v;
      }
      return '';
    }
    function parseMaybeJson(value){
      if(!value || typeof value !== 'string') return null;
      try{ return JSON.parse(value); }catch(e){ return null; }
    }
    function fetchJson(url, options){
      return fetch(url, options || {}).then(async function(res){
        let data = null;
        try{ data = await res.json(); }catch(e){}
        if(!res.ok || (data && data.ok === false)){
          throw new Error((data && (data.message || data.error)) || ('요청 실패: ' + res.status));
        }
        return data || {};
      });
    }
    function gasPost(action, payload){
      return fetchJson(PUBLIC_PROPERTY_GAS_URL, {
        method:'POST',
        mode:'cors',
        headers:{'Content-Type':'text/plain;charset=UTF-8'},
        body:JSON.stringify(Object.assign({action:action}, payload || {}))
      });
    }
    function normalizeProjectRecord(raw){
      const row = raw || {};
      const memo = parseMaybeJson(row.internalMemo || row.internal_memo || row.memoJson || '');
      const memoProject = memo && memo.project && typeof memo.project === 'object' ? memo.project : {};
      const p = Object.assign({}, memoProject, row);
      const projectId = firstText(p.projectId, p.id, p.project_id, p['프로젝트ID'], p['프로젝트 ID']);
      const saleEnabled = String(p.saleEnabled).toLowerCase() === 'true' || p.saleEnabled === true || /매매/.test(String(p.dealType || p.dealTypeMode || ''));
      const rentEnabled = String(p.rentEnabled).toLowerCase() === 'true' || p.rentEnabled === true || /임대|임차/.test(String(p.dealType || p.dealTypeMode || ''));
      return {
        projectId: projectId,
        projectStatus: firstText(p.projectStatus, p.status, p['상태'], '조건정리중'),
        projectTitle: firstText(p.projectTitle, p.title, p['프로젝트명'], p['제목'], '프로젝트 제목 미입력'),
        clientName: firstText(p.clientName, p.contactName, p.customerName, p['고객명'], p['의뢰인']),
        companyName: firstText(p.companyName, p.company, p['회사명']),
        contactName: firstText(p.contactName, p.managerName, p['담당자']),
        phone: firstText(p.phone, p.tel, p.mobile, p['연락처']),
        requestDate: firstText(p.requestDate, p.createdAt, p.savedAt, p['접수일']),
        createdAt: firstText(p.createdAt, p.created_at, p.savedAt, p.requestDate, p['생성일'], p['저장일'], p['접수일']),
        updatedAt: firstText(p.updatedAt, p.modifiedAt, p.updated_at, p.savedAt, p.createdAt, p['수정일'], p['저장일']),
        dealTypeMode: firstText(p.dealTypeMode, p.dealType),
        saleEnabled: saleEnabled,
        rentEnabled: rentEnabled,
        saleBudgetMin: firstText(p.saleBudgetMin, p.saleMin, p['매매하한']),
        saleBudgetMax: firstText(p.saleBudgetMax, p.saleMax, p['매매상한']),
        salePriceMemo: firstText(p.salePriceMemo, p['매매메모']),
        rentDepositMin: firstText(p.rentDepositMin, p.depositMin, p['보증금하한']),
        rentDepositMax: firstText(p.rentDepositMax, p.depositMax, p['보증금상한']),
        rentMonthlyMin: firstText(p.rentMonthlyMin, p.monthlyMin, p['월세하한']),
        rentMonthlyMax: firstText(p.rentMonthlyMax, p.monthlyMax, p['월세상한']),
        rentPriceMemo: firstText(p.rentPriceMemo, p['임대메모']),
        regionText: firstText(p.regionText, p.regions, p.region, p['희망지역']),
        useText: firstText(p.useText, p.usePurpose, p.usage, p['용도']),
        industryText: firstText(p.industryText, p.industry, p['업종']),
        requiredMemo: firstText(p.requiredMemo, p.coreNeeds, p.requirements, p['요구조건']),
        lastContact: firstText(p.lastContact, p.recentContact, p['최근연락']),
        nextAction: firstText(p.nextAction, p['다음액션']),
        raw: row
      };
    }
    function listFromResponse(data){
      if(Array.isArray(data)) return data;
      if(Array.isArray(data.projects)) return data.projects;
      if(Array.isArray(data.items)) return data.items;
      if(Array.isArray(data.rows)) return data.rows;
      if(data.project) return [data.project];
      return [];
    }
    function compactRange(min, max){
      const a = oneLine(min);
      const b = oneLine(max);
      if(a && b) return a + '~' + b;
      return a || b || '';
    }
    function formatDealCondition(p){
      const parts = [];
      const saleRange = compactRange(p.saleBudgetMin, p.saleBudgetMax);
      if(p.saleEnabled || saleRange || p.salePriceMemo){
        parts.push('매매 ' + escapeHtml(firstText(saleRange, p.salePriceMemo, '조건 미입력')));
      }
      const depositRange = compactRange(p.rentDepositMin, p.rentDepositMax);
      const monthlyRange = compactRange(p.rentMonthlyMin, p.rentMonthlyMax);
      const rentBits = [];
      if(depositRange) rentBits.push('보증금 ' + depositRange);
      if(monthlyRange) rentBits.push('월세 ' + monthlyRange);
      if(p.rentEnabled || rentBits.length || p.rentPriceMemo){
        parts.push('임대 ' + escapeHtml(firstText(rentBits.join(' / '), p.rentPriceMemo, '조건 미입력')));
      }
      return parts.length ? parts.join('<br>') : '거래조건 미입력';
    }
    function projectThumbLabel(p){
      if(p.saleEnabled && p.rentEnabled) return '매·임';
      if(p.rentEnabled) return '임차';
      if(p.saleEnabled) return '매수';
      return 'PROJECT';
    }
    function projectDealFilterValue(p){
      if(p.rentEnabled && !p.saleEnabled) return 'rent';
      if(p.saleEnabled && !p.rentEnabled) return 'buy';
      if(p.saleEnabled && p.rentEnabled) return 'both';
      return 'none';
    }
    function projectStatusFilterValue(status){
      const s = String(status || '');
      if(/신규|접수|문의/.test(s)) return 'new';
      if(/추천|매칭|검토|조건/.test(s)) return 'matching';
      if(/임장|방문|현장/.test(s)) return 'visit';
      if(/협의|계약|진행/.test(s)) return 'deal';
      return 'matching';
    }
    function formatDashboardDate(value){
      const raw = oneLine(value);
      if(!raw) return '미확인';
      const d = new Date(raw);
      if(!Number.isNaN(d.getTime())){
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const hh = String(d.getHours()).padStart(2, '0');
        const mm = String(d.getMinutes()).padStart(2, '0');
        return y + '.' + m + '.' + day + ' ' + hh + ':' + mm;
      }
      return raw;
    }
    function matchingUrl(projectId){
      return '/matching?projectId=' + encodeURIComponent(projectId || '');
    }
    function renderProjectCard(p){
      const id = p.projectId || '';
      const href = matchingUrl(id);
      return `
<article class="property-card project-dashboard-card" data-project-id="${escapeAttr(id)}" data-status-filter="${escapeAttr(projectStatusFilterValue(p.projectStatus))}" data-deal-filter="${escapeAttr(projectDealFilterValue(p))}" onclick="location.href='${escapeAttr(href)}'">
  <div class="property-main">
    <div class="card-content">
      <h3 class="card-title property-edit-link">${escapeHtml(p.projectTitle)}</h3>
      <div class="project-card-meta">
        <span>프로젝트 번호 ${escapeHtml(id || '미확정')}</span>
        <span>생성일 ${escapeHtml(formatDashboardDate(p.createdAt || p.requestDate))}</span>
        <span>수정일 ${escapeHtml(formatDashboardDate(p.updatedAt))}</span>
      </div>
    </div>
  </div>
</article>`;
    }
    function filteredProjects(){
      let rows = projectDashboardState.allProjects.slice();
      const f = projectDashboardState.filters;
      if(f.status && f.status !== 'all') rows = rows.filter(function(p){ return projectStatusFilterValue(p.projectStatus) === f.status; });
      if(f.deal && f.deal !== 'all') rows = rows.filter(function(p){
        const v = projectDealFilterValue(p);
        return v === f.deal || v === 'both';
      });
      if(f.sort === 'updated'){
        rows.sort(function(a,b){ return String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')); });
      }
      return rows;
    }
    function renderProjects(projects){
      const rows = Array.isArray(projects) ? projects : filteredProjects();
      projectDashboardState.visibleProjects = rows;
      if(toolbarMeta) toolbarMeta.textContent = '전체 ' + projectDashboardState.allProjects.length + '건' + (rows.length !== projectDashboardState.allProjects.length ? ' / 표시 ' + rows.length + '건' : '');
      if(!dashboardRoot) return;
      if(projectDashboardState.loading){
        dashboardRoot.innerHTML = '<div class="empty">프로젝트 목록을 불러오는 중입니다.</div>';
        return;
      }
      if(projectDashboardState.error){
        dashboardRoot.innerHTML = '<div class="empty">프로젝트 목록을 불러오지 못했습니다.<br>' + escapeHtml(projectDashboardState.error) + '<br><br><button class="mini-btn" type="button" onclick="loadProjects()">다시 불러오기</button></div>';
        return;
      }
      if(!projectDashboardState.allProjects.length){
        dashboardRoot.innerHTML = '<div class="empty">저장된 프로젝트가 없습니다.<br>프로젝트 등록 버튼으로 새 프로젝트를 시작하세요.</div>';
        return;
      }
      if(!rows.length){
        dashboardRoot.innerHTML = '<div class="empty">현재 필터에 맞는 프로젝트가 없습니다.</div>';
        return;
      }
      dashboardRoot.innerHTML = `
        <section class="group">
          <div class="group-head"><div class="group-title">프로젝트</div><div class="group-count">${rows.length}건</div></div>
          <div class="card-list">${rows.map(renderProjectCard).join('')}</div>
        </section>`;
    }
    async function loadProjects(){
      projectDashboardState.loading = true;
      projectDashboardState.error = '';
      renderProjects([]);
      try{
        const data = await gasPost('listProjects', { limit: 300 });
        const rows = listFromResponse(data).map(normalizeProjectRecord).filter(function(p){ return p.projectId || p.projectTitle; });
        projectDashboardState.allProjects = rows;
        projectDashboardState.loading = false;
        renderProjects(filteredProjects());
      }catch(err){
        projectDashboardState.loading = false;
        projectDashboardState.error = err && err.message ? err.message : String(err || '알 수 없는 오류');
        renderProjects([]);
      }
    }
    document.querySelectorAll('.filter-chip').forEach(function(btn){
      btn.addEventListener('click', function(){
        const group = btn.dataset.filterGroup;
        const value = btn.dataset.filterValue || 'all';
        const wasActive = btn.classList.contains('active');
        document.querySelectorAll('.filter-chip[data-filter-group="' + group + '"]').forEach(function(x){x.classList.remove('active')});
        if(group === 'sort'){
          btn.classList.add('active');
          projectDashboardState.filters.sort = value || 'default';
        }else if(wasActive){
          projectDashboardState.filters[group] = 'all';
        }else{
          btn.classList.add('active');
          projectDashboardState.filters[group] = value;
        }
        renderProjects(filteredProjects());
      });
    });
    loadProjects();
  </script>
</body>
</html>
