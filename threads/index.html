<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <!-- SEO: 관리자/작업용 페이지 검색 제외 -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="naverbot" content="noindex, nofollow, noarchive, nosnippet" />
<title>Threads 사고영상 수집</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #f4f4f2;
      --text: #111111;
      --muted: #7a7a7a;
      --shadow: 0 18px 40px rgba(0,0,0,.08);
      --radius: 28px;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 16px 80px;
    }

    .hero {
      position: relative;
      padding: 10px 4px 24px;
    }

    .hero-top {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .hero-text {
      min-width: 0;
      flex: 1;
    }

    .refresh {
      appearance: none;
      border: 0;
      background: #111;
      color: #fff;
      border-radius: 999px;
      padding: 11px 15px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: -0.04em;
      cursor: pointer;
      white-space: nowrap;
      flex: 0 0 auto;
      box-shadow: 0 8px 18px rgba(0,0,0,.12);
    }

    .title {
      margin: 0;
      font-size: clamp(34px, 6vw, 56px);
      line-height: .94;
      font-weight: 900;
      letter-spacing: -0.06em;
    }

    .sub {
      margin-top: 12px;
      color: var(--muted);
      font-size: 15px;
      letter-spacing: -0.03em;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
    }

    .legend {
      font-size: 12px;
      color: var(--muted);
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .count {
      margin-left: auto;
      font-size: 14px;
      color: var(--muted);
      font-weight: 800;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
      overflow: hidden;
    }

    .card {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 0;
      text-decoration: none;
      color: inherit;
      min-height: 245px;
      display: block;
      isolation: isolate;
      cursor: pointer;
      max-width: 100%;
    }

    .card.no-reply::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 15% 18%, rgba(255,255,255,.75) 0, rgba(255,255,255,0) 26%),
        radial-gradient(circle at 90% 10%, rgba(0,0,0,.06) 0, rgba(0,0,0,0) 22%),
        linear-gradient(135deg, #101010 0%, #1b1b1b 36%, #2c2c2c 100%);
      z-index: -2;
    }

    .card.has-reply::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 14% 18%, rgba(255,255,255,.85) 0, rgba(255,255,255,0) 30%),
        radial-gradient(circle at 94% 8%, rgba(32,80,255,.16) 0, rgba(32,80,255,0) 24%),
        linear-gradient(135deg, #eef3ff 0%, #dbe7ff 46%, #c3d2f2 100%);
      z-index: -2;
    }

    .card::after {
      content: "";
      position: absolute;
      width: 240px;
      height: 240px;
      right: -70px;
      bottom: -78px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,.22), rgba(255,255,255,.03) 50%, transparent 70%);
      z-index: -1;
      pointer-events: none;
    }

    .card-inner {
      min-height: 245px;
      padding: 18px;
      display: flex;
      flex-direction: column;
    }

    .no-reply .card-inner { color: #fff; }
    .has-reply .card-inner { color: #191714; }

    .badge-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border-radius: 999px;
      padding: 8px 12px;
      backdrop-filter: blur(8px);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: -0.03em;
      white-space: nowrap;
    }

    .no-reply .badge {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.14);
      color: #fff;
    }

    .has-reply .badge {
      background: rgba(255,255,255,.48);
      border: 1px solid rgba(255,255,255,.54);
      color: #191714;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    .no-reply .dot {
      background: #7cff9d;
      box-shadow: 0 0 16px rgba(124,255,157,.8);
    }

    .has-reply .dot {
      background: #111;
      opacity: .45;
    }

    .scraped {
      margin-left: auto;
      font-size: 12px;
      line-height: 1.3;
      font-weight: 800;
      text-align: right;
    }

    .no-reply .scraped { color: rgba(255,255,255,.72); }
    .has-reply .scraped { color: rgba(25,23,20,.55); }

    .card-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 22px 2px 18px;
    }

    .eyebrow {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .no-reply .eyebrow { color: rgba(255,255,255,.66); }
    .has-reply .eyebrow { color: rgba(25,23,20,.52); }

    .headline {
      margin-top: 10px;
      font-size: clamp(28px, 7vw, 38px);
      line-height: .95;
      font-weight: 900;
      letter-spacing: -0.06em;
      word-break: keep-all;
    }

    .handle {
      margin-top: 14px;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.04em;
      opacity: .96;
    }

    .hint {
      margin-top: 8px;
      font-size: 14px;
      letter-spacing: -0.03em;
    }

    .no-reply .hint { color: rgba(255,255,255,.72); }
    .has-reply .hint { color: rgba(25,23,20,.58); }

    .bottom {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: auto;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 15px;
      border-radius: 999px;
      background: #fff;
      color: #111;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: -0.03em;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .memo-btn {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 9px;
      border: 1px solid rgba(255,255,255,.38);
      cursor: pointer;
      background: rgba(255,255,255,.08);
      color: inherit;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: -0.04em;
      white-space: nowrap;
      flex: 0 0 auto;
      backdrop-filter: blur(10px);
    }

    .has-reply .memo-btn {
      border: 1px solid rgba(25,23,20,.18);
      background: rgba(255,255,255,.34);
    }

    .url-mini {
      min-width: 0;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .no-reply .url-mini { color: rgba(255,255,255,.58); }
    .has-reply .url-mini { color: rgba(25,23,20,.48); }

    .loading, .empty, .error {
      padding: 90px 10px;
      text-align: center;
      color: var(--muted);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .error { color: #b42318; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0,0,0,.42);
      backdrop-filter: blur(10px);
    }

    .modal-backdrop.show { display: flex; }

    .memo-modal {
      width: min(420px, 100%);
      background: #fff7b8;
      color: #16130b;
      border-radius: 10px 28px 18px 24px;
      padding: 22px 20px 18px;
      box-shadow: 0 28px 70px rgba(0,0,0,.28);
      transform: rotate(-.6deg);
    }

    .memo-title {
      font-size: 22px;
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: -0.06em;
      margin-bottom: 12px;
    }

    .memo-meta {
      font-size: 13px;
      color: rgba(22,19,11,.62);
      font-weight: 800;
      margin-bottom: 12px;
    }

    .memo-textarea {
      width: 100%;
      min-height: 160px;
      border: 0;
      outline: 0;
      resize: vertical;
      background: rgba(255,255,255,.34);
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      line-height: 1.45;
      color: #16130b;
      font-family: inherit;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }

    .modal-actions button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 11px 15px;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }

    .modal-close {
      background: rgba(0,0,0,.08);
      color: #16130b;
    }

    .modal-save {
      background: #111;
      color: #fff;
    }

    @media (max-width: 520px) {
      .wrap {
        padding-left: 12px;
        padding-right: 12px;
      }

      .card,
      .card-inner {
        min-height: 235px;
      }

      .bottom {
        gap: 8px;
      }

      .pill {
        min-height: 42px;
        padding: 0 14px;
      }

      .memo-btn {
        min-height: 34px;
        padding: 0 11px;
      }

      .url-mini {
        display: none;
      }
    }

    @media (min-width: 760px) {
      .wrap { padding-left: 22px; padding-right: 22px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .card, .card-inner { min-height: 290px; }
      .card-main { padding-top: 28px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="hero-top">
        <div class="hero-text">
          <h1 class="title">Threads<br>사고영상 수집</h1>
          <div class="sub">댓글 없는 사고영상 먼저, 댓글 있는 영상은 아래에 표시합니다.</div>
        </div>
        <button class="refresh" type="button" onclick="loadItems()">새로고침</button>
      </div>
      <div class="topbar">
        <div class="legend" id="noReplyCount">댓글 없는 영상 0건</div>
        <div class="count" id="count">불러오는 중</div>
      </div>
    </section>

    <section class="grid" id="list">
      <div class="loading">불러오는 중...</div>
    </section>
  </main>

  <div class="modal-backdrop" id="memoBackdrop" onclick="closeMemoModal(event)">
    <div class="memo-modal" onclick="event.stopPropagation()">
      <div class="memo-title">메모</div>
      <div class="memo-meta" id="memoMeta"></div>
      <textarea class="memo-textarea" id="memoTextarea" placeholder="메모를 적어두세요."></textarea>
      <div class="modal-actions">
        <button class="modal-close" type="button" onclick="hideMemoModal()">닫기</button>
        <button class="modal-save" type="button" onclick="saveMemo()">저장</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbznhBvYFIv_GKeNoGIPFTi_mIXXH04BOvYrb4ZN9dk_Cc4Xjir3TP_vL3bbPrLLxgg2/exec';
    let ITEMS = [];
    let CURRENT_MEMO_ITEM = null;

    function esc(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function callGas(payload) {
      return fetch(GAS_URL, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(res => res.text())
      .then(text => JSON.parse(text));
    }

    function toThreadsAppUrl(webUrl) {
      const url = String(webUrl || '').trim();
      const ua = navigator.userAgent || '';
      const isAndroid = /Android/i.test(ua);
      const isIOS = /iPhone|iPad|iPod/i.test(ua);

      if (isAndroid) {
        const clean = url.replace(/^https?:\/\//, '');
        return 'intent://' + clean + '#Intent;scheme=https;package=com.instagram.barcelona;end';
      }

      if (isIOS) return url;
      return url;
    }

    function openThread(url) {
      window.location.href = toThreadsAppUrl(url);
    }

    function normalizeAuthor(item) {
      return item.author || item.username || item.handle || 'unknown';
    }

    function normalizeUrl(item) {
      return item.replyUrl || item.url || item.threadUrl || '';
    }

    function normalizeTime(item) {
      return item.scrapedAt || item.updatedAt || item.createdAt || '';
    }

    function timeValue(item) {
      const raw = normalizeTime(item);
      const t = Date.parse(String(raw || '').replace(' ', 'T'));
      return Number.isFinite(t) ? t : 0;
    }

    function hasOwnerReply(item) {
      return String(item.ownerReplied || '').trim().toUpperCase() === 'TRUE';
    }

    function sortItems(items) {
      return [...items].sort((a, b) => {
        const ar = hasOwnerReply(a) ? 1 : 0;
        const br = hasOwnerReply(b) ? 1 : 0;
        if (ar !== br) return ar - br;
        return timeValue(b) - timeValue(a);
      });
    }

    async function loadItems() {
      const list = document.getElementById('list');
      const count = document.getElementById('count');
      count.textContent = '불러오는 중';
      list.innerHTML = '<div class="loading">불러오는 중...</div>';

      try {
        const data = await callGas({ action: 'threads.list' });
        if (!data || !data.ok) throw new Error((data && data.error) || '불러오기 실패');
        ITEMS = sortItems(Array.isArray(data.items) ? data.items : []);
        render();
      } catch (err) {
        count.textContent = '오류';
        list.innerHTML = '<div class="error">' + esc(err.message || err) + '</div>';
      }
    }

    function render() {
      const list = document.getElementById('list');
      const count = document.getElementById('count');
      const noReplyCount = ITEMS.filter(item => !hasOwnerReply(item)).length;
      count.textContent = ITEMS.length + '건';
      const noReplyEl = document.getElementById('noReplyCount');
      if (noReplyEl) noReplyEl.textContent = '댓글 없는 영상 ' + noReplyCount + '건';

      if (!ITEMS.length) {
        list.innerHTML = '<div class="empty">확인할 사고영상이 없습니다.</div>';
        return;
      }

      list.innerHTML = ITEMS.map(item => {
        const author = normalizeAuthor(item);
        const url = normalizeUrl(item);
        const time = normalizeTime(item);
        const replied = hasOwnerReply(item);
        const cardClass = replied ? 'has-reply' : 'no-reply';
        const label = replied ? '댓글 있는 사고영상' : '댓글 없는 사고영상';
        const headline = replied ? '댓글 있는<br>사고영상' : '댓글 없는<br>사고영상';

        return `
          <article class="card ${cardClass}" onclick="openThread('${esc(url)}')">
            <div class="card-inner">
              <div class="badge-row">
                <div class="badge"><span class="dot"></span>${label}</div>
                <div class="scraped">${esc(time)}</div>
              </div>

              <div class="card-main">
                <div class="eyebrow">THREADS ACCIDENT VIDEO</div>
                <div class="headline">${headline}</div>
                <div class="handle">@${esc(author)}</div>
                <div class="hint">누르면 Threads로 바로 이동</div>
              </div>

              <div class="bottom">
                <div class="pill">Threads 열기</div>
                <button class="memo-btn" type="button" onclick="openMemoModal(event, '${esc(item.id)}')">메모</button>
                <div class="url-mini">${esc(url)}</div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function openMemoModal(event, id) {
      event.stopPropagation();
      CURRENT_MEMO_ITEM = ITEMS.find(item => String(item.id) === String(id));
      if (!CURRENT_MEMO_ITEM) return;

      const author = normalizeAuthor(CURRENT_MEMO_ITEM);
      document.getElementById('memoMeta').textContent = '@' + author;
      document.getElementById('memoTextarea').value = CURRENT_MEMO_ITEM.memo || '';
      document.getElementById('memoBackdrop').classList.add('show');

      setTimeout(() => {
        document.getElementById('memoTextarea').focus();
      }, 50);
    }

    function hideMemoModal() {
      document.getElementById('memoBackdrop').classList.remove('show');
      CURRENT_MEMO_ITEM = null;
    }

    function closeMemoModal(event) {
      if (event.target.id === 'memoBackdrop') hideMemoModal();
    }

    async function saveMemo() {
      if (!CURRENT_MEMO_ITEM) return;

      const memo = document.getElementById('memoTextarea').value;

      try {
        const data = await callGas({
          action: 'threads.memo',
          id: CURRENT_MEMO_ITEM.id,
          memo
        });

        if (!data || !data.ok) throw new Error((data && data.error) || '메모 저장 실패');

        CURRENT_MEMO_ITEM.memo = memo;
        hideMemoModal();

      } catch (err) {
        alert(err.message || err);
      }
    }

    loadItems();
  </script>
</body>
</html>
