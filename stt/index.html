<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MASLOW 음성 텍스트 변환</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
      color:#141820;
      background:
        radial-gradient(circle at 50% 10%, rgba(71,134,255,.12), transparent 34%),
        linear-gradient(180deg,#eff6ff 0%,#f7fbff 46%,#fff 100%);
    }
    .page{min-height:100vh;padding:34px 18px 58px}
    .hero{max-width:520px;margin:0 auto;padding-top:42px;text-align:center}
    .brand-en{
      font-size:31px;line-height:1;font-weight:500;letter-spacing:.22em;text-indent:.22em;color:#2c7be5
    }
    .brand-ko{
      margin-top:12px;font-size:clamp(56px,14.5vw,92px);line-height:.86;font-weight:950;
      letter-spacing:-.09em;color:#05070c
    }
    .subtitle{
      margin-top:22px;font-size:25px;font-weight:900;letter-spacing:-.06em;color:#78818f
    }
    .title-row{display:flex;justify-content:center;align-items:center;gap:13px;margin-top:20px}
    .title-row h1{margin:0;font-size:28px;line-height:1;font-weight:950;letter-spacing:-.06em;color:#4b5565}
    .free{
      display:inline-flex;align-items:center;justify-content:center;min-width:72px;height:45px;padding:0 15px;
      border-radius:18px;color:#fff;background:linear-gradient(180deg,#3b82ff,#2563eb);
      box-shadow:0 12px 23px rgba(37,99,235,.26);font-size:26px;font-weight:850;letter-spacing:-.05em
    }
    .card{
      max-width:520px;margin:72px auto 0;padding:22px 14px 24px;border-radius:28px;
      background:rgba(255,255,255,.88);box-shadow:0 24px 54px rgba(37,99,235,.10);
      backdrop-filter:blur(12px)
    }
    .input-card{display:grid;grid-template-columns:1fr 54px 54px;gap:12px}
    .upload-box{
      display:flex;align-items:center;gap:16px;min-height:92px;padding:0 23px;border:1px solid #e4e9f2;
      border-radius:20px;background:#fff;text-align:left;cursor:pointer;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)
    }
    .upload-icon{font-size:40px;line-height:1;color:#a5adba;transform:rotate(-12deg)}
    .upload-text{font-size:20px;font-weight:900;letter-spacing:-.07em;color:#a0a7b3}
    .hidden-input{display:none}
    .refresh,.play-preview{
      min-height:92px;border:1px solid #e4e9f2;border-radius:20px;background:#fff;color:#737b88;
      font-weight:800;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)
    }
    .refresh{font-size:36px}
    .play-preview{font-size:24px;padding-left:3px;color:#2563eb}
    .play-preview:disabled{
      opacity:.36;
      cursor:not-allowed;
      color:#a5adba;
    }
    .file-name{
      grid-column:1/-1;min-height:18px;padding:0 4px;color:#7a8290;font-size:13px;text-align:center;word-break:break-all
    }
    .divider{
      grid-column:1/-1;display:flex;align-items:center;gap:12px;margin:4px 0 0;
      color:#a0a7b3;font-size:13px;font-weight:800
    }
    .divider:before,.divider:after{content:"";flex:1;height:1px;background:#eef2f7}
    .record-panel{
      grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;
      background:#f8fafc;border:1px solid #e8edf5
    }
    .rec-dot{width:13px;height:13px;border-radius:999px;background:#cbd5e1}
    .rec-dot.on{background:#ef4444;box-shadow:0 0 0 8px rgba(239,68,68,.12)}
    .rec-main{font-size:15px;font-weight:950;color:#273142}
    .rec-sub{margin-top:4px;font-size:12px;font-weight:700;color:#8a93a1}
    .actions{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px}
    button{
      border:0;cursor:pointer;font-family:inherit;font-weight:950;letter-spacing:-.04em
    }
    .small-btn{height:48px;border-radius:15px;font-size:15px}
    .small-btn.dark{color:#fff;background:#111827}
    .small-btn.danger{color:#fff;background:#ef4444}
    .small-btn.ghost{color:#596170;background:#eef2f7}
    .audio{grid-column:1/-1;width:100%;display:none}
    .submit{
      grid-column:1/-1;height:58px;margin-top:18px;border-radius:19px;color:#fff;background:linear-gradient(180deg,#3b63ff,#2553f4);
      box-shadow:0 18px 26px rgba(37,83,244,.20);font-size:21px
    }
    .submit:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
    .result-card{
      max-width:520px;margin:26px auto 0;padding:24px;border:1px dashed #d8dee8;border-radius:22px;background:rgba(255,255,255,.92)
    }
    .empty{
      min-height:88px;display:flex;align-items:center;justify-content:center;text-align:center;color:#6b7280;
      font-size:20px;line-height:1.55;font-weight:850;letter-spacing:-.06em
    }
    .result-body{display:none}
    .result-head{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
    .result-head strong{font-size:19px;font-weight:950;letter-spacing:-.06em}
    .result-head span{color:#8a93a1;font-size:13px;font-weight:800;letter-spacing:-.04em}
    .result-text{
      width:100%;min-height:240px;resize:vertical;padding:16px;border:1px solid #e4e9f2;border-radius:18px;
      outline:none;color:#1f2937;background:#fff;font-size:16px;line-height:1.7;font-family:inherit
    }
    .result-text:focus{border-color:#93c5fd;box-shadow:0 0 0 4px rgba(147,197,253,.24)}
    .result-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    .result-actions button{height:48px;border-radius:15px;color:#384152;background:#eef2f7;font-size:15px}
    .status{margin-top:12px;color:#8a93a1;font-size:12px;font-weight:800;letter-spacing:-.04em;text-align:center}

    .toast{
      position:fixed;
      left:50%;
      bottom:28px;
      z-index:9999;
      transform:translateX(-50%) translateY(16px);
      min-width:min(360px, calc(100vw - 36px));
      padding:14px 18px;
      border-radius:16px;
      background:rgba(17,24,39,.94);
      color:#fff;
      font-size:14px;
      font-weight:850;
      line-height:1.45;
      text-align:center;
      letter-spacing:-.04em;
      box-shadow:0 18px 38px rgba(15,23,42,.24);
      opacity:0;
      pointer-events:none;
      transition:opacity .22s ease, transform .22s ease;
    }
    .toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }

    @media(max-width:520px){
      .page{padding:30px 18px 48px}
      .hero{padding-top:46px}
      .card{margin-top:72px}
      .input-card{grid-template-columns:1fr 52px 52px}
      .upload-box,.refresh,.play-preview{min-height:92px}
      .title-row h1{font-size:27px}
    }
    @media(max-width:380px){
      .brand-ko{font-size:55px}
      .subtitle{font-size:22px}
      .free{min-width:66px;height:42px;font-size:23px}
      .title-row h1{font-size:24px}
      .card{margin-top:64px}
      .input-card{grid-template-columns:1fr 46px 46px}
      .upload-text{font-size:17px}
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="brand-en">MASLOW</div>
      <div class="brand-ko">매슬로우</div>
      <div class="subtitle">부동산 IT 서비스</div>
      <div class="title-row">
        <span class="free">Free</span>
        <h1>음성 텍스트 변환</h1>
      </div>
    </section>

    <section class="card input-card">
      <button class="upload-box" type="button" id="uploadBtn">
        <span class="upload-icon">⌕</span>
        <span class="upload-text">음성 파일을 선택하세요</span>
      </button>
      <input id="fileInput" class="hidden-input" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.flac,.ogg,.webm" />
      <button class="refresh" type="button" id="resetBtn" aria-label="새로고침">↻</button>
      <button class="play-preview" type="button" id="playBtn" aria-label="선택한 음성 듣기" disabled>▶</button>

      <div id="fileName" class="file-name">선택된 파일이 없습니다.</div>

      <div class="divider"><span>또는 바로 녹음</span></div>

      <div class="record-panel">
        <div id="recDot" class="rec-dot"></div>
        <div>
          <div id="recMain" class="rec-main">녹음 대기</div>
          <div class="rec-sub">휴대폰이나 PC 마이크로 바로 녹음할 수 있습니다.</div>
        </div>
      </div>

      <div class="actions">
        <button id="recordBtn" class="small-btn dark" type="button">녹음 시작</button>
        <button id="clearBtn" class="small-btn ghost" type="button">초기화</button>
      </div>

      <audio id="audioPlayer" class="audio" controls></audio>

      <button id="submitBtn" class="submit" type="button" disabled>텍스트 변환</button>
    </section>

    <section class="result-card">
      <div id="emptyBox" class="empty">음성 파일을 올리거나 녹음하면 텍스트로 변환할 수 있습니다.</div>

      <div id="resultBody" class="result-body">
        <div class="result-head">
          <strong>추출 결과</strong>
          <span>실제 들리는 발화 기준으로 수정하세요.</span>
        </div>
        <textarea id="resultText" class="result-text"></textarea>
        <div class="result-actions">
          <button id="copyBtn" type="button">전체 복사</button>
          <button id="txtBtn" type="button">TXT 저장</button>
        </div>
        <div id="status" class="status">변환이 완료되었습니다.</div>
      </div>
    </section>
  </main>
  <div id="toast" class="toast"></div>

  <script>
    const STT_API_URL = "https://stt-api.sf-farm.store/api/stt";

    const uploadBtn = document.getElementById("uploadBtn");
    const fileInput = document.getElementById("fileInput");
    const resetBtn = document.getElementById("resetBtn");
    const playBtn = document.getElementById("playBtn");
    const clearBtn = document.getElementById("clearBtn");
    const fileName = document.getElementById("fileName");
    const recordBtn = document.getElementById("recordBtn");
    const recDot = document.getElementById("recDot");
    const recMain = document.getElementById("recMain");
    const audioPlayer = document.getElementById("audioPlayer");
    const submitBtn = document.getElementById("submitBtn");
    const emptyBox = document.getElementById("emptyBox");
    const resultBody = document.getElementById("resultBody");
    const resultText = document.getElementById("resultText");
    const statusBox = document.getElementById("status");
    const copyBtn = document.getElementById("copyBtn");
    const txtBtn = document.getElementById("txtBtn");
    const toast = document.getElementById("toast");

    const ALLOWED_AUDIO_EXTS = [".mp3", ".wav", ".m4a", ".aac", ".flac", ".ogg", ".webm"];

    let toastTimer = null;

    function showToast(message){
      toast.textContent = message;
      toast.classList.add("show");

      if(toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2600);
    }

    function isAllowedAudioFile(file){
      if(!file) return false;

      const name = (file.name || "").toLowerCase();
      const dotIndex = name.lastIndexOf(".");
      const ext = dotIndex >= 0 ? name.slice(dotIndex) : "";

      if(file.type && file.type.startsWith("audio/")) return true;
      return ALLOWED_AUDIO_EXTS.includes(ext);
    }

    let selectedFile = null;
    let sourceType = "";
    let mediaRecorder = null;
    let chunks = [];
    let activeStream = null;
    let timer = null;
    let seconds = 0;
    let recording = false;
    let audioUrl = "";

    function formatTime(sec){
      const m = String(Math.floor(sec / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return m + ":" + s;
    }

    function formatParagraphs(text){
      if(!text) return "";

      const normalized = String(text)
        .replace(/\s+/g, " ")
        .replace(/([.!?。！？]|(?:습니다|니다|어요|예요|에요|세요|까요|죠|다|요))\s+/g, "$1\n")
        .trim();

      const lines = normalized
        .split(/\n+/)
        .map(v => v.trim())
        .filter(Boolean);

      if(lines.length <= 2) return lines.join("\n\n");

      const paragraphs = [];
      for(let i = 0; i < lines.length; i += 2){
        paragraphs.push(lines.slice(i, i + 2).join(" "));
      }

      return paragraphs.join("\n\n");
    }

    function setEmpty(message){
      emptyBox.style.display = "flex";
      resultBody.style.display = "none";
      emptyBox.textContent = message;
    }

    function setReady(file, type){
      selectedFile = file;
      sourceType = type || "";
      submitBtn.disabled = !selectedFile;
      playBtn.disabled = !selectedFile;
    }

    function stopTimer(){
      if(timer){
        clearInterval(timer);
        timer = null;
      }
    }

    function stopStream(){
      if(activeStream){
        activeStream.getTracks().forEach(track => track.stop());
        activeStream = null;
      }
    }

    function resetAll(){
      stopTimer();
      stopStream();

      if(audioUrl){
        URL.revokeObjectURL(audioUrl);
        audioUrl = "";
      }

      selectedFile = null;
      sourceType = "";
      chunks = [];
      seconds = 0;
      recording = false;

      fileInput.value = "";
      fileName.textContent = "선택된 파일이 없습니다.";
      recDot.classList.remove("on");
      recMain.textContent = "녹음 대기";
      recordBtn.textContent = "녹음 시작";
      recordBtn.className = "small-btn dark";
      audioPlayer.removeAttribute("src");
      audioPlayer.style.display = "none";
      submitBtn.disabled = true;
      playBtn.disabled = true;
      resultText.value = "";

      setEmpty("음성 파일을 올리거나 녹음하면 텍스트로 변환할 수 있습니다.");
    }

    uploadBtn.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", () => {
      const file = fileInput.files && fileInput.files[0];
      if(!file) return;

      if(!isAllowedAudioFile(file)){
        fileInput.value = "";
        setReady(null, "");
        fileName.textContent = "선택된 파일이 없습니다.";
        showToast("오디오 파일만 업로드할 수 있습니다. mp3, wav, m4a 파일을 선택해 주세요.");
        setEmpty("음성 파일을 올리거나 녹음하면 텍스트로 변환할 수 있습니다.");
        return;
      }

      if(audioUrl){
        URL.revokeObjectURL(audioUrl);
        audioUrl = "";
      }

      audioUrl = URL.createObjectURL(file);
      audioPlayer.src = audioUrl;
      audioPlayer.style.display = "none";

      fileName.textContent = file.name;
      resultText.value = "";
      setReady(file, "upload");
      setEmpty("파일이 준비되었습니다. ▶ 버튼으로 들어본 뒤 텍스트 변환을 눌러주세요.");
    });

    async function startRecording(){
      try{
        chunks = [];
        seconds = 0;

        if(audioUrl){
          URL.revokeObjectURL(audioUrl);
          audioUrl = "";
        }

        activeStream = await navigator.mediaDevices.getUserMedia({ audio:true });

        let mimeType = "";
        if(typeof MediaRecorder !== "undefined"){
          if(MediaRecorder.isTypeSupported("audio/webm")) mimeType = "audio/webm";
          else if(MediaRecorder.isTypeSupported("audio/mp4")) mimeType = "audio/mp4";
        }

        mediaRecorder = mimeType
          ? new MediaRecorder(activeStream, { mimeType })
          : new MediaRecorder(activeStream);

        mediaRecorder.ondataavailable = (event) => {
          if(event.data && event.data.size > 0) chunks.push(event.data);
        };

        mediaRecorder.onstop = () => {
          stopTimer();

          const blobType = mediaRecorder.mimeType || "audio/webm";
          const ext = blobType.includes("mp4") ? "m4a" : "webm";
          const blob = new Blob(chunks, { type: blobType });
          const file = new File([blob], "maslow_recording_" + Date.now() + "." + ext, { type: blobType });

          audioUrl = URL.createObjectURL(blob);
          audioPlayer.src = audioUrl;
          audioPlayer.style.display = "none";

          fileName.textContent = "녹음 파일이 준비되었습니다.";
          recDot.classList.remove("on");
          recMain.textContent = "녹음 완료 " + formatTime(seconds);
          recordBtn.textContent = "다시 녹음";
          recordBtn.className = "small-btn dark";
          recording = false;

          setReady(file, "recording");
          setEmpty("녹음이 준비되었습니다. ▶ 버튼으로 들어본 뒤 텍스트 변환을 눌러주세요.");
          stopStream();
        };

        mediaRecorder.start();
        recording = true;
        recDot.classList.add("on");
        recMain.textContent = "녹음 중 00:00";
        recordBtn.textContent = "녹음 정지";
        recordBtn.className = "small-btn danger";
        setEmpty("녹음 중입니다.");

        timer = setInterval(() => {
          seconds += 1;
          recMain.textContent = "녹음 중 " + formatTime(seconds);
        }, 1000);
      }catch(err){
        setEmpty("마이크 권한이 필요합니다. 브라우저 권한을 확인해 주세요.");
        recording = false;
        stopTimer();
        stopStream();
      }
    }

    function stopRecording(){
      if(mediaRecorder && mediaRecorder.state !== "inactive"){
        mediaRecorder.stop();
      }
      stopTimer();
    }

    recordBtn.addEventListener("click", () => {
      if(recording) stopRecording();
      else startRecording();
    });

    resetBtn.addEventListener("click", () => window.location.reload());
    clearBtn.addEventListener("click", resetAll);

    playBtn.addEventListener("click", async () => {
      if(!audioPlayer.src){
        showToast("먼저 음성 파일을 선택하거나 녹음해 주세요.");
        return;
      }

      try{
        if(!audioPlayer.paused){
          audioPlayer.pause();
          audioPlayer.currentTime = 0;
          playBtn.textContent = "▶";
          return;
        }

        await audioPlayer.play();
        playBtn.textContent = "■";
      }catch(err){
        showToast("이 파일은 브라우저에서 바로 재생할 수 없습니다.");
      }
    });

    audioPlayer.addEventListener("ended", () => {
      playBtn.textContent = "▶";
    });

    audioPlayer.addEventListener("pause", () => {
      if(audioPlayer.currentTime === 0 || audioPlayer.ended){
        playBtn.textContent = "▶";
      }
    });

    submitBtn.addEventListener("click", async () => {
      if(!selectedFile){
        setEmpty("먼저 파일을 올리거나 녹음해 주세요.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "변환 중...";
      setEmpty("음성을 텍스트로 변환하고 있습니다.");

      const formData = new FormData();
      formData.append("file", selectedFile);
      formData.append("sourceType", sourceType || "unknown");

      try{
        const res = await fetch(STT_API_URL, {
          method: "POST",
          body: formData
        });

        const data = await res.json().catch(() => null);

        if(!res.ok || !data || !data.ok){
          throw new Error((data && data.error) || "변환에 실패했습니다.");
        }

        resultText.value = formatParagraphs(data.text || "");
        emptyBox.style.display = "none";
        resultBody.style.display = "block";
        statusBox.textContent = "변환이 완료되었습니다.";
      }catch(err){
        setEmpty("잠시 후 다시 시도해 주세요.");
      }finally{
        submitBtn.disabled = false;
        submitBtn.textContent = "텍스트 변환";
      }
    });

    copyBtn.addEventListener("click", async () => {
      const text = resultText.value || "";
      if(!text.trim()){
        statusBox.textContent = "복사할 텍스트가 없습니다.";
        return;
      }
      await navigator.clipboard.writeText(text);
      statusBox.textContent = "텍스트를 복사했습니다.";
    });

    txtBtn.addEventListener("click", () => {
      const text = resultText.value || "";
      if(!text.trim()){
        statusBox.textContent = "저장할 텍스트가 없습니다.";
        return;
      }

      const blob = new Blob([text], { type:"text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "maslow-stt.txt";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      statusBox.textContent = "TXT 파일을 저장했습니다.";
    });
  </script>
</body>
</html>
