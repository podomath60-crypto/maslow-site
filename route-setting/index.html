/* Carpet guide behavior:
   - Initial state keeps the centered rectangular overlay.
   - Once docking starts, the overlay box/text disappear and only the carpet flies.
   - Docked state remains carpet-only and clickable for reload. */
.mapCarpetHero{
  transform-origin:50% 58%;
  animation:carpetOnlyFlutter 2.2s ease-in-out infinite!important;
}
.mapGuide.mapGuideDocking,
.mapGuide.mapGuideDocked{
  background:transparent!important;
  border:0!important;
  box-shadow:none!important;
  backdrop-filter:none!important;
  -webkit-backdrop-filter:none!important;
  padding:0!important;
  border-radius:0!important;
  overflow:visible!important;
}
.mapGuide.mapGuideDocking strong,
.mapGuide.mapGuideDocking span,
.mapGuide.mapGuideDocked strong,
.mapGuide.mapGuideDocked span{
  display:none!important;
}
.mapGuide.mapGuideDocking .mapCarpetHero{
  animation:carpetDockHeroJourneyClean 3s cubic-bezier(.22,.72,.18,1) both!important;
}
.mapGuide.mapGuideDocked .mapCarpetHero{
  animation:carpetOnlyDockedFlutter 2.4s ease-in-out infinite!important;
}
@keyframes carpetOnlyFlutter{
  0%,100%{transform:translateY(0) rotate(-3deg)}
  18%{transform:translateY(-5px) rotate(3deg)}
  38%{transform:translateY(2px) rotate(-4deg)}
  58%{transform:translateY(-7px) rotate(4deg)}
  78%{transform:translateY(1px) rotate(-3deg)}
}
@keyframes carpetOnlyDockedFlutter{
  0%,100%{transform:translateY(0) rotate(-3deg)}
  25%{transform:translateY(-3px) rotate(3deg)}
  50%{transform:translateY(1px) rotate(-4deg)}

<script>
const $=id=>document.getElementById(id);
const startInput=$('start'), visitsInput=$('visits'), endInput=$('end'), returnChk=$('returnToStart');
const statusEl=$('status'), totalTimeEl=$('totalTime'), resultEl=$('result'), panelBody=$('panelBody');
const mapWrap=$('mapWrap'), mapGuide=$('mapGuide');
let naverMap=null, markers=[], polylines=[], latestResult=null;
let mapClickBubble=null, mapClickTouchPin=null, pendingMapClickVisit=null;
let lastMapPointerPixel=null;
let routeRunSeq=0;

function rememberMapPointerPixel(e){
  if(!mapWrap||!e)return;
  const rect=mapWrap.getBoundingClientRect();
  const x=e.clientX-rect.left;
  const y=e.clientY-rect.top;
  if(x<0||y<0||x>rect.width||y>rect.height)return;
  lastMapPointerPixel={x,y,ts:Date.now()};
}

function getFreshMapPointerPixel(){
  if(!lastMapPointerPixel)return null;
  if(Date.now()-lastMapPointerPixel.ts>900)return null;
  return {x:lastMapPointerPixel.x,y:lastMapPointerPixel.y};
}

function dockMapGuide(){
  if(!mapGuide||mapGuide.classList.contains('mapGuideDocked')||mapGuide.classList.contains('mapGuideDocking'))return;
  mapGuide.classList.remove('hide');

  const wrapRect=mapWrap.getBoundingClientRect();
  const carpet=mapGuide.querySelector('.mapCarpetHero');
  const guideRect=mapGuide.getBoundingClientRect();
  const carpetRect=carpet?carpet.getBoundingClientRect():guideRect;
  const isMobile=window.matchMedia('(max-width:760px)').matches;

  const startW=carpetRect.width||guideRect.width;
  const startH=carpetRect.height||guideRect.height;
  const startX=carpetRect.left-wrapRect.left+startW/2;
  const startY=carpetRect.top-wrapRect.top+startH/2;

  const endW=isMobile?44:67;
  const endH=endW;
  const endLeft=isMobile?12:14;
  const endTop=isMobile?6:14;
  const endX=endLeft+endW/2;
  const endY=endTop+endH/2;

  // One continuous cubic Bezier curve: P0(start) -> P1(right/up) -> P2(right/down loop) -> P3(dock).
  // No straight-line keyframe segments, so the carpet rides one smooth butterfly-like curve.
  const p0={x:startX,y:startY};
  const p1={x:Math.min(wrapRect.width-24,startX+wrapRect.width*.34),y:Math.max(24,startY-wrapRect.height*.34)};
  const p2={x:Math.min(wrapRect.width-24,startX+wrapRect.width*.50),y:Math.min(wrapRect.height-24,startY+wrapRect.height*.34)};
  const p3={x:endX,y:endY};

  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  const bezier=(a,b,c,d,t)=>{
    const mt=1-t;
    return mt*mt*mt*a+3*mt*mt*t*b+3*mt*t*t*c+t*t*t*d;
  };
  const lerp=(a,b,t)=>a+(b-a)*t;
  const duration=3000;
  let startedAt=0;

  mapGuide.classList.add('mapGuideDocking');
  mapGuide.style.left=(startX-startW/2)+'px';
  mapGuide.style.top=(startY-startH/2)+'px';
  mapGuide.style.width=startW+'px';
  mapGuide.style.height=startH+'px';
  mapGuide.style.transform='translate3d(0,0,0)';
  if(carpet){
    carpet.style.width=startW+'px';
    carpet.style.maxWidth=startW+'px';
    carpet.style.transform='translate3d(0,0,0) rotate(-3deg)';
  }

  function step(ts){
    if(!startedAt)startedAt=ts;
    const raw=Math.min(1,(ts-startedAt)/duration);
    const t=ease(raw);
    const x=bezier(p0.x,p1.x,p2.x,p3.x,t);
    const y=bezier(p0.y,p1.y,p2.y,p3.y,t);
    const w=lerp(startW,endW,t);
    const h=lerp(startH,endH,t);

    mapGuide.style.left=(x-w/2)+'px';
    mapGuide.style.top=(y-h/2)+'px';
    mapGuide.style.width=w+'px';
    mapGuide.style.height=h+'px';
    mapGuide.style.padding='0';
    mapGuide.style.border='0';
    mapGuide.style.background='transparent';
    mapGuide.style.boxShadow='none';
    mapGuide.style.transform='translate3d(0,0,0)';

    if(carpet){
      const wing=Math.sin(raw*Math.PI*4)*2.4;
      const settle=lerp(1,.35,t);
      const angle=lerp(-3, -3 + wing*settle, 1);
      carpet.style.width=w+'px';
      carpet.style.maxWidth=w+'px';
      carpet.style.transform=`translate3d(0,0,0) rotate(${angle}deg)`;
    }

function getTextareaCaretPositionFromPointer(textarea,event){
  if(!textarea||!event)return -1;
  const previousStart=textarea.selectionStart;
  const previousEnd=textarea.selectionEnd;
  let pos=-1;

  if(document.caretPositionFromPoint){
    const caret=document.caretPositionFromPoint(event.clientX,event.clientY);
    if(caret&&Number.isFinite(caret.offset))pos=caret.offset;
  }else if(document.caretRangeFromPoint){
    const range=document.caretRangeFromPoint(event.clientX,event.clientY);
    if(range&&Number.isFinite(range.startOffset))pos=range.startOffset;
  }

  if(!Number.isFinite(pos)||pos<0){
    const rect=textarea.getBoundingClientRect();
    const style=window.getComputedStyle(textarea);
    const lineHeight=parseFloat(style.lineHeight)||parseFloat(style.fontSize)*1.5||22;
    const charWidth=Math.max(7,(parseFloat(style.fontSize)||15)*0.58);
    const x=Math.max(0,event.clientX-rect.left-(parseFloat(style.paddingLeft)||0)+textarea.scrollLeft);
    const y=Math.max(0,event.clientY-rect.top-(parseFloat(style.paddingTop)||0)+textarea.scrollTop);
    const line=Math.floor(y/lineHeight);
    const col=Math.round(x/charWidth);
    const lines=String(textarea.value||'').replace(/\r/g,'\n').split('\n');
    pos=0;
    for(let i=0;i<Math.min(line,lines.length);i++)pos+=lines[i].length+1;
    pos+=Math.min(col,(lines[line]||'').length);
  }

  try{textarea.setSelectionRange(previousStart,previousEnd)}catch(e){}
  return pos;
}

function permutations(arr){
  const res=[];const used=new Array(arr.length).fill(false);const cur=[];
  function backtrack(){if(cur.length===arr.length){res.push(cur.slice());return}for(let i=0;i<arr.length;i++){if(used[i])continue;used[i]=true;cur.push(arr[i]);backtrack();cur.pop();used[i]=false}}
  backtrack();return res;
}

function evaluateBest(start,visits,end,matrix){
  let best=null;const orders=permutations(visits);
  for(const order of orders){
    const route=[start,...order,end];let durationMs=0,distanceM=0,segments=[],ok=true;
    for(let i=0;i<route.length-1;i++){
      const from=route[i],to=route[i+1];const d=matrix.get(coordKey(from,to));
      if(!d){ok=false;break}
      durationMs+=Number(d.summary.durationMs||0);distanceM+=Number(d.summary.distanceM||0);
      segments.push({from,to,summary:d.summary,path:d.path||[]});
    }
    if(!ok)continue;
    if(!best||durationMs<best.durationMs)best={route,durationMs,distanceM,segments,orderCount:orders.length};
  }
  if(!best)throw new Error('추천 순서를 계산하지 못했습니다.');
  return best;
}

async function findRoute(){
  const runId=++routeRunSeq;
  const assertActive=()=>{
    if(runId!==routeRunSeq){
      const err=new Error('이전 최단경로 계산을 중단했습니다.');
      err.code='ROUTE_CANCELLED';
      throw err;
    }
  };
  try{
    resetResult();
    const input=parseInputs();
    saveRouteInputAddressesToHistory(input);
    showStatus('최단경로 계산을 시작합니다. 주소 좌표를 확인하는 중입니다.');
    focusPanelTopSoon();
    setBusy(true);
    const labels=input.returnToStart
      ? ['A',...input.visits.map((_,i)=>String.fromCharCode(66+i))]
      : ['A',...input.visits.map((_,i)=>String.fromCharCode(66+i)),'Z'];
    const raw=input.returnToStart
      ? [input.start,...input.visits]
      : [input.start,...input.visits,input.end];
    if(!input.start||!input.end||raw.some(v=>!normalizeAddress(v))){
      throw makeInputValidationError('출발지와 도착지가 모두 확인된 뒤 최단경로를 계산할 수 있습니다.');
    }
    const totalGeo=raw.length;const resolved=[];
    for(let i=0;i<raw.length;i++){
      assertActive();
      const item=await geocodeAddress(raw[i],labels[i],i+1,totalGeo);
      assertActive();
      if(!hasCoord(item)){
        const err=new Error(`${labels[i]} 주소 좌표를 확인하지 못했습니다: ${raw[i]}`);
        err.code='GEOCODE_NOT_FOUND';
        err.label=labels[i];
        err.address=raw[i];
        throw err;
      }
      resolved.push(item);
    }
    assertActive();
    const start={id:'A',role:'start',...resolved[0]};
    const visits=resolved.slice(1,1+input.visits.length).map((p,i)=>({id:`V${i+1}`,role:'visit',...p}));
    const end=input.returnToStart?start:{id:'Z',role:'end',...resolved[resolved.length-1]};
    const nodes=input.returnToStart?[start,...visits]:[start,...visits,end];
    const pairs=[];
    if(!visits.length){
      pairs.push([start,end]);
    }else{
      for(const a of nodes){for(const b of nodes){if(a.id!==b.id)pairs.push([a,b])}}
    }
    const matrix=new Map();
    await mapLimit(pairs,4,async(pair)=>{
      assertActive();
      const [a,b]=pair;
      const data=await directionBetween(a,b);
      assertActive();
      matrix.set(coordKey(a,b),data);
      return data;
    },(done,total,pair)=>{
      if(runId!==routeRunSeq)return;
      showProgress(`구간 시간 조회 중 ${done}/${total} · ${pair[0].label||pair[0].id} → ${pair[1].label||pair[1].id}`,done,total);
    });
    assertActive();
    showStatus('추천 순서 계산 중...');
    const best=evaluateBest(start,visits,end,matrix);
    assertActive();
    showStatus(`${best.orderCount.toLocaleString('ko-KR')}개 경로 검토 후 최적 경로 도출 완료`,'ok');
    renderResult(best,input.returnToStart);
    saveRouteResultAddressesToHistory(best);
  }catch(e){
    if(e&&e.code==='INPUT_VALIDATION'){
      showInputValidationError(e.message||'입력값을 확인해 주세요.');
    }else if(e&&e.code==='GEOCODE_NOT_FOUND'){
      routeRunSeq++;
      showAddressLookupError(e);
    }else if(e&&e.code==='DIRECTION_FAILED'){
      routeRunSeq++;
      showDirectionLookupError(e);
    }else if(e&&e.code==='ROUTE_CANCELLED'){
      return;
    }else{
      showInputValidationError(e.message||'입력값을 확인해 주세요.');
    }
  }finally{if(runId===routeRunSeq)setBusy(false);endInput.disabled=returnChk.checked}
}

function getCurrentPositionOnce(){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation){
      reject(new Error('이 브라우저에서는 현재 위치 기능을 사용할 수 없습니다.'));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos=>resolve(pos),
      err=>{
        if(err&&err.code===1)reject(new Error('위치 권한이 차단되어 있습니다. 브라우저 위치 권한을 허용해 주세요.'));
        else if(err&&err.code===2)reject(new Error('현재 위치를 확인하지 못했습니다. GPS 또는 위치 서비스를 확인해 주세요.'));
        else if(err&&err.code===3)reject(new Error('현재 위치 확인 시간이 초과되었습니다. 다시 시도해 주세요.'));
        else reject(new Error('현재 위치를 가져오지 못했습니다.'));
      },
      {enableHighAccuracy:true,timeout:10000,maximumAge:30000}
    );
  });
}

async function reverseGeocode(lat,lng){
  const res=await fetch('/api/route-setting/reverse-geocode',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({lat,lng})
  });
  const data=await res.json().catch(()=>null);
  if(!res.ok||!data||!data.ok||!data.item){
    throw new Error((data&&data.message)||'현재 위치 주소 변환에 실패했습니다.');
  }
  return data.item;
}

/* Search history modal. Naver Search API is removed; this modal only uses typed/pasted addresses and local address history. */
let lastPlaceSearchItems=[];
const PLACE_HISTORY_KEY='routeSettingAddressHistory:v1';

function stripHtmlTags(value){
  return String(value||'').replace(/<[^>]*>/g,'').replace(/&quot;/g,'"').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').trim();
}
function getPlaceResultAddress(item){
  return normalizeAddress(item&&((item.roadAddress||'')||(item.address||'')||(item.title||'')));
}
function loadAddressHistory(){
  try{
    const raw=localStorage.getItem(PLACE_HISTORY_KEY);
    const arr=JSON.parse(raw||'[]');
    return Array.isArray(arr)?arr.filter(v=>normalizeAddress(v&&v.address)).map(v=>({
      title:normalizeAddress(v.title||v.address),
      address:normalizeAddress(v.address),
      roadAddress:normalizeAddress(v.roadAddress||v.address),
      source:normalizeAddress(v.source||'이력'),
      savedAt:Number(v.savedAt||0)
    })):[];
  }catch(err){return [];}
}
function writeAddressHistory(items){
  try{localStorage.setItem(PLACE_HISTORY_KEY,JSON.stringify(items.slice(0,80)));}catch(err){}
}
function normalizeHistoryRecord(record){
  const address=normalizeAddress(record&&((record.roadAddress||'')||(record.address||'')||(record.title||'')));
  if(!address)return null;
  return {
    title:normalizeAddress(record.title||address),
    address,
    roadAddress:normalizeAddress(record.roadAddress||address),
    source:normalizeAddress(record.source||'이력'),
    savedAt:Number(record.savedAt||Date.now())
  };
}
function mergeAddressHistory(records){
  const merged=[];
  const seen=new Set();
  records.forEach(record=>{
    const item=normalizeHistoryRecord(record);
    if(!item)return;
    const key=item.address.toLowerCase();
    if(seen.has(key))return;
    seen.add(key);
    merged.push(item);
  });
  return merged;
}
function saveAddressHistoryRecord(address,title,source='이력'){
  const item=normalizeHistoryRecord({address,roadAddress:address,title:title||address,source,savedAt:Date.now()});
  if(!item)return;
  const existing=loadAddressHistory();
  writeAddressHistory(mergeAddressHistory([item,...existing]));
}
function getCurrentRouteAddressRecords(){

  const start=normalizeAddress(startInput&&startInput.value);
  const end=normalizeAddress(endInput&&endInput.value);
  if(start)records.push({title:'출발지',address:start,roadAddress:start,source:'현재 입력'});

    records.push({title:`경유지 ${idx+1}`,address,roadAddress:address,source:'현재 입력'});
  });

  return records;
}
function saveCurrentRouteAddressesToHistory(){

function getRouteInputAddressRecords(input,source='경로찾기 이력'){
  const records=[];
  if(!input)return records;
  const start=normalizeAddress(input.start);
  const end=normalizeAddress(input.end);
  if(start)records.push({title:'출발지',address:start,roadAddress:start,source});

  });

  return records;

function saveRouteInputAddressesToHistory(input){
  const records=getRouteInputAddressRecords(input,'경로찾기 이력');
  if(!records.length)return;
  writeAddressHistory(mergeAddressHistory([...records,...loadAddressHistory()]));
}
function saveRouteResultAddressesToHistory(result){
  const route=result&&Array.isArray(result.route)?result.route:[];
  if(!route.length)return;
  const records=route.map((item,idx)=>{
    const address=normalizeAddress(item&&((item.address||'')||(item.resolvedAddress||'')));
    if(!address)return null;
    return {title:idx===0?'출발지':idx===route.length-1?'도착지':`경유지 ${idx}`,address,roadAddress:address,source:'경로찾기 완료'};
  }).filter(Boolean);
  if(!records.length)return;
  writeAddressHistory(mergeAddressHistory([...records,...loadAddressHistory()]));
}
function getAddressHistoryItems(query=''){
  const q=normalizeAddress(query).toLowerCase();
  const current=getCurrentRouteAddressRecords();
  const history=loadAddressHistory();
  let items=mergeAddressHistory([...current,...history]);
  if(q){
    items=items.filter(item=>[
      item.title,
      item.address,
      item.roadAddress,
      item.source
    ].join(' ').toLowerCase().includes(q));
  }
  return items;
}

const mobilePanelHandle=$('mobilePanelHandle');
const mobilePanelDragZone=$('mobilePanelDragZone');
const mobilePanelRoot=document.querySelector('.app');
const mobilePanelStates={top:88,middle:50,bottom:10};
let mobilePanelDragActive=false;

if(window.matchMedia&&window.matchMedia('(max-width:760px)').matches&&mobilePanelRoot){
  mobilePanelRoot.dataset.mobilePanelState='middle';
  mobilePanelRoot.style.setProperty('--mobile-panel-top','50vh');
}

function isMobileLayout(){
  return !!(window.matchMedia&&window.matchMedia('(max-width:760px)').matches);
}

function clampMapPercent(value){
  return Math.max(10,Math.min(88,value));
}

function setMobileMapPercent(value){
  if(!isMobileLayout())return;
  mobilePanelRoot.style.setProperty('--mobile-panel-top',`${clampMapPercent(value)}vh`);
  refreshMap();
  setTimeout(refreshMap,80);
  setTimeout(refreshMap,320);
}

function setMobilePanelState(state){
  if(!isMobileLayout())return;
  const nextState=mobilePanelStates[state]!==undefined?state:'middle';
  mobilePanelRoot.dataset.mobilePanelState=nextState;
  setMobileMapPercent(mobilePanelStates[nextState]);
}

function nearestMobilePanelState(percent){
  const states=Object.entries(mobilePanelStates);
  let best=states[0];
  for(const item of states){
    if(Math.abs(item[1]-percent)<Math.abs(best[1]-percent))best=item;
  }
  return best[0];
}

function pointerY(e){
  if(e.touches&&e.touches.length)return e.touches[0].clientY;
  if(e.changedTouches&&e.changedTouches.length)return e.changedTouches[0].clientY;
  return e.clientY;
}


function installMobilePullRefreshGuard(){
  const panelEl=document.querySelector('.panel');
  if(!panelBody||!panelEl)return;
  let startY=0;
  let startX=0;
  let startScrollTop=0;
  let targetScrollable=null;

  const findScrollable=el=>{
    let node=el;
    while(node&&node!==document.body&&node!==document.documentElement){
      const style=window.getComputedStyle(node);
      const canScrollY=/(auto|scroll)/.test(style.overflowY)&&node.scrollHeight>node.clientHeight+1;
      if(canScrollY)return node;
      node=node.parentElement;
    }
    return panelBody;
  };

  const isFormControl=el=>!!(el&&el.closest&&el.closest('input,textarea,select,button'));

  panelEl.addEventListener('touchstart',e=>{
    if(!isMobileLayout())return;
    if(e.touches&&e.touches.length>1){e.preventDefault();return;}
    if(!e.touches||e.touches.length!==1)return;
    if(isFormControl(e.target))return;
    const t=e.touches[0];
    startY=t.clientY;
    startX=t.clientX;
    targetScrollable=findScrollable(e.target);
    startScrollTop=targetScrollable?targetScrollable.scrollTop:0;
  },{passive:false});

  panelEl.addEventListener('touchmove',e=>{
    if(!isMobileLayout())return;
    if(e.touches&&e.touches.length>1){e.preventDefault();return;}
    if(!e.touches||e.touches.length!==1)return;
    if(isFormControl(e.target))return;
    const t=e.touches[0];
    const dy=t.clientY-startY;
    const dx=t.clientX-startX;
    if(Math.abs(dx)>Math.abs(dy))return;

    const scroller=targetScrollable||panelBody;
    const atTop=scroller.scrollTop<=0;
    const atBottom=scroller.scrollTop+scroller.clientHeight>=scroller.scrollHeight-1;

    // 패널 내부 스크롤이 더 갈 곳이 없을 때 브라우저 전체로 드래그가 넘어가면
    // 모바일 pull-to-refresh / 화면 새로고침이 걸릴 수 있어 여기서 끊는다.
    if((atTop&&dy>0)||(atBottom&&dy<0)||startScrollTop<=0&&dy>0){
      e.preventDefault();
    }
  },{passive:false});
}

installMobilePullRefreshGuard();

function preventMobilePageZoom(){
  if(!isMobileLayout())return;

  // iOS Safari page zoom gesture.
  ['gesturestart','gesturechange','gestureend'].forEach(type=>{
    document.addEventListener(type,e=>{
      e.preventDefault();
    },{passive:false});
  });

  // Browser page pinch fallback. Do not stop propagation, so Naver map can still handle its own pinch zoom.
  document.addEventListener('touchmove',e=>{
    if(e.touches&&e.touches.length>1){
      e.preventDefault();
    }
  },{passive:false});

  // Double-tap page zoom guard.
  let lastTouchEnd=0;
  document.addEventListener('touchend',e=>{
    const now=Date.now();
    if(now-lastTouchEnd<=300){
      e.preventDefault();
    }
    lastTouchEnd=now;
  },{passive:false});
}

preventMobilePageZoom();

const mobilePanelDragSurface=mobilePanelDragZone||mobilePanelHandle;
if(mobilePanelDragSurface){
  const startDrag=e=>{
    if(!isMobileLayout())return;
    mobilePanelDragActive=true;
    mobilePanelRoot.dataset.mobilePanelState='dragging';
    mobilePanelDragSurface.setPointerCapture&&e.pointerId!==undefined&&mobilePanelDragSurface.setPointerCapture(e.pointerId);
    e.preventDefault();
  };
  const moveDrag=e=>{
    if(!mobilePanelDragActive||!isMobileLayout())return;
    const y=pointerY(e);
    const percent=clampMapPercent((y/window.innerHeight)*100);
    mobilePanelRoot.style.setProperty('--mobile-panel-top',`${percent}vh`);
    refreshMap();
    e.preventDefault();
  };
  const endDrag=e=>{
    if(!mobilePanelDragActive)return;
    mobilePanelDragActive=false;
    const y=pointerY(e);
    const percent=clampMapPercent((y/window.innerHeight)*100);
    setMobilePanelState(nearestMobilePanelState(percent));
    e.preventDefault();
  };

  mobilePanelDragSurface.addEventListener('pointerdown',startDrag);
  window.addEventListener('pointermove',moveDrag,{passive:false});
  window.addEventListener('pointerup',endDrag,{passive:false});
  window.addEventListener('pointercancel',endDrag,{passive:false});
}

window.addEventListener('resize',()=>{
  if(isMobileLayout()){
    const current=parseFloat(getComputedStyle(mobilePanelRoot).getPropertyValue('--mobile-panel-top'))||mobilePanelStates.middle;
    setMobileMapPercent(current);
  }else{
    mobilePanelRoot.style.removeProperty('--mobile-panel-top');
    delete mobilePanelRoot.dataset.mobilePanelState;
  }
});

/* Print patch: render the current desktop map viewport into A4, pins only. */
function getCurrentMapViewportSnapshot(){
  const maps=getNaverMaps();
  const rect=mapWrap?mapWrap.getBoundingClientRect():null;
  const width=Math.max(1,Math.round(rect&&rect.width?rect.width:1200));
  const height=Math.max(1,Math.round(rect&&rect.height?rect.height:700));
  const aspect=width/height;
  const fallback={width,height,aspect,center:null,zoom:11,bounds:null};
  if(!maps||!naverMap)return fallback;
  try{
    const center=naverMap.getCenter&&naverMap.getCenter();
    const zoom=naverMap.getZoom&&naverMap.getZoom();
    const bounds=naverMap.getBounds&&naverMap.getBounds();
    let sw=null,ne=null;
    if(bounds){
      sw=bounds.getSW?bounds.getSW():(bounds._sw||null);
      ne=bounds.getNE?bounds.getNE():(bounds._ne||null);
    }
    return {
      width,height,aspect,
      center:center?{lat:center.lat(),lng:center.lng()}:null,
      zoom:Number.isFinite(zoom)?zoom:11,
      bounds:(sw&&ne)?{sw:{lat:sw.lat(),lng:sw.lng()},ne:{lat:ne.lat(),lng:ne.lng()}}:null
    };
  }catch(e){
    return fallback;
  }
}

function getPrintMapHeightMm(viewport){
  const usableWidthMm=190;
  const aspect=Math.max(.35,Math.min(4,viewport&&viewport.aspect?viewport.aspect:1.7));
  const raw=usableWidthMm/aspect;
  return Math.max(82,Math.min(142,raw));
}

function normalizePrintClusterKey(item){
  const lat=Number(item&&item.lat);
  const lng=Number(item&&item.lng);
  if(!Number.isFinite(lat)||!Number.isFinite(lng))return '';
  return `${lat.toFixed(6)},${lng.toFixed(6)}`;
}

function getPrintPointLabel(item,index,total,returnToStart){
  const meta=makeRouteLabel(item,index,total,returnToStart);
  return meta.label;
}

function normalizePrintGroupLabels(items){
  const seen=new Set();
  const labels=[];
  items.forEach(x=>{
    const label=String(x.label||'').trim();
    if(!label)return;
    // 출발지와 도착지가 같은 좌표로 묶이면 A만 표시한다.
    if(label==='Z'&&seen.has('A'))return;
    if(label==='A'&&seen.has('Z')){
      const zIndex=labels.indexOf('Z');
      if(zIndex>=0)labels.splice(zIndex,1);
      seen.delete('Z');
    }
    if(seen.has(label))return;
    seen.add(label);
    labels.push(label);
  });
  return labels;
}

function printMercatorX(lng){
  return (Number(lng)+180)/360;
}

function printMercatorY(lat){
  const clamped=Math.max(-85.05112878,Math.min(85.05112878,Number(lat)));
  const rad=clamped*Math.PI/180;
  return (1-Math.log(Math.tan(rad)+1/Math.cos(rad))/Math.PI)/2;
}

function getPrintViewportMercatorBox(viewport, route){
  if(viewport&&viewport.bounds&&viewport.bounds.sw&&viewport.bounds.ne){
    const west=printMercatorX(viewport.bounds.sw.lng);
    const east=printMercatorX(viewport.bounds.ne.lng);
    const north=printMercatorY(viewport.bounds.ne.lat);
    const south=printMercatorY(viewport.bounds.sw.lat);
    return {
      minX:Math.min(west,east),
      maxX:Math.max(west,east),
      minY:Math.min(north,south),
      maxY:Math.max(north,south)
    };
  }

  const xs=[];
  const ys=[];
  (route||[]).forEach(item=>{
    if(!hasCoord(item))return;
    xs.push(printMercatorX(item.lng));
    ys.push(printMercatorY(item.lat));
  });
  if(!xs.length||!ys.length)return null;

  const minX=Math.min(...xs),maxX=Math.max(...xs);
  const minY=Math.min(...ys),maxY=Math.max(...ys);
  const padX=Math.max((maxX-minX)*0.10,0.00015);
  const padY=Math.max((maxY-minY)*0.10,0.00015);
  return {minX:minX-padX,maxX:maxX+padX,minY:minY-padY,maxY:maxY+padY};
}

function getPrintPointPixel(item,viewport,route){
  const box=getPrintViewportMercatorBox(viewport,route);
  const mapEl=document.getElementById('printNaverMap');
  const mapWidth=mapEl&&mapEl.clientWidth?mapEl.clientWidth:900;
  const mapHeight=mapEl&&mapEl.clientHeight?mapEl.clientHeight:520;
  if(!box||box.maxX===box.minX||box.maxY===box.minY)return null;

  const x=(printMercatorX(item.lng)-box.minX)/(box.maxX-box.minX)*mapWidth;
  const y=(printMercatorY(item.lat)-box.minY)/(box.maxY-box.minY)*mapHeight;
  if(!Number.isFinite(x)||!Number.isFinite(y))return null;
  return {x,y};
}

function buildPrintMarkerGroups(route,viewport){
  const groups=[];
  const total=(route||[]).length;
  const returnToStart=!!(latestResult&&latestResult.returnToStart);
  const mapEl=document.getElementById('printNaverMap');
  const mapWidth=mapEl&&mapEl.clientWidth?mapEl.clientWidth:900;
  const mapHeight=mapEl&&mapEl.clientHeight?mapEl.clientHeight:520;

  // 핀 머리 폭/높이를 기준으로, 실제 인쇄 지도에서 서로 가리는 거리면 한 핀에 묶는다.
  const overlapX=Math.max(24,Math.min(42,mapWidth*0.045));
  const overlapY=Math.max(28,Math.min(48,mapHeight*0.085));

  (route||[]).forEach((item,index)=>{
    if(!hasCoord(item))return;
    const label=getPrintPointLabel(item,index,total,returnToStart);
    const pt=getPrintPointPixel(item,viewport,route);
    const lat=Number(item.lat);
    const lng=Number(item.lng);

    let group=null;
    if(pt){
      group=groups.find(g=>Math.abs(g.px-pt.x)<=overlapX&&Math.abs(g.py-pt.y)<=overlapY);
    }

    // 위 픽셀 계산이 안 되는 경우만 같은 좌표로 묶는다.
    if(!group){
      const key=normalizePrintClusterKey(item);
      group=groups.find(g=>g.coordKey&&g.coordKey===key) || null;
    }

    if(!group){
      group={
        lat,lng,
        sumLat:0,sumLng:0,count:0,
        px:pt?pt.x:0,py:pt?pt.y:0,
        sumPx:0,sumPy:0,pxCount:0,
        coordKey:normalizePrintClusterKey(item),
        items:[]
      };
      groups.push(group);
    }

    group.items.push({item,index,label});
    group.sumLat+=lat;
    group.sumLng+=lng;
    group.count+=1;
    if(pt){
      group.sumPx+=pt.x;
      group.sumPy+=pt.y;
      group.pxCount+=1;
      group.px=group.sumPx/group.pxCount;
      group.py=group.sumPy/group.pxCount;
    }
    group.lat=group.sumLat/group.count;
    group.lng=group.sumLng/group.count;
  });

  groups.forEach(group=>{
    group.labels=normalizePrintGroupLabels(group.items);
  });
  return groups;
}

function makeStrongPrintPinContent(label){
  const safe=esc(label);
  // 현재 핀 외형의 80% 크기로 한 번 더 줄이고, 글자 크기는 그대로 유지한다.
  return `<div style="width:30px;height:36px;filter:drop-shadow(0 4px 8px rgba(15,23,42,.38));">
    <svg xmlns="http://www.w3.org/2000/svg" width="30" height="36" viewBox="0 0 30 36" role="img" aria-label="${safe}" style="display:block;overflow:visible;-webkit-print-color-adjust:exact;print-color-adjust:exact;">
      <path d="M15 33.6 L7.4 25 C2.8 21.5 1 17.6 1 12.3 C1 5.6 6.7 1 15 1 C23.3 1 29 5.6 29 12.3 C29 17.6 27.2 21.5 22.6 25 Z" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
      <text x="15" y="17.1" text-anchor="middle" dominant-baseline="middle" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="1000" fill="#ffffff" stroke="rgba(0,0,0,.55)" stroke-width="0.8" paint-order="stroke fill" letter-spacing="-.02em">${safe}</text>
    </svg>
  </div>`;
}

function makeMultiLabelPrintPinContent(labels){
  const raw=(labels||[]).map(x=>String(x||'').trim()).filter(Boolean).join(',');
  const safe=esc(raw);
  const w=Math.max(30,Math.min(90,Math.round(raw.length*8+16)));
  const h=36;
  const cx=w/2;
  const bodyTop=1;
  const bodyBottom=23.5;
  const radius=Math.min(11.5,Math.max(8,w*0.22));
  const left=1;
  const right=w-1;
  const tipY=33.6;
  const tailHalf=6.5;
  return `<div style="width:${w}px;height:${h}px;filter:drop-shadow(0 4px 8px rgba(15,23,42,.38));">
    <svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${safe}" style="display:block;overflow:visible;-webkit-print-color-adjust:exact;print-color-adjust:exact;">
      <path d="M ${left+radius} ${bodyTop} H ${right-radius} A ${radius} ${radius} 0 0 1 ${right} ${bodyTop+radius} V ${bodyBottom-radius} A ${radius} ${radius} 0 0 1 ${right-radius} ${bodyBottom} H ${cx+tailHalf} L ${cx} ${tipY} L ${cx-tailHalf} ${bodyBottom} H ${left+radius} A ${radius} ${radius} 0 0 1 ${left} ${bodyBottom-radius} V ${bodyTop+radius} A ${radius} ${radius} 0 0 1 ${left+radius} ${bodyTop} Z" fill="#dc2626" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
      <text x="${cx}" y="14.2" text-anchor="middle" dominant-baseline="middle" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="1000" fill="#ffffff" stroke="rgba(0,0,0,.55)" stroke-width="0.8" paint-order="stroke fill" letter-spacing="-.02em">${safe}</text>
    </svg>
  </div>`;
}

function makePrintMarkerIconForGroup(group){
  const maps=getNaverMaps();
  const labels=group.labels&&group.labels.length?group.labels:normalizePrintGroupLabels(group.items);
  if(labels.length>1){
    const raw=labels.join(',');
    const w=Math.max(30,Math.min(90,Math.round(raw.length*8+16)));
    return {
      content:makeMultiLabelPrintPinContent(labels),
      anchor:maps?new maps.Point(Math.round(w/2),34):undefined
    };
  }
  return {
    content:makeStrongPrintPinContent(labels[0]||''),
    anchor:maps?new maps.Point(15,34):undefined
  };
}

function buildPrintRouteItemHtml(routeItem,index,total,returnToStart,segments){
  const meta=makeRouteLabel(routeItem,index,total,returnToStart);
  const seg=segments[index];
  const badgeClass=meta.type==='start'?'a':meta.type==='end'?'z':'';
  const segText=seg?`<div class="printSegment">다음 구간 ${esc(seg.summary.durationText)} · ${esc(seg.summary.distanceText)}</div>`:'';
  return `<div class="printRouteItem">
    <div class="printBadge ${badgeClass}">${esc(meta.label)}</div>
    <div>
      <span class="printRouteLabel">${esc(meta.text)}</span>
      <div class="printRouteText">${esc(routeItem.address||routeItem.resolvedAddress||'')}</div>
      ${segText}
    </div>
  </div>`;
}

function makePrintRouteHtml(){
  if(!latestResult)return '';
  const route=latestResult.route||[];
  const useTwoCols=route.length>=4;
  const splitIndex=useTwoCols?Math.ceil(route.length/2):route.length;
  const col1=route.slice(0,splitIndex).map((item,i)=>buildPrintRouteItemHtml(item,i,route.length,latestResult.returnToStart,latestResult.segments||[])).join('');
  const col2=useTwoCols?route.slice(splitIndex).map((item,i)=>buildPrintRouteItemHtml(item,splitIndex+i,route.length,latestResult.returnToStart,latestResult.segments||[])).join(''):'';
  return `<div class="printColumns ${useTwoCols?'twoCol':''}">
    <div class="printColumn">${col1}</div>
    ${useTwoCols?`<div class="printColumn">${col2}</div>`:''}
  </div>`;
}

function destroyPrintMap(){
  (printMapMarkers||[]).forEach(m=>{try{m.setMap(null)}catch(e){}});
  printMapMarkers=[];
  printMapInstance=null;
}

function renderPrintViewportMap(viewport){
  const maps=getNaverMaps();
  if(!maps||!latestResult)return false;
  const mapEl=document.getElementById('printMapLive');
  if(!mapEl)return false;
  destroyPrintMap();

  const route=latestResult.route||[];
  const first=route.find(hasCoord);
  const center=viewport&&viewport.center
    ? new maps.LatLng(viewport.center.lat,viewport.center.lng)
    : first?new maps.LatLng(first.lat,first.lng):new maps.LatLng(36.5,127.8);

  printMapInstance=new maps.Map(mapEl,{
    center,
    zoom:(viewport&&Number.isFinite(viewport.zoom))?viewport.zoom:11,
    draggable:false,
    pinchZoom:false,
    scrollWheel:false,
    keyboardShortcuts:false,
    disableDoubleTapZoom:true,
    disableDoubleClickZoom:true,
    mapDataControl:false,
    scaleControl:false,
    logoControl:false
  });

  const groups=buildPrintMarkerGroups(route,viewport);
  groups.forEach(group=>{
    const pos=new maps.LatLng(group.lat,group.lng);
    const marker=new maps.Marker({
      position:pos,
      map:printMapInstance,
      title:group.items.map(x=>`${x.label}. ${x.item.address||x.item.resolvedAddress||''}`).join(' / '),
      icon:makePrintMarkerIconForGroup(group)
    });
    printMapMarkers.push(marker);
  });

  const applyViewport=()=>{
    try{maps.Event.trigger(printMapInstance,'resize')}catch(e){}
    try{
      if(viewport&&viewport.bounds){
        const sw=new maps.LatLng(viewport.bounds.sw.lat,viewport.bounds.sw.lng);
        const ne=new maps.LatLng(viewport.bounds.ne.lat,viewport.bounds.ne.lng);
        const bounds=new maps.LatLngBounds(sw,ne);
        printMapInstance.fitBounds(bounds,{top:8,right:8,bottom:8,left:8});
      }else if(route.length>1){
        const bounds=new maps.LatLngBounds();
        route.filter(hasCoord).forEach(p=>bounds.extend(new maps.LatLng(p.lat,p.lng)));
        printMapInstance.fitBounds(bounds,{top:38,right:38,bottom:38,left:38});
      }else if(first){
        printMapInstance.setCenter(new maps.LatLng(first.lat,first.lng));
        printMapInstance.setZoom(13);
      }
    }catch(e){}
  };
  applyViewport();
  setTimeout(applyViewport,80);
  setTimeout(applyViewport,260);
  return true;
}

async function printRouteResult(){
  if(!latestResult){
    showStatus('출력할 추천순서가 없습니다. 최단경로를 먼저 찾으세요.','err');
    return;
  }

  removePrintSheet();
  destroyPrintMap();

  const viewport=getCurrentMapViewportSnapshot();
  const mapHeightMm=getPrintMapHeightMm(viewport);
  const routeCount=(latestResult.route||[]).length;
  const sheet=document.createElement('section');
  sheet.className='printSheet printViewportSheet offscreen';
  const now=new Date();
  const dateText=now.toLocaleString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});

  sheet.innerHTML=`<div class="printPage">
    <div class="printTop">
      <div class="printTitle">최단 경로 추천 순서</div>
      <div class="printMeta">출력일 ${esc(dateText)}</div>
    </div>
    <div class="printMapBox" style="height:${mapHeightMm.toFixed(2)}mm">
      <div id="printMapLive" class="printMapLive" aria-label="출력용 지도" style="height:${mapHeightMm.toFixed(2)}mm"></div>
    </div>
    <div class="printRouteSection">
      <div class="printSummary">
        <span>총 예상시간 ${esc(formatDuration(latestResult.durationMs))}</span>
        <span>총 거리 ${esc(formatDistance(latestResult.distanceM))}</span>
        <span>${routeCount}개 지점</span>
        <span>${routeCount<=3?'경로 1열':'경로 2열'}</span>
      </div>
      ${makePrintRouteHtml()}
    </div>
  </div>`;
  document.body.appendChild(sheet);

  const ok=renderPrintViewportMap(viewport);
  if(!ok){
    removePrintSheet();
    showStatus('출력용 지도를 만들지 못했습니다.','err');
    return;
  }

  setTimeout(()=>{
    sheet.classList.remove('offscreen');
    window.print();
  },850);
}


/* Final print selection implementation: capture selected current map area, then reuse existing print pin HTML logic. */
let routeToastTimer=null;
let printAreaSelectState=null;

function showRouteToast(message,type){
  let toast=document.getElementById('routeToast');
  if(!toast){
    toast=document.createElement('div');
    toast.id='routeToast';
    toast.className='routeToast';
    document.body.appendChild(toast);
  }
  toast.className='routeToast';
  if(type)toast.classList.add(String(type));
  toast.textContent=String(message||'');
  toast.classList.add('show');
  clearTimeout(routeToastTimer);
  routeToastTimer=setTimeout(()=>toast.classList.remove('show'),2600);
}

function getPrintSelectionRectFromState(){
  if(!printAreaSelectState)return null;
  const s=printAreaSelectState;
  const left=Math.min(s.startX,s.endX);
  const top=Math.min(s.startY,s.endY);
  const width=Math.abs(s.endX-s.startX);
  const height=Math.abs(s.endY-s.startY);
  if(width<24||height<24)return null;
  return {left,top,width,height,right:left+width,bottom:top+height};
}

function updatePrintAreaBox(){
  const box=$('printAreaBox');
  if(!box)return;
  const rect=getPrintSelectionRectFromState();
  if(!rect){
    box.classList.remove('active','ready');
    return;
  }
  box.classList.add('active');
  box.style.left=`${rect.left}px`;
  box.style.top=`${rect.top}px`;
  box.style.width=`${rect.width}px`;
  box.style.height=`${rect.height}px`;
  if(printAreaSelectState&&printAreaSelectState.ready){
    box.classList.add('ready');
  }else{
    box.classList.remove('ready');
  }
}

function cancelPrintAreaSelect(){
  const overlay=$('printAreaOverlay');
  const box=$('printAreaBox');
  if(overlay){
    overlay.classList.remove('active');
    overlay.onpointerdown=null;
    overlay.onpointermove=null;
    overlay.onpointerup=null;
    overlay.onpointercancel=null;
  }
  if(box){
    box.classList.remove('active','ready');
    box.removeAttribute('style');
  }
  printAreaSelectState=null;
}

function removePrintCaptureSheet(){
  const old=document.querySelector('.printSheet.printCaptureSheet');
  if(old&&old.parentNode)old.parentNode.removeChild(old);
}

function cleanupPrintCaptureMode(){
  document.body.classList.remove('printCaptureMode');
  document.body.style.removeProperty('--print-map-height-mm');
  removePrintCaptureSheet();
}

function escapeDataAttrValue(value){
  return String(value||'').replace(/"/g,'&quot;');
}

function loadHtml2CanvasIfNeeded(){
  if(window.html2canvas)return Promise.resolve(window.html2canvas);
  return new Promise((resolve,reject)=>{
    const old=document.getElementById('html2canvasLoader');
    if(old){
      old.addEventListener('load',()=>resolve(window.html2canvas));
      old.addEventListener('error',reject);
      return;
    }
    const s=document.createElement('script');
    s.id='html2canvasLoader';
    s.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
    s.onload=()=>resolve(window.html2canvas);
    s.onerror=()=>reject(new Error('html2canvas 로딩 실패'));
    document.head.appendChild(s);
  });
}

async function captureSelectedMapArea(rect){
  if(!mapWrap||!rect)return '';
  const overlay=$('printAreaOverlay');
  const previousDisplay=overlay?overlay.style.display:'';
  if(overlay)overlay.style.display='none';

  try{
    const html2canvas=await loadHtml2CanvasIfNeeded();
    const canvas=await html2canvas(mapWrap,{
      backgroundColor:null,
      useCORS:true,
      allowTaint:true,
      logging:false,
      scale:Math.min(2,Math.max(1,window.devicePixelRatio||1)),
      x:rect.left,
      y:rect.top,
      width:rect.width,
      height:rect.height,
      scrollX:0,
      scrollY:0
    });
    return canvas.toDataURL('image/png');
  }catch(e){
    // fallback: crop the first map canvas if the map renderer exposes one.
    try{
      const source=mapWrap.querySelector('canvas');
      if(!source)return '';
      const ratioX=source.width/mapWrap.clientWidth;
      const ratioY=source.height/mapWrap.clientHeight;
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(rect.width*ratioX));
      c.height=Math.max(1,Math.round(rect.height*ratioY));
      const ctx=c.getContext('2d');
      ctx.drawImage(
        source,
        rect.left*ratioX,rect.top*ratioY,rect.width*ratioX,rect.height*ratioY,
        0,0,c.width,c.height
      );
      return c.toDataURL('image/png');
    }catch(err){
      return '';
    }
  }finally{
    if(overlay)overlay.style.display=previousDisplay;
  }
}

function getRoutePointOffset(item){
  if(!naverMap||!item||!hasCoord(item))return null;
  const maps=getNaverMaps();
  try{
    const projection=naverMap.getProjection&&naverMap.getProjection();
    if(!projection||!projection.fromCoordToOffset)return null;
    const coord=new maps.LatLng(item.lat,item.lng);
    const pt=projection.fromCoordToOffset(coord);
    return {x:pt.x,y:pt.y};
  }catch(e){
    return null;
  }
}

function buildCapturePrintMarkerGroups(rect){
  const groups=[];
  const route=(latestResult&&latestResult.route)||[];
  const total=route.length;
  const returnToStart=!!(latestResult&&latestResult.returnToStart);
  const overlapX=Math.max(24,Math.min(42,rect.width*0.045));
  const overlapY=Math.max(28,Math.min(48,rect.height*0.085));

  route.forEach((item,index)=>{
    if(!hasCoord(item))return;
    const pt=getRoutePointOffset(item);
    if(!pt)return;
    if(pt.x<rect.left||pt.x>rect.right||pt.y<rect.top||pt.y>rect.bottom)return;

    const localX=pt.x-rect.left;
    const localY=pt.y-rect.top;
    const label=getPrintPointLabel(item,index,total,returnToStart);

    let group=groups.find(g=>Math.abs(g.x-localX)<=overlapX&&Math.abs(g.y-localY)<=overlapY);
    if(!group){
      group={x:localX,y:localY,sumX:0,sumY:0,count:0,items:[]};
      groups.push(group);
    }
    group.items.push({item,index,label});
    group.sumX+=localX;
    group.sumY+=localY;
    group.count+=1;
    group.x=group.sumX/group.count;
    group.y=group.sumY/group.count;
  });

  groups.forEach(group=>{
    group.labels=normalizePrintGroupLabels(group.items);
  });
  return groups;
}

function buildCapturePinLayerHtml(rect){
  const groups=buildCapturePrintMarkerGroups(rect);
  const pins=groups.map(group=>{
    const labels=group.labels&&group.labels.length?group.labels:normalizePrintGroupLabels(group.items);
    const html=labels.length>1?makeMultiLabelPrintPinContent(labels):makeStrongPrintPinContent(labels[0]||'');
    const left=(group.x/rect.width)*100;
    const top=(group.y/rect.height)*100;
    const title=escapeDataAttrValue(group.items.map(x=>`${x.label}. ${x.item.address||x.item.resolvedAddress||''}`).join(' / '));
    return `<div class="printCapturePin" title="${title}" style="left:${left.toFixed(4)}%;top:${top.toFixed(4)}%">${html}</div>`;
  }).join('');
  return `<div class="printCapturePinLayer">${pins}</div>`;
}

async function printSelectedMapCapture(){
  const rect=getPrintSelectionRectFromState();
  if(!rect){
    showRouteToast('인쇄할 영역을 선택\n경로와 함께 인쇄됨','printToast');
    return;
  }

  const image=await captureSelectedMapArea(rect);
  if(!image){
    showRouteToast('지도 캡쳐 실패\n영역을 다시 선택');
    return;
  }

  cancelPrintAreaSelect();
  removePrintSheet();
  removePrintCaptureSheet();

  const mapHeightMm=Math.max(45,Math.min(245,190/(rect.width/rect.height)));
  document.body.style.setProperty('--print-map-height-mm',`${mapHeightMm}mm`);

  const sheet=document.createElement('section');
  sheet.className='printSheet printCaptureSheet';
  const now=new Date();
  const dateText=now.toLocaleString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  const routeCount=(latestResult.route||[]).length;

  sheet.innerHTML=`<div class="printPage">
    <div class="printTop">
      <div class="printTitle">최단 경로 추천 순서</div>
      <div class="printMeta">출력일 ${esc(dateText)}</div>
    </div>
    <div class="printMapBox" style="height:${mapHeightMm.toFixed(2)}mm">
      <img class="printMapCapture" src="${esc(image)}" alt="선택한 지도 영역">
      ${buildCapturePinLayerHtml(rect)}
    </div>
    <div class="printRouteSection">
      <div class="printSummary">
        <span>총 예상시간 ${esc(formatDuration(latestResult.durationMs))}</span>
        <span>총 거리 ${esc(formatDistance(latestResult.distanceM))}</span>
        <span>${routeCount}개 지점</span>
        <span>${routeCount<=3?'경로 1열':'경로 2열'}</span>
      </div>
      ${makePrintRouteHtml()}
    </div>
  </div>`;

  document.body.appendChild(sheet);
  document.body.classList.add('printCaptureMode');

  setTimeout(()=>window.print(),180);
}

function startPrintAreaSelectFinal(){
  if(!latestResult){
    showStatus('출력할 추천순서가 없습니다. 최단경로를 먼저 찾으세요.','err');
    return;
  }

  const overlay=$('printAreaOverlay');
  const box=$('printAreaBox');
  if(!overlay||!box||!mapWrap)return;

  cleanupPrintCaptureMode();
  showRouteToast('인쇄할 영역을 선택\n경로와 함께 인쇄됨','printToast');

  printAreaSelectState={startX:0,startY:0,endX:0,endY:0,dragging:false,ready:false};
  box.classList.remove('active','ready');
  box.removeAttribute('style');
  overlay.classList.add('active');

  const getLocalPoint=(ev)=>{
    const r=mapWrap.getBoundingClientRect();
    return {
      x:Math.max(0,Math.min(r.width,ev.clientX-r.left)),
      y:Math.max(0,Math.min(r.height,ev.clientY-r.top))
    };
  };

  overlay.onpointerdown=(ev)=>{
    if(ev.target&&ev.target.closest&&ev.target.closest('.printAreaActions'))return;
    ev.preventDefault();
    ev.stopPropagation();
    const p=getLocalPoint(ev);
    printAreaSelectState={startX:p.x,startY:p.y,endX:p.x,endY:p.y,dragging:true,ready:false};
    updatePrintAreaBox();
    try{overlay.setPointerCapture(ev.pointerId)}catch(e){}
  };
  overlay.onpointermove=(ev)=>{
    if(!printAreaSelectState||!printAreaSelectState.dragging)return;
    ev.preventDefault();
    ev.stopPropagation();
    const p=getLocalPoint(ev);
    printAreaSelectState.endX=p.x;
    printAreaSelectState.endY=p.y;
    updatePrintAreaBox();
  };
  overlay.onpointerup=(ev)=>{
    if(!printAreaSelectState||!printAreaSelectState.dragging)return;
    ev.preventDefault();
    ev.stopPropagation();
    const p=getLocalPoint(ev);
    printAreaSelectState.endX=p.x;
    printAreaSelectState.endY=p.y;
    printAreaSelectState.dragging=false;
    printAreaSelectState.ready=!!getPrintSelectionRectFromState();
    updatePrintAreaBox();
    try{overlay.releasePointerCapture(ev.pointerId)}catch(e){}
  };
  overlay.onpointercancel=overlay.onpointerup;

  const doBtn=$('printAreaDo');
  const cancelBtn=$('printAreaCancel');
  if(doBtn)doBtn.onclick=(ev)=>{
    ev.preventDefault();
    ev.stopPropagation();
    printSelectedMapCapture();
  };
  if(cancelBtn)cancelBtn.onclick=(ev)=>{
    ev.preventDefault();
    ev.stopPropagation();
    cancelPrintAreaSelect();
  };
}

printRouteResult=async function(){
  startPrintAreaSelectFinal();
};
if($('printRoute'))$('printRoute').onclick=printRouteResult;

window.addEventListener('afterprint',()=>{
  cleanupPrintCaptureMode();
});

window.addEventListener('resize',refreshMap);
initNaverMap();
</script>
