<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>블로그 발행 작업현황</title>
  <style>
    :root{
      --bg:#f5f7fb;
      --card:#ffffff;
      --line:#e6ebf2;
      --ink:#18202a;
      --muted:#6b7280;
      --blue:#0f7cff;
      --green:#10b981;
      --amber:#f59e0b;
      --shadow:0 14px 32px rgba(15,23,42,.08);
      --radius:24px;
      --max:1280px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo",sans-serif}
    body{min-width:0}
    a{text-decoration:none;color:inherit}
    button{font:inherit;border:none;background:none;cursor:pointer}

    .page{min-height:100vh;padding:26px 14px 48px}
    .wrap{max-width:var(--max);margin:0 auto}
    .head{
      display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
      margin-bottom:20px;
    }
    .title{
      margin:0;
      font-size:34px;
      line-height:1.2;
      font-weight:950;
      letter-spacing:-0.05em;
      display:flex;
      align-items:center;
      gap:8px;
    }
    .title-n{
      color:#16a34a;
      font-size:1em;
      line-height:1;
      font-weight:950;
      display:inline-block;
    }
    .sub{margin:8px 0 0;font-size:14px;color:var(--muted);font-weight:800}
    .head-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
    .count{
      display:inline-flex;align-items:center;justify-content:center;
      min-height:42px;padding:0 16px;border-radius:999px;
      background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);
      font-size:14px;font-weight:900;white-space:nowrap;
    }
    .top-action-btn{
      display:inline-flex;align-items:center;justify-content:center;gap:6px;
      min-height:42px;padding:0 16px;border-radius:999px;
      background:#16a34a;border:1px solid #16a34a;box-shadow:var(--shadow);
      color:#fff;font-size:14px;font-weight:900;white-space:nowrap;
    }
    .top-action-btn .n{font-weight:950}
    .refresh-btn{
      display:inline-flex;align-items:center;justify-content:center;gap:6px;
      min-height:42px;padding:0 16px;border-radius:999px;
      background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);
      color:var(--ink);font-size:14px;font-weight:900;white-space:nowrap;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:18px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      overflow:hidden;
      box-shadow:var(--shadow);
    }
    .thumb{
      position:relative;
      width:100%;
      aspect-ratio:16/9;
      background:#eef2f7 center/cover no-repeat;
      display:flex;align-items:center;justify-content:center;
      color:#97a1ae;font-size:14px;font-weight:900;
    }
    .trash-btn{
      position:absolute;
      top:8px;
      right:8px;
      z-index:2;
      width:30px;
      height:30px;
      border-radius:999px;
      background:rgba(17,24,39,.72);
      color:#fff;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 8px 18px rgba(15,23,42,.20);
      line-height:1;
    }
    .trash-btn svg{
      width:15px;
      height:15px;
      display:block;
      pointer-events:none;
    }
    .trash-btn:disabled{
      cursor:default;
      opacity:.92;
    }
    .trash-spinner{
      width:14px;
      height:14px;
      border-radius:999px;
      border:2px solid rgba(255,255,255,.42);
      border-top-color:#fff;
      animation:trashSpin .72s linear infinite;
      display:block;
      pointer-events:none;
    }
    @keyframes trashSpin{
      to{transform:rotate(360deg)}
    }
    .body{padding:18px 18px 18px}
    .meta{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      margin-bottom:10px;
    }
    .date{font-size:13px;color:var(--muted);font-weight:800}
    .status{
      display:inline-flex;align-items:center;justify-content:center;
      min-height:30px;padding:0 14px;border-radius:999px;
      font-size:12px;font-weight:900;white-space:nowrap;
      border:1px solid transparent;
      max-width:100%;
    }
    .status.draft{background:#eff6ff;border-color:#cfe2ff;color:#2563eb}
    .status.scheduled{background:#fff7ed;border-color:#fed7aa;color:#c2410c}
    .status.publishing{background:#fff7ed;border-color:#fed7aa;color:#c2410c}
    .status.published{background:#ecfdf5;border-color:#a7f3d0;color:#047857}
    .status.aiQueued{background:#f8fafc;border-color:#cbd5e1;color:#475569}
    .status.aiRunning{background:#eef5ff;border-color:#bfdbfe;color:#1d4ed8}
    .status.aiDone{background:#f5f3ff;border-color:#ddd6fe;color:#6d28d9}
    .status.editing{background:#ecfeff;border-color:#a5f3fc;color:#0e7490}
    .status.error{background:#fef2f2;border-color:#fecaca;color:#b91c1c}

    .listing{font-size:13px;color:#7b8491;font-weight:900;margin-bottom:8px}
    .card-title{
      margin:0;
      font-size:22px;line-height:1.42;font-weight:950;letter-spacing:-0.04em;
      word-break:keep-all;
      min-height:62px;
    }

    .actions{
      display:flex;align-items:center;gap:10px;margin-top:18px;
    }
    .btn{
      display:inline-flex;align-items:center;justify-content:center;
      min-height:44px;padding:0 16px;border-radius:14px;
      font-size:14px;font-weight:900;
      border:1px solid var(--line);
      background:#fff;color:var(--ink);
      flex:1 1 0;
    }
    .btn.primary{
      background:var(--blue);
      border-color:var(--blue);
      color:#fff;
    }
    .btn.green{
      background:var(--green);
      border-color:var(--green);
      color:#fff;
    }
    .btn.disabled{
      background:#f3f4f6;
      border-color:#e5e7eb;
      color:#9ca3af;
      cursor:default;
      pointer-events:none;
    }

    .loading,
    .empty{
      padding:60px 18px;
      text-align:center;
      color:var(--muted);
      font-size:16px;
      font-weight:900;
    }

    @media (max-width:900px){
      .page{padding:18px 10px 36px}
      .head{align-items:flex-start;flex-direction:column}
      .head-right{width:100%;justify-content:flex-start}
      .title{font-size:28px}
      .grid{grid-template-columns:1fr}
      .card-title{font-size:20px;min-height:auto}
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="wrap">
      <div class="head">
        <div>
          <h1 class="title"><span class="title-n">N</span> 블로그 발행 작업현황</h1>
          <p class="sub">createdAt 기준 최신순</p>
        </div>
        <div class="head-right">
          <a class="top-action-btn" href="/naverbloginput"><span class="n">N</span>발행하기</a>
          <button type="button" class="refresh-btn" id="refreshBtn">새로고침</button>
          <div class="count" id="countBox">불러오는 중</div>
        </div>
      </div>

      <div id="loadingBox" class="loading">블로그 리스트를 불러오는 중입니다.</div>
      <div id="emptyBox" class="empty" style="display:none;">표시할 블로그가 없습니다.</div>
      <div id="grid" class="grid" style="display:none;"></div>
    </div>
  </div>

  <script>
    const CONFIG = {
      adminListUrl: 'https://script.google.com/macros/s/AKfycbznhBvYFIv_GKeNoGIPFTi_mIXXH04BOvYrb4ZN9dk_Cc4Xjir3TP_vL3bbPrLLxgg2/exec',
      siteOrigin: 'https://maslowkorea.site'
    };

    const els = {
      refreshBtn: document.getElementById('refreshBtn'),
      countBox: document.getElementById('countBox'),
      loadingBox: document.getElementById('loadingBox'),
      emptyBox: document.getElementById('emptyBox'),
      grid: document.getElementById('grid')
    };

    function text(v){ return String(v == null ? '' : v).trim(); }
    function esc(v){
      return String(v == null ? '' : v).replace(/[&<>"']/g, function(s){
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;', "'":'&#39;'})[s];
      });
    }

    function fetchPostJson(payload){
      return fetch(CONFIG.adminListUrl, {
        method:'POST',
        mode:'cors',
        headers:{'Content-Type':'text/plain;charset=UTF-8'},
        body: JSON.stringify(payload)
      }).then(function(res){
        if(!res.ok) throw new Error('요청 실패: ' + res.status);
        return res.json();
      }).then(function(data){
        if(data && data.ok === false){
          throw new Error((data && (data.message || data.error)) || '요청 실패');
        }
        return data;
      });
    }

    function formatDate(iso){
      const s = text(iso);
      if(!s) return '-';
      const d = new Date(s);
      if(isNaN(d.getTime())) return s;
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return y + '-' + m + '-' + day + ' ' + hh + ':' + mm;
    }

    function formatScheduledAt(iso){
      const s = text(iso);
      if(!s) return '';
      const d = new Date(s);
      if(isNaN(d.getTime())) return s;
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return y + '-' + m + '-' + day + ' ' + hh + ':' + mm;
    }

    function getDashboardDisplayStatus(item){
      const publishedUrl = text(item && item.publishedUrl);
      const publishedAt = text(item && item.publishedAt);
      const scheduledAt = text(item && item.scheduledAt);
      const status = text(item && item.status);
      const subStatus = text(item && item.subStatus);
      const displayStatus = text(item && item.displayStatus);
      const errorMessage = text(item && item.errorMessage);

      if (publishedUrl || publishedAt || displayStatus === '발행완료') {
        return '발행완료';
      }

      if (scheduledAt || displayStatus === '예약발행중') {
        return '예약발행중';
      }

      if (
        displayStatus === '발행중' ||
        status === 'ready' ||
        status === 'publishing' ||
        status === 'publish_pending' ||
        status === 'publish_requested' ||
        subStatus === 'ready_to_publish' ||
        subStatus === 'publishing' ||
        subStatus === 'publish_waiting' ||
        subStatus === 'publish_requested'
      ) {
        return '발행중';
      }

      if (displayStatus === 'EDITING' || status === 'editing' || subStatus === 'user_editing') {
        return 'EDITING';
      }

      if (displayStatus === '실패' || status === 'ai_error' || subStatus === 'dgx_qwen_failed' || errorMessage) {
        return '실패';
      }

      if (
        displayStatus === 'DGX DONE' ||
        status === 'ai_done' ||
        subStatus === 'draft_generated' ||
        subStatus === 'dgx_done'
      ) {
        return 'DGX DONE';
      }

      if (
        displayStatus === 'DGX 진행중' ||
        status === 'ai_pending' ||
        status === 'ai_running' ||
        subStatus === 'calling_dgx_qwen' ||
        subStatus === 'dgx_calling'
      ) {
        return 'DGX 진행중';
      }

      if (
        displayStatus === 'DGX 대기중' ||
        status === 'asset_done' ||
        status === 'ai_queued' ||
        subStatus === 'asset_saved' ||
        subStatus === 'ai_queued'
      ) {
        return 'DGX 대기중';
      }

      return '임시저장중';
    }

    function getStatusClass(status){
      if(status === '발행완료') return 'published';
      if(status === '예약발행중') return 'scheduled';
      if(status === '발행중') return 'publishing';
      if(status === 'DGX 대기중') return 'aiQueued';
      if(status === 'DGX 진행중') return 'aiRunning';
      if(status === 'DGX DONE') return 'aiDone';
      if(status === 'EDITING') return 'editing';
      if(status === '실패') return 'error';
      return 'draft';
    }

    function getStatusText(item){
      return getDashboardDisplayStatus(item);
    }

    function renderAction(item){
      const status = getDashboardDisplayStatus(item);

      if(status === '발행완료'){
        if(text(item.publishedUrl)){
          return '<a class="btn green" href="' + esc(item.publishedUrl) + '" target="_blank" rel="noopener noreferrer">발행글 보기</a>';
        }
        return '<div class="btn disabled">발행완료</div>';
      }

      if(status === 'EDITING'){
        return '<a class="btn primary" href="' + esc(item.editorUrl) + '" target="_blank" rel="noopener noreferrer">수정/검수하기</a>';
      }

      if(status === 'DGX DONE'){
        return '<a class="btn primary" href="' + esc(item.editorUrl) + '" target="_blank" rel="noopener noreferrer">검수하기</a>';
      }

      return '<a class="btn primary" href="' + esc(item.editorUrl) + '" target="_blank" rel="noopener noreferrer">수정/검수하기</a>';
    }


    function trashIconSvg(){
      return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">'
        + '<path d="M9 3h6l1 2h4v2H4V5h4l1-2Z" fill="currentColor"/>'
        + '<path d="M6 9h12l-1 11H7L6 9Z" fill="currentColor"/>'
        + '</svg>';
    }

    function renderThumb(item){
      const thumb = text(item && item.heroImageUrl);
      const blogId = text(item && item.blogId);
      const deleteButton = '<button type="button" class="trash-btn" data-action="delete" data-blog-id="' + esc(blogId) + '" title="현황판에서 숨기기" aria-label="현황판에서 숨기기">' + trashIconSvg() + '</button>';
      if(thumb){
        return '<div class="thumb" style="background-image:url(\'' + thumb.replace(/'/g, '%27') + '\')">' + deleteButton + '</div>';
      }
      return '<div class="thumb">' + deleteButton + '대표사진 없음</div>';
    }

    function deleteDashboardItem(blogId, buttonEl){
      const id = text(blogId);
      if(!id) return;
      if(!confirm('이 작업을 현황판에서 숨길까요?')) return;

      const btn = buttonEl || null;
      const originalHtml = btn ? btn.innerHTML : '';
      if(btn){
        btn.disabled = true;
        btn.setAttribute('aria-label', '삭제 중');
        btn.setAttribute('title', '삭제 중');
        btn.innerHTML = '<span class="trash-spinner" aria-hidden="true"></span>';
      }

      fetchPostJson({
        action: 'deleteBlogDashboardItem',
        blogId: id
      })
      .then(function(){
        load();
      })
      .catch(function(err){
        console.error(err);
        if(btn){
          btn.disabled = false;
          btn.setAttribute('aria-label', '현황판에서 숨기기');
          btn.setAttribute('title', '현황판에서 숨기기');
          btn.innerHTML = originalHtml;
        }
        alert((err && err.message) || '삭제 실패');
      });
    }

    function renderCard(item){
      const thumbHtml = renderThumb(item);

      return ''
        + '<article class="card">'
        +   thumbHtml
        +   '<div class="body">'
        +     '<div class="meta">'
        +       '<div class="date">' + esc(formatDate(item.createdAt)) + '</div>'
        +       '<div class="status ' + getStatusClass(getStatusText(item)) + '">' + esc(getStatusText(item)) + '</div>'
        +     '</div>'
        +     '<div class="listing">' + esc(text(item.listingNumber) || '-') + '</div>'
        +     '<h2 class="card-title">' + esc(text(item.title) || '제목 없음') + '</h2>'
        +     '<div class="actions">'
        +       renderAction(item)
        +     '</div>'
        +   '</div>'
        + '</article>';
    }

    function render(items){
      els.countBox.textContent = '총 ' + items.length + '건';
      els.loadingBox.style.display = 'none';

      if(!items.length){
        els.emptyBox.style.display = 'block';
        els.grid.style.display = 'none';
        els.grid.innerHTML = '';
        return;
      }

      els.emptyBox.style.display = 'none';
      els.grid.style.display = 'grid';
      els.grid.innerHTML = items.map(renderCard).join('');
    }

    function load(){
      fetchPostJson({
        action: 'listBlogDashboard',
        siteOrigin: CONFIG.siteOrigin
      })
      .then(function(data){
        const items = Array.isArray(data && data.items) ? data.items : [];
        render(items);
      })
      .catch(function(err){
        console.error(err);
        els.loadingBox.textContent = '리스트를 불러오지 못했습니다.';
        els.countBox.textContent = '오류';
      });
    }

    if(els.refreshBtn){
      els.refreshBtn.addEventListener('click', load);
    }

    els.grid.addEventListener('click', function(e){
      const deleteBtn = e.target.closest('[data-action="delete"]');
      if(deleteBtn){
        e.preventDefault();
        e.stopPropagation();
        deleteDashboardItem(deleteBtn.getAttribute('data-blog-id'), deleteBtn);
      }
    });

    load();
  </script>
</body>
</html>
