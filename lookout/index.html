<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maslow 매물조회기</title>

  <link rel="icon" type="image/jpeg" href="/favicon.ico" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/favicon.ico" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="매슬로우 - 토지,건축물 조회기" />
  <meta property="og:description" content="토지대장과 건축물대장 조회기" />
  <meta property="og:image" content="https://cdn.imweb.me/thumbnail/20260410/e2d5bcd79cb3e.jpg" />
  <meta property="og:locale" content="ko_KR" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="매슬로우 - 토지,건축물 조회기" />
  <meta name="twitter:description" content="토지대장과 건축물대장 조회기" />
  <meta name="twitter:image" content="https://cdn.imweb.me/thumbnail/20260410/e2d5bcd79cb3e.jpg" />

  <script src="https://t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root{
      --text:#101828;
      --muted:#667085;
      --line:#e6ebf2;
      --blue:#2164ff;
      --blue-soft:#eef4ff;
      --land-bg:#fffaf3;
      --land-surface:#ffffff;
      --land-line:#eadfc9;
      --land-main:#b7791f;
      --land-main-dark:#7a4a12;
      --land-soft:#fff7e8;
      --land-shadow:0 18px 42px rgba(124,74,3,.06);
      --shadow:0 18px 42px rgba(15,23,42,.08);
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;padding:0;background:#fff;color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
      letter-spacing:-0.02em;
    }
    button{font:inherit;border:none;background:none;cursor:pointer}
    .page{
      min-height:100vh;
      background:#fff;
      padding:12px 12px 56px;
    }
    .wrap{
      width:100%;
      max-width:1120px;
      margin:0 auto;
    }

    .hero{
      position:relative;
      overflow:hidden;
      min-height:760px;
      border-radius:34px;
      border:1px solid var(--line);
      background:linear-gradient(180deg,#edf5ff 0%,#dcecff 100%);
      box-shadow:var(--shadow);
    }
    .hero:before{
      content:"";
      position:absolute;
      left:-2%;
      top:0;
      width:42%;
      height:100%;
      background:rgba(255,255,255,.16);
      clip-path:polygon(10% 0,100% 0,78% 100%,0 100%);
    }
    .hero:after{
      content:"";
      position:absolute;
      right:-12%;
      bottom:-6%;
      width:88%;
      height:78%;
      background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,.18));
      clip-path:polygon(34% 0,100% 0,100% 100%,0 100%);
    }

    .brand{
      position:relative;
      z-index:5;
      text-align:center;
      padding:54px 24px 286px;
    }
    .brand-en{
      margin:0 0 12px;
      font-size:54px;
      line-height:1;
      font-weight:900;
      letter-spacing:.14em;
      color:#1970ff;
      text-transform:uppercase;
    }
    .brand-ko{
      margin:0;
      font-size:120px;
      line-height:.96;
      font-weight:1000;
      letter-spacing:-0.085em;
      color:#05070b;
    }
    .brand-sub{
      display:block;
      margin:20px 0 0;
      font-size:34px;
      line-height:1.18;
      font-weight:900;
      letter-spacing:-0.05em;
      color:#6a7d98;
    }
    .service-line{
      margin-top:18px;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
    }
    .free-chip{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:42px;
      padding:0 20px;
      border-radius:999px;
      background:linear-gradient(180deg,#2d78ff 0%,#1f67f1 100%);
      color:#fff;
      font-size:28px;
      line-height:1;
      font-weight:900;
      letter-spacing:-0.04em;
      box-shadow:0 12px 22px rgba(33,100,255,.18);
    }
    .service-title{
      font-size:38px;
      line-height:1.15;
      font-weight:900;
      letter-spacing:-0.055em;
      color:#4f6280;
    }
    .mode-tabs{
      margin-top:112px;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:14px;
      flex-wrap:wrap;
    }
    .mode-tab{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:58px;
      padding:12px 30px;
      border-radius:999px;
      border:1px solid #cfe0ff;
      background:rgba(255,255,255,.72);
      color:#4f6280;
      font-size:29px;
      line-height:1;
      font-weight:950;
      letter-spacing:-0.05em;
      box-shadow:0 10px 22px rgba(33,100,255,.08);
    }
    .mode-tab.active{
      background:linear-gradient(180deg,#2d78ff 0%,#1f67f1 100%);
      border-color:#1f67f1;
      color:#fff;
      box-shadow:0 12px 22px rgba(33,100,255,.18);
    }
    .mode-tab.land-mode-btn{
      border-color:var(--land-line);
      box-shadow:0 10px 22px rgba(183,121,31,.08);
    }
    .mode-tab.land-mode-btn.active{
      background:linear-gradient(180deg,#d99a2b 0%,#b7791f 100%);
      border-color:#b7791f;
      color:#fff;
      box-shadow:0 12px 22px rgba(183,121,31,.22);
    }
    .land-address-input{
      display:none;
      width:100%;
      min-height:56px;
      border:none;
      outline:none;
      background:transparent;
      color:var(--text);
      font-size:24px;
      line-height:1.38;
      font-weight:800;
      letter-spacing:-0.03em;
    }
    .land-address-input::placeholder{
      color:#b99b61;
      font-weight:800;
    }
    body.mode-land-only .page{
      background:#fff;
    }
    body.mode-land-only .hero{
      border-color:var(--land-line);
      background:linear-gradient(180deg,#fff8ef 0%,#f3eadc 100%);
      box-shadow:var(--land-shadow);
    }
    body.mode-land-only .brand-en{
      color:var(--land-main);
    }
    body.mode-land-only .brand-ko{
      color:#2f230f;
    }
    body.mode-land-only .search-panel{
      box-shadow:0 22px 40px rgba(124,74,3,.08);
    }
    body.mode-land-only .search-shell{
      border-color:var(--land-line);
      background:var(--land-surface);
    }
    body.mode-land-only .search-icon path{
      stroke:var(--land-main);
    }
    body.mode-land-only .lookup-btn{
      background:linear-gradient(180deg,#d99a2b 0%,#b7791f 100%);
      box-shadow:0 16px 28px rgba(183,121,31,.24);
    }
    body.mode-land-only .refresh-address-btn{
      border-color:var(--land-line);
      background:var(--land-surface);
    }
    body.mode-land-only .section,
    body.mode-land-only .map-link-section{
      border-color:var(--land-line);
      background:var(--land-surface);
      box-shadow:var(--land-shadow);
    }
    body.mode-land-only .section-chip{
      background:var(--land-soft);
      color:var(--land-main-dark);
      border-color:var(--land-line);
    }
    body.mode-land-only .result-block{
      border-color:var(--land-line);
      background:var(--land-surface);
    }
    body.mode-land-only .result-block-head{
      border-bottom-color:var(--land-line);
      background:#fffaf3;
      color:#3d2a09;
    }
    body.mode-land-only .result-table{
      background:var(--land-surface);
    }
    body.mode-land-only .result-table th{
      background:#fffaf5;
      color:#6b4706;
    }
    body.mode-land-only .result-table th,
    body.mode-land-only .result-table td{
      border-bottom-color:#efe3ce;
    }
    body.mode-land-only .map-link-btn,
    body.mode-land-only .table-download-btn,
    body.mode-land-only .table-copy-btn{
      border-color:#d7dee8;
      color:#344054;
      background:#ffffff;
      box-shadow:0 8px 20px rgba(15,23,42,.06);
    }
    body.mode-land-only .address-display{
      display:none;
    }
    body.mode-land-only .land-address-input{
      display:block;
    }

    .search-panel{
      position:absolute;
      left:50%;
      bottom:32px;
      transform:translateX(-50%);
      width:min(88%, 940px);
      z-index:6;
      padding:14px;
      border-radius:30px;
      background:rgba(255,255,255,.80);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      box-shadow:0 22px 40px rgba(33,100,255,.12);
      border:1px solid rgba(255,255,255,.75);
    }
    .search-row{
      display:flex;
      flex-direction:column;
      align-items:stretch;
      gap:12px;
      width:100%;
    }
    .search-top-row{
      display:flex;
      align-items:stretch;
      gap:12px;
      width:100%;
    }
    .search-shell{
      flex:1 1 auto;
      min-width:0;
      min-height:96px;
      padding:16px 20px;
      border-radius:24px;
      border:1px solid #e5eaf2;
      background:#fff;
      display:flex;
      align-items:flex-start;
      gap:14px;
      cursor:pointer;
    }
    .search-shell.locked{
      cursor:default;
      background:#f8fafc;
    }
    .search-icon{
      width:28px;height:28px;flex:0 0 auto;opacity:.42;margin-top:6px;
    }
    .address-display{
      flex:1 1 auto;
      min-width:0;
      min-height:56px;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      flex-direction:column;
      font-size:24px;
      line-height:1.38;
      font-weight:700;
      color:var(--text);
      white-space:pre-wrap;
      word-break:break-word;
    }
    .address-display.placeholder{
      color:#adb5c2;
      font-weight:800;
    }
    .refresh-address-btn{
      flex:0 0 auto;
      width:96px;
      min-width:96px;
      min-height:96px;
      border-radius:24px;
      border:1px solid #dfe6f0;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 8px 18px rgba(15,23,42,.04);
    }
    .refresh-address-btn:hover{
      background:#f8fafc;
    }
    .lookup-btn{
      width:100%;
      min-height:76px;
      padding:0 22px;
      border-radius:24px;
      background:linear-gradient(180deg,#4a78ff 0%,#215ef5 100%);
      color:#fff;
      font-size:32px;
      line-height:1;
      font-weight:900;
      letter-spacing:-0.05em;
      box-shadow:0 16px 28px rgba(33,100,255,.22);
    }
    .picked-line{
      min-height:22px;
      margin-top:10px;
      padding:0 6px;
      white-space:pre-wrap;
      text-align:left;
      font-size:14px;
      line-height:1.65;
      color:#516173;
      font-weight:700;
    }
    .status{
      min-height:18px;
      margin-top:6px;
      padding:0 6px;
      font-size:13px;
      font-weight:900;
    }
    .status.ok{color:#0f9d58}
    .status.err{color:#d93025}

    .summary-grid{
      display:none;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:12px;
      margin:18px 0 16px;
    }
    .sum-card{
      background:#fff;
      border:1px solid var(--line);
      border-radius:24px;
      padding:18px 16px;
      box-shadow:0 10px 24px rgba(15,23,42,.04);
    }
    .sum-label{
      margin-bottom:10px;
      font-size:12px;
      color:var(--muted);
      font-weight:800;
    }
    .sum-value{
      font-size:24px;
      line-height:1.15;
      font-weight:900;
      letter-spacing:-0.045em;
      word-break:break-word;
    }

    .section{
      display:none;
      background:#fff;
      border:1px solid var(--line);
      border-radius:30px;
      padding:20px;
      box-shadow:var(--shadow);
      margin-bottom:16px;
    }
    .section-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }
    .section-title{
      margin:0;
      font-size:24px;
      line-height:1.18;
      font-weight:900;
      letter-spacing:-0.045em;
    }
    .section-chip{
      display:inline-flex;
      align-items:center;
      min-height:30px;
      padding:0 10px;
      border-radius:999px;
      background:var(--blue-soft);
      color:var(--blue);
      border:1px solid #d9e5ff;
      font-size:12px;
      font-weight:900;
    }
    .field-grid{
      display:block;
    }
    .field{
      min-height:88px;
      padding:14px 15px;
      border-radius:20px;
      background:#fbfcfe;
      border:1px solid #edf1f6;
    }
    .field-label{
      margin-bottom:8px;
      font-size:13px;
      color:var(--muted);
      font-weight:800;
    }
    .field-value{
      font-size:17px;
      line-height:1.65;
      color:#1f2937;
      font-weight:700;
      white-space:pre-wrap;
      word-break:keep-all;
    }

    .source-stack{display:grid;gap:14px}
    .source-card{
      border:1px solid var(--line);
      border-radius:24px;
      padding:18px;
      background:#fff;
    }
    .source-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:12px;
    }
    .source-title{
      margin:0;
      font-size:20px;
      line-height:1.25;
      font-weight:900;
      letter-spacing:-0.03em;
    }
    .source-meta{
      margin:4px 0 0;
      font-size:13px;
      color:var(--muted);
      font-weight:700;
    }
    .source-badge{
      display:inline-flex;
      align-items:center;
      min-height:30px;
      padding:0 10px;
      border-radius:999px;
      background:#f7f9fc;
      border:1px solid #e4e9f1;
      color:#475569;
      font-size:12px;
      font-weight:900;
    }
    .source-items{display:grid;gap:12px}
    .item-card{
      border:1px solid #edf2f8;
      border-radius:20px;
      padding:14px;
      background:#fff;
    }
    .item-title{
      margin:0 0 10px;
      font-size:15px;
      font-weight:900;
      color:#374151;
    }
    .item-fields{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
    }
    .mini-field{
      min-height:72px;
      padding:10px 12px;
      border-radius:16px;
      background:#f8fafc;
      border:1px solid #edf2f7;
    }
    .mini-label{
      margin-bottom:6px;
      font-size:12px;
      color:var(--muted);
      font-weight:800;
    }
    .mini-value{
      font-size:14px;
      line-height:1.6;
      color:#1f2937;
      font-weight:700;
      white-space:pre-wrap;
      word-break:keep-all;
    }

    .empty{
      border:1px dashed #d7e1ec;
      background:#fff;
      border-radius:24px;
      padding:32px 18px;
      text-align:center;
      color:#6b7280;
      font-size:15px;
      line-height:1.7;
      font-weight:700;
      margin-top:18px;
    }
    .loading{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(255,255,255,.62);
      backdrop-filter:blur(2px);
      -webkit-backdrop-filter:blur(2px);
      z-index:100;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .loading.show{display:flex}
    .loading-panel{
      min-width:240px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:26px;
      padding:26px 24px;
      box-shadow:var(--shadow);
      text-align:center;
    }
    .spinner{
      width:52px;height:52px;
      border-radius:999px;
      border:4px solid #dbeafe;
      border-top-color:var(--blue);
      margin:0 auto 14px;
      animation:spin 1s linear infinite;
    }
    .loading-text{
      font-size:16px;
      font-weight:900;
      color:#111827;
      letter-spacing:-0.03em;
    }


    .lookup-fail-panel{
      display:none;
      position:fixed;
      inset:0;
      z-index:120;
      padding:24px;
      background:rgba(15,23,42,.36);
      backdrop-filter:blur(3px);
      -webkit-backdrop-filter:blur(3px);
      align-items:center;
      justify-content:center;
    }
    .lookup-fail-panel.show{display:flex}
    .lookup-fail-box{
      width:min(560px,100%);
      border-radius:28px;
      border:1px solid #f2c8c8;
      background:#fff;
      box-shadow:0 24px 60px rgba(15,23,42,.22);
      padding:24px;
    }
    .lookup-fail-title{
      margin:0 0 8px;
      font-size:26px;
      line-height:1.2;
      font-weight:900;
      letter-spacing:-0.045em;
      color:#b42318;
    }
    .lookup-fail-desc{
      margin:0 0 16px;
      font-size:15px;
      line-height:1.65;
      font-weight:700;
      color:#475467;
    }
    .lookup-fail-steps{
      margin:0 0 18px;
      padding:14px 16px;
      border-radius:18px;
      background:#fff7f7;
      border:1px solid #ffd8d8;
      color:#7a271a;
      font-size:14px;
      line-height:1.7;
      font-weight:800;
    }
    .lookup-fail-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .lookup-fail-actions button{
      flex:1 1 160px;
      min-height:48px;
      border-radius:16px;
      padding:0 14px;
      font-size:15px;
      font-weight:900;
      border:1px solid #d0d5dd;
      background:#fff;
      color:#344054;
    }
    .lookup-fail-actions .primary{
      background:#2164ff;
      border-color:#2164ff;
      color:#fff;
    }

    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

    @media (max-width:980px){
      .summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .field-grid,.item-fields{grid-template-columns:1fr}
      .brand-ko{font-size:92px}
      .brand-sub{font-size:28px}
      .service-title{font-size:30px}
      .brand-en{font-size:42px}
    }

    @media (max-width:720px){
      .page{
        padding:0 0 44px;
      }
      .wrap{
        max-width:none;
      }
      .hero{
        min-height:570px;
        border-radius:0;
        border-left:none;
        border-right:none;
        box-shadow:none;
      }
      .brand{
        padding:56px 18px 88px;
      }
      .brand-en{
        font-size:26px;
        letter-spacing:.12em;
        margin-bottom:8px;
      }
      .brand-ko{
        font-size:58px;
      }
      .brand-sub{
        margin-top:12px;
        font-size:18px;
      }
      .service-line{
        margin-top:12px;
        gap:8px;
      }
      .free-chip{
        min-height:30px;
        padding:0 12px;
        font-size:18px;
      }
      .service-title{
        font-size:22px;
      }
      .mode-tabs{
        margin-top:72px;
        gap:9px;
      }
      .mode-tab{
        min-height:46px;
        padding:9px 17px;
        font-size:19px;
      }
      .land-address-input{
        font-size:15px;
        min-height:52px;
      }
      .search-panel{
        width:calc(100% - 24px);
        bottom:16px;
        padding:8px;
        border-radius:22px;
      }
      .search-row{
        gap:10px;
      }
      .search-top-row{
        gap:8px;
      }
      .search-shell{
        min-height:86px;
        padding:14px 14px;
        border-radius:18px;
      }
      .refresh-address-btn{
        width:72px;
        min-width:72px;
        min-height:86px;
        border-radius:18px;
      }
      .search-icon{
        width:22px;
        height:22px;
        margin-top:4px;
      }
      .address-display{
        font-size:15px;
        line-height:1.45;
        min-height:52px;
      }
      .lookup-btn{
        width:100%;
        min-height:56px;
        padding:0 14px;
        border-radius:18px;
        font-size:18px;
      }
      .summary-grid{
        grid-template-columns:1fr 1fr;
        padding:0 12px;
      }
      .section{
        border-radius:24px;
        padding:16px;
        margin-left:12px;
        margin-right:12px;
      }
      .section-title{
        font-size:20px;
      }
      .empty{
        margin:18px 12px 0;
      }
    }
  
    .result-stack{display:grid;gap:16px}
    .result-block{border:1px solid var(--line);border-radius:24px;background:#fff;overflow:hidden}

        label: '표제부',
        fields: [
          ['주소', function(v){ return firstNonEmpty(v.newPlatPlc, v.platPlc); }],

          ['기타용도', function(v){ return v.etcPurps; }],
          ['구조', function(v){ return firstNonEmpty(v.strctCdNm, v.etcStrct); }],
          ['지붕', function(v){ return firstNonEmpty(v.roofCdNm, v.etcRoof); }],
          ['대지면적', function(v){ return formatArea(v.platArea); }],
          ['건축면적', function(v){ return formatArea(v.archArea); }],
          ['연면적', function(v){ return formatArea(v.totArea); }],

          ['건폐율', function(v){ return formatPercent(v.bcRat); }],
          ['용적률', function(v){ return formatPercent(v.vlRat); }],
          ['사용승인일', function(v){ return formatDate(v.useAprDay); }],
          ['허가일', function(v){ return formatDate(v.pmsDay); }],
          ['착공일', function(v){ return formatDate(v.stcnsDay); }],
          ['층수', function(v){ return buildFloorText(v); }],
          ['층고', function(v){ return formatHeight(v.heit); }],
          ['주차', function(v){ return buildParkingText(v); }]
        ]
      },
      recap: {
        label: '총괄표제부',
        fields: [
          ['대지면적', function(v){ return formatArea(v.platArea); }],
          ['건축면적', function(v){ return formatArea(v.archArea); }],
          ['연면적', function(v){ return formatArea(v.totArea); }],
          ['건물용도', function(v){ return firstNonEmpty(v.mainPurpsCdNm, v.etcPurps); }],
          ['주건축물 수', function(v){ return formatInt(v.mainBldCnt, '동'); }],
          ['주차대수', function(v){ return formatInt(v.totPkngCnt, '대'); }]
        ]
      },
      basis: {
        label: '기본개요',
        fields: [
          ['주소', function(v){ return firstNonEmpty(v.newPlatPlc, v.platPlc); }],
          ['용도지역', function(v){ return joinValues([v.jiyukCdNm, v.jiguCdNm, v.guyukCdNm], ' / '); }],
          ['건물 ID', function(v){ return v.bldgId; }],
          ['생성일', function(v){ return formatDate(v.crtnDay); }]
        ]
      },
      flr: {
        label: '층별개요',
        perItemTitle: function(item){ return firstNonEmpty(item.flrNoNm, item.flrGbCdNm, '층 정보'); },
        fields: [
          ['층구분', function(v){ return firstNonEmpty(v.flrGbCdNm, v.flrNoNm); }],
          ['용도', function(v){ return firstNonEmpty(v.mainPurpsCdNm, v.etcPurps); }],
          ['기타용도', function(v){ return v.etcPurps; }],
          ['구조', function(v){ return firstNonEmpty(v.strctCdNm, v.etcStrct); }],
          ['면적', function(v){ return formatArea(v.area); }]
        ]
      },
      atchJibun: { label: '부속지번', fields: [['부속지번', function(v){ return joinValues([v.platPlc, v.newPlatPlc], ' / '); }]] },
      jijigu: { label: '지역지구구역', fields: [['지역/지구/구역', function(v){ return joinValues([v.jiyukCdNm, v.jiguCdNm, v.guyukCdNm, v.jijigu], ' / '); }]] },
      exposPubuseArea: {
        label: '전유공용면적',
        fields: [
          ['전유면적', function(v){ return formatArea(v.excluUseArea); }],

    };

    function firstNonEmpty(){
      for(var i=0;i<arguments.length;i++){
        var v = arguments[i];
        if(v == null) continue;
        v = String(v).trim();
        if(v) return v;
      }
      return '';
    }
    function joinValues(arr, sep){
      sep = sep || ' / ';
      var out = [];
      (arr || []).forEach(function(v){
        v = String(v == null ? '' : v).trim();
        if(v && out.indexOf(v) === -1) out.push(v);
      });
      return out.join(sep);
    }
    function formatDate(v){
      v = String(v == null ? '' : v).replace(/\D/g,'');
      if(v.length !== 8) return String(v || '').trim();
      return v.slice(0,4)+'.'+v.slice(4,6)+'.'+v.slice(6,8);
    }
    function formatArea(v){
      if(v == null || v === '') return '';
      var n = Number(v);
      if(!isFinite(n)) return String(v).trim();
      return numberText(n)+'㎡';
    }
    function formatPercent(v){
      if(v == null || v === '') return '';
      var n = Number(v);
      if(!isFinite(n)) return String(v).trim();
      return numberText(n)+'%';
    }
    function formatHeight(v){
      if(v == null || v === '') return '';
      var n = Number(v);
      if(!isFinite(n) || n === 0) return '';
      return numberText(n)+'m';
    }
    function formatInt(v, suffix){
      if(v == null || v === '') return '';
      var n = Number(v);
      if(!isFinite(n)) return String(v).trim();
      return String(Math.round(n)) + (suffix || '');

    function jsonpCall(params){
      return new Promise(function(resolve, reject){
        var cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random()*1000);
        var script = document.createElement('script');
        var done = false;
        var timer = null;

        function cleanup(){
          try{ delete window[cb]; }catch(e){}
          if(timer) clearTimeout(timer);
          if(script.parentNode) script.parentNode.removeChild(script);
        }

        window[cb] = function(payload){
          if(done) return;
          done = true;
          cleanup();
          resolve(payload);
        };

        script.onerror = function(){
          if(done) return;
          done = true;
          cleanup();
          reject(new Error('JSONP 요청 실패'));
        };

        params.callback = cb;
        params._ts = Date.now();

        var q = new URLSearchParams();
        Object.keys(params || {}).forEach(function(k){
          q.set(k, params[k] == null ? '' : String(params[k]));
        });

        script.src = GAS_URL + '?' + q.toString();
        document.body.appendChild(script);

        timer = setTimeout(function(){
          if(done) return;
          done = true;
          cleanup();
          reject(new Error('JSONP 타임아웃'));
        }, 15000);
      });
    }

      }
    }

    async function searchVworldParcelPnu(query){
      query = String(query || '').trim();
      if(!query) throw new Error('지번주소 또는 도로명주소를 입력하세요.');

      var item = await searchVworldAddressItem(query, 'parcel');
      var searchType = 'parcel';

      if(!item || !String(item.id || '').replace(/\D/g, '')){
        item = await searchVworldAddressItem(query, 'road');
        searchType = 'road';
      }

      if(!item){
        throw new Error('토지 검색 결과가 없습니다.');
      }

      var pnu = String(item.id || '').replace(/\D/g, '');
      var parcelAddress = firstNonEmpty(item.address && item.address.parcel, '');

      if(pnu.length !== 19 && parcelAddress){
        var parcelItem = await searchVworldAddressItem(parcelAddress, 'parcel');
        if(parcelItem && String(parcelItem.id || '').replace(/\D/g, '').length === 19){
          item = parcelItem;
          pnu = String(parcelItem.id || '').replace(/\D/g, '');
          searchType = 'road-to-parcel';
        }
      }

      if(pnu.length !== 19){
        throw new Error('필지 식별정보를 확인하지 못했습니다. 지번주소로 다시 입력해 주세요.');
      }

      return {
        pnu: pnu,
        address: firstNonEmpty(
          item.address && item.address.parcel,
          item.address && item.address.road,
          item.title,
          query
        ),
        roadAddress: firstNonEmpty(item.address && item.address.road, ''),
        parcelAddress: firstNonEmpty(item.address && item.address.parcel, ''),
        query: query,
        searchType: searchType,
        point: item.point || {}
      };
    }

    async function proxyLookupCall(params){
      params = Object.assign({}, params || {});
      var action = String(params.action || 'fetchPublicPropertyBySearchResult').trim();
      var q = new URLSearchParams();
      Object.keys(params || {}).forEach(function(k){
        if(k === 'callback' || k === '_ts' || k === 'action') return;
        q.set(k, params[k] == null ? '' : String(params[k]));
      });
      q.set('action', action);
      q.set('_ts', Date.now());

      var response = await fetch('/api/public-property-lookup?' + q.toString(), {
        method: 'GET',
        headers: { 'Accept': 'application/json' },
        cache: 'no-store'
      });

      var data = await response.json().catch(function(){ return null; });
      if(!response.ok || !(data && data.ok)){
        throw new Error((data && data.message) || '프록시 조회 실패');
      }
      return data;
    }

    async function lookupPublicProperty(params){
      var firstError = null;
      try{
        var direct = await jsonpCall(Object.assign({}, params));
        if(direct && direct.ok) return direct;
        firstError = new Error((direct && direct.message) || 'GAS 직접 조회 응답 실패');
      }catch(e){
        firstError = e;
      }

      try{
        return await proxyLookupCall(Object.assign({}, params));
      }catch(secondError){
        var err = new Error('BOTH_LOOKUP_FAILED');
        err.firstError = firstError;
        err.secondError = secondError;
        throw err;
      }
    }

    function areaText(v){

      if(!isFinite(n) || n <= 0) return '-';
      var py = n / 3.305785;
      return numberText(n) + '㎡ / ' + numberText(py) + '평';

    function textOrDash(v){

    function uniqueNonEmpty(arr){
      var out = [];
      (arr || []).forEach(function(v){
        v = String(v == null ? '' : v).trim();
        if(v && out.indexOf(v) === -1) out.push(v);
      });
      return out;
    }
    function findPositive(items, key){
      var best = null;
      (items || []).forEach(function(it){
        var n = Number(it && it[key]);
        if(isFinite(n) && n > 0 && (best == null || n > best)) best = n;
      });
      return best;
    }
    function buildingSortKey(name){

    function joinAreaPurpose(area, purpose, struct){
      var parts = [];
      if(area && area !== '-') parts.push(area);
      if(purpose && purpose !== '-') parts.push(purpose);
      if(struct && struct !== '-') parts.push(struct);

    function getBuildingArchArea(buildingSource, flrItemsForBuilding){
      var direct = Number(buildingSource && buildingSource.archArea);
      if(isFinite(direct) && direct > 0) return direct;

      var firstFloorArea = null;

      (flrItemsForBuilding || []).forEach(function(f){
        var floorName = String(f.flrNoNm || '').trim();
        var floorGb = String(f.flrGbCdNm || '').trim();
        var floorNo = String(f.flrNo == null ? '' : f.flrNo).trim();
        var area = Number(f && f.area);

        if(!isFinite(area) || area <= 0) return;

        var isFirstFloor =
          floorName === '1층' ||
          (floorGb === '지상' && floorNo === '1');

        if(isFirstFloor){

      });

      var n = Number(m2Text);

    function formatLandOfficialTotalText(areaM2, pricePerM2){
      var area = parseLandNumber(areaM2);
      var price = parseLandNumber(pricePerM2);
      if(!isFinite(area) || area <= 0 || !isFinite(price) || price <= 0) return '';

      var total = area * price;
      var manwon = Math.round(total / 10000);
      return formatWonText(total) + ' / 약 ' + String(manwon).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '만원';

    function splitLandValues(value){

    function normalizeUsePlanItems(usePlan){
      usePlan = usePlan || {};

      if(Array.isArray(usePlan.usePlanItems) && usePlan.usePlanItems.length){
        return usePlan.usePlanItems.map(function(item){
          return {
            name: firstNonEmpty(item && item.name, item && item.zoningDistrict, item && item.prposAreaDstrcCodeNm),
            conflict: firstNonEmpty(item && item.conflict, item && item.conflictStatus, item && item.cnflcAtNm)
          };
        }).filter(function(item){
          return !!(item.name || item.conflict);
        });
      }

      var names = splitLandValues(usePlan.zoningDistricts);
      var conflicts = splitLandValues(usePlan.conflictStatus);
      var max = Math.max(names.length, conflicts.length);
      var items = [];

      for(var i = 0; i < max; i++){
        items.push({
          name: names[i] || '',
          conflict: conflicts[i] || ''
        });
      }

      return items.filter(function(item){
        return !!(item.name || item.conflict);
      });
    }

      ) || normalizeUsePlanItems(usePlan).length > 0;
    }

    function formatLandBaseYearMonth(baseYear, baseMonth){
      var year = String(baseYear == null ? '' : baseYear).replace(/\D/g, '');
      var month = String(baseMonth == null ? '' : baseMonth).replace(/\D/g, '');

      if(!year) return '';
      if(year.length > 4) year = year.slice(0, 4);

      if(!month) return year;
      if(month.length === 1) month = '0' + month;
      if(month.length > 2) month = month.slice(0, 2);

      return year + '.' + month;
    }

    function buildLandInfoRows(data){
      var land = (data && data.land) || {};
      var characteristic = land.characteristic || {};
      if(!hasLandCharacteristic(characteristic)) return [];

      var rows = [];
      var priceText = firstNonEmpty(characteristic.officialLandPriceText, characteristic.officialLandPrice);
      var totalPriceText = firstNonEmpty(
        characteristic.officialLandTotalPriceText,
        characteristic.officialLandTotalPriceShortText,
        formatLandOfficialTotalText(characteristic.areaM2, characteristic.officialLandPrice)
      );

      var baseYearMonth = formatLandBaseYearMonth(characteristic.baseYear, characteristic.baseMonth);
      rows.push(['기준년월', textOrDash(baseYearMonth)]);
      rows.push(['지목', textOrDash(characteristic.landCategory)]);
      rows.push(['면적', formatLandAreaText(characteristic.areaM2, characteristic.areaPy)]);
      rows.push(['용도지역1', textOrDash(characteristic.zoning)]);
      if(firstNonEmpty(characteristic.zoning2)){
        rows.push(['용도지역2', textOrDash(characteristic.zoning2)]);
      }
      if(firstNonEmpty(characteristic.landUseSituation)){
        rows.push(['토지이용상황', textOrDash(characteristic.landUseSituation)]);
      }
      if(firstNonEmpty(characteristic.terrainHeight)){
        rows.push(['지형고저', textOrDash(characteristic.terrainHeight)]);
      }
      rows.push(['지형형상', textOrDash(characteristic.terrainShape)]);
      rows.push(['도로접면', textOrDash(formatLandRoadSideText(characteristic.roadSide))]);
      rows.push(['공시지가', textOrDash(priceText)]);
      if(totalPriceText) rows.push(['공시지가 총액', totalPriceText]);
      if(firstNonEmpty(characteristic.officialLandPriceAnnouncementDate)){
        rows.push(['개별공시지가 공시일자', textOrDash(formatDate(characteristic.officialLandPriceAnnouncementDate) || characteristic.officialLandPriceAnnouncementDate)]);
      }
      rows.push(['토지특성 기준일', textOrDash(formatDate(characteristic.dataDate) || characteristic.dataDate)]);

      return rows;
    }

    function buildLandUsePlanRows(data){
      var land = (data && data.land) || {};
      var usePlan = land.usePlan || {};
      if(!hasLandUsePlan(usePlan)) return [];

      var rows = [];
      var ledgerTypes = uniqueLandValues(usePlan.ledgerType);
      if(ledgerTypes.length){
        rows.push(['대장구분', ledgerTypes.join(', ')]);
      }

      normalizeUsePlanItems(usePlan).forEach(function(item){
        rows.push([textOrDash(item.name), textOrDash(item.conflict)]);
      });

      rows.push(['토지이용 기준일', textOrDash(formatDate(usePlan.dataDate) || usePlan.dataDate)]);
      return rows;
    }

    function buildLandRows(data){
      var landInfoRows = buildLandInfoRows(data);
      var landUsePlanRows = buildLandUsePlanRows(data);

      if(!landInfoRows.length && !landUsePlanRows.length){
        var msg = firstNonEmpty(data && data.land && data.land.message);
        if(!msg) return [];
        return [['조회상태', msg]];
      }

      var rows = [];
      if(landInfoRows.length){
        rows.push(['[토지 정보]', '']);
        rows = rows.concat(landInfoRows);
      }
      if(landUsePlanRows.length){
        rows.push(['[토지이용계획]', '']);
        rows = rows.concat(landUsePlanRows);
      }
      return rows;
    }

    function extractIntegratedData(data){
      var apis = data.apis || {};
      var titleItems = ((apis.title || {}).items || []).slice();
      var recapItems = ((apis.recap || {}).items || []).slice();
      var basisItems = ((apis.basis || {}).items || []).slice();
      var jijiguItems = ((apis.jijigu || {}).items || []).slice();
      var flrItems = ((apis.flr || {}).items || []).slice();
      var titleFirst = ((apis.title || {}).firstItem || {});
      var recapFirst = ((apis.recap || {}).firstItem || {});

      var zoningParts = uniqueNonEmpty(
        basisItems.map(function(it){ return it.jiyukCdNm; })
          .concat(basisItems.map(function(it){ return it.jiguCdNm; }))
          .concat(basisItems.map(function(it){ return it.guyukCdNm; }))
          .concat(jijiguItems.map(function(it){ return it.jiyukCdNm; }))
          .concat(jijiguItems.map(function(it){ return it.jiguCdNm; }))
          .concat(jijiguItems.map(function(it){ return it.guyukCdNm; }))
          .concat(jijiguItems.map(function(it){ return it.jijigu; }))
      ).join(' / ');

      var landArea = Number(recapFirst.platArea);
      if(!isFinite(landArea) || landArea <= 0) landArea = findPositive(recapItems, 'platArea');
      if(!isFinite(landArea) || landArea <= 0) landArea = findPositive(titleItems, 'platArea');

      var archArea = Number(recapFirst.archArea);
      if(!isFinite(archArea) || archArea <= 0) archArea = findPositive(recapItems, 'archArea');
      if(!isFinite(archArea) || archArea <= 0) {
        archArea = titleItems.reduce(function(sum, it){
          var n = Number(it.archArea);
          return sum + (isFinite(n) && n > 0 ? n : 0);
        }, 0);
      }

      var totArea = Number(recapFirst.totArea);
      if(!isFinite(totArea) || totArea <= 0) totArea = findPositive(recapItems, 'totArea');
      if(!isFinite(totArea) || totArea <= 0) {
        totArea = titleItems.reduce(function(sum, it){
          var n = Number(it.totArea);
          return sum + (isFinite(n) && n > 0 ? n : 0);
        }, 0);
      }

      var mainCnt = titleItems.filter(function(it){ return String(it.mainAtchGbCd || '').trim() === '0'; }).length;
      var atchCnt = titleItems.filter(function(it){ return String(it.mainAtchGbCd || '').trim() && String(it.mainAtchGbCd || '').trim() !== '0'; }).length;
      if(!mainCnt && recapFirst.mainBldCnt) mainCnt = Number(recapFirst.mainBldCnt) || 0;
      if(!atchCnt && recapFirst.atchBldCnt) atchCnt = Number(recapFirst.atchBldCnt) || 0;
      var totalCnt = titleItems.length || (mainCnt + atchCnt);
      var compText = '-';
      if(totalCnt){
        compText = '총 ' + totalCnt + '동';
        if(mainCnt || atchCnt) compText += ' (주건축물 ' + (mainCnt || 0) + '동, 부속건축물 ' + (atchCnt || 0) + '동)';
      }

      var summaryRows = [
        ['주소', firstNonEmpty(data.normalized && data.normalized.jibunAddress, data.address, titleFirst.platPlc, recapFirst.platPlc, '-')],
        ['도로명주소', firstNonEmpty(data.normalized && data.normalized.roadAddress, titleFirst.newPlatPlc, recapFirst.newPlatPlc, '-')],
        ['건축물구성', compText],
        ['건물용도', firstNonEmpty(recapFirst.mainPurpsCdNm, titleFirst.mainPurpsCdNm, recapFirst.etcPurps, titleFirst.etcPurps, '-')],
        ['용도지역', textOrDash(zoningParts)],
        ['사용승인일', formatDate(firstNonEmpty(recapFirst.useAprDay, titleFirst.useAprDay)) || '-'],
        ['대지면적', areaText(landArea)],
        ['건축면적', areaText(archArea)],
        ['연면적', areaText(totArea)],
        ['건폐율', formatPercent(firstNonEmpty(recapFirst.bcRat, titleFirst.bcRat)) || '-'],
        ['용적률', formatPercent(firstNonEmpty(recapFirst.vlRat, titleFirst.vlRat)) || '-'],
        ['주차대수', (function(){
          var n = Number(firstNonEmpty(recapFirst.totPkngCnt, ''));
          return (isFinite(n) && n > 0) ? (String(Math.round(n)) + '대') : '-';
        })()]
      ];

      var basisByPk = {};
      basisItems.forEach(function(it){
        var pk = String(it.mgmBldrgstPk || '').trim();
        if(!pk) return;
        if(!basisByPk[pk]) basisByPk[pk] = [];
        basisByPk[pk].push(it);
      });

      var floorsByDong = {};
      flrItems.forEach(function(it){
        var dk = String(it.dongNm || '').trim();
        if(!dk) return;
        if(!floorsByDong[dk]) floorsByDong[dk] = [];
        floorsByDong[dk].push(it);
      });

      var buildings = titleItems.slice().sort(function(a,b){
        return buildingSortKey(a.dongNm) - buildingSortKey(b.dongNm);
      }).map(function(it){
        var pk = String(it.mgmBldrgstPk || '').trim();
        var basisList = basisByPk[pk] || [];
        var floorList = (floorsByDong[String(it.dongNm || '').trim()] || []).slice().sort(function(a,b){
          return floorSortKey(a.flrNoNm || a.flrGbCdNm) - floorSortKey(b.flrNoNm || b.flrGbCdNm);
        });
        var isMainBuilding = String(it.mainAtchGbCd || '').trim() === '0';
        var isResidentialApartmentDong = isMainBuilding && /공동주택|아파트/.test(
          firstNonEmpty(it.mainPurpsCdNm, '') + ' ' + firstNonEmpty(it.etcPurps, '')
        ) && /(\d+동)$/.test(firstNonEmpty(it.dongNm, ''));
        var floorSummary = isResidentialApartmentDong
          ? '-'
          : (floorList.length ? floorList.map(function(f){
              var fname = firstNonEmpty(f.flrNoNm, f.flrGbCdNm, '층정보');
              var fpurpose = firstNonEmpty(f.mainPurpsCdNm, f.etcPurps, '-');
              var fstruct = firstNonEmpty(f.strctCdNm, f.etcStrct, '-');
              return fname + ': ' + joinAreaPurpose(areaText(f.area), fpurpose, fstruct);
            }).join('\n') : '-');

        var bRows = [
          ['동명', firstNonEmpty(it.dongNm, '-')],
          ['구분', firstNonEmpty(it.mainAtchGbCdNm, '-')],
          ['용도', firstNonEmpty(it.mainPurpsCdNm, it.etcPurps, '-')],
          ['구조', firstNonEmpty(it.strctCdNm, it.etcStrct, '-')],
          ['지붕', firstNonEmpty(it.roofCdNm, it.etcRoof, '-')],
          ['층수', buildFloorText(it) || '-'],
          ['층고', formatHeight(it.heit) || '-'],
          ['건축면적', areaText(getBuildingArchArea(it, floorList))],
          ['연면적', areaText(it.totArea)],
          ['사용승인일', formatDate(it.useAprDay) || '-'],
          ['층별요약', floorSummary]
        ];
        return { title: firstNonEmpty(it.dongNm, '건물'), rows: bRows };
      });

      var hsprcItems = ((apis.hsprc || {}).items || []).slice();
      var hsprcFirst = ((apis.hsprc || {}).firstItem || {});
      var priceItem = hsprcItems.find(function(it){
        return firstNonEmpty(it.stdrYear, it.housePc, it.pblntfPc, it.officialLandPrice);
      }) || hsprcFirst || {};

      var priceRows = [
        ['기준연도', firstNonEmpty(formatDate(priceItem.stdrYear), priceItem.stdrYear, '-')],
        ['공시가격', firstNonEmpty(priceItem.housePc, priceItem.pblntfPc, priceItem.officialLandPrice, '-')]
      ];

      return {
        summaryRows: summaryRows,
        buildings: buildings,
        priceRows: priceRows,
        landRows: buildLandRows(data),
        landInfoRows: buildLandInfoRows(data),
        landUsePlanRows: buildLandUsePlanRows(data)
      };
    }


    function maskJibunAddress(addr){
      var s = String(addr == null ? '' : addr).replace(/\s+/g, ' ').trim();
      if(!s) return '-';
      s = s.replace(/\s산?\d+(?:-\d+)?(?:번지)?$/,'').trim();
      return s || '-';
    }

    function buildExportRows(data, extracted){
      var rows = [];
      var base = extracted && extracted.summaryRows ? extracted.summaryRows.slice() : [];
      base.forEach(function(row){
        var label = row[0];
        var value = row[1];
        if(label === '주소'){
          rows.push(['주소', maskJibunAddress(firstNonEmpty(
            data && data.normalized && data.normalized.jibunAddress,
            data && data.address,
            value
          ))]);
        }else if(label === '도로명주소'){
          rows.push(['도로명주소', maskJibunAddress(value)]);
        }else{
          rows.push([label, value]);
        }
      });
      return rows;
    }

    function buildCaptureSheetHtml(data, extracted){
      var rows = buildExportRows(data, extracted);
      return ''
        + '<div class="capture-card">'
        +   '<div class="capture-head">'
        +     '<h1 class="capture-title">부동산 기본정보</h1>'
        +   '</div>'
        +   '<div class="capture-body">'
        +     '<table class="capture-table"><tbody>'
        +       rows.map(function(row){
                  return '<tr><th>' + escapeHtml(row[0]) + '</th><td>' + escapeHtml(row[1]) + '</td></tr>';
                }).join('')
        +     '</tbody></table>'
        +   '</div>'
        + '</div>';
    }

    function downloadBlob(blob, filename){
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){
        URL.revokeObjectURL(url);
        if(a.parentNode) a.parentNode.removeChild(a);
      }, 100);
    }

    async function saveSummaryImage(){
      if(!window.lastResultData){
        setStatus('먼저 조회를 완료해주세요.', 'err');
        return;
      }
      var extracted = extractIntegratedData(window.lastResultData);
      return saveRowsAsImage('부동산 기본정보', extracted.summaryRows, 'maslow-summary.png');
    }


    function sanitizeRowsForImage(rows){
      return (rows || []).map(function(row){
        var label = row[0];
        var value = row[1];
        if(label === '주소' || label === '도로명주소'){
          return [label, maskJibunAddress(value)];
        }
        return [label, value];
      });
    }

    function buildRowsCopyText(title, rows){
      var lines = [String(title || '부동산 기본정보').trim()];
      (rows || []).forEach(function(row){
        var label = String(row[0] == null ? '' : row[0]).trim();
        var value = String(row[1] == null ? '' : row[1]).trim();
        if(!label) return;
        lines.push(label + ': ' + (value || '-'));
      });
      return lines.join('\n');
    }

    async function copyRowsText(title, rows){
      if(!rows || !rows.length){
        setStatus('복사할 내용이 없습니다.', 'err');
        return;
      }
      try{
        var text = buildRowsCopyText(title, rows);
        if(navigator.clipboard && navigator.clipboard.writeText){
          await navigator.clipboard.writeText(text);
        }else{
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          if(ta.parentNode) ta.parentNode.removeChild(ta);
        }
        setStatus('텍스트 복사 완료', 'ok');
      }catch(err){
        setStatus('텍스트 복사 실패', 'err');
      }
    }

    async function saveRowsAsImage(title, rows, filename){
      if(!rows || !rows.length){
        setStatus('이미지 저장 실패', 'err');
        return;
      }

      try{
        setStatus('', '');

        function splitLines(ctx, text, maxWidth){
          var raw = String(text == null ? '' : text).split('\n');
          var lines = [];
          raw.forEach(function(block){
            var words = block.split(' ');
            var line = '';
            for(var i=0;i<words.length;i++){
              var test = line ? (line + ' ' + words[i]) : words[i];
              if(ctx.measureText(test).width <= maxWidth){
                line = test;
              }else{
                if(line) lines.push(line);
                line = words[i];
                while(ctx.measureText(line).width > maxWidth && line.length > 1){
                  var cut = line.length - 1;
                  while(cut > 1 && ctx.measureText(line.slice(0, cut)).width > maxWidth) cut--;
                  lines.push(line.slice(0, cut));
                  line = line.slice(cut);
                }
              }
            }
            lines.push(line || '');
          });
          return lines.length ? lines : [''];
        }

        function roundRect(ctx, x, y, w, h, r){
          var radius = Math.min(r, w/2, h/2);
          ctx.beginPath();
          ctx.moveTo(x + radius, y);
          ctx.arcTo(x + w, y, x + w, y + h, radius);
          ctx.arcTo(x + w, y + h, x, y + h, radius);
          ctx.arcTo(x, y + h, x, y, radius);
          ctx.arcTo(x, y, x + w, y, radius);
          ctx.closePath();
        }

        var safeRows = sanitizeRowsForImage(rows);
        var dpr = 2;
        var paddingLeft = 20;
        var paddingRight = 12;
        var paddingTop = 20;
        var paddingBottom = 18;
        var titleH = 58;
        var labelW = 132;

        var probe = document.createElement('canvas');
        var pctx = probe.getContext('2d');

        pctx.font = '900 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo",sans-serif';
        var maxLabelW = labelW;
        safeRows.forEach(function(row){
          maxLabelW = Math.max(maxLabelW, Math.ceil(pctx.measureText(String(row[0] || '')).width) + 26);
        });
        labelW = maxLabelW;

        pctx.font = '900 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo",sans-serif';
        var valueW = 220;
        safeRows.forEach(function(row){
          String(row[1] == null ? '' : row[1]).split('\n').forEach(function(line){
            valueW = Math.max(valueW, Math.ceil(pctx.measureText(line).width) + 34);
          });
        });
        valueW = Math.min(valueW, 540);

        var tableW = labelW + valueW;
        var fullW = paddingLeft + tableW + paddingRight;

        var rowHeights = [];
        safeRows.forEach(function(row){
          var lines = splitLines(pctx, row[1], valueW - 24);
          var lineCount = Math.max(1, lines.length);
          rowHeights.push(Math.max(52, 18 + lineCount * 24));
        });

        var totalRowsH = rowHeights.reduce(function(a,b){ return a+b; }, 0);
        var fullH = paddingTop + titleH + totalRowsH + paddingBottom;

        var canvas = document.createElement('canvas');
        canvas.width = Math.ceil(fullW * dpr);
        canvas.height = Math.ceil(fullH * dpr);

        var ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, fullW, fullH);

        ctx.strokeStyle = '#dfe7f3';
        ctx.lineWidth = 1;
        roundRect(ctx, 0.5, 0.5, fullW - 1, fullH - 1, 14);
        ctx.stroke();

        ctx.fillStyle = '#f8fbff';
        roundRect(ctx, 0.5, 0.5, fullW - 1, titleH + 10, 14);
        ctx.fillRect(1, titleH, fullW - 2, 10);
        ctx.fill();

        ctx.fillStyle = '#111827';
        ctx.font = '900 24px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo",sans-serif';
        ctx.textBaseline = 'middle';
        ctx.fillText(title || '부동산 기본정보', paddingLeft, paddingTop + titleH / 2 - 2);

        var startY = paddingTop + titleH;
        var xLabel = paddingLeft;
        var xValue = paddingLeft + labelW;

        for(var i=0;i<safeRows.length;i++){
          var row = safeRows[i];
          var rh = rowHeights[i];
          var y = startY;

          ctx.fillStyle = '#f8fbff';
          ctx.fillRect(xLabel, y, labelW, rh);

          ctx.strokeStyle = '#e7edf5';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(xLabel, y);
          ctx.lineTo(xLabel + tableW, y);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(xValue, y);
          ctx.lineTo(xValue, y + rh);
          ctx.stroke();

          ctx.fillStyle = '#344054';
          ctx.font = '900 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo",sans-serif';
          ctx.textBaseline = 'middle';
          ctx.fillText(String(row[0] || ''), xLabel + 14, y + rh / 2);

          ctx.fillStyle = '#111827';
          ctx.font = '900 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo",sans-serif';
          ctx.textBaseline = 'top';
          var lines = splitLines(ctx, row[1], valueW - 24);
          var textY = y + 14;
          lines.forEach(function(line){
            ctx.fillText(String(line || ''), xValue + 14, textY);
            textY += 24;
          });

          startY += rh;
        }

        ctx.beginPath();
        ctx.moveTo(xLabel, startY);
        ctx.lineTo(xLabel + tableW, startY);
        ctx.strokeStyle = '#e7edf5';
        ctx.stroke();

        canvas.toBlob(function(blob){
          if(!blob){
            setStatus('이미지 저장 실패', 'err');
            return;
          }
          downloadBlob(blob, filename || 'maslow-summary.png');
        }, 'image/png');
      }catch(err){
        setStatus('이미지 저장 실패', 'err');
      }
    }

          + buildResultTable(extracted.landUsePlanRows)
          + '<div class="table-download-wrap">'
          + '<div class="table-action-row">'
          + '<button class="table-download-btn" data-kind="land-use-plan" data-title="토지대장 토지이용계획">이미지 내려받기</button>'
          + '<button class="table-copy-btn" data-copy-kind="land-use-plan" data-title="토지대장 토지이용계획">텍스트 복사</button>'
          + '</div>'
          + '<div class="table-download-note">저촉/포함은 왼쪽 용도지역·지구와 같은 줄 기준입니다.</div>'
          + '</div>'
          + '</div>';
      }

      if((!extracted.landInfoRows || !extracted.landInfoRows.length) && (!extracted.landUsePlanRows || !extracted.landUsePlanRows.length) && extracted.landRows && extracted.landRows.length){
        html += '<div class="result-block">'
          + '<div class="result-block-head">토지대장 토지정보</div>'
          + buildResultTable(extracted.landRows)
          + '</div>';
      }

      if(!isLandOnly){
        html += '<div class="result-block">'
          + '<div class="result-block-head">건축물대장 통합요약 <span style="font-size:12px;font-weight:800;color:#667085;vertical-align:middle;margin-left:6px;">총괄표제부값</span></div>'
          + buildResultTable(extracted.summaryRows)
          + '<div class="table-download-wrap">'
          + '<div class="table-action-row">'
          + '<button class="table-download-btn" data-kind="summary" data-title="건축물대장 통합요약">이미지 내려받기</button>'
          + '<button class="table-copy-btn" data-copy-kind="summary" data-title="건축물대장 통합요약">텍스트 복사</button>'
          + '</div>'
          + '<div class="table-download-note">주소가 있으면 뒤 숫자는 보이지 않게 저장됩니다.</div>'
          + '</div>'
          + '</div>';

        extracted.buildings.forEach(function(b){
          html += '<div class="result-block">'
            + '<div class="result-block-head">' + escapeHtml(b.title) + '</div>'
            + buildResultTable(b.rows)
            + '<div class="table-download-wrap">'
            + '<div class="table-action-row">'
            + '<button class="table-download-btn" data-kind="building" data-title="' + escapeHtml(b.title) + '">이미지 내려받기</button>'
            + '<button class="table-copy-btn" data-copy-kind="building" data-title="' + escapeHtml(b.title) + '">텍스트 복사</button>'
            + '</div>'
            + '<div class="table-download-note">주소가 있으면 뒤 숫자는 보이지 않게 저장됩니다.</div>'
            + '</div>'
            + '</div>';
        });

        html += '<div class="result-block">'
          + '<div class="result-block-head">공시지가 주택 가격 조회</div>'
          + '<div class="table-download-wrap">'
          + '<div class="table-action-row">'
          + '<button class="table-download-btn" data-kind="price-link" data-title="공시지가 주택 가격 조회">조회하기</button>'
          + '</div>'
          + '</div>'
          + '</div>';
      }

      html += '</div>';
      els.overviewGrid.innerHTML = html;

      document.querySelectorAll('.table-download-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
          var kind = btn.getAttribute('data-kind');
          var title = btn.getAttribute('data-title') || '부동산 기본정보';

          if(kind === 'summary'){
            saveRowsAsImage(title, extracted.summaryRows, 'maslow-summary.png');
            return;
          }
          if(kind === 'land-info'){
            saveRowsAsImage(title, extracted.landInfoRows || [], 'maslow-land-info.png');
            return;
          }
          if(kind === 'land-use-plan'){
            saveRowsAsImage(title, extracted.landUsePlanRows || [], 'maslow-land-use-plan.png');
            return;
          }
          if(kind === 'land'){
            saveRowsAsImage(title, extracted.landRows || [], 'maslow-land-info.png');
            return;
          }
          if(kind === 'price-link'){
            window.open('https://www.realtyprice.kr/notice/m/main/main.do', '_blank', 'noopener');
            return;
          }

          var found = extracted.buildings.find(function(b){
            return b.title === title;
          });
          if(found){
            saveRowsAsImage(title, found.rows, title + '.png');
          }
        });
      });

      document.querySelectorAll('.table-copy-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
          var kind = btn.getAttribute('data-copy-kind');
          var title = btn.getAttribute('data-title') || '부동산 기본정보';

          if(kind === 'summary'){
            copyRowsText(title, extracted.summaryRows);
            return;
          }
          if(kind === 'land-info'){
            copyRowsText(title, extracted.landInfoRows || []);
            return;
          }
          if(kind === 'land-use-plan'){
            copyRowsText(title, extracted.landUsePlanRows || []);
            return;
          }
          if(kind === 'land'){
            copyRowsText(title, extracted.landRows || []);
            return;
          }

          var found = extracted.buildings.find(function(b){
            return b.title === title;
          });
          if(found){
            copyRowsText(title, found.rows);
          }
        });
      });
    }

    function buildSourceCard(key, source){
      return '';
    }

    function renderResult(data, mode, restoring){
      mode = mode || currentLookupMode;
      window.lastResultData = data;
      if(!restoring){
        resultCacheByMode[mode] = { data: data };
      }
      els.emptyState.style.display = 'none';
      els.summaryGrid.style.display = 'none';
      renderMapLink();
      els.overviewSection.style.display = 'block';
      els.sourcesSection.style.display = 'none';
      buildOverviewCards(data, mode);
    }

    async function lookupLandOnly(){
      try{
        var query = els.landAddressInput ? String(els.landAddressInput.value || '').trim() : '';
        if(!query){
          setStatus('지번주소 또는 도로명주소를 입력하세요.', 'err');
          if(els.landAddressInput) els.landAddressInput.focus();
          return;
        }

        setLoading(true);
        hideLookupFailPanel();
        setStatus('', '');

        var found = await searchVworldParcelPnu(query);
        if(!found.pnu || found.pnu.length !== 19){
          throw new Error('필지 식별정보를 확인하지 못했습니다.');
        }

        landPicked = found;
        els.pickedLine.textContent = joinValues([
          found.parcelAddress ? ('지번: ' + found.parcelAddress) : '',
          found.roadAddress ? ('도로명: ' + found.roadAddress) : '',
          (!found.parcelAddress && found.address) ? ('주소: ' + found.address) : ''
        ], '\n');

        var res = await lookupPublicProperty({
          action: 'fetchLandInfoBySearchResult',
          pnu: found.pnu,
          queryAddress: found.query,
          lookupAddress: found.address || found.query,
          address: found.address || found.query
        });

        if(!(res && res.ok)){
          throw new Error((res && res.message) || '토지정보 조회 실패');
        }

        renderResult({
          ok: true,
          message: res.message || '토지정보 조회 성공',
          address: found.address || found.query,
          pnu: found.pnu,
          land: res
        }, LOOKUP_MODE_LAND_ONLY);
      }catch(e){
        if(e && e.message === 'BOTH_LOOKUP_FAILED'){
          setStatus('토지 조회 실패 · 1차 직접 조회와 2차 프록시 조회가 모두 실패했습니다.', 'err');
          showLookupFailPanel(e);
        }else{
          setStatus('토지 조회 실패 · ' + (e && e.message ? e.message : String(e)), 'err');
        }
      }finally{
        setLoading(false);
      }
    }

    async function lookup(){
      try{
        if(currentLookupMode === LOOKUP_MODE_LAND_ONLY){
          await lookupLandOnly();
          return;
        }

        if(!picked){
          openAddressSearch('');
          return;
        }

        setLoading(true);
        hideLookupFailPanel();
        setStatus('', '');
        var params = { action:'fetchPublicPropertyBySearchResult' };
        Object.keys(picked).forEach(function(k){ params[k] = picked[k]; });
        params.queryAddress = picked.lookupAddress || picked.jibunAddress || picked.autoJibunAddress || picked.roadAddress || '';
        params.queryAddressType = (picked.jibunAddress || picked.autoJibunAddress) ? 'JIBUN' : 'ROAD';

        var res = await lookupPublicProperty(params);
        renderResult(res, LOOKUP_MODE_BUILDING_LAND);
      }catch(e){
        setStatus('조회 실패 · 1차 직접 조회와 2차 프록시 조회가 모두 실패했습니다.', 'err');
        showLookupFailPanel(e);
      }finally{
        setLoading(false);
      }
    }

    if(els.modeBuildingLandBtn){
      els.modeBuildingLandBtn.addEventListener('click', function(){
        setLookupMode(LOOKUP_MODE_BUILDING_LAND);
      });
    }

    if(els.modeLandOnlyBtn){
      els.modeLandOnlyBtn.addEventListener('click', function(){
        setLookupMode(LOOKUP_MODE_LAND_ONLY);
      });
    }

    if(els.landAddressInput){
      els.landAddressInput.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){
          e.preventDefault();
          lookup();
        }
      });
    }

    els.addressSearchTrigger.addEventListener('click', function(){
      if(currentLookupMode === LOOKUP_MODE_LAND_ONLY){
        if(els.landAddressInput) els.landAddressInput.focus();
        return;
      }
      if(addressLocked) return;
      openAddressSearch('');
    });

    els.refreshAddressBtn.addEventListener('click', function(e){
      e.stopPropagation();
      resetAddressOnly();
    });

    els.lookupBtn.addEventListener('click', function(){
      lookup();
    });

    els.naverMapBtn.addEventListener('click', function(){
      openNaverMap();
    });

    if(els.ddangyaMapBtn){
      els.ddangyaMapBtn.addEventListener('click', function(){
        openDdangyaMap();
      });
    }


    if(els.lookupFailRetryBtn){
      els.lookupFailRetryBtn.addEventListener('click', function(){
        hideLookupFailPanel();
        lookup();
      });
    }
    if(els.lookupFailCloseBtn){
      els.lookupFailCloseBtn.addEventListener('click', function(){
        hideLookupFailPanel();
      });
    }
    if(els.lookupFailResetBtn){
      els.lookupFailResetBtn.addEventListener('click', function(){
        hideLookupFailPanel();
        resetAddressOnly();
        if(currentLookupMode === LOOKUP_MODE_LAND_ONLY){
          if(els.landAddressInput) els.landAddressInput.focus();
        }else{
          openAddressSearch('');
        }
      });
    }
    if(els.lookupFailPanel){
      els.lookupFailPanel.addEventListener('click', function(e){
        if(e.target === els.lookupFailPanel) hideLookupFailPanel();
      });
    }

    setLookupMode(LOOKUP_MODE_BUILDING_LAND);


    renderAddressDisplay();
    renderMapLink();
  </script>
</body>
</html>
