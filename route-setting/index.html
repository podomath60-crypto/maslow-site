<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>경로설정 - 최단 경로</title>
<style>
:root{--green:#03c75a;--blue:#2563eb;--dark:#111827;--muted:#6b7280;--line:#e5e7eb;--bg:#f4f6f8;--danger:#e11d48;--amber:#f59e0b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--dark)}button,input,textarea{font-family:inherit}.app{width:100vw;height:100vh;display:grid;grid-template-columns:65% 35%;overflow:hidden}
.mapWrap{position:relative;height:100vh;border-right:1px solid var(--line);overflow:hidden;background:#eef2f7}.naverMapCanvas{position:absolute;inset:0;z-index:2;width:100%;height:100%;min-height:320px;background:#f8f9fa;display:block;transform:translateZ(0)}.mapbar{position:absolute;left:18px;top:18px;z-index:20;background:rgba(255,255,255,.94);border:1px solid var(--line);box-shadow:0 12px 34px rgba(15,23,42,.12);border-radius:14px;padding:10px 13px}.mapbar strong{font-size:15px}.mapbar span{margin-left:8px;font-size:12px;color:var(--muted)}.mapGuide{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:18;width:min(560px,72%);padding:18px 20px;border:1px solid rgba(148,163,184,.55);border-radius:18px;background:rgba(255,255,255,.88);box-shadow:0 12px 34px rgba(15,23,42,.12);text-align:center;color:#475569;line-height:1.55;pointer-events:none}.mapGuide strong{display:block;color:#0f172a;margin-bottom:4px}.mapGuide.hide{display:none}.legend{position:absolute;left:18px;bottom:18px;z-index:20;background:rgba(255,255,255,.94);border:1px solid var(--line);box-shadow:0 12px 34px rgba(15,23,42,.12);border-radius:14px;padding:10px 13px;font-size:12px;color:#475569;display:flex;gap:10px}.dot{display:inline-block;width:12px;height:12px;border-radius:99px;margin-right:4px;vertical-align:-2px}.dot.a{background:var(--green)}.dot.s{background:var(--blue)}.dot.z{background:#111827}
.panel{height:100vh;background:#fff;display:flex;flex-direction:column;overflow:hidden;padding-right:16px}.head{padding:18px 22px 13px 16px;border-bottom:1px solid var(--line)}.headLine{display:flex;align-items:baseline;gap:20px}.head h1{margin:0;font-size:22px;letter-spacing:-.04em;white-space:nowrap}.totalLine{display:flex;align-items:baseline;gap:8px;color:#15803d;font-weight:950;line-height:1;white-space:nowrap}.totalLine small{font-size:12px;color:#64748b;font-weight:900}.totalLine span{font-size:30px;letter-spacing:-.055em}.body{flex:1;overflow:auto;padding:14px 18px 118px 12px}.section{margin-bottom:12px}.label{display:flex;align-items:center;justify-content:space-between;margin:0 0 6px;font-size:13px;font-weight:950;letter-spacing:-.03em}.hint{font-size:11px;color:#64748b;font-weight:700}.inputRow{display:flex;gap:7px;align-items:center}.inputRow .input{flex:1;min-width:0}.locBtn{width:38px;height:38px;border:1px solid #d1d5db;border-radius:11px;background:#f8fafc;color:#0f172a;display:grid;place-items:center;cursor:pointer;flex:0 0 38px}.locBtn:hover{background:#f0fdf4;border-color:#86efac;color:#15803d}.locBtn.currentBtn:hover{background:#eff6ff;border-color:#bfdbfe;color:#2563eb}.locBtn:disabled{opacity:.55;cursor:wait}.locBtn svg{width:20px;height:20px;display:block}.input,.textarea{width:100%;border:1px solid #d1d5db;border-radius:11px;background:#fff;outline:none;font-size:15px}.input{height:42px;padding:9px 11px}.textarea{height:96px;min-height:96px;max-height:96px;resize:none;padding:11px 12px;line-height:1.5;overflow:auto}.input:focus,.textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(3,199,90,.12)}.input:disabled{background:#f1f5f9;color:#64748b}.check{display:flex;gap:7px;align-items:center;margin-top:7px;font-size:12px;color:#334155;font-weight:800}.check input{width:15px;height:15px;accent-color:var(--green)}.primary{width:100%;height:44px;border:0;border-radius:13px;background:var(--green);color:#fff;font-size:14px;font-weight:950;cursor:pointer}.primary:disabled{opacity:.62;cursor:not-allowed}.status{margin:0 0 12px;padding:9px 10px;border-radius:11px;background:#f8fafc;border:1px solid #e2e8f0;color:#475569;font-size:12px;font-weight:850;display:none}.status.show{display:block}.status.ok{background:#f0fdf4;border-color:#bbf7d0;color:#15803d}.status.err{background:#fff1f2;border-color:#fecdd3;color:#be123c}.progress{height:6px;border-radius:99px;background:#e5e7eb;overflow:hidden;margin-top:7px}.progress span{display:block;height:100%;width:0;background:var(--green);transition:width .18s ease}.result{display:none;margin-top:14px}.result.show{display:block}.resultHeader{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-bottom:8px}.resultHeader h2{margin:0;font-size:16px;letter-spacing:-.04em}.summary{font-size:12px;color:#475569;font-weight:850;white-space:nowrap}.routeList{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}.routeItem{position:relative;min-height:43px;border-bottom:1px solid #eef2f7;background:#fff}.routeItem:last-child{border-bottom:0}.routeMain{display:flex;align-items:center;gap:8px;min-width:0;padding:9px 186px 9px 12px}.routeBadge{display:inline-flex;width:26px;height:26px;border-radius:8px;align-items:center;justify-content:center;background:#eff6ff;color:#1d4ed8;font-size:12px;font-weight:950;flex:0 0 26px}.routeBadge.a{background:#f0fdf4;color:#15803d}.routeBadge.z{background:#f1f5f9;color:#0f172a}.routeText{min-width:0;font-size:12px;line-height:1.35;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.routeText .muted{color:#64748b;font-weight:800}.segmentBetween{position:absolute;right:12px;top:100%;width:172px;height:34px;transform:translateY(-17px);z-index:5;display:flex;align-items:center;justify-content:flex-end;pointer-events:none}.segmentBlank{display:none}.segmentRight{position:relative;display:flex;align-items:center;justify-content:flex-end;gap:8px;width:100%;height:34px;padding-left:22px;pointer-events:auto}.segmentBracket{position:absolute;left:0;top:0;bottom:0;width:18px;border-right:3px solid #0ea5e9;border-top:3px solid #0ea5e9;border-bottom:3px solid #0ea5e9}.segmentText{color:#1d4ed8;font-size:12px;font-weight:950;line-height:1.1;text-align:right;white-space:nowrap;background:#fff;padding:0 2px}.segOpen{width:31px;height:31px;border:1px solid #dbe3ef;border-radius:10px;background:#f8fafc;cursor:pointer;font-size:15px;line-height:1;display:grid;place-items:center;flex:0 0 31px}.segOpen:hover{background:#eff6ff;border-color:#bfdbfe}.actions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}.secondary{height:38px;border:1px solid #dbe3ef;border-radius:11px;background:#f8fafc;color:#0f172a;font-size:12px;font-weight:950;cursor:pointer}.secondary.dark{background:#111827;color:#fff;border-color:#111827}.fine{margin-top:8px;font-size:11px;color:#64748b;line-height:1.45}.warn{color:#be123c;font-weight:900}
@media(max-width:1100px){.app{grid-template-columns:60% 40%}.totalLine span{font-size:26px}.textarea{height:86px;min-height:86px;max-height:86px}}
@media(max-width:760px){.app{display:block;overflow:auto}.mapWrap{height:44vh;border-right:0;border-bottom:1px solid var(--line)}.mapbar,.legend{display:none}.panel{height:auto;min-height:56vh}.body{padding-bottom:32px}.headLine{flex-wrap:wrap;gap:8px 16px}.input,.textarea{font-size:16px}.input{height:44px}.textarea{height:104px;min-height:104px;max-height:104px}}

.mapGuide{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px 20px;max-width:340px;text-align:center;background:rgba(255,255,255,.92)!important;backdrop-filter:blur(6px)}
.mapGuide strong{font-size:15px;line-height:1.35;color:#0f172a}
.mapGuide span{font-size:12px;line-height:1.45;color:#475569}
.mapCarpetHero{width:min(220px,56vw);height:auto;display:block;filter:drop-shadow(0 18px 24px rgba(15,23,42,.18));animation:carpetFloat 3.8s ease-in-out infinite}
@keyframes carpetFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(1.5deg)}}


@media(max-width:760px){
  .mapCarpetHero{width:min(132px,34vw)}
}


.magicTitle{
  font-size:24px;
  font-weight:950;
  letter-spacing:-.04em;
  line-height:1.15;
  background:linear-gradient(90deg,#312e81,#7c3aed,#f59e0b,#312e81);
  background-size:240% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent!important;
  animation:magicTextShine 4.2s ease-in-out infinite;
  filter:drop-shadow(0 4px 10px rgba(124,58,237,.16));
}
@keyframes magicTextShine{
  0%,72%,100%{background-position:0% 50%;filter:drop-shadow(0 4px 10px rgba(124,58,237,.16))}
  36%{background-position:100% 50%;filter:drop-shadow(0 6px 16px rgba(245,158,11,.30))}
}
@media(max-width:760px){
  .magicTitle{font-size:20px}
}

/* mobile route list clean */

@media(max-width:760px){
  .routeMain{padding-right:12px;align-items:flex-start}
  .routeText{
    white-space:normal;
    overflow:visible;
    text-overflow:clip;
    word-break:keep-all;
    overflow-wrap:anywhere;
    line-height:1.42;
    padding-top:3px;
  }
  .segmentBetween{
    right:10px;
    width:158px;
    transform:translateY(-17px);
  }
  .segmentRight{
    padding-left:0;
  }
  .segmentBracket{
    display:none;
  }
  .segmentText{
    background:#fff;
  }
}

</style>
</head>
<body>
<main class="app">
  <section class="mapWrap" id="mapWrap">
    <div class="naverMapCanvas" id="naverMap" aria-label="네이버 지도"></div>
    <div class="mapbar"><strong>경로설정</strong><span id="mapStatus">네이버 지도 로딩 중</span></div>
    <div class="mapGuide" id="mapGuide"><img class="mapCarpetHero" src="/route-setting/magic-carpet.png" alt="" aria-hidden="true"><strong class="magicTitle">매직 카펫</strong><span>계산이 끝나면 추천 순서대로 지도에 핀이 표시됩니다.</span></div>
    <div class="legend"><span><i class="dot a"></i>출발</span><span><i class="dot s"></i>방문</span><span><i class="dot z"></i>도착</span></div>
  </section>

  <aside class="panel">
    <div class="head">
      <div class="headLine"><h1>🪄 최단 경로</h1><div class="totalLine"><small>총 예상시간</small><span id="totalTime">--</span></div></div>
    </div>
    <div class="body">
      <div id="status" class="status"></div>

      <div class="section">
        <div class="label">출발지 <span class="hint">A</span></div>
        <div class="inputRow">
          <button class="locBtn" id="officeStart" type="button" title="사무실 주소 입력" aria-label="사무실 주소 입력">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 21V8.8L12 3l8 5.8V21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M9 21v-7h6v7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M7 11h2M15 11h2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="locBtn currentBtn" id="currentStart" type="button" title="현재 위치를 출발지로 입력" aria-label="현재 위치를 출발지로 입력">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 4v12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
              <path d="M7 11l5 5 5-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M5 20h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
          </button>
          <input class="input" id="start" placeholder="출발지 주소 입력" autocomplete="off">
        </div>
      </div>

      <div class="section">
        <div class="label">방문지 <span class="hint">순서 상관없이 경유지 주소 붙여넣기 · 최대 8개</span></div>
        <textarea class="textarea" id="visits" placeholder="순서 상관없이 경유지 주소만 붙여넣기&#10;예) 전북 군산시 오식도동 601-8, 전북 군산시 산북동 3531-6"></textarea>
      </div>

      <div class="section">
        <div class="label">도착지 <span class="hint">Z</span></div>
        <input class="input" id="end" placeholder="도착지 주소 입력" autocomplete="off">
        <label class="check"><input type="checkbox" id="returnToStart">출발지로 복귀</label>
      </div>

      <button class="primary" id="findRoute">최단경로 찾기</button>
      <div class="fine">붙여넣은 경유지 주소를 콤마 기준으로 정리한 뒤, 가능한 방문 순서 중 총시간이 가장 짧은 순서를 추천합니다.</div>

      <div class="result" id="result">
        <div class="resultHeader"><h2>추천 순서</h2><div class="summary" id="resultSummary"></div></div>
        <div class="routeList" id="routeList"></div>

        <div class="actions"><button class="secondary" id="copyResult">결과 복사</button></div>
      </div>
    </div>
  </aside>
</main>

<script>
const $=id=>document.getElementById(id);
const startInput=$('start'), visitsInput=$('visits'), endInput=$('end'), returnChk=$('returnToStart');
const statusEl=$('status'), totalTimeEl=$('totalTime'), resultEl=$('result');
const mapWrap=$('mapWrap'), mapGuide=$('mapGuide');
let naverMap=null, markers=[], polylines=[], latestResult=null;

function esc(v){return String(v||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function normalizeAddress(v){return String(v||'').trim().replace(/\s+/g,' ')}
function uniqueLines(text){const seen=new Set(), out=[];String(text||'').replace(/\r/g,'\n').split(/[\n,]+/).map(normalizeAddress).filter(Boolean).forEach(a=>{const key=a.toLowerCase();if(!seen.has(key)){seen.add(key);out.push(a)}});return out}
function formatVisitsInput(addComma=false){const items=uniqueLines(visitsInput.value);visitsInput.value=items.length?items.join(', ')+(addComma?', ':''):''}
function showStatus(msg,type=''){statusEl.className='status show'+(type?' '+type:'');statusEl.innerHTML=esc(msg)}
function showProgress(msg,done,total){const pct=total?Math.round(done/total*100):0;statusEl.className='status show';statusEl.innerHTML=`${esc(msg)}<div class="progress"><span style="width:${pct}%"></span></div>`}
function formatDuration(ms){const minutes=Math.max(0,Math.round(Number(ms||0)/60000));const h=Math.floor(minutes/60),m=minutes%60;return h?(m?`${h}시간 ${m}분`:`${h}시간`):`${m}분`}
function formatDistance(m){const n=Number(m||0);return n>=1000?`${(n/1000).toFixed(n>=10000?0:1)}km`:`${Math.round(n)}m`}
function coordKey(a,b){return `${a.id}->${b.id}`}
function hasCoord(p){return p&&Number.isFinite(Number(p.lat))&&Number.isFinite(Number(p.lng))}
function getNaverMaps(){return window.naver&&window.naver.maps?window.naver.maps:null}
function setBusy(b){$('findRoute').disabled=b;startInput.disabled=b;visitsInput.disabled=b;endInput.disabled=b||returnChk.checked;returnChk.disabled=b;if($('currentStart'))$('currentStart').disabled=b}
function resetResult(){latestResult=null;totalTimeEl.textContent='--';resultEl.classList.remove('show');clearMap();mapGuide.classList.remove('hide')}

function parseInputs(){
  const start=normalizeAddress(startInput.value);
  const visits=uniqueLines(visitsInput.value);
  const returnToStart=returnChk.checked;
  const end=returnToStart?start:normalizeAddress(endInput.value);
  if(!start)throw new Error('출발지를 입력하세요.');
  if(!visits.length)throw new Error('경유지 주소를 입력하세요.');
  if(visits.length>8)throw new Error('경유지는 최대 8개까지 계산합니다.');
  if(!returnToStart&&!end)throw new Error('도착지를 입력하거나 출발지로 복귀를 체크하세요.');
  const all=[start,...visits,end];
  const normalized=new Set();
  for(const a of all){const key=a.toLowerCase();if(normalized.has(key))continue;normalized.add(key)}
  return {start,visits,end,returnToStart};
}

async function geocodeAddress(address,label,index,total){
  showProgress(`주소 좌표 변환 중 ${index}/${total} · ${label}`,index-1,total);
  const res=await fetch('/api/route-setting/geocode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:address})});
  const data=await res.json().catch(()=>null);
  if(!res.ok||!data||!data.ok||!data.item)throw new Error(`${label} 주소를 찾지 못했습니다: ${address}`);
  return {...data.item,address:data.item.address||address,originalAddress:address,label};
}

async function directionBetween(a,b){
  const res=await fetch('/api/route-setting/directions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({start:{lat:a.lat,lng:a.lng},goal:{lat:b.lat,lng:b.lng}})});
  const data=await res.json().catch(()=>null);
  if(!res.ok||!data||!data.ok||!data.summary)throw new Error(`${a.label} → ${b.label} 구간 경로를 확인하지 못했습니다.`);
  return data;
}

async function mapLimit(items,limit,worker,onProgress){
  const results=new Array(items.length);let next=0,done=0;
  async function run(){while(next<items.length){const i=next++;results[i]=await worker(items[i],i);done++;if(onProgress)onProgress(done,items.length,items[i],i)}}
  await Promise.all(Array.from({length:Math.min(limit,items.length)},run));
  return results;
}

function permutations(arr){
  const res=[];const used=new Array(arr.length).fill(false);const cur=[];
  function backtrack(){if(cur.length===arr.length){res.push(cur.slice());return}for(let i=0;i<arr.length;i++){if(used[i])continue;used[i]=true;cur.push(arr[i]);backtrack();cur.pop();used[i]=false}}
  backtrack();return res;
}

function evaluateBest(start,visits,end,matrix){
  let best=null;const orders=permutations(visits);
  for(const order of orders){
    const route=[start,...order,end];let durationMs=0,distanceM=0,segments=[],ok=true;
    for(let i=0;i<route.length-1;i++){
      const from=route[i],to=route[i+1];const d=matrix.get(coordKey(from,to));
      if(!d){ok=false;break}
      durationMs+=Number(d.summary.durationMs||0);distanceM+=Number(d.summary.distanceM||0);
      segments.push({from,to,summary:d.summary,path:d.path||[]});
    }
    if(!ok)continue;
    if(!best||durationMs<best.durationMs)best={route,durationMs,distanceM,segments,orderCount:orders.length};
  }
  if(!best)throw new Error('추천 순서를 계산하지 못했습니다.');
  return best;
}

function makeRouteLabel(point,idx,total,returnToStart){
  if(idx===0)return {label:'A',type:'start',text:`출발지: ${point.address}`};
  if(idx===total-1)return {label:returnToStart?'A':'Z',type:returnToStart?'start':'end',text:returnToStart?'출발지 복귀':`도착지: ${point.address}`};
  return {label:String(idx),type:'stop',text:point.address};
}

function routeTextHtml(meta){
  if(meta.type==='start'&&meta.text.startsWith('출발지: '))return `<span class="muted">출발지:</span> ${esc(meta.text.replace('출발지: ',''))}`;
  if(meta.type==='end'&&meta.text.startsWith('도착지: '))return `<span class="muted">도착지:</span> ${esc(meta.text.replace('도착지: ',''))}`;
  return esc(meta.text);
}

function renderResult(best,returnToStart){
  latestResult={...best,returnToStart};
  totalTimeEl.textContent=formatDuration(best.durationMs);
  $('resultSummary').textContent=`${best.route.length}개 지점 · ${best.orderCount.toLocaleString('ko-KR')}개 순서 비교`;
  $('routeList').innerHTML=best.route.map((p,i)=>{
    const meta=makeRouteLabel(p,i,best.route.length,returnToStart);
    const seg=best.segments[i];
    const badgeClass=meta.type==='start'?'a':meta.type==='end'?'z':'';
    const segmentHtml=seg?`<div class="segmentBetween"><div class="segmentBlank"></div><div class="segmentRight"><span class="segmentBracket" aria-hidden="true"></span><div class="segmentText">${esc(seg.summary.durationText)} · ${esc(seg.summary.distanceText)}</div><button class="segOpen" type="button" data-seg="${i}" title="이 구간 네이버 경로 조회" aria-label="${esc(seg.from.address)}에서 ${esc(seg.to.address)} 구간 네이버 경로 조회">🚗</button></div></div>`:'';
    return `<div class="routeItem"><div class="routeMain"><strong class="routeBadge ${badgeClass}">${esc(meta.label)}</strong><div class="routeText">${routeTextHtml(meta)}</div></div>${segmentHtml}</div>`;
  }).join('');
  $('routeList').querySelectorAll('.segOpen').forEach(btn=>{btn.onclick=()=>openSegmentNaver(Number(btn.dataset.seg))});
  resultEl.classList.add('show');
  renderMapResult(best,returnToStart);
}

function makeIcon(label,type){const maps=getNaverMaps();const color=type==='start'?'#03c75a':type==='stop'?'#2563eb':'#111827';return {content:`<div style="width:36px;height:36px;border-radius:999px 999px 999px 0;transform:rotate(-45deg);background:${color};border:3px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.22);display:grid;place-items:center"><span style="transform:rotate(45deg);color:#fff;font-weight:950;font-size:12px">${esc(label)}</span></div>`,anchor:maps?new maps.Point(18,36):undefined}}
function clearMap(){markers.forEach(m=>m.setMap(null));polylines.forEach(l=>l.setMap(null));markers=[];polylines=[]}
function refreshMap(){const maps=getNaverMaps();if(!maps||!naverMap)return;setTimeout(()=>{try{maps.Event.trigger(naverMap,'resize')}catch(e){}},60);setTimeout(()=>{try{maps.Event.trigger(naverMap,'resize')}catch(e){}},260)}
function renderMapResult(best,returnToStart){
  const maps=getNaverMaps();if(!maps||!naverMap)return;clearMap();mapGuide.classList.add('hide');
  const bounds=new maps.LatLngBounds();
  best.route.forEach((p,i)=>{if(returnToStart&&i===best.route.length-1)return;const meta=makeRouteLabel(p,i,best.route.length,returnToStart);const pos=new maps.LatLng(p.lat,p.lng);bounds.extend(pos);markers.push(new maps.Marker({position:pos,map:naverMap,title:`${meta.label}. ${p.address}`,icon:makeIcon(meta.label,meta.type)}))});
  best.segments.forEach(seg=>{const path=(seg.path&&seg.path.length?seg.path:[seg.from,seg.to]).filter(hasCoord);if(path.length){polylines.push(new maps.Polyline({map:naverMap,path:path.map(x=>new maps.LatLng(x.lat,x.lng)),strokeColor:'#0f172a',strokeWeight:4,strokeOpacity:.58,strokeStyle:'solid'}))}});
  try{if(best.route.length>1)naverMap.fitBounds(bounds,{top:70,right:70,bottom:70,left:70});else naverMap.setCenter(new maps.LatLng(best.route[0].lat,best.route[0].lng));}catch(e){}
  refreshMap();
}

function pointForNaver(p,name){return `${p.lng},${p.lat},${encodeURIComponent(name||p.address)},,ADDRESS_POI`}
function buildNaverDirectionsUrl(){
  if(!latestResult)return '#';
  const r=latestResult.route;const returnToStart=latestResult.returnToStart;const start=r[0];const goal=r[r.length-1];
  const waypointPoints=r.slice(1,-1).map((p,i)=>pointForNaver(p,String(i+1))).join(':')||'-';
  const goalName=returnToStart?'출발지 복귀':'도착지';
  return `https://map.naver.com/p/directions/${pointForNaver(start,'출발지')}/${pointForNaver(goal,goalName)}/${waypointPoints}/car`;
}
function buildSegmentDirectionsUrl(segment,idx){
  if(!segment)return '#';
  const fromName=segment.from.address||segment.from.resolvedAddress||'출발지';
  const toName=segment.to.address||segment.to.resolvedAddress||'도착지';
  return `https://map.naver.com/p/directions/${pointForNaver(segment.from,fromName)}/${pointForNaver(segment.to,toName)}/-/car`;
}
function openSegmentNaver(idx){
  if(!latestResult||!latestResult.segments||!latestResult.segments[idx])return;
  const url=buildSegmentDirectionsUrl(latestResult.segments[idx],idx);
  if(url&&url!=='#')window.open(url,'_blank','noopener,noreferrer');
}
function resultText(){
  if(!latestResult)return '';
  const r=latestResult;const lines=[];lines.push('최단 경로 결과','');lines.push(`총 예상 운행시간: ${formatDuration(r.durationMs)}`);lines.push(`총 예상 거리: ${formatDistance(r.distanceM)}`,'');lines.push('추천 순서');
  r.route.forEach((p,i)=>{const meta=makeRouteLabel(p,i,r.route.length,r.returnToStart);lines.push(`${meta.label}. ${meta.text}`)});lines.push('','구간별 시간');
  r.segments.forEach((s,i)=>{const from=makeRouteLabel(s.from,i,r.route.length,r.returnToStart).label;const to=makeRouteLabel(s.to,i+1,r.route.length,r.returnToStart).label;lines.push(`${from} → ${to}: ${s.summary.durationText} · ${s.summary.distanceText}`)});
  return lines.join('\n');
}

async function findRoute(){
  try{
    resetResult();setBusy(true);
    const input=parseInputs();
    const labels=['A',...input.visits.map((_,i)=>String.fromCharCode(66+i)),input.returnToStart?'A':'Z'];
    const raw=[input.start,...input.visits,input.end];
    const totalGeo=raw.length;const resolved=[];
    for(let i=0;i<raw.length;i++)resolved.push(await geocodeAddress(raw[i],labels[i],i+1,totalGeo));
    const start={id:'A',role:'start',...resolved[0]};
    const visits=resolved.slice(1,1+input.visits.length).map((p,i)=>({id:`V${i+1}`,role:'visit',...p}));
    const end=input.returnToStart?start:{id:'Z',role:'end',...resolved[resolved.length-1]};
    const nodes=input.returnToStart?[start,...visits]:[start,...visits,end];
    const pairs=[];
    for(const a of nodes){for(const b of nodes){if(a.id!==b.id)pairs.push([a,b])}}
    const matrix=new Map();
    await mapLimit(pairs,4,async(pair)=>{const [a,b]=pair;const data=await directionBetween(a,b);matrix.set(coordKey(a,b),data);return data},(done,total,pair)=>{showProgress(`구간 시간 조회 중 ${done}/${total} · ${pair[0].label||pair[0].id} → ${pair[1].label||pair[1].id}`,done,total)});
    showStatus('추천 순서 계산 중...');
    const best=evaluateBest(start,visits,end,matrix);
    showStatus(`${best.orderCount.toLocaleString('ko-KR')}개 경로 검토 후 최적 경로 도출 완료`,'ok');
    renderResult(best,input.returnToStart);
  }catch(e){showStatus(e.message||'최단경로 계산 중 오류가 발생했습니다.','err')}finally{setBusy(false);endInput.disabled=returnChk.checked}
}

function waitForNaverMaps(retry=0){const maps=getNaverMaps();const el=$('naverMap');if(maps&&el&&el.clientWidth>0&&el.clientHeight>0){naverMap=new maps.Map(el,{center:new maps.LatLng(35.9676,126.7367),zoom:11});$('mapStatus').textContent='네이버 지도 연결됨';refreshMap();return}if(retry<35){setTimeout(()=>waitForNaverMaps(retry+1),120);return}$('mapStatus').textContent='지도 연결 실패';showStatus('네이버 지도 객체 또는 지도 영역 크기를 확인하지 못했습니다.','err')}
async function initNaverMap(){try{const cfg=await fetch('/api/route-setting/config').then(r=>r.json());if(!cfg.ok||!cfg.clientId)throw new Error(cfg.message||'지도 Client ID가 없습니다.');const script=document.createElement('script');script.src=`https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${encodeURIComponent(cfg.clientId)}`;script.async=true;script.onload=()=>waitForNaverMaps();script.onerror=()=>{$('mapStatus').textContent='지도 연결 실패';showStatus('네이버 지도 스크립트 로딩 실패','err')};document.head.appendChild(script)}catch(e){$('mapStatus').textContent='지도 연결 대기';showStatus(e.message,'err')}}


function getCurrentPositionOnce(){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation){
      reject(new Error('이 브라우저에서는 현재 위치 기능을 사용할 수 없습니다.'));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos=>resolve(pos),
      err=>{
        if(err&&err.code===1)reject(new Error('위치 권한이 차단되어 있습니다. 브라우저 위치 권한을 허용해 주세요.'));
        else if(err&&err.code===2)reject(new Error('현재 위치를 확인하지 못했습니다. GPS 또는 위치 서비스를 확인해 주세요.'));
        else if(err&&err.code===3)reject(new Error('현재 위치 확인 시간이 초과되었습니다. 다시 시도해 주세요.'));
        else reject(new Error('현재 위치를 가져오지 못했습니다.'));
      },
      {enableHighAccuracy:true,timeout:10000,maximumAge:30000}
    );
  });
}

async function reverseGeocode(lat,lng){
  const res=await fetch('/api/route-setting/reverse-geocode',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({lat,lng})
  });
  const data=await res.json().catch(()=>null);
  if(!res.ok||!data||!data.ok||!data.item){
    throw new Error((data&&data.message)||'현재 위치 주소 변환에 실패했습니다.');
  }
  return data.item;
}

async function setCurrentLocationAsStart(){
  const btn=$('currentStart');
  try{
    if(btn)btn.disabled=true;
    showStatus('현재 위치 확인 중...');
    const pos=await getCurrentPositionOnce();
    const lat=pos.coords.latitude;
    const lng=pos.coords.longitude;
    showStatus('현재 위치를 주소로 변환 중...');
    const item=await reverseGeocode(lat,lng);
    startInput.value=item.address||`현재위치: ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
    resetResult();
    showStatus('현재 위치를 출발지에 입력했습니다.','ok');
    const maps=getNaverMaps();
    if(maps&&naverMap){
      naverMap.setCenter(new maps.LatLng(lat,lng));
      naverMap.setZoom(Math.max(naverMap.getZoom ? naverMap.getZoom() : 14,14));
      refreshMap();
    }
  }catch(e){
    showStatus(e.message||'현재 위치를 가져오지 못했습니다.','err');
  }finally{
    if(btn)btn.disabled=false;
  }
}


returnChk.onchange=()=>{endInput.disabled=returnChk.checked;if(returnChk.checked)endInput.value='';resetResult()};
[startInput,endInput].forEach(el=>el.addEventListener('input',resetResult));
function normalizeVisitSeparators(value){
  return String(value||'')
    .replace(/\r/g,'\n')
    .replace(/\n+/g,', ')
    .replace(/,\s*,+/g,', ')
    .replace(/\s+,/g,',')
    .replace(/,\s*/g,', ');
}

function addCommaBlankAfterPaste(){
  let value=normalizeVisitSeparators(visitsInput.value).trim();
  if(!value){
    visitsInput.value='';
    return;
  }
  value=value.replace(/,+\s*$/,'');
  visitsInput.value=value+', ';
  visitsInput.selectionStart=visitsInput.selectionEnd=visitsInput.value.length;
}

let visitPasteTimer=null;

function schedulePasteComma(){
  clearTimeout(visitPasteTimer);
  visitPasteTimer=setTimeout(()=>{
    addCommaBlankAfterPaste();
    resetResult();
  },120);
}

visitsInput.addEventListener('input',e=>{
  // 일반 타이핑/수정 중에는 콤마를 절대 강제로 붙이지 않는다.
  if(e.inputType==='insertFromPaste'){
    schedulePasteComma();
    return;
  }

  const before=visitsInput.value;
  const after=before.replace(/\r/g,'\n').replace(/\n+/g,', ');
  if(after!==before){
    visitsInput.value=after;
    visitsInput.selectionStart=visitsInput.selectionEnd=visitsInput.value.length;
  }
  resetResult();
});

visitsInput.addEventListener('paste',e=>{
  const pasted=(e.clipboardData||window.clipboardData)?.getData('text')||'';

  // clipboardData가 잡히는 PC/안드로이드/크롬 계열: 직접 넣고 즉시 콤마 추가.
  if(pasted){
    e.preventDefault();
    const s=visitsInput.selectionStart||0;
    const t=visitsInput.selectionEnd||s;
    visitsInput.value=visitsInput.value.slice(0,s)+pasted+visitsInput.value.slice(t);
    addCommaBlankAfterPaste();
    visitsInput.focus();
    resetResult();
    return;
  }

  // clipboardData가 안 잡히는 모바일: 기본 붙여넣기를 허용하고, 직후 콤마만 붙인다.
  schedulePasteComma();
});

visitsInput.addEventListener('blur',resetResult);

$('findRoute').onclick=findRoute;
$('officeStart').onclick=()=>{startInput.value='전북 군산시 나운동 805-1';resetResult();startInput.focus()};
$('currentStart').onclick=setCurrentLocationAsStart;

$('copyResult').onclick=async()=>{if(!latestResult)return;await navigator.clipboard.writeText(resultText());showStatus('추천 결과를 복사했습니다.','ok')};
window.addEventListener('resize',refreshMap);
initNaverMap();
</script>
