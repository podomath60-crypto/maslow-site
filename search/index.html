<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet" />
  <meta name="theme-color" content="#eef5ff" />
  <title>매물주소추적기 | 네이버부동산</title>
  <style>
    *{box-sizing:border-box}
    :root{--bg:#eef5ff;--card:#fff;--line:#dbeafe;--text:#111827;--muted:#6b7280;--blue:#2563eb;--blue2:#60a5fa;--green:#03c75a;--red:#dc2626;--shadow:0 18px 44px rgba(37,99,235,.1)}
    body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    button,input,select{font:inherit}
    button{cursor:pointer}
    .page{min-height:100vh}
    .main{padding:34px 20px 64px}
    .wrap{width:100%;max-width:900px;min-width:0;margin:0 auto;box-sizing:border-box}
    .hero{position:relative;margin-bottom:22px;text-align:center}
    .favorite-view-btn{
      position:absolute;
      left:44px;
      top:-12px;
      min-width:92px;
      height:66px;
      border:2px solid rgba(255,126,171,.42);
      background:rgba(255,179,205,.26);
      color:rgba(219,39,119,.42);
      border-radius:999px;
      font-size:26px;
      font-weight:950;
      letter-spacing:-.04em;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      box-shadow:none;
      opacity:.72;
      transition:background .15s ease,color .15s ease,border-color .15s ease,box-shadow .15s ease,opacity .15s ease,transform .15s ease;
    }
    .favorite-view-btn::after{
      content:'';
      position:absolute;
      right:15px;
      bottom:-9px;
      width:22px;
      height:22px;
      background:inherit;
      border-right:2px solid rgba(255,126,171,.42);
      border-bottom:2px solid rgba(255,126,171,.42);
      transform:rotate(24deg);
      border-bottom-right-radius:4px;
    }
    .favorite-view-btn span{position:relative;z-index:1}
    .favorite-view-btn:hover{opacity:.92}
    .favorite-view-btn.active{
      background:#ff8fbc;
      border-color:#ff8fbc;
      color:#fff;
      opacity:1;
      box-shadow:0 12px 28px rgba(255,105,180,.22);
      transform:translateY(-1px);
    }
    .favorite-view-btn.active::after{
      background:#ff8fbc;
      border-color:#ff8fbc;
    }
    .brand{font-size:13px;font-weight:950;letter-spacing:.12em;color:var(--blue);margin-bottom:8px}
    h1{margin:0;font-size:46px;letter-spacing:-.06em;line-height:1.03}
    .desc{margin:10px auto 0;color:#4b5563;font-size:15px;line-height:1.55;max-width:620px;word-break:keep-all}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow)}
    .section-title{font-size:14px;font-weight:950;color:#111827;margin:0 0 9px}
    .form-grid{display:grid;gap:16px}
    .dong-btn{width:100%;min-height:64px;border:1px solid #d1d5db;background:#fff;border-radius:16px;text-align:left;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .dong-btn strong{font-size:18px;font-weight:950;color:#111827;line-height:1.35;word-break:keep-all}
    .dong-btn span{font-size:13px;color:#6b7280;white-space:nowrap}
    .dong-placeholder{color:#9ca3af!important;font-weight:900!important}
    .dong-btn:focus,.input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.11);outline:none}
    .dong-trade-row{display:grid;grid-template-columns:2fr 1fr;gap:12px;align-items:end}
    .trade-pick-box{min-height:64px;border:1px solid #d1d5db;background:#fff;border-radius:16px;padding:8px 10px;display:grid;gap:6px;align-content:center}
    .trade-pick-title{font-size:12px;font-weight:950;color:#6b7280;line-height:1}
    .trade-checks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
    .trade-check{height:30px;border:1px solid #d1d5db;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:950;color:#374151;cursor:pointer;user-select:none}
    .trade-check input{width:13px;height:13px;margin:0;accent-color:var(--blue)}
    .trade-check.active{border-color:var(--blue);background:#eff6ff;color:#1d4ed8}
    .choice-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
    .choice{min-height:46px;border:1px solid #d1d5db;background:#fff;border-radius:14px;font-weight:950;color:#374151}
    .choice.active{border-color:var(--blue);background:#eff6ff;color:#1d4ed8;box-shadow:0 8px 18px rgba(37,99,235,.12)}
    .trade-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .input-row{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px}
    .input{height:52px;border:1px solid #d1d5db;background:#fff;border-radius:15px;padding:0 14px;outline:none;color:#111827}
    .run-btn{height:54px;border:0;border-radius:16px;background:var(--blue);color:#fff;font-weight:950;box-shadow:0 10px 22px rgba(37,99,235,.24)}
    .run-btn:disabled{opacity:.55;cursor:not-allowed}
    .single-article-box{border:1px solid #e5e7eb;background:#ffffff;border-radius:14px;padding:10px;margin:0 0 14px;display:grid;gap:7px}
    .single-article-title{font-size:12px;font-weight:950;color:#111827;line-height:1}
    .single-article-row{display:grid;grid-template-columns:minmax(0,1fr) 58px;gap:6px}
    .single-article-input{height:34px;border:1px solid #d1d5db;background:#fff;border-radius:10px;padding:0 9px;outline:none;color:#111827;font-size:12px;font-weight:900;letter-spacing:.01em}
    .single-article-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
    .single-article-btn{height:34px;border:0;border-radius:10px;background:#111827;color:#fff;font-size:12px;font-weight:950;box-shadow:0 6px 12px rgba(17,24,39,.12)}
    .single-article-btn:disabled{opacity:.55;cursor:not-allowed}
        .sub-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:12px}
    .small-actions{display:flex;gap:8px;flex-wrap:wrap}
    .result-filter{display:none;margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 10px 28px rgba(37,99,235,.06);grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
    .result-filter.show{display:grid}
    .filter-field{display:grid;gap:6px}
    .filter-field label{font-size:12px;font-weight:950;color:#374151}
    .filter-select{height:40px;border:1px solid #d1d5db;border-radius:12px;background:#fff;padding:0 10px;font-weight:900;color:#111827;outline:none}
    .filter-select:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.11)}
    .ghost-btn{height:40px;padding:0 12px;border-radius:12px;border:1px solid #d1d5db;background:#fff;color:#111827;font-weight:900;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
    details.settings{margin-top:12px;border:1px solid #e5e7eb;border-radius:16px;background:#f8fafc;padding:0 14px}
    details.settings summary{height:44px;display:flex;align-items:center;font-weight:950;color:#374151;cursor:pointer}
    .settings-body{display:grid;gap:10px;padding:0 0 14px}
    .hint{font-size:13px;color:var(--muted);line-height:1.45;word-break:keep-all}
    .status{min-height:22px;font-size:14px;font-weight:950;color:#374151;margin:14px 2px}
    .status.err{color:var(--red)}
    .status.ok{color:#0f766e}
    .progress{display:none;margin:12px 0;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 10px 28px rgba(37,99,235,.08)}
    .progress.show{display:block}
    .progress-top{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:950;color:#374151;margin-bottom:10px}
    .bar{height:12px;border-radius:999px;background:#e0ecff;overflow:hidden;border:1px solid #bfdbfe}
    .bar-fill{height:100%;width:0;background:linear-gradient(90deg,var(--blue2),var(--blue));transition:width .25s ease}
    .summary{display:none;margin:12px 0;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
    .summary.show{display:grid}
    .summary-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;box-shadow:0 10px 28px rgba(37,99,235,.06)}
    .summary-label{font-size:12px;font-weight:900;color:#6b7280;margin-bottom:6px}
    .summary-value{font-size:20px;font-weight:950;color:#111827}
    .table-wrap{display:none;margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:auto;box-shadow:0 10px 28px rgba(37,99,235,.08)}
    .table-wrap.show{display:block}
    table{width:100%;min-width:820px;border-collapse:collapse;font-size:14px}
    th,td{padding:12px 10px;border-bottom:1px solid #edf2ff;text-align:left;vertical-align:middle}
    th{background:#f8fbff;color:#374151;font-size:12px;font-weight:950;white-space:nowrap}
    td{color:#111827}
    tr:last-child td{border-bottom:0}
    .addr{font-weight:950;line-height:1.45;word-break:keep-all}
    .muted{color:#6b7280;font-size:12px;font-weight:800}
    .badge{display:inline-flex;align-items:center;justify-content:center;min-height:28px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:950;white-space:nowrap;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
    .badge.gray{background:#f3f4f6;color:#374151;border-color:#e5e7eb}
    .badge.green{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
    tr.favorite-row td{background:#fff1f7 !important}
    tr.favorite-row td:first-child{box-shadow:inset 4px 0 0 #ec4899}
    .result-favorite-chip{position:relative;cursor:pointer;user-select:none;transition:transform .15s ease,background .15s ease,border-color .15s ease,color .15s ease;overflow:visible}
    .result-favorite-chip:hover{transform:translateY(-1px);box-shadow:0 7px 16px rgba(236,72,153,.14)}
    .result-favorite-chip.is-favorite{background:#fce7f3;color:#be185d;border-color:#f9a8d4;border-radius:8px}
    .result-favorite-chip.is-favorite.just-favorited{animation:favoriteChipPop .42s ease-out}
    .result-favorite-chip.is-favorite.just-favorited::after{content:'♥';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:24px;color:#ec4899;pointer-events:none;animation:favoriteHeartBurst .58s ease-out forwards}
    @keyframes favoriteChipPop{0%{transform:scale(.88)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
    @keyframes favoriteHeartBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(.35)}35%{opacity:1;transform:translate(-50%,-130%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-230%) scale(.72)}}
    .link-btn{height:34px;padding:0 10px;border-radius:10px;border:1px solid #d1d5db;background:#fff;color:#111827;font-weight:900;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
    .article-no-btn{border:0;background:transparent;color:#1d4ed8;font-size:13px;font-weight:950;text-decoration:underline;text-underline-offset:3px;padding:4px 0;cursor:pointer}
    .article-no-btn:hover{color:#1e40af}
    .map-head{width:32px;min-width:32px;padding-left:0;padding-right:0}
    .map-cell{width:32px;min-width:32px;text-align:center;vertical-align:middle;padding-left:0;padding-right:0}
    .naver-map-btn{width:18px;height:18px;border:0;border-radius:4px;background:#0b7cff;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(37,99,235,.13);cursor:pointer;line-height:1;padding:0;vertical-align:middle;transform:translateX(-18px)}
    .naver-map-btn svg{width:12px;height:12px;display:block}
    .naver-map-btn:hover{background:#075fd1}
    .naver-map-btn:focus{outline:none;box-shadow:0 0 0 3px rgba(37,99,235,.16)}


    .desktop-layout{max-width:1452px;margin:0 auto;display:grid;grid-template-columns:240px 900px 280px;gap:16px;align-items:start}
    .desktop-layout > .wrap{width:900px;max-width:900px;min-width:0;justify-self:center}
    .panel,.progress,.summary,.result-filter,.result-actions,.table-wrap,.empty,.sub-actions{width:100%;min-width:0;box-sizing:border-box}

    .local-result-transfer-panel{display:flex;gap:20px;margin:0 0 38px}
    .usb-transfer-btn{width:130px;height:130px;border:4px solid #b8bcc3;border-radius:18px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;padding:0;color:#374151;box-shadow:0 10px 24px rgba(37,99,235,.04);transition:background .18s ease,transform .18s ease,border-color .18s ease,box-shadow .18s ease}
    .usb-transfer-btn:hover{background:rgba(255,255,255,.46);border-color:#aeb4bd;transform:translateY(-1px);box-shadow:0 14px 28px rgba(37,99,235,.08)}
    .usb-transfer-btn:focus{outline:none;box-shadow:0 0 0 4px rgba(37,99,235,.13)}
    .usb-transfer-btn svg{width:78px;height:78px;display:block}
    .usb-transfer-btn.export .usb-arrow{color:#2563eb}
    .usb-transfer-btn.import .usb-arrow{color:#16a34a}
    .side-panel{position:sticky;top:18px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 36px);overflow:auto}
    .side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
    .side-title{font-size:15px;font-weight:950;color:#111827}
    .side-count{font-size:12px;font-weight:950;color:#6b7280;background:#f3f4f6;border:1px solid #e5e7eb;border-radius:999px;padding:4px 8px;white-space:nowrap}
    .side-list{display:grid;gap:8px}
    .side-empty{border:1px dashed #bfdbfe;border-radius:14px;background:#f8fbff;padding:14px 10px;color:#6b7280;text-align:center;font-size:12px;font-weight:850;line-height:1.45;word-break:keep-all}
    .side-item{border:1px solid #e5e7eb;border-radius:15px;background:#fff;padding:10px;display:grid;gap:7px}
    .side-item.active{border-color:#93c5fd;background:#eff6ff}

    .side-item.has-favorite-listing{
      position:relative;
      overflow:hidden;
      border-color:#ff1493;
      background:linear-gradient(180deg,#fff1f8 0%,#fff7fb 100%);
      box-shadow:
        0 0 0 1px rgba(255,20,147,.18),
        0 8px 22px rgba(255,20,147,.14),
        0 0 18px rgba(255,20,147,.16);
    }
    .side-item.has-favorite-listing.active{
      border-color:#ff1493;
      background:linear-gradient(180deg,#ffe8f4 0%,#fff3fa 100%);
      box-shadow:
        0 0 0 1px rgba(255,20,147,.24),
        0 10px 24px rgba(255,20,147,.18),
        0 0 20px rgba(255,20,147,.18);
    }
    .side-item.has-favorite-listing > *{
      position:relative;
      z-index:1;
    }

    .side-item.has-favorite-listing .side-item-top,
    .side-item.has-favorite-listing .side-meta{position:relative;}
    .side-item.has-favorite-listing .side-item-top::after,
    .side-item.has-favorite-listing .side-meta::after{
      content:'♥';
      position:absolute;
      right:10px;
      color:rgba(255, 105, 180, .55);
      font-size:14px;
      font-weight:900;
      line-height:1;
      pointer-events:none;
      animation:favoriteBubbleUp 2.8s ease-in-out infinite;
      text-shadow:0 2px 8px rgba(255,20,147,.18);
      z-index:1;
    }
    .side-item.has-favorite-listing .side-item-top::after{
      top:6px;
    }
    .side-item.has-favorite-listing .side-meta::after{
      right:34px;
      bottom:-1px;
      font-size:10px;
      animation-delay:1.15s;
    }
    @keyframes favoriteBubbleUp{
      0%{transform:translateY(10px) scale(.7);opacity:0}
      18%{opacity:.8}
      68%{opacity:.42}
      100%{transform:translateY(-34px) scale(1.06);opacity:0}
    }

    .side-item.is-in-center{
      position:relative;
      overflow:visible;
      box-shadow:
        0 0 0 1px rgba(34,197,94,.16);
    }
    .side-item.is-in-center::before{
      content:'';
      position:absolute;
      left:-16px;
      top:0;
      bottom:0;
      width:12px;
      background:#39e600;
      border-radius:0;
      pointer-events:none;
      z-index:2;
    }
    .side-item.is-in-center::after{
      content:'';
      position:absolute;
      left:-54px;
      top:50%;
      width:34px;
      height:34px;
      background:#39e600;
      transform:translateY(-50%);
      clip-path:polygon(0 50%, 46% 0, 46% 28%, 100% 28%, 100% 72%, 46% 72%, 46% 100%);
      pointer-events:none;
      z-index:2;
    }
    .side-item.has-favorite-listing.is-in-center{
      border-color:#ff1493;
      background:linear-gradient(180deg,#ffe8f4 0%,#fff3fa 100%);
      box-shadow:
        0 0 0 1px rgba(255,20,147,.24),
        0 10px 24px rgba(255,20,147,.18),
        0 0 20px rgba(255,20,147,.18);
    }
    .side-item.is-dragging{
      opacity:.72;
      transform:scale(.99);
    }
    .table-wrap.is-drop-target,
    .empty.is-drop-target{
      border-color:#39e600;
      box-shadow:0 0 0 3px rgba(57,230,0,.16);
    }
    .side-item-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
    .side-item-main{border:0;background:transparent;text-align:left;padding:0;min-width:0;color:#111827;font-weight:950;line-height:1.35;word-break:keep-all}
    .side-item-main:hover{text-decoration:underline;text-underline-offset:3px}
    .side-meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;color:#6b7280;font-size:11px;font-weight:850}
    .history-trade-chip{display:inline-flex;align-items:center;justify-content:center;min-height:23px;padding:0 7px;border-radius:4px;border:1px solid #cbd5e1;background:#f8fafc;color:#334155;font-size:11px;font-weight:950;line-height:1.2;white-space:nowrap}
    .history-trade-chip.is-sale{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
    .history-trade-chip.is-rent{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
    .history-trade-chip.is-both{background:#fffbeb;color:#92400e;border-color:#fde68a}
    .delete-mini{width:28px;height:28px;border:1px solid #fecaca;background:#fff5f5;color:#dc2626;border-radius:10px;font-weight:950;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
    .delete-mini:hover{background:#fee2e2}
    .history-refresh{height:34px;border-radius:11px;padding:0 9px;font-size:12px}
    .status-pill{display:inline-flex;align-items:center;justify-content:center;min-height:23px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:950;border:1px solid #e5e7eb;background:#f3f4f6;color:#374151}
    .status-pill.queued{background:#fff7ed;color:#c2410c;border-color:#fed7aa}
    .status-pill.running{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
    .status-pill.completed{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
    .status-pill.failed,.status-pill.not_found{background:#fef2f2;color:#dc2626;border-color:#fecaca}
    .favorite-toggle{width:64px;height:54px;border:1px solid #d1d5db;background:#fff;color:#9ca3af;border-radius:16px;font-weight:950;display:inline-flex;align-items:center;justify-content:center;padding:0;white-space:nowrap}
    .favorite-toggle.active{background:#fffbeb;border-color:#f59e0b;color:#f59e0b;box-shadow:0 8px 18px rgba(245,158,11,.14)}
    .favorite-toggle .star{font-size:28px;line-height:1;color:inherit}

    .naver-guide-box{width:min(440px,100%)}
    .guide-text{font-size:15px;line-height:1.55;color:#374151;word-break:keep-all}
    .guide-article-no{display:inline-flex;margin-top:10px;padding:8px 12px;border-radius:12px;background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8;font-weight:950;font-size:18px;letter-spacing:.02em}
    .primary-btn{border:0;background:var(--blue);color:#fff;border-radius:10px;height:40px;padding:0 14px;font-weight:950}
    .empty{border:1px dashed #bfdbfe;border-radius:18px;background:rgba(255,255,255,.82);padding:22px;color:#6b7280;text-align:center;font-weight:850;margin-top:12px;word-break:keep-all}
    .modal{display:none;position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:30;padding:18px;overflow:auto}
    .modal.show{display:flex;align-items:flex-start;justify-content:center}
    .modal-box{width:min(760px,100%);background:#fff;border-radius:20px;margin-top:24px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.22)}
    .modal-head{padding:16px;border-bottom:1px solid #e5e7eb;display:grid;gap:10px}
    .modal-title{font-size:18px;font-weight:950}
    .dong-search{height:54px;border:1px solid #d1d5db;border-radius:14px;padding:0 14px;font-size:18px;outline:none}
    .dong-search:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.11)}
    .quick-row{display:flex;gap:8px;flex-wrap:wrap}
    .quick{border:1px solid #d1d5db;background:#fff;border-radius:999px;height:34px;padding:0 11px;font-weight:900;color:#374151}

    };

    var TRACKER_API_BASE = 'https://tracker.sf-farm.store';
    var TRACKER_LIMIT = 100;
    var TRACKER_DURATION_SEC = 300;
    var TRACKER_PENDING_KEY = 'maslow_tracker_pending_v2';
    var TRACKER_RESULT_KEY = 'maslow_tracker_result_v2';
    var TRACKER_HISTORY_KEY = 'maslow_tracker_history_v1';
    var TRACKER_FAVORITES_KEY = 'maslow_tracker_favorites_v1';
    var TRACKER_FAVORITE_KEYS_KEY = 'maslow_tracker_favorite_keys_v1';
    var MAX_HISTORY_ITEMS = 100;
    var MAX_FAVORITE_ITEMS = 10;

    var TRACKER_DB_NAME = 'maslow_tracker_indexeddb_v1';
    var TRACKER_DB_VERSION = 1;
    var TRACKER_DB_RESULT_STORE = 'tracker_results';
    var TRACKER_DB_FAVORITE_STORE = 'favorite_keys';

    function openTrackerDb(){
      return new Promise(function(resolve, reject){
        if(!window.indexedDB){ reject(new Error('IndexedDB를 사용할 수 없습니다.')); return; }
        var req = indexedDB.open(TRACKER_DB_NAME, TRACKER_DB_VERSION);
        req.onupgradeneeded = function(){
          var db = req.result;
          if(!db.objectStoreNames.contains(TRACKER_DB_RESULT_STORE)){
            db.createObjectStore(TRACKER_DB_RESULT_STORE, { keyPath:'id' });
          }
          if(!db.objectStoreNames.contains(TRACKER_DB_FAVORITE_STORE)){
            db.createObjectStore(TRACKER_DB_FAVORITE_STORE, { keyPath:'key' });
          }
        };
        req.onsuccess = function(){ resolve(req.result); };
        req.onerror = function(){ reject(req.error || new Error('IndexedDB 열기 실패')); };
      });
    }
    function idbPut(storeName, value){
      return openTrackerDb().then(function(db){
        return new Promise(function(resolve, reject){
          var tx = db.transaction(storeName, 'readwrite');
          tx.objectStore(storeName).put(value);
          tx.oncomplete = function(){ resolve(value); };
          tx.onerror = function(){ reject(tx.error || new Error('IndexedDB 저장 실패')); };
        });
      });
    }
    function idbGet(storeName, key){
      return openTrackerDb().then(function(db){
        return new Promise(function(resolve, reject){
          var tx = db.transaction(storeName, 'readonly');
          var req = tx.objectStore(storeName).get(key);
          req.onsuccess = function(){ resolve(req.result || null); };
          req.onerror = function(){ reject(req.error || new Error('IndexedDB 읽기 실패')); };
        });
      });
    }
    function idbDelete(storeName, key){
      return openTrackerDb().then(function(db){
        return new Promise(function(resolve, reject){
          var tx = db.transaction(storeName, 'readwrite');
          tx.objectStore(storeName).delete(key);
          tx.oncomplete = function(){ resolve(true); };
          tx.onerror = function(){ reject(tx.error || new Error('IndexedDB 삭제 실패')); };
        });
      });
    }
    function idbGetAll(storeName){
      return openTrackerDb().then(function(db){
        return new Promise(function(resolve, reject){
          var tx = db.transaction(storeName, 'readonly');
          var req = tx.objectStore(storeName).getAll();
          req.onsuccess = function(){ resolve(Array.isArray(req.result) ? req.result : []); };
          req.onerror = function(){ reject(req.error || new Error('IndexedDB 전체 읽기 실패')); };
        });
      });
    }
    function resultIdFromHistoryItem(item, fallback){
      item = item || {};
      return String(item.resultId || item.jobId || fallback || item.id || localId()).trim();
    }
    function latestResultId(){
      try{ return localStorage.getItem(TRACKER_RESULT_KEY + '_id') || ''; }catch(e){ return ''; }
    }
    async function saveTrackerResultToDb(id, data, meta){
      id = String(id || '').trim();
      if(!id) id = localId();
      await idbPut(TRACKER_DB_RESULT_STORE, {
        id:id,
        data:data || {},
        meta:meta || {},
        savedAt:new Date().toISOString()
      });
      return id;
    }
    async function readTrackerResultFromDb(id){
      id = String(id || '').trim();
      if(!id) return null;
      var row = await idbGet(TRACKER_DB_RESULT_STORE, id);
      return row && row.data ? row.data : null;
    }
    function storeFavoriteKeyInDb(key, value){
      key = String(key || '').trim();
      if(!key) return;
      if(value){
        idbPut(TRACKER_DB_FAVORITE_STORE, { key:key, createdAt:new Date().toISOString(), source:'user' }).catch(function(){});
      }else{
        idbDelete(TRACKER_DB_FAVORITE_STORE, key).catch(function(){});
      }
    }
    async function readFavoriteKeyMapFromDb(){
      var map = {};
      try{
        var rows = await idbGetAll(TRACKER_DB_FAVORITE_STORE);
        rows.forEach(function(row){ if(row && row.key) map[row.key] = true; });
      }catch(e){}
      return map;
    }
    async function hydrateFavoriteKeysFromDb(){
      var fromDb = await readFavoriteKeyMapFromDb();
      var local = readFavoriteKeyMap();
      var changed = false;
      Object.keys(fromDb).forEach(function(key){
        if(!local[key]){ local[key] = true; changed = true; }
      });
      if(changed) writeFavoriteKeyMap(local);
      return local;
    }
    function itemArrayFromResultData(data){
      data = data && data.data && typeof data.data === 'object' ? data.data : data;
      if(!data || typeof data !== 'object') return [];
      var items = data.items || data.finalArticleRecords || data.records || [];
      return Array.isArray(items) ? items : [];
    }
    function listingKeysFromItems(items){
      var seen = {};
      var keys = [];
      (items || []).forEach(function(item){
        var key = getResultMergeKey(item);
        if(key && !seen[key]){ seen[key] = true; keys.push(key); }
      });
      return keys;
    }
    function favoriteKeysFromItems(items){
      var seen = {};
      var keys = [];
      (items || []).forEach(function(item){
        var key = getFavoriteKey(item);
        if(key && isResultFavorite(item) && !seen[key]){ seen[key] = true; keys.push(key); }
      });
      return keys;
    }
    function stripHeavyResultFromHistoryItem(item){
      if(!item || typeof item !== 'object') return item;
      if(item.result) item.result = null;
      return item;
    }
    function historyItemContainsFavorite(item){
      item = item || {};
      var favoriteMap = readFavoriteKeyMap();
      var keys = Array.isArray(item.listingKeys) ? item.listingKeys : [];
      if(keys.some(function(key){ return !!favoriteMap[key]; })) return true;
      var favKeys = Array.isArray(item.favoriteKeys) ? item.favoriteKeys : [];
      return favKeys.some(function(key){ return !!favoriteMap[key]; });
    }

    function localId(){ return 'local-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8); }
    function readLocalArray(key){ try{ var v = JSON.parse(localStorage.getItem(key) || '[]'); return Array.isArray(v) ? v : []; }catch(e){ return []; } }
    function writeLocalArray(key, arr){ try{ localStorage.setItem(key, JSON.stringify(arr || [])); }catch(e){} }
    function formatLocalTime(iso){
      try{ var d = new Date(iso); return (d.getMonth()+1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }catch(e){ return ''; }
    }
    function currentQueryLabel(payload){

    async function updateHistoryFromStatus(data){
      if(!data || !data.jobId) return;
      var history = readHistory();
      var changed = false;
      for(var idx = 0; idx < history.length; idx += 1){
        var item = history[idx];
        if(!item || item.jobId !== data.jobId) continue;
        changed = true;
        var status = data.status === 'done' ? 'completed' : (data.status || item.status || 'queued');
        var next = Object.assign({}, item, {
          status: status,
          error: data.message || data.error || item.error || null,
          updatedAt: new Date().toISOString()
        });
        if(status === 'completed'){
          var resultId = resultIdFromHistoryItem(next, data.jobId);
          var items = itemArrayFromResultData(data);
          await saveTrackerResultToDb(resultId, data, buildTransferMetaFromHistoryItem(next));
          next.resultId = resultId;
          next.itemCount = items.length;
          next.listingKeys = listingKeysFromItems(items);
          next.favoriteKeys = favoriteKeysFromItems(items);
          next.result = null;
        }
        history[idx] = next;
      }
      if(changed) saveHistory(history);
    }

    async function resolveSingleArticle(){

      if(els.singleArticleBtn) els.singleArticleBtn.disabled = true;
      if(els.runBtn) els.runBtn.disabled = true;
      setProgress({ status:'running', foundArticles:0, resolvedPnu:0, stage:'단건조회' });
      setStatus('매물번호 단건조회 중입니다.', '');

      try{
        var data = await fetchJson(TRACKER_API_BASE + '/api/tracker/resolve-article-by-search', {
          method:'POST',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify(payload)
        });

        var items = Array.isArray(data.items) && data.items.length ? data.items : [item];

      return tail ? (dongName + ' ' + tail) : '';
    }
    function getAddressText(item){
      return addressCandidate(item && item.jibunAddress)
        || addressCandidate(item && Array.isArray(item.jibunAddresses) ? item.jibunAddresses[0] : '')
        || addressCandidate(item && item.roadAddress)
        || addressCandidate(item && item.estimatedAddress)
        || addressFromBjdongAndPnu(item)
        || addressCandidate(item && item.address)
        || '';
    }
    function rawTypeText(item){
      return String((item && (item.realEstateTypeName || item.realEstateType || item.realEstateTypeCode || item.articleRealEstateTypeCode || item.displayType || item.propertyTypeName || item.typeName || item.type)) || '').trim();
    }
    function hasValidAddress(item){
      var addr = String(getAddressText(item) || '').trim();
      var pnu = String((item && (item.pnu || (Array.isArray(item.pnus) ? item.pnus[0] : ''))) || '').trim();
      if(pnu) return true;
      if(!addr) return false;
      if(/주소\s*미확인|주소미확정|미확인/.test(addr)) return false;
      return true;
    }
    function isJunkItem(item){
      if(!item || typeof item !== 'object') return true;
      var no = String(getArticleNo(item) || '').trim();
      if(!no) return true;

      var status = String(statusValue(item) || '').trim();
      var pnu = String(item.pnu || (Array.isArray(item.pnus) ? item.pnus[0] : '') || '').trim();
      var addrOk = hasValidAddress(item);

      // 네이버 raw 목록에 섞여 들어오는 A01/A04 같은 거래코드 찌꺼기.
      // 실제 매물 유형이 아니라 행 자체가 깨진 항목이라 화면/카운트/복사/CSV에서 제외한다.
      var rawType = rawTypeText(item);
      var normalizedType = getTypeText(item);
      var price = String(getPriceText(item) || '').trim();
      if(/^(A\d+|B\d+)$/.test(rawType) || /^(A\d+|B\d+)$/.test(normalizedType)) return true;

      // 주소/PNU가 전혀 없는 주소미확정 행은 찌꺼기로 본다.
      if(!addrOk && !pnu) return true;
      if(/주소미확정|missing|unresolved/i.test(status) && !addrOk && !pnu) return true;

      // 가격도 없고 유형도 네이버 원본 코드처럼 깨져 있으면 제외한다.
      if((!price || price === '-') && !addrOk) return true;
      return false;
    }
    function cleanItems(items){
      return (items || []).filter(function(item){ return !isJunkItem(item); });
    }
    function tradeGroup(item){
      var t = getTradeText(item);
      if(/매매|A1/.test(t)) return 'SALE';
      if(/임대|전세|월세|B1|B2|B3/.test(t)) return 'RENT';
      return '';
    }
    function priceNumber(item){
      var text = String(getPriceText(item) || '').replace(/,/g, '').trim();
      if(!text) return -1;
      var firstPart = text.split('/')[0];
      var total = 0;
      var eok = firstPart.match(/([0-9]+(?:\.[0-9]+)?)\s*억/);
      if(eok){
        total += Math.round(parseFloat(eok[1]) * 10000);
        var tail = firstPart.slice(eok.index + eok[0].length);
        var rest = tail.match(/([0-9]+)/);
        if(rest) total += parseInt(rest[1], 10) || 0;
        return total;
      }
      var m = firstPart.match(/([0-9]+)/);
      return m ? (parseInt(m[1], 10) || 0) : -1;
    }
    function compareAddressText(a,b, direction){
      var aa = String(getAddressText(a) || '').trim();
      var bb = String(getAddressText(b) || '').trim();
      var aMissing = !aa || aa === '주소 미확인';
      var bMissing = !bb || bb === '주소 미확인';

      // 주소가 없는 매물은 오름차순/내림차순 모두 아래로 보낸다.
      if(aMissing && bMissing) return 0;
      if(aMissing) return 1;
      if(bMissing) return -1;

      var cmp = aa.localeCompare(bb, 'ko-KR', { numeric:true, sensitivity:'base' });
      return direction === 'DESC' ? -cmp : cmp;
    }
    function applyResultFilters(items){
      var trade = els.filterTrade.value || 'ALL';
      var sort = els.priceSort.value || 'NONE';
      var addressSort = els.addressSort.value || 'NONE';
      var out = (items || []).slice();
      if(trade !== 'ALL') out = out.filter(function(item){ return tradeGroup(item) === trade; });
      if(sort === 'ASC' || sort === 'DESC'){
        out.sort(function(a,b){
          var pa = priceNumber(a), pb = priceNumber(b);
          if(pa < 0 && pb < 0) return 0;
          if(pa < 0) return 1;
          if(pb < 0) return -1;
          return sort === 'DESC' ? pb - pa : pa - pb;
        });
      }
      if(addressSort === 'ASC' || addressSort === 'DESC'){
        out.sort(function(a,b){ return compareAddressText(a,b,addressSort); });
      }
      return out;
    }

    async function runResearch(){
      if(!picked || !picked.code){ openDongModal(); return; }

      // 새 조회는 기존 조회이력을 유지하고 새 jobId만 추가한다.

      var payload = buildTrackerPayload();

      showTrackerRunning('새 조회 작업을 접수하고 있습니다. 기존 조회이력은 유지됩니다.');

      try{
        var data = await fetchJson(TRACKER_API_BASE + '/api/tracker/start-manual', {
          method: 'POST',
          headers: { 'Content-Type':'application/json' },
          body: JSON.stringify(payload)
        });

        currentJobId = data.jobId || '';
        if(!currentJobId) throw new Error('jobId를 받지 못했습니다.');

        saveTrackerPending(currentJobId, payload);
        addHistoryJob(currentJobId, payload, data.status || 'queued');
        if(favoriteChecked) addFavoriteFromPayload(payload);
        showTrackerRunning('조회가 접수되었습니다. 서버 큐에서 순서대로 처리합니다. 오른쪽 조회이력에서 확인하세요.');

        clearTrackerState();
        setProgress(null);
        setStatus(e && e.message ? e.message : '조회 요청 실패', 'err');

    function savedTrackerExportKey(stored, meta){
      var jobId = String((stored && stored.jobId) || (meta && meta.sourceJobId) || '').trim();
      if(jobId) return 'job:' + jobId;
      var data = stored && stored.data ? stored.data : {};
      var input = data.input || data.payload || {};
      var itemCount = trackerResultItemCount(stored);
      var q = (meta && meta.query) || input.legalDongName || '';
      var t = (meta && meta.selectedType) || (Array.isArray(input.propertyTypeNames) ? input.propertyTypeNames.join(',') : '');
      var tr = (meta && meta.selectedTrade) || (Array.isArray(input.tradeTypes) ? input.tradeTypes.join(',') : '');
      return ['manual', q, t, tr, itemCount, stored && stored.finishedAt || ''].join('|');

    async function collectSavedTrackerResultsForExport(){
      var rows = [];
      var seen = {};

      function addStored(stored, meta){
        if(!stored || !stored.data) return;
        if(!trackerResultItemCount(stored)) return;
        var key = savedTrackerExportKey(stored, meta);
        if(seen[key]) return;
        seen[key] = true;
        rows.push({
          meta: meta || {},
          trackerResult: stored
        });
      }

      // 1) 최근 조회결과
      try{
        var latestData = await readLatestTrackerResult();
        if(latestData){
          var latestMeta = readTrackerResult() || {};
          addStored(wrapTrackerDataForTransfer(latestData, latestMeta.jobId || latestMeta.resultId || latestResultId(), latestMeta.finishedAt || ''), buildTransferMetaForExport());
        }
      }catch(e){}

      // 2) 오른쪽 조회이력에 저장된 완료 결과 전체
      var history = readHistory();
      for(var i = 0; i < history.length; i += 1){
        var item = history[i];
        if(!item || item.status !== 'completed') continue;
        var resultData = await getHistoryResultData(item);
        if(!resultData) continue;
        addStored(
          wrapTrackerDataForTransfer(resultData, item.jobId || item.resultId || '', item.updatedAt || item.createdAt || ''),
          buildTransferMetaFromHistoryItem(item)
        );
      }

      return rows;
    }

    function normalizeImportedTrackerEntries(payload){

      if(payload && Array.isArray(payload.trackerResults)){
        payload.trackerResults.forEach(function(row){
          if(row && row.trackerResult && row.trackerResult.data){
            entries.push({
              meta: row.meta || {},
              trackerResult: row.trackerResult
            });
          }
        });
      }
      if(!entries.length && payload && payload.trackerResult && payload.trackerResult.data){
        entries.push({
          meta: payload.meta || {},
          trackerResult: payload.trackerResult
        });
      }
      return entries;
    }
    function buildImportedHistoryEntry(row, index){
      var stored = row && row.trackerResult ? row.trackerResult : {};
      var meta = (row && row.meta) || {};
      var data = (stored && stored.data) || {};
      var input = data.input || data.payload || {};
      var dong = meta.dong || {
        name: input.legalDongName || input.dongName || input.regionName || '',
        code: input.legalDongCode || input.dongCode || ''
      };
      var selectedTypeText = meta.selectedType || '';
      if(!selectedTypeText && Array.isArray(input.propertyTypeNames)) selectedTypeText = input.propertyTypeNames.join(',');

      var selectedTradeText = meta.selectedTrade || '';
      var selectedTradeTypes = Array.isArray(meta.selectedTradeTypes) ? meta.selectedTradeTypes : [];
      if(!selectedTradeTypes.length && Array.isArray(input.tradeTypes)) selectedTradeTypes = input.tradeTypes;
      if(!selectedTradeTypes.length && selectedTradeText){
        if(selectedTradeText === 'SALE') selectedTradeTypes = ['A1'];
        else if(selectedTradeText === 'RENT') selectedTradeTypes = ['B1','B2','B3'];
        else if(selectedTradeText === 'ALL') selectedTradeTypes = ['A1','B1','B2','B3'];
      }

      var query = meta.query || currentQueryLabel({
        legalDongName: dong.name || '가져온 조회결과',
        legalDongCode: dong.code || '',
        propertyTypeNames: selectedTypeText ? selectedTypeText.split(',').filter(Boolean) : [],
        tradeTypes: selectedTradeTypes
      });

      return {
        id: localId(),
        jobId: '',
        query: query || ('가져온 조회결과 ' + (index + 1)),
        dong: { name: dong.name || '', code: dong.code || '' },
        selectedType: selectedTypeText,
        selectedTrade: selectedTradeText,
        selectedTradeTypes: selectedTradeTypes,
        payload: {
          legalDongName: dong.name || '',
          legalDongCode: dong.code || '',
          propertyTypeNames: selectedTypeText ? selectedTypeText.split(',').filter(Boolean) : [],
          tradeTypes: selectedTradeTypes
        },
        createdAt: new Date().toISOString(),
        status: 'completed',
        resultId: meta.resultId || ('import-' + localId()),
        result: data,
        error: null,
        imported: true,
        importedAt: new Date().toISOString()
      };
    }
    async function addImportedTrackerResultsToHistory(entries){
      var imported = [];
      for(var i = 0; i < entries.length; i += 1){
        var entry = buildImportedHistoryEntry(entries[i], i);
        var stored = entries[i] && entries[i].trackerResult ? entries[i].trackerResult : {};
        var data = stored && stored.data ? stored.data : {};
        var resultId = resultIdFromHistoryItem(entry, entry.resultId);
        var items = itemArrayFromResultData(data);
        await saveTrackerResultToDb(resultId, data, buildTransferMetaFromHistoryItem(entry));
        entry.resultId = resultId;
        entry.itemCount = items.length;
        entry.listingKeys = listingKeysFromItems(items);
        entry.favoriteKeys = favoriteKeysFromItems(items);
        entry.result = null;
        imported.push(entry);
      }
      var history = readHistory();
      history = imported.concat(history);
      selectedHistoryId = imported.length ? imported[0].id : '';
      clearSelectedHistoryIds();
      if(imported.length) setHistoryInCenter(imported[0].id, true);
      saveHistory(history);
      return imported;
    }
    async function restoreImportedTrackerResult(stored, payload){
      // 구버전 함수명 유지. 내부는 단일/다중 TXT 모두 처리한다.
      var entries = normalizeImportedTrackerEntries(payload || { trackerResult: stored });
      if(!entries.length) throw new Error('missing result');
      var importedFavoriteCount = normalizeImportedFavoriteFlags(entries, payload || {});

      var imported = await addImportedTrackerResultsToHistory(entries);
      var firstEntry = imported[0];
      var firstStored = entries[0].trackerResult;
      var firstResultId = firstEntry ? firstEntry.resultId : '';
      if(firstStored && firstStored.data && firstResultId){
        await saveTrackerResultToDb(firstResultId, firstStored.data, firstEntry ? buildTransferMetaFromHistoryItem(firstEntry) : {});
        localStorage.setItem(TRACKER_RESULT_KEY + '_id', firstResultId);
        localStorage.setItem(TRACKER_RESULT_KEY, JSON.stringify({
          status:'completed',
          jobId:firstEntry ? firstEntry.jobId || '' : '',
          resultId:firstResultId,
          itemCount: trackerResultItemCount(firstStored),
          finishedAt:new Date().toISOString()
        }));
      }
      localStorage.removeItem(TRACKER_PENDING_KEY);
      currentJobId = '';

      if(firstEntry && firstEntry.dong && firstEntry.dong.name){ picked = firstEntry.dong; renderPickedDong(); }
      if(firstEntry && firstEntry.selectedType){ selectedType = firstEntry.selectedType; setChoice(els.typeChoices, 'data-type', selectedType); }
      if(firstEntry && firstEntry.selectedTrade){ setTradeChoice(firstEntry.selectedTrade); }

      renderHistory();
      await renderSelectedHistoryResults();
      setProgress(null);

      var totalItems = entries.reduce(function(sum, row){ return sum + trackerResultItemCount(row.trackerResult); }, 0);
      var favoriteNote = importedFavoriteCount ? ' / 찜 ' + importedFavoriteCount + '개' : '';
      setStatus('저장 매물을 가져왔습니다. 오른쪽 조회이력에 반영했습니다. · 이력 ' + entries.length + '개 / 매물 ' + totalItems + '건' + favoriteNote, totalItems ? 'ok' : 'err');
      toast(importedFavoriteCount ? '찜 표시까지 가져왔습니다.' : '저장 매물을 가져왔습니다.');
    }
    function importTrackerResultTxtFile(file){
      if(!file) return;
      var reader = new FileReader();
      reader.onload = async function(){
        try{
          var payload = JSON.parse(String(reader.result || ''));
          if(!payload || payload.app !== 'maslow-search' || payload.type !== 'tracker-result') throw new Error('invalid file');
          await restoreImportedTrackerResult(payload.trackerResult, payload);
        }catch(e){
          setStatus('올바른 조회결과 TXT 파일이 아닙니다.', 'err');
          toast('조회결과 TXT 파일을 확인하세요.');
        }finally{
          if(els.importResultTxtInput) els.importResultTxtInput.value = '';
        }
      };
      reader.onerror = function(){
        setStatus('TXT 파일을 읽지 못했습니다.', 'err');
        if(els.importResultTxtInput) els.importResultTxtInput.value = '';
      };
      reader.readAsText(file, 'utf-8');
    }


    if(els.favoriteViewBtn) els.favoriteViewBtn.addEventListener('click', toggleFavoriteViewMode);
    if(els.exportResultTxtBtn) els.exportResultTxtBtn.addEventListener('click', exportTrackerResultTxt);
    if(els.importResultTxtBtn) els.importResultTxtBtn.addEventListener('click', function(){ if(els.importResultTxtInput) els.importResultTxtInput.click(); });
    if(els.importResultTxtInput) els.importResultTxtInput.addEventListener('change', function(e){
      var file = e.target.files && e.target.files[0];
      if(!file) return;
      if(!confirm('선택한 TXT 파일의 조회결과로 현재 조회결과를 교체합니다. 계속할까요?')){
        els.importResultTxtInput.value = '';
        return;
      }
      importTrackerResultTxtFile(file);
    });
    els.dongPickBtn.addEventListener('click', openDongModal);
    els.dongCloseBtn.addEventListener('click', closeDongModal);
    els.dongModal.addEventListener('click', function(e){ if(e.target === els.dongModal) closeDongModal(); });
    els.dongSearchInput.addEventListener('input', renderDongList);
    els.dongSearchInput.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeDongModal(); });
    Array.prototype.forEach.call(document.querySelectorAll('.quick'), function(btn){
      btn.addEventListener('click', function(){ els.dongSearchInput.value = btn.getAttribute('data-q') || ''; renderDongList(); els.dongSearchInput.focus(); });
    });
    els.typeChoices.addEventListener('click', function(e){
      var btn = e.target.closest('[data-type]'); if(!btn) return;
      selectedType = btn.getAttribute('data-type'); setChoice(els.typeChoices, 'data-type', selectedType);
    });
    if(els.tradeChoices){
      els.tradeChoices.addEventListener('click', function(e){
        var opt = e.target.closest('[data-trade]'); if(!opt) return;
        setTradeChoice(opt.getAttribute('data-trade') || 'ALL');
      });
    }
    els.runBtn.addEventListener('click', runResearch);
    if(els.singleArticleBtn){
      els.singleArticleBtn.addEventListener('click', resolveSingleArticle);
    }
    if(els.singleArticleInput){
      els.singleArticleInput.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){
          e.preventDefault();
          resolveSingleArticle();
        }
      });
    }
    els.favoriteToggleBtn.addEventListener('click', function(){ setFavoriteChecked(!favoriteChecked); });
    els.historyRefreshBtn.addEventListener('click', refreshHistoryStatuses);
    els.favoriteList.addEventListener('click', function(e){ var del=e.target.closest('[data-favorite-delete]'); if(del){ deleteFavorite(del.getAttribute('data-favorite-delete')); return; } var load=e.target.closest('[data-favorite-load]'); if(load) loadFavorite(load.getAttribute('data-favorite-load')); });
    els.historyList.addEventListener('click', function(e){
      var del=e.target.closest('[data-history-delete]');
      if(del){ deleteHistory(del.getAttribute('data-history-delete')); return; }
      var card=e.target.closest('[data-history-id]');
      if(card) loadHistory(card.getAttribute('data-history-id'));
    });
    els.historyList.addEventListener('dragstart', function(e){
      var card=e.target.closest('[data-history-id]');
      if(!card) return;
      e.dataTransfer.effectAllowed = 'copy';
      e.dataTransfer.setData('text/plain', card.getAttribute('data-history-id'));
      card.classList.add('is-dragging');
    });
    els.historyList.addEventListener('dragend', function(e){
      var card=e.target.closest('[data-history-id]');
      if(card) card.classList.remove('is-dragging');
    });
    [els.tableWrap, els.empty].forEach(function(target){
      if(!target) return;
      target.addEventListener('dragover', function(e){
        e.preventDefault();
        target.classList.add('is-drop-target');
      });
      target.addEventListener('dragleave', function(){
        target.classList.remove('is-drop-target');
      });
      target.addEventListener('drop', function(e){
        e.preventDefault();
        target.classList.remove('is-drop-target');
        var id = e.dataTransfer.getData('text/plain');
        if(!id) return;
        var item = historyById(id);
        if(!item) return;
        if(item.status !== 'completed' || !item.result){
          selectedHistoryId = id;
          renderHistory();
          setStatus('완료된 조회카드만 중앙 결과에 넣을 수 있습니다.', 'err');
          return;
        }
        selectedHistoryId = id;
        setHistoryInCenter(id, true);
        renderHistory();
        renderSelectedHistoryResults();
      });
    });
    els.filterTrade.addEventListener('change', renderFilteredResults);
    els.priceSort.addEventListener('change', renderFilteredResults);
    els.addressSort.addEventListener('change', renderFilteredResults);
    els.copyTableBtn.addEventListener('click', copyTable);
    els.csvBtn.addEventListener('click', downloadCsv);
    els.resultBody.addEventListener('click', function(e){
      var favoriteChip = e.target.closest('[data-favorite-key]');
      if(favoriteChip){
        e.preventDefault();
        e.stopPropagation();
        toggleResultFavoriteByKey(favoriteChip.getAttribute('data-favorite-key') || '');
        return;
      }
      var mapBtn = e.target.closest('[data-map-address]');
      if(mapBtn){
        openNaverMapAddress(mapBtn.getAttribute('data-map-address') || '');
        return;
      }
      var btn = e.target.closest('[data-article-no]');
      if(!btn) return;
      openNaverGuide(btn.getAttribute('data-article-no') || '');
    });
    els.naverGuideCloseBtn.addEventListener('click', closeNaverGuide);
    els.naverGuideModal.addEventListener('click', function(e){ if(e.target === els.naverGuideModal) closeNaverGuide(); });
    els.naverGuideGoBtn.addEventListener('click', goNaverLand);

    renderPickedDong();
    resetResults();
    renderFavorites();
    setFavoriteViewButton();
    renderHistory();
    migrateLegacyLocalStorageToIndexedDb().then(function(){
      restoreTrackerState();
    }).catch(function(){
      restoreTrackerState();
    });
  </script>
</body>
</html>
