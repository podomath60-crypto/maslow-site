<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>건축물대장 주소 찾기</title>
  <meta name="description" content="법정동과 사용승인일로 건축물 주소를 찾는 조회기" />
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f8fb;color:#111827}
    button,input{font:inherit}
    .page{min-height:100vh;display:grid;grid-template-columns:320px minmax(0,1fr)}
    .log-panel{background:#111827;color:#d1d5db;padding:18px;overflow:auto;max-height:100vh;position:sticky;top:0}
    .log-title{font-size:15px;font-weight:800;color:#fff;margin-bottom:10px}
    .log-box{font-size:12px;line-height:1.55;white-space:pre-wrap;word-break:break-all}
    .main{padding:34px 20px 60px}
    .wrap{max-width:760px;margin:0 auto}
    .header{margin-bottom:22px}
    .brand{font-size:13px;font-weight:800;letter-spacing:.08em;color:#6b7280;margin-bottom:6px}
    h1{margin:0;font-size:30px;letter-spacing:-.04em}
    .desc{margin-top:8px;color:#6b7280;font-size:15px;line-height:1.5}
    .search-area{display:grid;gap:10px;margin-bottom:18px}
    .dong-btn{width:100%;min-height:58px;border:1px solid #d1d5db;background:#fff;border-radius:14px;text-align:left;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
    .dong-btn strong{font-size:17px;font-weight:800;color:#111827}
    .dong-btn span{font-size:13px;color:#6b7280}
    .dong-placeholder{color:#9ca3af!important;font-weight:700!important}
    .date-row{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px}
    .date-input{height:56px;border:1px solid #d1d5db;background:#fff;border-radius:14px;padding:0 16px;font-size:18px;outline:none}
    .date-input:focus{border-color:#111827}
    .lookup-btn{height:56px;border:0;border-radius:14px;background:#111827;color:#fff;font-weight:900;cursor:pointer}
    .lookup-btn:disabled{opacity:.55;cursor:not-allowed}
    .hint{font-size:13px;color:#6b7280}
    .status{min-height:22px;font-size:14px;font-weight:800;color:#374151;margin:14px 0}
    .status.err{color:#dc2626}
    .status.ok{color:#0f766e}
    .results{display:grid;gap:10px;margin-top:12px}
    .result-item{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;display:grid;gap:12px}
    .addr{font-size:18px;font-weight:900;line-height:1.45;word-break:keep-all}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    .action-btn,.map-link{height:42px;padding:0 14px;border-radius:11px;border:1px solid #d1d5db;background:#fff;color:#111827;font-weight:900;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
    .map-link{background:#03c75a;border-color:#03c75a;color:#fff}
    .empty{border:1px dashed #d1d5db;border-radius:16px;background:#fff;padding:20px;color:#6b7280;text-align:center;font-weight:700}
    .modal{display:none;position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:30;padding:18px;overflow:auto}
    .modal.show{display:flex;align-items:flex-start;justify-content:center}
    .modal-box{width:min(760px,100%);background:#fff;border-radius:18px;margin-top:24px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.22)}
    .modal-head{padding:16px;border-bottom:1px solid #e5e7eb;display:grid;gap:10px}
    .modal-title{font-size:18px;font-weight:900}
    .dong-search{height:52px;border:1px solid #d1d5db;border-radius:13px;padding:0 14px;font-size:18px;outline:none}
    .dong-list{max-height:58vh;overflow:auto;padding:8px}
    .dong-item{width:100%;border:0;background:#fff;text-align:left;padding:13px 12px;border-radius:12px;cursor:pointer;display:grid;gap:4px}
    .dong-item:hover{background:#f3f4f6}
    .dong-name{font-weight:900;font-size:16px}
    .dong-code{font-size:12px;color:#6b7280}
    .modal-foot{padding:12px 16px;border-top:1px solid #e5e7eb;display:flex;justify-content:space-between;gap:10px;align-items:center;color:#6b7280;font-size:13px}
    .close-btn{border:1px solid #d1d5db;background:#fff;border-radius:10px;height:38px;padding:0 12px;font-weight:800;cursor:pointer}
    .loading{display:none;position:fixed;inset:0;z-index:40;background:rgba(255,255,255,.62);align-items:center;justify-content:center;font-weight:900;color:#111827}
    .loading.show{display:flex}
    @media(max-width:860px){.page{display:block}.log-panel{position:relative;max-height:190px}.main{padding:24px 14px 44px}.date-row{grid-template-columns:1fr}.lookup-btn{width:100%}h1{font-size:26px}}
  </style>
</head>
<body>
  <div class="page">
    <aside class="log-panel">
      <div class="log-title">조회 로그</div>
      <div id="logBox" class="log-box"></div>
    </aside>

    <main class="main">
      <div class="wrap">
        <div class="header">
          <div class="brand">MASLOW</div>
          <h1>건축물 주소 찾기</h1>
          <div class="desc">법정동과 사용승인일로 건축물대장 표제부를 조회해 주소만 찾습니다.</div>
        </div>

        <div class="search-area">
          <button id="dongPickBtn" class="dong-btn" type="button">
            <strong id="pickedDongText" class="dong-placeholder">법정동 검색</strong>
            <span id="pickedDongCode">동 이름을 입력해 선택</span>
          </button>
          <div class="date-row">
            <input id="useAprDayInput" class="date-input" type="text" inputmode="numeric" placeholder="사용승인일 예: 2011.12.02" autocomplete="off" />
            <button id="lookupBtn" class="lookup-btn" type="button">조회</button>
          </div>
          <div class="hint">날짜는 20111202, 2011.12.02, 2011-12-02, 2011/12/2처럼 입력해도 됩니다.</div>
        </div>

        <div id="status" class="status"></div>
        <div id="results" class="results"></div>
        <div id="empty" class="empty">법정동과 사용승인일을 입력하면 주소가 표시됩니다.</div>
      </div>
    </main>
  </div>

  <div id="dongModal" class="modal" aria-hidden="true">
    <div class="modal-box" role="dialog" aria-modal="true" aria-label="법정동 검색">
      <div class="modal-head">
        <div class="modal-title">법정동 검색</div>
        <input id="dongSearchInput" class="dong-search" type="search" placeholder="예: 오식도동, 군산 오식도, 5213014700" autocomplete="off" />
      </div>
      <div id="dongList" class="dong-list"></div>
      <div class="modal-foot">
        <div id="dongCountText">법정동 데이터를 불러오는 중입니다.</div>
        <button id="dongCloseBtn" class="close-btn" type="button">닫기</button>
      </div>
    </div>
  </div>

  <div id="loading" class="loading">조회 중...</div>

  <script src="/search/bjdong-codes.js" onerror="document.write('<script src=&quot;./bjdong-codes.js&quot;><\/script>')"></script>
  <script>
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbznhBvYFIv_GKeNoGIPFTi_mIXXH04BOvYrb4ZN9dk_Cc4Xjir3TP_vL3bbPrLLxgg2/exec';
    var picked = null;

    var els = {
      logBox: document.getElementById('logBox'),
      dongPickBtn: document.getElementById('dongPickBtn'),
      pickedDongText: document.getElementById('pickedDongText'),
      pickedDongCode: document.getElementById('pickedDongCode'),
      useAprDayInput: document.getElementById('useAprDayInput'),
      lookupBtn: document.getElementById('lookupBtn'),
      status: document.getElementById('status'),
      results: document.getElementById('results'),
      empty: document.getElementById('empty'),
      dongModal: document.getElementById('dongModal'),
      dongSearchInput: document.getElementById('dongSearchInput'),
      dongList: document.getElementById('dongList'),
      dongCountText: document.getElementById('dongCountText'),
      dongCloseBtn: document.getElementById('dongCloseBtn'),
      loading: document.getElementById('loading')
    };

    function nowText(){
      var d = new Date();
      return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ':' + String(d.getSeconds()).padStart(2,'0');
    }

    function addLog(msg){
      els.logBox.textContent += '[' + nowText() + '] ' + msg + '\n';
      els.logBox.scrollTop = els.logBox.scrollHeight;
    }

    function escapeHtml(v){
      return String(v == null ? '' : v)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'",'&#39;');
    }

    function setStatus(text, type){
      els.status.textContent = text || '';
      els.status.className = 'status' + (type ? ' ' + type : '');
    }

    function setLoading(on){
      els.loading.classList.toggle('show', !!on);
      els.lookupBtn.disabled = !!on;
    }

    function getBjdongItems(){
      return Array.isArray(window.BJDONG_CODES) ? window.BJDONG_CODES : [];
    }

    function normalizeText(s){
      return String(s == null ? '' : s).trim().toLowerCase().replace(/\s+/g, ' ');
    }

    function normalizeUseAprDayInput(input){
      var raw = String(input == null ? '' : input).trim();
      if(!raw) return '';

      var parts = raw.match(/\d+/g) || [];
      if(parts.length >= 3){
        var y = parts[0];
        var m = parts[1];
        var d = parts[2];
        if(y.length === 4){
          return y + String(m).padStart(2,'0') + String(d).padStart(2,'0');
        }
      }

      var digits = raw.replace(/\D/g, '');
      if(digits.length === 8) return digits;
      return digits;
    }

    function formatDate8(v){
      v = String(v || '');
      if(v.length !== 8) return v;
      return v.slice(0,4) + '-' + v.slice(4,6) + '-' + v.slice(6,8);
    }

    function openDongModal(){
      els.dongModal.classList.add('show');
      els.dongModal.setAttribute('aria-hidden','false');
      els.dongSearchInput.value = '';
      renderDongList();
      setTimeout(function(){ els.dongSearchInput.focus(); }, 30);
    }

    function closeDongModal(){
      els.dongModal.classList.remove('show');
      els.dongModal.setAttribute('aria-hidden','true');
    }

    function renderPickedDong(){
      if(picked){
        els.pickedDongText.textContent = picked.name;
        els.pickedDongText.classList.remove('dong-placeholder');
        els.pickedDongCode.textContent = picked.code;
      }else{
        els.pickedDongText.textContent = '법정동 검색';
        els.pickedDongText.classList.add('dong-placeholder');
        els.pickedDongCode.textContent = '동 이름을 입력해 선택';
      }
    }

    function renderDongList(){
      var items = getBjdongItems();
      var q = normalizeText(els.dongSearchInput.value);
      els.dongCountText.textContent = '내장 법정동 ' + items.length.toLocaleString('ko-KR') + '건';

      if(!items.length){
        els.dongList.innerHTML = '<div class="empty">법정동 데이터 로드 실패</div>';
        return;
      }

      if(!q){
        els.dongList.innerHTML = '<div class="empty">동 이름이나 코드를 입력하세요.</div>';
        return;
      }

      var qNoSpace = q.replace(/\s/g,'');
      var matched = items.filter(function(item){
        var name = normalizeText(item.name);
        var bname = normalizeText(item.bname);
        var sigungu = normalizeText(item.sigungu);
        var code = String(item.code || '');
        var compact = (name + bname + sigungu).replace(/\s/g,'');
        return name.indexOf(q) !== -1 ||
          bname.indexOf(q) !== -1 ||
          sigungu.indexOf(q) !== -1 ||
          code.indexOf(q) !== -1 ||
          compact.indexOf(qNoSpace) !== -1;
      }).slice(0, 80);

      if(!matched.length){
        els.dongList.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>';
        return;
      }

      els.dongList.innerHTML = matched.map(function(item, idx){
        return '<button class="dong-item" type="button" data-idx="' + idx + '">' +
          '<div class="dong-name">' + escapeHtml(item.name) + '</div>' +
          '<div class="dong-code">' + escapeHtml(item.code) + '</div>' +
          '</button>';
      }).join('');

      Array.prototype.forEach.call(els.dongList.querySelectorAll('.dong-item'), function(btn){
        btn.addEventListener('click', function(){
          picked = matched[Number(btn.getAttribute('data-idx'))];
          renderPickedDong();
          closeDongModal();
          addLog('법정동 선택: ' + picked.name + ' / ' + picked.code);
          setStatus('', '');
        });
      });
    }

    function jsonpCall(params){
      return new Promise(function(resolve, reject){
        var callbackName = 'lookupCallback_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
        var timer = null;
        var script = document.createElement('script');
        params.callback = callbackName;
        var query = Object.keys(params).map(function(k){
          return encodeURIComponent(k) + '=' + encodeURIComponent(params[k] == null ? '' : String(params[k]));
        }).join('&');

        window[callbackName] = function(data){
          clearTimeout(timer);
          try{ delete window[callbackName]; }catch(e){ window[callbackName] = undefined; }
          if(script.parentNode) script.parentNode.removeChild(script);
          resolve(data);
        };

        script.onerror = function(){
          clearTimeout(timer);
          try{ delete window[callbackName]; }catch(e){ window[callbackName] = undefined; }
          if(script.parentNode) script.parentNode.removeChild(script);
          reject(new Error('JSONP 요청 실패'));
        };

        timer = setTimeout(function(){
          try{ delete window[callbackName]; }catch(e){ window[callbackName] = undefined; }
          if(script.parentNode) script.parentNode.removeChild(script);
          reject(new Error('JSONP 타임아웃'));
        }, 45000);

        script.src = GAS_URL + '?' + query;
        document.body.appendChild(script);
      });
    }

    function getResultItems(res){
      if(Array.isArray(res && res.items)) return res.items;
      var titleItems = (((res || {}).apis || {}).title || {}).items;
      return Array.isArray(titleItems) ? titleItems : [];
    }

    function getAddressFromItem(item){
      return String((item && (item.address || item.roadAddress || item.jibunAddress || item.newPlatPlc || item.platPlc)) || '').trim();
    }

    function getNaverMapUrl(item){
      var direct = String((item && item.naverMapUrl) || '').trim();
      if(direct) return direct;
      var addr = getAddressFromItem(item);
      return addr ? 'https://map.naver.com/p/search/' + encodeURIComponent(addr) : '';
    }

    async function copyText(text){
      try{
        await navigator.clipboard.writeText(text);
        setStatus('주소를 복사했습니다.', 'ok');
        addLog('주소 복사: ' + text);
      }catch(e){
        var ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        setStatus('주소를 복사했습니다.', 'ok');
        addLog('주소 복사: ' + text);
      }
    }

    function renderAddressResults(items){
      els.results.innerHTML = '';
      if(!items.length){
        els.empty.style.display = 'block';
        els.empty.textContent = '일치하는 주소가 없습니다.';
        return;
      }
      els.empty.style.display = 'none';
      els.results.innerHTML = items.map(function(item, idx){
        var addr = getAddressFromItem(item);
        var mapUrl = getNaverMapUrl(item);
        return '<div class="result-item">' +
          '<div class="addr">' + escapeHtml(addr || '주소 없음') + '</div>' +
          '<div class="actions">' +
          '<button class="action-btn" type="button" data-copy-idx="' + idx + '">주소복사</button>' +
          (mapUrl ? '<a class="map-link" href="' + escapeHtml(mapUrl) + '" target="_blank" rel="noopener">네이버 지도로 조회</a>' : '') +
          '</div>' +
          '</div>';
      }).join('');

      Array.prototype.forEach.call(els.results.querySelectorAll('[data-copy-idx]'), function(btn){
        btn.addEventListener('click', function(){
          var item = items[Number(btn.getAttribute('data-copy-idx'))];
          var addr = getAddressFromItem(item);
          if(addr) copyText(addr);
        });
      });
    }

    async function lookup(){
      if(!picked || !picked.code){
        openDongModal();
        return;
      }

      var rawDate = els.useAprDayInput.value;
      var useAprDay = normalizeUseAprDayInput(rawDate);
      addLog('날짜 정규화: ' + rawDate + ' → ' + useAprDay);

      if(useAprDay.length !== 8){
        setStatus('사용승인일을 8자리 날짜로 입력해주세요.', 'err');
        els.useAprDayInput.focus();
        return;
      }

      els.useAprDayInput.value = formatDate8(useAprDay);
      setStatus('', '');
      setLoading(true);

      var params = {
        action: 'fetchBuildingsByDongAndUseAprDay',
        bcode: picked.code,
        sido: picked.sido || '',
        sigungu: picked.sigungu || '',
        bname: picked.bname || '',
        useAprDay: useAprDay
      };

      addLog('GAS 요청 시작: action=' + params.action + ', bcode=' + params.bcode + ', useAprDay=' + params.useAprDay);

      try{
        var res = await jsonpCall(params);
        addLog('GAS 응답 수신: ok=' + !!(res && res.ok) + ', message=' + ((res && (res.message || res.error)) || ''));

        if(!(res && res.ok)){
          setStatus((res && (res.message || res.error)) || '조회 실패', 'err');
          renderAddressResults([]);
          return;
        }

        var items = getResultItems(res).filter(function(item){ return !!getAddressFromItem(item); });
        if(!items.length){
          setStatus('일치하는 주소가 없습니다.', 'err');
        }else{
          setStatus('조회 완료 · ' + items.length + '건', 'ok');
        }
        addLog('조회 완료: ' + items.length + '건');
        renderAddressResults(items);
      }catch(e){
        addLog('조회 실패: ' + (e && e.message ? e.message : String(e)));
        setStatus('조회 실패 · ' + (e && e.message ? e.message : String(e)), 'err');
      }finally{
        setLoading(false);
      }
    }

    els.dongPickBtn.addEventListener('click', openDongModal);
    els.dongCloseBtn.addEventListener('click', closeDongModal);
    els.dongModal.addEventListener('click', function(e){ if(e.target === els.dongModal) closeDongModal(); });
    els.dongSearchInput.addEventListener('input', renderDongList);
    els.lookupBtn.addEventListener('click', lookup);
    els.useAprDayInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') lookup(); });

    renderPickedDong();
    addLog('프론트 로드 완료');
    addLog('법정동 데이터: ' + getBjdongItems().length.toLocaleString('ko-KR') + '건');
  </script>
</body>
</html>
