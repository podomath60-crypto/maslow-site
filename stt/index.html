<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MASLOW 음성 텍스트 변환</title>
  <meta name="description" content="녹음하거나 음성 파일을 올리면 텍스트로 변환합니다." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="MASLOW" />
  <meta property="og:title" content="MASLOW 음성 텍스트 변환" />
  <meta property="og:description" content="녹음하거나 음성 파일을 올리면 텍스트로 변환합니다." />
  <meta property="og:url" content="https://maslowkorea.site/stt" />
  <meta property="og:image" content="https://maslowkorea.site/stt-og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="MASLOW 음성 텍스트 변환" />
  <meta name="twitter:description" content="녹음하거나 음성 파일을 올리면 텍스트로 변환합니다." />
  <meta name="twitter:image" content="https://maslowkorea.site/stt-og.png" />
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
      color:#141820;
      background:
        radial-gradient(circle at 50% 10%, rgba(71,134,255,.12), transparent 34%),
        linear-gradient(180deg,#eff6ff 0%,#f7fbff 46%,#fff 100%);
    }
    body.tutorial-lock{
      overflow:hidden;
      touch-action:none;
      overscroll-behavior:none;
    }
    .page{min-height:100vh;padding:34px 18px 58px}
    .tutorial-replay-btn{
      position:fixed;
      left:12px;
      top:calc(10px + env(safe-area-inset-top));
      z-index:1000;
      padding:6px 8px;
      border:0;
      background:transparent;
      color:#9aa3b2;
      font-size:11px;
      font-weight:850;
      letter-spacing:-.04em;
      line-height:1;
      opacity:.72;
      cursor:pointer;
    }
    .tutorial-replay-btn:active{
      opacity:1;
      transform:translateY(1px);
    }
    .hero{max-width:520px;margin:0 auto;padding-top:42px;text-align:center}
    .brand-en{
      font-size:31px;line-height:1;font-weight:500;letter-spacing:.22em;text-indent:.22em;color:#2c7be5
    }
    .brand-ko{
      margin-top:12px;font-size:clamp(56px,14.5vw,92px);line-height:.86;font-weight:950;
      letter-spacing:-.09em;color:#05070c
    }
    .subtitle{
      margin-top:22px;font-size:25px;font-weight:900;letter-spacing:-.06em;color:#78818f
    }
    .title-row{display:flex;justify-content:center;align-items:center;gap:13px;margin-top:20px}
    .title-row h1{margin:0;font-size:28px;line-height:1;font-weight:950;letter-spacing:-.06em;color:#4b5565}
    .free{
      display:inline-flex;align-items:center;justify-content:center;min-width:72px;height:45px;padding:0 15px;
      border-radius:18px;color:#fff;background:linear-gradient(180deg,#3b82ff,#2563eb);
      box-shadow:0 12px 23px rgba(37,99,235,.26);font-size:26px;font-weight:850;letter-spacing:-.05em
    }
    .card{
      max-width:520px;margin:72px auto 0;padding:22px 14px 24px;border-radius:28px;
      background:rgba(255,255,255,.88);box-shadow:0 24px 54px rgba(37,99,235,.10);
      backdrop-filter:blur(12px)
    }
    .input-card{display:grid;grid-template-columns:1fr 54px 54px;gap:12px}
    .upload-box{
      display:flex;align-items:center;gap:16px;min-height:92px;padding:0 23px;border:1px solid #e4e9f2;
      border-radius:20px;background:#fff;text-align:left;cursor:pointer;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)
    }
    .upload-icon{font-size:40px;line-height:1;color:#a5adba;transform:rotate(-12deg)}
    .upload-text{font-size:20px;font-weight:900;letter-spacing:-.07em;color:#a0a7b3}
    .hidden-input{display:none}
    .refresh,.play-preview{
      min-height:92px;border:1px solid #e4e9f2;border-radius:20px;background:#fff;color:#737b88;
      font-weight:800;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)
    }
    .refresh{font-size:36px}
    .play-preview{font-size:24px;padding-left:3px;color:#2563eb}
    .play-preview:disabled{
      opacity:.36;
      cursor:not-allowed;
      color:#a5adba;
    }
    .file-name{
      grid-column:1/-1;min-height:18px;padding:0 4px;color:#7a8290;font-size:13px;text-align:center;word-break:break-all
    }
    .divider{
      grid-column:1/-1;display:flex;align-items:center;gap:12px;margin:4px 0 0;
      color:#a0a7b3;font-size:13px;font-weight:800
    }
    .divider:before,.divider:after{content:"";flex:1;height:1px;background:#eef2f7}
    .record-panel{
      grid-column:1/3;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;
      background:#f8fafc;border:1px solid #e8edf5
    }
    .record-play-preview{
      grid-column:3/4;
      min-height:72px;
      border:1px solid #e4e9f2;
      border-radius:18px;
      background:#fff;
      color:#2563eb;
      font-size:24px;
      font-weight:800;
      padding-left:3px;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.4);
      cursor:pointer;
    }
    .record-play-preview:disabled{
      opacity:.36;
      cursor:not-allowed;
      color:#a5adba;
    }
    .rec-dot{width:13px;height:13px;border-radius:999px;background:#cbd5e1}
    .rec-dot.on{background:#ef4444;box-shadow:0 0 0 8px rgba(239,68,68,.12)}
    .rec-main{font-size:15px;font-weight:950;color:#273142}
    .rec-sub{margin-top:4px;font-size:12px;font-weight:700;color:#8a93a1}
    .actions{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
    button{
      border:0;cursor:pointer;font-family:inherit;font-weight:950;letter-spacing:-.04em
    }
    .small-btn{height:48px;border-radius:15px;font-size:15px}
    .small-btn.dark{color:#fff;background:#111827}
    .small-btn.danger{color:#fff;background:#ef4444}
    .small-btn.ghost{color:#596170;background:#eef2f7}
    .audio{grid-column:1/-1;width:100%;display:none}
    .submit{
      grid-column:1/-1;
      height:58px;
      margin-top:18px;
      border-radius:19px;
      color:#fff;
      background:linear-gradient(180deg,#3b63ff,#2553f4);
      box-shadow:0 18px 26px rgba(37,83,244,.20);
      font-size:19px;
    }
    .save-recording{
      color:#2563eb;
      background:#eef4ff;
      border:1px solid #dbe7ff;
    }
    .submit:disabled,.save-recording:disabled{
      opacity:.42;
      cursor:not-allowed;
      box-shadow:none;
    }
    .result-card{
      max-width:520px;margin:26px auto 0;padding:24px;border:1px dashed #d8dee8;border-radius:22px;background:rgba(255,255,255,.92)
    }
    .empty{
      min-height:88px;display:flex;align-items:center;justify-content:center;text-align:center;color:#6b7280;
      font-size:20px;line-height:1.55;font-weight:850;letter-spacing:-.06em
    }
    .result-body{display:none}
    .result-head{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
    .result-head strong{font-size:19px;font-weight:950;letter-spacing:-.06em}
    .result-head span{color:#8a93a1;font-size:13px;font-weight:800;letter-spacing:-.04em}
    .result-text{
      width:100%;min-height:240px;resize:vertical;padding:16px;border:1px solid #e4e9f2;border-radius:18px;
      outline:none;color:#1f2937;background:#fff;font-size:16px;line-height:1.7;font-family:inherit
    }
    .result-text:focus{border-color:#93c5fd;box-shadow:0 0 0 4px rgba(147,197,253,.24)}
    .result-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    .result-actions button{height:48px;border-radius:15px;color:#384152;background:#eef2f7;font-size:15px}
    .status{margin-top:12px;color:#8a93a1;font-size:12px;font-weight:800;letter-spacing:-.04em;text-align:center}

    .toast{
      position:fixed;
      left:50%;
      top:50%;
      z-index:9999;
      transform:translate(-50%, -50%) scale(.96);
      width:min(420px, calc(100vw - 40px));
      padding:22px 22px 20px;
      border-radius:24px;
      background:rgba(255,255,255,.96);
      color:#1f2937;
      font-size:17px;
      font-weight:900;
      line-height:1.55;
      text-align:center;
      letter-spacing:-.055em;
      white-space:pre-line;
      border:1px solid rgba(219,231,255,.95);
      box-shadow:0 24px 70px rgba(37,99,235,.18), 0 8px 26px rgba(15,23,42,.10);
      opacity:0;
      pointer-events:none;
      transition:opacity .24s ease, transform .24s ease;
    }
    .toast.show{
      opacity:1;
      transform:translate(-50%, -50%) scale(1);
    }


    .tutorial-overlay{
      position:fixed;
      inset:0;
      z-index:9998;
      background:transparent;
      backdrop-filter:none;
      opacity:0;
      pointer-events:none;
      transition:opacity .24s ease;
    }
    .tutorial-overlay.intro{
      background:rgba(7,10,18,.38);
      backdrop-filter:blur(1px);
    }
    .tutorial-overlay.final{
      background:rgba(7,10,18,.32);
      backdrop-filter:blur(1px);
    }
    .tutorial-overlay.show{
      opacity:1;
      pointer-events:auto;
    }
    .tutorial-stage{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
    }
    .tutorial-ring{
      position:absolute;
      border:5px solid rgba(255,92,177,.96);
      border-radius:44% 56% 50% 48% / 48% 45% 55% 52%;
      box-shadow:
        0 0 0 9999px rgba(7,10,18,.42),
        0 0 0 2px rgba(255,255,255,.24),
        0 0 24px rgba(255,92,177,.46);
      background:rgba(255,255,255,.02);
      transform:rotate(-4deg) scale(.86);
      opacity:0;
      transition:opacity .28s ease, transform .42s cubic-bezier(.2,1,.2,1);
      pointer-events:none;
    }
    .tutorial-ring.show{
      opacity:1;
      transform:rotate(-4deg) scale(1);
    }
    .tutorial-ring.second{
      border-radius:53% 47% 46% 54% / 52% 55% 45% 48%;
      transform:rotate(3deg) scale(.86);
    }
    .tutorial-ring.second.show{
      transform:rotate(3deg) scale(1);
    }
    .tutorial-ring.green-ring{
      border-color:rgba(198,255,88,.98);
      border-radius:50% 46% 53% 47% / 48% 54% 46% 52%;
      box-shadow:
        0 0 0 9999px rgba(7,10,18,.42),
        0 0 0 2px rgba(255,255,255,.22),
        0 0 26px rgba(198,255,88,.55);
      transform:rotate(-2deg) scale(.86);
    }
    .tutorial-ring.green-ring.show{
      transform:rotate(-2deg) scale(1);
    }
    .tutorial-note{
      position:absolute;
      left:50%;
      top:92px;
      width:min(360px, calc(100vw - 48px));
      transform:translateY(8px);
      padding:0;
      border-radius:0;
      background:transparent;
      color:#ffffff;
      text-align:left;
      font-weight:950;
      letter-spacing:-.065em;
      line-height:1.5;
      font-size:22px;
      box-shadow:none;
      text-shadow:
        0 3px 18px rgba(0,0,0,.48),
        0 1px 3px rgba(0,0,0,.38);
      opacity:0;
      transition:opacity .32s ease, transform .32s ease;
      pointer-events:none;
      white-space:pre-line;
    }
    .tutorial-note.show{
      opacity:1;
      transform:translateY(0);
    }
    .tutorial-note.green{
      width:min(430px, calc(100vw - 40px));
      text-align:center;
      background:transparent;
      border:0;
      color:#c6ff58;
      font-size:25px;
      line-height:1.42;
      box-shadow:none;
      text-shadow:
        0 3px 18px rgba(28,87,0,.32),
        0 1px 3px rgba(0,0,0,.34);
    }
    .tutorial-start{
      position:absolute;
      left:50%;
      bottom:34px;
      transform:translateX(-50%);
      width:min(360px, calc(100vw - 42px));
      padding:15px 18px;
      border-radius:18px;
      background:rgba(255,255,255,.95);
      color:#374151;
      text-align:center;
      font-size:14px;
      font-weight:900;
      letter-spacing:-.05em;
      box-shadow:0 18px 50px rgba(0,0,0,.24);
      opacity:0;
      transition:opacity .25s ease;
    }
    .tutorial-start.show{
      opacity:1;
    }
    .tutorial-skip{
      position:absolute;
      right:18px;
      top:calc(18px + env(safe-area-inset-top));
      width:42px;
      height:42px;
      border-radius:999px;
      background:rgba(255,255,255,.18);
      color:white;
      border:1px solid rgba(255,255,255,.22);
      font-size:24px;
      line-height:1;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      opacity:.94;
    }
    .tutorial-highlight-target{
      position:relative;
      z-index:9999;
    }

    @media(max-width:520px){
      .page{padding:30px 18px 48px}
      .hero{padding-top:46px}
      .card{margin-top:72px}
      .input-card{grid-template-columns:1fr 52px 52px}
      .upload-box,.refresh,.play-preview{min-height:92px}
      .title-row h1{font-size:27px}
      .tutorial-note{
        width:min(330px, calc(100vw - 36px));
        font-size:20px;
        line-height:1.48;
      }
      .tutorial-note.green{
        width:min(390px, calc(100vw - 30px));
        font-size:23px;
        line-height:1.42;
      }
    }
    @media(max-width:380px){
      .brand-ko{font-size:55px}
      .subtitle{font-size:22px}
      .free{min-width:66px;height:42px;font-size:23px}
      .title-row h1{font-size:24px}
      .card{margin-top:64px}
      .input-card{grid-template-columns:1fr 46px 46px}
      .upload-text{font-size:17px}
    }
  </style>
</head>
<body>
  <main class="page">
    <button id="tutorialReplayBtn" class="tutorial-replay-btn" type="button">튜토리얼</button>
    <section class="hero">
      <div class="brand-en">MASLOW</div>
      <div class="brand-ko">매슬로우</div>
      <div class="subtitle">IT 서비스</div>
      <div class="title-row">
        <span class="free">Free</span>
        <h1>음성 텍스트 변환</h1>
      </div>
    </section>

    <section class="card input-card">
      <button class="upload-box" type="button" id="uploadBtn">
        <span class="upload-icon">⌕</span>
        <span class="upload-text">음성 파일을 선택하세요</span>
      </button>
      <input id="fileInput" class="hidden-input" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.flac,.ogg,.webm" />
      <button class="refresh" type="button" id="resetBtn" aria-label="새로고침">↻</button>
      <button class="play-preview" type="button" id="playBtn" aria-label="선택한 음성 듣기" disabled>▶</button>

      <div id="fileName" class="file-name">선택된 파일이 없습니다.</div>

      <div class="divider"><span>또는 바로 녹음</span></div>

      <div class="record-panel">
        <div id="recDot" class="rec-dot"></div>
        <div>
          <div id="recMain" class="rec-main">녹음 대기</div>
          <div class="rec-sub">휴대폰이나 PC 마이크로 바로 녹음할 수 있습니다.</div>
        </div>
      </div>
      <button class="record-play-preview" type="button" id="recordPlayBtn" aria-label="녹음한 음성 듣기" disabled>▶</button>

      <div class="actions">
        <button id="recordBtn" class="small-btn dark" type="button">녹음 시작</button>
        <button id="saveRecordingBtn" class="small-btn save-recording" type="button" disabled>녹음저장</button>
        <button id="clearBtn" class="small-btn ghost" type="button">초기화</button>
      </div>

      <audio id="audioPlayer" class="audio" controls></audio>

      <button id="submitBtn" class="submit" type="button" disabled>텍스트 변환</button>
    </section>

    <section class="result-card">
      <div id="emptyBox" class="empty">음성 파일을 올리거나 녹음하면 텍스트로 변환할 수 있습니다.</div>

      <div id="resultBody" class="result-body">
        <div class="result-head">
          <strong>추출 결과</strong>
          <span>실제 들리는 발화 기준으로 수정하세요.</span>
        </div>
        <textarea id="resultText" class="result-text"></textarea>
        <div class="result-actions">
          <button id="copyBtn" type="button">전체 복사</button>
          <button id="txtBtn" type="button">텍스트 저장</button>
        </div>
        <div id="status" class="status">변환이 완료되었습니다.</div>
      </div>
    </section>
  </main>
  <div id="toast" class="toast"></div>
  <div id="tutorialOverlay" class="tutorial-overlay" aria-hidden="true">
    <div class="tutorial-stage">
      <div id="tutorialRing1" class="tutorial-ring"></div>
      <div id="tutorialRing2" class="tutorial-ring second"></div>
      <div id="tutorialNote" class="tutorial-note"></div>
      <div id="tutorialStart" class="tutorial-start">화면을 터치하면 시작합니다</div>
      <button id="tutorialSkip" class="tutorial-skip" type="button" aria-label="튜토리얼 닫기">×</button>
    </div>
  </div>

  <script>
    const STT_API_URL = "https://stt-api.sf-farm.store/api/stt";

    const uploadBtn = document.getElementById("uploadBtn");
    const fileInput = document.getElementById("fileInput");
    const resetBtn = document.getElementById("resetBtn");
    const playBtn = document.getElementById("playBtn");
    const clearBtn = document.getElementById("clearBtn");
    const fileName = document.getElementById("fileName");
    const recordBtn = document.getElementById("recordBtn");
    const recordPlayBtn = document.getElementById("recordPlayBtn");
    const recDot = document.getElementById("recDot");
    const recMain = document.getElementById("recMain");
    const audioPlayer = document.getElementById("audioPlayer");
    const submitBtn = document.getElementById("submitBtn");
    const saveRecordingBtn = document.getElementById("saveRecordingBtn");
    const emptyBox = document.getElementById("emptyBox");
    const resultBody = document.getElementById("resultBody");
    const resultText = document.getElementById("resultText");
    const statusBox = document.getElementById("status");
    const copyBtn = document.getElementById("copyBtn");
    const txtBtn = document.getElementById("txtBtn");
    const toast = document.getElementById("toast");
    const tutorialOverlay = document.getElementById("tutorialOverlay");
    const tutorialRing1 = document.getElementById("tutorialRing1");
    const tutorialRing2 = document.getElementById("tutorialRing2");
    const tutorialNote = document.getElementById("tutorialNote");
    const tutorialStart = document.getElementById("tutorialStart");
    const tutorialSkip = document.getElementById("tutorialSkip");
    const tutorialReplayBtn = document.getElementById("tutorialReplayBtn");

    const ALLOWED_AUDIO_EXTS = [".mp3", ".wav", ".m4a", ".aac", ".flac", ".ogg", ".webm"];

    let toastTimer = null;
    const TUTORIAL_STORAGE_KEY = "maslowSttTutorialSeen";

    function showToast(message){
      toast.textContent = message;
      toast.classList.add("show");

      if(toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 3600);
    }


    function wait(ms){
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function placeRing(ring, target, padX = 14, padY = 12){
      const rect = target.getBoundingClientRect();
      ring.style.left = (rect.left - padX) + "px";
      ring.style.top = (rect.top - padY) + "px";
      ring.style.width = (rect.width + padX * 2) + "px";
      ring.style.height = (rect.height + padY * 2) + "px";
    }

    function placeTutorialNoteNextTo(target, preferred = "right"){
      const rect = target.getBoundingClientRect();
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const noteWidth = Math.min(360, vw - 48);
      const gap = 16;

      let left;
      if(preferred === "right" && rect.right + gap + noteWidth <= vw - 18){
        left = rect.right + gap;
      }else if(rect.left - gap - noteWidth >= 18){
        left = rect.left - gap - noteWidth;
      }else{
        left = Math.max(20, Math.min(vw - noteWidth - 20, rect.left));
      }

      let top = rect.top + rect.height + 14;

      if(top + 100 > vh - 26){
        top = Math.max(24, rect.top - 86);
      }

      tutorialNote.style.left = left + "px";
      tutorialNote.style.top = top + "px";
      tutorialNote.style.width = noteWidth + "px";
    }

    function placeTutorialNoteCenter(){
      const vw = window.innerWidth;
      tutorialNote.style.left = "50%";
      tutorialNote.style.top = "50%";
      tutorialNote.style.width = Math.min(430, vw - 42) + "px";
      tutorialNote.style.transform = "translate(-50%, -50%) scale(.98)";
    }

    function placeTutorialNoteBelow(target){
      const rect = target.getBoundingClientRect();
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const noteWidth = Math.min(430, vw - 40);

      let left = rect.left + rect.width / 2 - noteWidth / 2;
      left = Math.max(20, Math.min(vw - noteWidth - 20, left));

      let top = rect.bottom + 18;
      if(top + 125 > vh - 24){
        top = Math.max(24, rect.top - 118);
      }

      tutorialNote.style.left = left + "px";
      tutorialNote.style.top = top + "px";
      tutorialNote.style.width = noteWidth + "px";
      tutorialNote.style.transform = "translateY(8px)";
    }

    function easeInOutCubic(t){
      return t < 0.5
        ? 4 * t * t * t
        : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function animateTutorialScrollTo(targetY, duration = 900){
      return new Promise(resolve => {
        const startY = tutorialLockScrollY;
        const distance = targetY - startY;
        const startTime = performance.now();

        function step(now){
          const elapsed = now - startTime;
          const progress = Math.min(1, elapsed / duration);
          const eased = easeInOutCubic(progress);

          tutorialLockScrollY = startY + distance * eased;
          document.body.style.top = "-" + tutorialLockScrollY + "px";

          if(progress < 1){
            requestAnimationFrame(step);
          }else{
            tutorialLockScrollY = targetY;
            document.body.style.top = "-" + tutorialLockScrollY + "px";
            resolve();
          }
        }

        requestAnimationFrame(step);
      });
    }

    async function scrollForTutorialTarget(target){
      const rect = target.getBoundingClientRect();
      const vh = window.innerHeight || document.documentElement.clientHeight;

      if(rect.top < 90 || rect.bottom > vh - 120){
        const absoluteTop = rect.top + tutorialLockScrollY;
        const targetScrollY = Math.max(0, absoluteTop - (vh / 2) + (rect.height / 2));

        await animateTutorialScrollTo(targetScrollY, 1050);
        await wait(180);
      }
    }

    async function scrollForSubmitTutorial(target){
      const rect = target.getBoundingClientRect();
      const vh = window.innerHeight || document.documentElement.clientHeight;
      const absoluteTop = rect.top + tutorialLockScrollY;

      /* 텍스트 변환 버튼이 화면 중간보다 살짝 위에 오도록 올림 */
      const targetScrollY = Math.max(0, absoluteTop - (vh * 0.36));

      await animateTutorialScrollTo(targetScrollY, 1050);
      await wait(180);
    }

    function isAllowedAudioFile(file){
      if(!file) return false;

      const name = (file.name || "").toLowerCase();
      const dotIndex = name.lastIndexOf(".");
      const ext = dotIndex >= 0 ? name.slice(dotIndex) : "";

      if(file.type && file.type.startsWith("audio/")) return true;
      return ALLOWED_AUDIO_EXTS.includes(ext);
    }

    function writeString(view, offset, string){
      for(let i = 0; i < string.length; i++){
        view.setUint8(offset + i, string.charCodeAt(i));
      }
    }

    function audioBufferToWavBlob(buffer){
      const numChannels = buffer.numberOfChannels;
      const sampleRate = buffer.sampleRate;
      const bytesPerSample = 2;
      const blockAlign = numChannels * bytesPerSample;
      const length = buffer.length * blockAlign;
      const arrayBuffer = new ArrayBuffer(44 + length);
      const view = new DataView(arrayBuffer);

      writeString(view, 0, "RIFF");
      view.setUint32(4, 36 + length, true);
      writeString(view, 8, "WAVE");
      writeString(view, 12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * blockAlign, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, 16, true);
      writeString(view, 36, "data");
      view.setUint32(40, length, true);

      let offset = 44;
      const channels = [];
      for(let ch = 0; ch < numChannels; ch++){
        channels.push(buffer.getChannelData(ch));
      }

      for(let i = 0; i < buffer.length; i++){
        for(let ch = 0; ch < numChannels; ch++){
          let sample = Math.max(-1, Math.min(1, channels[ch][i]));
          sample = sample < 0 ? sample * 0x8000 : sample * 0x7fff;
          view.setInt16(offset, sample, true);
          offset += 2;
        }
      }

      return new Blob([arrayBuffer], { type: "audio/wav" });
    }

    async function makeWavBlobFromFile(file){
      const arrayBuffer = await file.arrayBuffer();
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      const audioContext = new AudioContextClass();
      const decoded = await audioContext.decodeAudioData(arrayBuffer.slice(0));
      const wavBlob = audioBufferToWavBlob(decoded);

      if(audioContext.close) await audioContext.close();

      return wavBlob;
    }

    function buildWavFileName(){
      const now = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      const stamp =
        now.getFullYear() +
        pad(now.getMonth() + 1) +
        pad(now.getDate()) +
        "_" +
        pad(now.getHours()) +
        pad(now.getMinutes()) +
        pad(now.getSeconds());

      return "maslow_recording_" + stamp + ".wav";
    }

    function isInAppBrowser(){
      const ua = (navigator.userAgent || "").toLowerCase();
      const patterns = [
        "kakaotalk",

        "fban",
        "line/",
        "naver(inapp",
        "wv",
        "; wv",
        "daumapps",
        "snapchat",
        "micromessenger",
        "webview"
      ];
      return patterns.some(v => ua.includes(v));
    }

    function formatTime(sec){

      const s = String(sec % 60).padStart(2, "0");
      return m + ":" + s;
    }

    function formatParagraphs(text){
      if(!text) return "";

      const normalized = String(text)
        .replace(/\s+/g, " ")
        .replace(/([.!?。！？]|(?:습니다|니다|어요|예요|에요|세요|까요|죠|다|요))\s+/g, "$1\n")
        .trim();

      const lines = normalized
        .split(/\n+/)
        .map(v => v.trim())
        .filter(Boolean);

      if(lines.length <= 2) return lines.join("\n\n");

      const paragraphs = [];
      for(let i = 0; i < lines.length; i += 2){
        paragraphs.push(lines.slice(i, i + 2).join(" "));
      }

      return paragraphs.join("\n\n");
    }

    async function startRecording(){
      try{
        chunks = [];
        seconds = 0;

        if(audioUrl){
          URL.revokeObjectURL(audioUrl);
          audioUrl = "";
        }

        activeStream = await navigator.mediaDevices.getUserMedia({ audio:true });

        let mimeType = "";
        if(typeof MediaRecorder !== "undefined"){
          if(MediaRecorder.isTypeSupported("audio/webm")) mimeType = "audio/webm";
          else if(MediaRecorder.isTypeSupported("audio/mp4")) mimeType = "audio/mp4";
        }

        mediaRecorder = mimeType
          ? new MediaRecorder(activeStream, { mimeType })
          : new MediaRecorder(activeStream);

        mediaRecorder.ondataavailable = (event) => {
          if(event.data && event.data.size > 0) chunks.push(event.data);
        };

        mediaRecorder.onstop = () => {
          stopTimer();

          const blobType = mediaRecorder.mimeType || "audio/webm";
          const ext = blobType.includes("mp4") ? "m4a" : "webm";
          const blob = new Blob(chunks, { type: blobType });
          const file = new File([blob], "maslow_recording_" + Date.now() + "." + ext, { type: blobType });

          audioUrl = URL.createObjectURL(blob);
          audioPlayer.src = audioUrl;
          audioPlayer.style.display = "none";

          fileName.textContent = "녹음 파일이 준비되었습니다.";
          recDot.classList.remove("on");
          recMain.textContent = "녹음 완료 " + formatTime(seconds);
          recordBtn.textContent = "다시 녹음";
          recordBtn.className = "small-btn dark";
          recording = false;

          setReady(file, "recording");
          setEmpty("녹음이 준비되었습니다. ▶ 버튼으로 들어본 뒤 텍스트 변환을 눌러주세요.");
          stopStream();
        };

        mediaRecorder.start();
        recordPlayBtn.disabled = true;
        recordPlayBtn.textContent = "▶";
        recording = true;
        recDot.classList.add("on");
        recMain.textContent = "녹음 중 00:00";
        recordBtn.textContent = "녹음 정지";
        recordBtn.className = "small-btn danger";
        setEmpty("녹음 중입니다.");

        timer = setInterval(() => {
          seconds += 1;
          recMain.textContent = "녹음 중 " + formatTime(seconds);
        }, 1000);
      }catch(err){
        setEmpty("마이크 권한이 필요합니다. 브라우저 권한을 확인해 주세요.");
        recording = false;
        stopTimer();
        stopStream();
      }
    }

    function stopRecording(){
      if(mediaRecorder && mediaRecorder.state !== "inactive"){
        mediaRecorder.stop();
      }
      stopTimer();
    }

      try{
        await navigator.clipboard.writeText(text);
        statusBox.textContent = "텍스트가 클립보드에 저장되었습니다.";
        showToast("텍스트가 클립보드에 저장되었습니다.");
      }catch(err){
        statusBox.textContent = "클립보드 저장에 실패했습니다.";
        showToast("클립보드 저장에 실패했습니다. 직접 선택해서 복사해 주세요.");
      }
    });
  </script>
</body>
