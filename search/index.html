<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet" />
  <meta name="theme-color" content="#eef5ff" />
  <title>매물추적 | 매슬로우</title>
  <style>
    *{box-sizing:border-box}
    :root{--bg:#eef5ff;--card:#fff;--line:#dbeafe;--text:#111827;--muted:#6b7280;--blue:#2563eb;--blue2:#60a5fa;--green:#03c75a;--red:#dc2626;--shadow:0 18px 44px rgba(37,99,235,.1)}
    body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    button,input,select{font:inherit}
    button{cursor:pointer}
    .page{min-height:100vh}
    .main{padding:34px 20px 64px}
    .wrap{max-width:980px;margin:0 auto}
    .hero{margin-bottom:22px;text-align:center}
    .brand{font-size:13px;font-weight:950;letter-spacing:.12em;color:var(--blue);margin-bottom:8px}
    h1{margin:0;font-size:34px;letter-spacing:-.055em;line-height:1.08}
    .desc{margin:10px auto 0;color:#4b5563;font-size:15px;line-height:1.55;max-width:620px;word-break:keep-all}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow)}
    .section-title{font-size:14px;font-weight:950;color:#111827;margin:0 0 9px}
    .form-grid{display:grid;gap:16px}
    .dong-btn{width:100%;min-height:64px;border:1px solid #d1d5db;background:#fff;border-radius:16px;text-align:left;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .dong-btn strong{font-size:18px;font-weight:950;color:#111827;line-height:1.35;word-break:keep-all}
    .dong-btn span{font-size:13px;color:#6b7280;white-space:nowrap}
    .dong-placeholder{color:#9ca3af!important;font-weight:900!important}
    .dong-btn:focus,.input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.11);outline:none}
    .choice-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
    .choice{min-height:46px;border:1px solid #d1d5db;background:#fff;border-radius:14px;font-weight:950;color:#374151}
    .choice.active{border-color:var(--blue);background:#eff6ff;color:#1d4ed8;box-shadow:0 8px 18px rgba(37,99,235,.12)}
    .trade-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .input-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
    .input{height:52px;border:1px solid #d1d5db;background:#fff;border-radius:15px;padding:0 14px;outline:none;color:#111827}
    .run-btn{height:54px;border:0;border-radius:16px;background:var(--blue);color:#fff;font-weight:950;box-shadow:0 10px 22px rgba(37,99,235,.24)}
    .run-btn:disabled{opacity:.55;cursor:not-allowed}
    .refresh-btn{height:54px;border-radius:16px;font-weight:950}
    .sub-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:12px}
    .small-actions{display:flex;gap:8px;flex-wrap:wrap}
    .result-filter{display:none;margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 10px 28px rgba(37,99,235,.06);grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .result-filter.show{display:grid}
    .filter-field{display:grid;gap:6px}
    .filter-field label{font-size:12px;font-weight:950;color:#374151}
    .filter-select{height:40px;border:1px solid #d1d5db;border-radius:12px;background:#fff;padding:0 10px;font-weight:900;color:#111827;outline:none}
    .filter-select:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.11)}
    .ghost-btn{height:40px;padding:0 12px;border-radius:12px;border:1px solid #d1d5db;background:#fff;color:#111827;font-weight:900;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
    details.settings{margin-top:12px;border:1px solid #e5e7eb;border-radius:16px;background:#f8fafc;padding:0 14px}
    details.settings summary{height:44px;display:flex;align-items:center;font-weight:950;color:#374151;cursor:pointer}
    .settings-body{display:grid;gap:10px;padding:0 0 14px}
    .hint{font-size:13px;color:var(--muted);line-height:1.45;word-break:keep-all}
    .status{min-height:22px;font-size:14px;font-weight:950;color:#374151;margin:14px 2px}
    .status.err{color:var(--red)}
    .status.ok{color:#0f766e}
    .progress{display:none;margin:12px 0;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 10px 28px rgba(37,99,235,.08)}
    .progress.show{display:block}
    .progress-top{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:950;color:#374151;margin-bottom:10px}
    .bar{height:12px;border-radius:999px;background:#e0ecff;overflow:hidden;border:1px solid #bfdbfe}
    .bar-fill{height:100%;width:0;background:linear-gradient(90deg,var(--blue2),var(--blue));transition:width .25s ease}
    .summary{display:none;margin:12px 0;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
    .summary.show{display:grid}
    .summary-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;box-shadow:0 10px 28px rgba(37,99,235,.06)}
    .summary-label{font-size:12px;font-weight:900;color:#6b7280;margin-bottom:6px}
    .summary-value{font-size:20px;font-weight:950;color:#111827}
    .table-wrap{display:none;margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 10px 28px rgba(37,99,235,.08)}
    .table-wrap.show{display:block}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{padding:12px 10px;border-bottom:1px solid #edf2ff;text-align:left;vertical-align:middle}
    th{background:#f8fbff;color:#374151;font-size:12px;font-weight:950;white-space:nowrap}
    td{color:#111827}
    tr:last-child td{border-bottom:0}
    .addr{font-weight:950;line-height:1.45;word-break:keep-all}
    .muted{color:#6b7280;font-size:12px;font-weight:800}
    .badge{display:inline-flex;align-items:center;justify-content:center;min-height:28px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:950;white-space:nowrap;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
    .badge.gray{background:#f3f4f6;color:#374151;border-color:#e5e7eb}
    .badge.green{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
    .link-btn{height:34px;padding:0 10px;border-radius:10px;border:1px solid #d1d5db;background:#fff;color:#111827;font-weight:900;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
    .article-no-btn{border:0;background:transparent;color:#1d4ed8;font-size:13px;font-weight:950;text-decoration:underline;text-underline-offset:3px;padding:4px 0;cursor:pointer}
    .article-no-btn:hover{color:#1e40af}
    .addr-line{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
    .naver-map-btn{width:20px;height:20px;border:0;border-radius:4px;background:#0b7cff;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(37,99,235,.14);cursor:pointer;line-height:1;flex:0 0 20px;padding:0}
    .naver-map-btn svg{width:13px;height:13px;display:block}
    .naver-map-btn:hover{background:#075fd1}
    .naver-map-btn:focus{outline:none;box-shadow:0 0 0 3px rgba(37,99,235,.16)}
    .naver-guide-box{width:min(440px,100%)}
    .guide-text{font-size:15px;line-height:1.55;color:#374151;word-break:keep-all}
    .guide-article-no{display:inline-flex;margin-top:10px;padding:8px 12px;border-radius:12px;background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8;font-weight:950;font-size:18px;letter-spacing:.02em}
    .primary-btn{border:0;background:var(--blue);color:#fff;border-radius:10px;height:40px;padding:0 14px;font-weight:950}
    .empty{border:1px dashed #bfdbfe;border-radius:18px;background:rgba(255,255,255,.82);padding:22px;color:#6b7280;text-align:center;font-weight:850;margin-top:12px;word-break:keep-all}
    .modal{display:none;position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:30;padding:18px;overflow:auto}
    .modal.show{display:flex;align-items:flex-start;justify-content:center}
    .modal-box{width:min(760px,100%);background:#fff;border-radius:20px;margin-top:24px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.22)}
    .modal-head{padding:16px;border-bottom:1px solid #e5e7eb;display:grid;gap:10px}
    .modal-title{font-size:18px;font-weight:950}
    .dong-search{height:54px;border:1px solid #d1d5db;border-radius:14px;padding:0 14px;font-size:18px;outline:none}
    .dong-search:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.11)}
    .quick-row{display:flex;gap:8px;flex-wrap:wrap}
    .quick{border:1px solid #d1d5db;background:#fff;border-radius:999px;height:34px;padding:0 11px;font-weight:900;color:#374151}
    .dong-list{max-height:58vh;overflow:auto;padding:8px}
    .dong-item{width:100%;border:0;background:#fff;text-align:left;padding:13px 12px;border-radius:12px;cursor:pointer;display:grid;gap:4px}
    .dong-item:hover,.dong-item:focus{background:#f3f4f6;outline:none}
    .dong-name{font-weight:950;font-size:16px;line-height:1.35;word-break:keep-all}
    .dong-sub{font-size:12px;color:#6b7280;font-weight:800}
    .modal-foot{padding:12px 16px;border-top:1px solid #e5e7eb;display:flex;justify-content:space-between;gap:10px;align-items:center;color:#6b7280;font-size:13px}
    .close-btn{border:1px solid #d1d5db;background:#fff;border-radius:10px;height:38px;padding:0 12px;font-weight:900}
    .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:60;background:#111827;color:#fff;border-radius:999px;padding:12px 16px;font-weight:900;box-shadow:0 14px 34px rgba(0,0,0,.25);transition:.2s ease;pointer-events:none}
    .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
    @media(max-width:860px){.main{padding:24px 14px 44px}h1{font-size:30px}.choice-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.input-row{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.table-wrap{overflow:auto}table{min-width:820px}.dong-btn{align-items:flex-start;flex-direction:column;justify-content:center}.dong-btn span{white-space:normal}.trade-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.result-filter{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="page">
    <main class="main">
      <div class="wrap">
        <div class="hero">
          <div class="brand">MASLOW INTERNAL</div>
          <h1>매물추적</h1>
          <p class="desc">지역을 선택하고 물건유형을 고르면 내부 검토용 매물 목록을 정리합니다. 최종 안내 전에는 원문과 공적장부를 확인하세요.</p>
        </div>

        <div class="panel">
          <div class="form-grid">
            <div>
              <p class="section-title">지역 선택</p>
              <button id="dongPickBtn" class="dong-btn" type="button">
                <strong id="pickedDongText" class="dong-placeholder">법정동 검색</strong>
                <span id="pickedDongCode">동 이름을 입력해 선택</span>
              </button>
            </div>

            <div>
              <p class="section-title">물건유형</p>
              <div id="typeChoices" class="choice-grid">
                <button class="choice" type="button" data-type="D02">상가</button>
                <button class="choice" type="button" data-type="E03">토지</button>
                <button class="choice" type="button" data-type="D01">사무실</button>
                <button class="choice" type="button" data-type="D03,D04,E01,Z00">건물</button>
                <button class="choice active" type="button" data-type="E02">공장/창고</button>
                <button class="choice" type="button" data-type="E04">지식산업센터</button>
              </div>
            </div>

            <div>
              <p class="section-title">거래유형</p>
              <div id="tradeChoices" class="trade-grid">
                <button class="choice active" type="button" data-trade="ALL">전체</button>
                <button class="choice" type="button" data-trade="A1">매매</button>
                <button class="choice" type="button" data-trade="B1,B2,B3">임대</button>
              </div>
            </div>

            <div class="input-row">
              <button id="runBtn" class="run-btn" type="button">조회</button>
              <button id="refreshStatusBtn" class="ghost-btn refresh-btn" type="button">결과 새로고침</button>
            </div>
          </div>
        </div>

        <div id="status" class="status"></div>

        <div id="progress" class="progress">
          <div class="progress-top">
            <span id="progressStage">준비 중</span>
            <span id="progressCount">0건</span>
          </div>
          <div class="bar"><div id="barFill" class="bar-fill"></div></div>
        </div>

        <div id="summary" class="summary">
          <div class="summary-card"><div class="summary-label">전체</div><div id="sumTotal" class="summary-value">0</div></div>
          <div class="summary-card"><div class="summary-label">주소확인</div><div id="sumPnu" class="summary-value">0</div></div>
          <div class="summary-card"><div class="summary-label">매매</div><div id="sumSale" class="summary-value">0</div></div>
          <div class="summary-card"><div class="summary-label">임대</div><div id="sumRent" class="summary-value">0</div></div>
        </div>

        <div class="sub-actions" id="resultActions" style="display:none">
          <div class="hint">표의 주소는 내부 검토용입니다.</div>
          <div class="small-actions">
            <button id="copyTableBtn" class="ghost-btn" type="button">표 복사</button>
            <button id="csvBtn" class="ghost-btn" type="button">CSV 저장</button>
          </div>
        </div>

        <div id="resultFilters" class="result-filter">
          <div class="filter-field">
            <label for="filterTrade">거래</label>
            <select id="filterTrade" class="filter-select">
              <option value="ALL">전체</option>
              <option value="SALE">매매</option>
              <option value="RENT">임대</option>
            </select>
          </div>
          <div class="filter-field">
            <label for="priceSort">가격</label>
            <select id="priceSort" class="filter-select">
              <option value="NONE">기본순</option>
              <option value="DESC">높은순</option>
              <option value="ASC">낮은순</option>
            </select>
          </div>
        </div>

        <div id="tableWrap" class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>상태</th>
                <th>주소</th>
                <th>거래</th>
                <th>가격</th>
                <th>유형</th>
                <th>매물번호</th>
              </tr>
            </thead>
            <tbody id="resultBody"></tbody>
          </table>
        </div>

        <div id="empty" class="empty">지역을 선택하면 조회를 시작할 수 있습니다.</div>
      </div>
    </main>
  </div>

  <div id="dongModal" class="modal" aria-hidden="true">
    <div class="modal-box" role="dialog" aria-modal="true" aria-label="법정동 검색">
      <div class="modal-head">
        <div class="modal-title">법정동 검색</div>
        <input id="dongSearchInput" class="dong-search" type="search" placeholder="예: 오식도동, 군산 오식도, 5213014700" autocomplete="off" />
        <div class="quick-row">
          <button class="quick" type="button" data-q="오식도동">오식도동</button>
          <button class="quick" type="button" data-q="소룡동">소룡동</button>
          <button class="quick" type="button" data-q="익산 팔봉동">익산 팔봉동</button>
          <button class="quick" type="button" data-q="전주 팔복동">전주 팔복동</button>
        </div>
      </div>
      <div id="dongList" class="dong-list"></div>
      <div class="modal-foot">
        <div id="dongCountText">검색어를 입력하세요.</div>
        <button id="dongCloseBtn" class="close-btn" type="button">닫기</button>
      </div>
    </div>
  </div>

  <div id="naverGuideModal" class="modal" aria-hidden="true">
    <div class="modal-box naver-guide-box" role="dialog" aria-modal="true" aria-label="네이버부동산 이동 안내">
      <div class="modal-head">
        <div class="modal-title">매물번호가 복사되었습니다.</div>
        <div class="guide-text">
          네이버부동산 검색창에 붙여넣으면 해당 매물 상세를 확인할 수 있습니다.
          <div id="copiedArticleNo" class="guide-article-no"></div>
        </div>
      </div>
      <div class="modal-foot">
        <button id="naverGuideCloseBtn" class="close-btn" type="button">닫기</button>
        <button id="naverGuideGoBtn" class="primary-btn" type="button">GO 네이버부동산</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/search/bjdong-codes.js" onerror="document.write('<script src=&quot;./bjdong-codes.js&quot;><\/script>')"></script>
  <script>
    var picked = null;
    var currentJobId = '';
    var pollTimer = null;
    var lastItems = [];
    var filteredItems = [];
    var selectedType = 'E02';
    var selectedTrade = 'ALL';

    var els = {
      dongPickBtn: document.getElementById('dongPickBtn'),
      pickedDongText: document.getElementById('pickedDongText'),
      pickedDongCode: document.getElementById('pickedDongCode'),
      typeChoices: document.getElementById('typeChoices'),
      tradeChoices: document.getElementById('tradeChoices'),
      runBtn: document.getElementById('runBtn'),
      refreshStatusBtn: document.getElementById('refreshStatusBtn'),
      status: document.getElementById('status'),
      progress: document.getElementById('progress'),
      progressStage: document.getElementById('progressStage'),
      progressCount: document.getElementById('progressCount'),
      barFill: document.getElementById('barFill'),
      summary: document.getElementById('summary'),
      sumTotal: document.getElementById('sumTotal'),
      sumPnu: document.getElementById('sumPnu'),
      sumSale: document.getElementById('sumSale'),
      sumRent: document.getElementById('sumRent'),
      resultActions: document.getElementById('resultActions'),
      resultFilters: document.getElementById('resultFilters'),
      filterTrade: document.getElementById('filterTrade'),
      priceSort: document.getElementById('priceSort'),
      copyTableBtn: document.getElementById('copyTableBtn'),
      csvBtn: document.getElementById('csvBtn'),
      tableWrap: document.getElementById('tableWrap'),
      resultBody: document.getElementById('resultBody'),
      empty: document.getElementById('empty'),
      dongModal: document.getElementById('dongModal'),
      dongSearchInput: document.getElementById('dongSearchInput'),
      dongList: document.getElementById('dongList'),
      dongCountText: document.getElementById('dongCountText'),
      dongCloseBtn: document.getElementById('dongCloseBtn'),
      naverGuideModal: document.getElementById('naverGuideModal'),
      copiedArticleNo: document.getElementById('copiedArticleNo'),
      naverGuideCloseBtn: document.getElementById('naverGuideCloseBtn'),
      naverGuideGoBtn: document.getElementById('naverGuideGoBtn'),
      toast: document.getElementById('toast')
    };

    var TRACKER_API_BASE = 'https://tracker.sf-farm.store';
    var TRACKER_LIMIT = 100;
    var TRACKER_DURATION_SEC = 300;
    var TRACKER_PENDING_KEY = 'maslow_tracker_pending_v2';
    var TRACKER_RESULT_KEY = 'maslow_tracker_result_v2';

    function clearTrackerPending(){
      try{ localStorage.removeItem(TRACKER_PENDING_KEY); }catch(e){}
    }
    function clearTrackerResult(){
      try{ localStorage.removeItem(TRACKER_RESULT_KEY); }catch(e){}
    }
    function clearTrackerState(){
      clearTrackerPending();
      clearTrackerResult();
      currentJobId = '';
    }
    function saveTrackerPending(jobId, payload){
      try{
        localStorage.setItem(TRACKER_PENDING_KEY, JSON.stringify({
          status:'running',
          jobId: jobId || '',
          payload: payload || null,
          startedAt:new Date().toISOString()
        }));
        localStorage.removeItem(TRACKER_RESULT_KEY);
      }catch(e){}
    }
    function saveTrackerResult(data){
      try{
        localStorage.setItem(TRACKER_RESULT_KEY, JSON.stringify({
          status:'completed',
          jobId: data && data.jobId ? data.jobId : '',
          data:data,
          finishedAt:new Date().toISOString()
        }));
        if(data && data.jobId){
          localStorage.setItem(TRACKER_PENDING_KEY, JSON.stringify({
            status:'completed',
            jobId:data.jobId,
            finishedAt:new Date().toISOString()
          }));
        }else{
          localStorage.removeItem(TRACKER_PENDING_KEY);
        }
      }catch(e){}
    }
    function readTrackerPending(){
      try{ return JSON.parse(localStorage.getItem(TRACKER_PENDING_KEY) || 'null'); }catch(e){ return null; }
    }
    function readTrackerResult(){
      try{ return JSON.parse(localStorage.getItem(TRACKER_RESULT_KEY) || 'null'); }catch(e){ return null; }
    }
    function buildTrackerPayload(){
      return {
        legalDongName: picked.name,
        legalDongCode: picked.code || '',
        mode: 'manual-record',
        durationSec: TRACKER_DURATION_SEC,
        limit: TRACKER_LIMIT,
        recordRawJson: true,
        headless: false,
        autoSetup: true,
        autoRegion: true,
        autoPropertyType: true,
        propertyTypeNames: selectedTypeArray(),
        tradeTypes: selectedTradeArray()
      };

          if(!res.ok || parsed.ok === false){

          }
          return parsed;

    async function checkTrackerStatus(jobId, manual){
      jobId = String(jobId || '').trim();
      if(!jobId){
        var pending = readTrackerPending();
        jobId = pending && pending.jobId ? pending.jobId : '';
      }
      if(!jobId){
        if(manual) setStatus('확인할 조회 작업이 없습니다.', 'err');
        return null;
      }

      showTrackerRunning('조회 상태를 확인하고 있습니다.');
      try{
        var data = await fetchJson(TRACKER_API_BASE + '/api/tracker/status/' + encodeURIComponent(jobId), {
          method:'GET'
        });

        if(data.status === 'completed'){
          applyTrackerResult(data, '조회 완료');
          return data;
        }

        if(data.status === 'failed' || data.ok === false){
          clearTrackerPending();
          setProgress(null);
          setStatus(data.message || data.error || '조회 실패', 'err');
          els.empty.style.display = 'block';
          els.empty.textContent = data.message || data.error || '조회 실패';
          return data;
        }

        saveTrackerPending(jobId, data.input || ((readTrackerPending() || {}).payload || null));
        showTrackerRunning('아직 조회중입니다. 잠시 후 결과 새로고침 버튼으로 다시 확인하세요.');
        return data;
      }catch(e){
        setProgress(null);

        return null;

    function scoreDong(item, q, qCompact){
      var name = normalizeText(item.name);

      var sigungu = normalizeText(item.sigungu);
      var code = String(item.code || '');
      var compact = compactText([item.sido,item.sigungu,item.bname,item.name].join(' '));
      if(code === q) return 100;
      if(name === q) return 95;
      if(bname === q) return 90;
      if(compact === qCompact) return 88;
      if(name.indexOf(q) === 0) return 80;
      if(bname.indexOf(q) === 0) return 76;
      if(compact.indexOf(qCompact) !== -1) return 70;
      if(name.indexOf(q) !== -1) return 62;
      if(sigungu.indexOf(q) !== -1) return 50;
      if(code.indexOf(q) !== -1) return 45;
      return 0;

      if(/주소매칭|COORDINATE_ESTIMATED|matched|estimated/i.test(v)) return '<span class="badge">주소매칭</span>';
      if(/주소미확정|missing|unresolved/i.test(v)) return '<span class="badge gray">주소미확정</span>';

    function rawTypeText(item){

      var pnu = String((item && (item.pnu || (Array.isArray(item.pnus) ? item.pnus[0] : ''))) || '').trim();
      if(pnu) return true;
      if(!addr) return false;

    function isJunkItem(item){
      if(!item || typeof item !== 'object') return true;

      var status = String(statusValue(item) || '').trim();
      var pnu = String(item.pnu || (Array.isArray(item.pnus) ? item.pnus[0] : '') || '').trim();
      var addrOk = hasValidAddress(item);

      // 네이버 raw 목록에 섞여 들어오는 A01/A04 같은 거래코드 찌꺼기.
      // 실제 매물 유형이 아니라 행 자체가 깨진 항목이라 화면/카운트/복사/CSV에서 제외한다.
      var rawType = rawTypeText(item);
      var normalizedType = getTypeText(item);
      var price = String(getPriceText(item) || '').trim();
      if(/^(A\d+|B\d+)$/.test(rawType) || /^(A\d+|B\d+)$/.test(normalizedType)) return true;

      // 주소/PNU가 전혀 없는 주소미확정 행은 찌꺼기로 본다.
      if(!addrOk && !pnu) return true;
      if(/주소미확정|missing|unresolved/i.test(status) && !addrOk && !pnu) return true;

      // 가격도 없고 유형도 네이버 원본 코드처럼 깨져 있으면 제외한다.
      if((!price || price === '-') && !addrOk) return true;

    function priceNumber(item){
      var text = String(getPriceText(item) || '').replace(/,/g, '').trim();
      if(!text) return -1;
      var firstPart = text.split('/')[0];
      var total = 0;
      var eok = firstPart.match(/([0-9]+(?:\.[0-9]+)?)\s*억/);
      if(eok){
        total += Math.round(parseFloat(eok[1]) * 10000);
        var tail = firstPart.slice(eok.index + eok[0].length);
        var rest = tail.match(/([0-9]+)/);
        if(rest) total += parseInt(rest[1], 10) || 0;
        return total;

    async function runResearch(){
      if(!picked || !picked.code){ openDongModal(); return; }

      // 새 조회는 기존 진행중 job/result를 무조건 버리고 새 jobId를 받아 시작한다.
      clearTrackerState();
      resetResults();
      if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }

      var payload = buildTrackerPayload();
      els.runBtn.disabled = true;
      showTrackerRunning('새 조회 작업을 시작하고 있습니다. 기존 조회 상태는 버리고 새 job을 생성합니다.');

      try{
        var data = await fetchJson(TRACKER_API_BASE + '/api/tracker/start-manual', {
          method: 'POST',
          headers: { 'Content-Type':'application/json' },
          body: JSON.stringify(payload)
        });

        currentJobId = data.jobId || '';
        if(!currentJobId) throw new Error('jobId를 받지 못했습니다.');

        saveTrackerPending(currentJobId, payload);
        showTrackerRunning('조회중입니다. 서버에서 작업을 계속 진행합니다. 잠시 후 결과 새로고침 버튼으로 확인하세요.');
        toast('조회 작업을 시작했습니다.');
      }catch(e){
        clearTrackerState();
        setProgress(null);
        setStatus(e && e.message ? e.message : '조회 요청 실패', 'err');
      }finally{
        els.runBtn.disabled = false;
      }
    }

    function exportItems(){
      return filteredItems.length || lastItems.length ? applyResultFilters(lastItems) : [];
    }
    function toRows(items){
      var header = ['번호','유형','주소','거래','가격'];
      var rows = (items || []).map(function(item, idx){
        return [idx + 1, getTypeText(item), getAddressText(item), getTradeText(item), getPriceText(item)];
      });
      return [header].concat(rows);
    }
    function rowsToTsv(rows){ return rows.map(function(r){ return r.map(function(v){ return String(v == null ? '' : v).replace(/\t/g,' ').replace(/\n/g,' '); }).join('\t'); }).join('\n'); }
    function rowsToCsv(rows){ return rows.map(function(r){ return r.map(function(v){ v = String(v == null ? '' : v); return '"' + v.replace(/"/g,'""') + '"'; }).join(','); }).join('\r\n'); }
    function rowsToNumberedText(items){
      return (items || []).map(function(item, idx){
        return (idx + 1) + '. ' + [getTypeText(item), getAddressText(item), getTradeText(item), getPriceText(item)].filter(Boolean).join(' / ');
      }).join('\n');
    }
    async function copyTable(){
      var items = exportItems();
      if(!items.length) return;
      var text = rowsToNumberedText(items);
      try{ await navigator.clipboard.writeText(text); toast('필터된 표를 복사했습니다.'); }
      catch(e){ fallbackCopyText(text); toast('필터된 표를 복사했습니다.'); }
    }
    function downloadCsv(){
      var items = exportItems();
      if(!items.length) return;
      var csv = '\ufeff' + rowsToCsv(toRows(items));
      var blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
      var a = document.createElement('a');
      var name = '매물추적_' + (picked ? picked.name.replace(/\s+/g,'_') : 'result') + '_' + new Date().toISOString().slice(0,10) + '.csv';
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
    }


    els.dongPickBtn.addEventListener('click', openDongModal);
    els.dongCloseBtn.addEventListener('click', closeDongModal);
    els.dongModal.addEventListener('click', function(e){ if(e.target === els.dongModal) closeDongModal(); });
    els.dongSearchInput.addEventListener('input', renderDongList);
    els.dongSearchInput.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeDongModal(); });
    Array.prototype.forEach.call(document.querySelectorAll('.quick'), function(btn){
      btn.addEventListener('click', function(){ els.dongSearchInput.value = btn.getAttribute('data-q') || ''; renderDongList(); els.dongSearchInput.focus(); });
    });
    els.typeChoices.addEventListener('click', function(e){
      var btn = e.target.closest('[data-type]'); if(!btn) return;
      selectedType = btn.getAttribute('data-type'); setChoice(els.typeChoices, 'data-type', selectedType);
    });
    els.tradeChoices.addEventListener('click', function(e){
      var btn = e.target.closest('[data-trade]'); if(!btn) return;
      selectedTrade = btn.getAttribute('data-trade'); setChoice(els.tradeChoices, 'data-trade', selectedTrade);
    });
    els.runBtn.addEventListener('click', runResearch);
    els.refreshStatusBtn.addEventListener('click', function(){ checkTrackerStatus('', true); });
    els.filterTrade.addEventListener('change', renderFilteredResults);
    els.priceSort.addEventListener('change', renderFilteredResults);
    els.copyTableBtn.addEventListener('click', copyTable);
    els.csvBtn.addEventListener('click', downloadCsv);
    els.resultBody.addEventListener('click', function(e){
      var mapBtn = e.target.closest('[data-map-address]');
      if(mapBtn){
        openNaverMapAddress(mapBtn.getAttribute('data-map-address') || '');
        return;
      }
      var btn = e.target.closest('[data-article-no]');
      if(!btn) return;
      openNaverGuide(btn.getAttribute('data-article-no') || '');
    });
    els.naverGuideCloseBtn.addEventListener('click', closeNaverGuide);
    els.naverGuideModal.addEventListener('click', function(e){ if(e.target === els.naverGuideModal) closeNaverGuide(); });
    els.naverGuideGoBtn.addEventListener('click', goNaverLand);

    renderPickedDong();
    resetResults();
    restoreTrackerState();
  </script>
</body>
</html>
