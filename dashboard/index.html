<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- SEO: 관리자/작업용 페이지 검색 제외 -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="naverbot" content="noindex, nofollow, noarchive, nosnippet" />

  <title>Maslow Headquarters Dashboard</title>
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Maslow Korea" />
  <meta property="og:title" content="Maslow Headquarters Dashboard" />
  <meta property="og:description" content="Maslow Headquarters Dashboard" />
  <meta property="og:url" content="https://www.maslowkorea.site/dashboard" />
  <meta property="og:image" content="https://www.maslowkorea.site/dashboard/assets/og-maslow-headquarters-dashboard.png" />
  <meta property="og:image:secure_url" content="https://www.maslowkorea.site/dashboard/assets/og-maslow-headquarters-dashboard.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1672" />
  <meta property="og:image:height" content="941" />
  <meta property="og:image:alt" content="Maslow Headquarters Dashboard OG image" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Maslow Headquarters Dashboard" />
  <meta name="twitter:description" content="Maslow Headquarters Dashboard" />
  <meta name="twitter:image" content="https://www.maslowkorea.site/dashboard/assets/og-maslow-headquarters-dashboard.png" />
  <meta name="twitter:image:alt" content="Maslow Headquarters Dashboard OG image" />
  <style>
    :root{
      --bg:#ffffff;
      --line:#e6ebf1;
      --text:#111318;
      --muted:#67707b;
      --blue:#0f7cff;
      --shadow:0 14px 30px rgba(15,23,42,.05);
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      padding:0;
      background:#fff;
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo",sans-serif !important;
      letter-spacing:-0.02em;
    }
    a{text-decoration:none;color:inherit}
    button,input{font:inherit}
    button{border:none;background:none;cursor:pointer}
    img{display:block;max-width:100%}

    .page{min-height:100vh;background:linear-gradient(180deg,#ffffff 0%,#f9fbff 100%)}
    .shell{position:relative;width:100%;max-width:980px;margin:0 auto;padding:0 20px 48px}

    .topbar{
      position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
      min-height:76px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
      border-bottom:1px solid rgba(230,235,241,.9)
    }
    .topbar-left{
      display:flex;
      align-items:center;
      justify-content:flex-start;
      width:auto;
      min-width:120px;
      flex:0 0 auto;
    }
    .topbar-right{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      flex:1 1 auto;
      min-width:0;
    }
    .topbar-greeting{
      display:inline-flex;
      align-items:center;
      min-height:44px;
      padding:0 4px;
      font-size:15px;
      font-weight:800;
      color:#5f6873;
      letter-spacing:-0.03em;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:100%;
    }
    .brand-link{display:inline-flex;align-items:center;min-height:44px;padding:0 4px;font-size:18px;font-weight:900;color:#111}

    .brand-icons{
      display:flex;
      align-items:center;
      gap:10px;
    }
    .brand-icon-link{
      width:42px;
      height:42px;
      border-radius:14px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      background:#fff;
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      transition:transform .18s ease, box-shadow .18s ease;
      flex:0 0 42px;
    }
    .brand-icon-link:hover{
      transform:translateY(-1px);
      box-shadow:0 18px 34px rgba(15,23,42,.08);
    }
    .brand-icon-link svg{
      width:26px;
      height:26px;
      display:block;
    }
    .brand-icon-factory{
      color:#3a8fe6;
      border-color:#cfe2ff;
      background:#eef6ff;
    }
    .brand-icon-building{
      color:#b8841a;
      border-color:#ead7aa;
      background:#fff8e8;
    }
    .brand-icon-vfactory{
      border:none;
      background:transparent;
      box-shadow:none;
      padding:0;
      overflow:visible;
    }
    .brand-icon-vfactory:hover{
      box-shadow:none;
    }
    .brand-icon-vfactory img{
      width:42px;
      height:42px;
      object-fit:cover;
      border-radius:14px;
      transform:scale(1.12);
      transform-origin:center;
      flex:0 0 auto;
    }
    .brand-icon-magiccarpet{
      background:#facc15;
      border:none;
      color:#fff;
      padding:0;
      overflow:hidden;
      box-shadow:none;
    }
    .brand-icon-magiccarpet:hover{
      background:#fbbf24;
      box-shadow:none;
    }
    .brand-icon-magiccarpet img{
      width:34px;
      height:34px;
      object-fit:contain;
      display:block;
      animation:magicCarpetFlutter 1.45s ease-in-out infinite;
      transform-origin:50% 58%;
      filter:drop-shadow(0 3px 4px rgba(15,23,42,.22));
    }
    @keyframes magicCarpetFlutter{
      0%,100%{transform:translateY(0) rotate(-2deg) scale(1)}
      25%{transform:translateY(-1px) rotate(2deg) scale(1.035) skewX(-2deg)}
      50%{transform:translateY(1px) rotate(-1deg) scale(.985) skewX(2deg)}
      75%{transform:translateY(-1px) rotate(1deg) scale(1.025) skewX(-1deg)}
    }
    .brand-icon-magiccarpet-mobile{
      display:none;
    }
    .brand-icon-naverblog{
      background:#19ce60;
      border-color:#19ce60;
      color:#fff;
      font-size:24px;
      font-weight:1000;
      letter-spacing:-0.04em;
      line-height:1;
      font-family:Arial, Helvetica, sans-serif;
    }

    .brand-icon-ownerletter{
      background:#6f7f3f;
      border-color:#6f7f3f;
      color:#fff;
      font-size:24px;
      font-weight:1000;
      letter-spacing:-0.04em;
      line-height:1;
      font-family:Arial, Helvetica, sans-serif;
    }
    .brand-icon-taxcheckup{
      width:63px;
      height:42px;
      flex:0 0 63px;
      border-radius:14px;
      background:#183a8f;
      border-color:#183a8f;
      color:#fff;
      font-size:18px;
      font-weight:1000;
      letter-spacing:-0.03em;
      line-height:1;
      font-family:Arial,Helvetica,sans-serif;
    }
    .brand-icon-taxcheckup .tax-mobile-label{display:none}
    .dashboard-refresh-btn{
      padding:0;
      overflow:hidden;
    }
    .dashboard-refresh-btn img{
      width:100%;
      height:100%;
      object-fit:cover;
      border-radius:14px;
    }

    .hero-spacer{height:18px}
    .panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0 18px}
    .panel-card{
      position:relative;display:flex;flex-direction:column;justify-content:space-between;
      min-height:132px;padding:22px 22px 20px;border:1px solid var(--line);border-radius:28px;
      background:#fff;box-shadow:var(--shadow);text-align:left;transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease
    }
    .panel-card:hover{transform:translateY(-2px);box-shadow:0 18px 34px rgba(15,23,42,.08)}
    .panel-card.primary{background:linear-gradient(180deg,#f7fbff 0%,#eef6ff 100%);border-color:#cfe2ff}
    .panel-eyebrow{font-size:12px;font-weight:900;color:#7d8792;letter-spacing:.08em;text-transform:uppercase}
    .panel-title{margin-top:10px;font-size:30px;line-height:1.08;font-weight:900;color:#111318;letter-spacing:-0.05em}
    .panel-desc{margin-top:10px;font-size:14px;line-height:1.65;color:#66707a;font-weight:700}

    .panel-card.desktop-only{display:none}
    .panel-title-row{display:flex;align-items:center;gap:12px;margin-top:10px}
    .panel-title-row .panel-title{margin-top:0}
    .panel-icon-svg{width:42px;height:42px;flex:0 0 42px;display:block;filter:drop-shadow(0 5px 8px rgba(15,23,42,.10))}
    .panel-card.compact-link{min-height:132px}

    .dashboard-memo-pad{
      display:grid;
      gap:10px;
      padding:18px 18px 16px;
      border:1px solid #f0e4a8;
      border-radius:24px;
      background:#fff7b8;
      box-shadow:var(--shadow);
    }
    .dashboard-memo-desktop{display:none}
    .dashboard-memo-mobile{margin:0 0 14px}
    .dashboard-memo-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .dashboard-memo-head-right{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:8px;
      min-width:0;
    }
    .dashboard-memo-title{
      font-size:19px;
      line-height:1.2;
      font-weight:1000;
      color:#6f5a00;
      letter-spacing:-0.04em;
    }
    .dashboard-memo-state{
      min-height:18px;
      font-size:12px;
      line-height:1.35;
      font-weight:800;
      color:#9a7d00;
      letter-spacing:-0.02em;
      white-space:nowrap;
    }
    .dashboard-memo-textarea{
      width:100%;
      min-height:132px;
      resize:vertical;
      border:none;
      outline:none;
      padding:0;
      background:transparent;
      color:#5d4b00;
      font-family:inherit;
      font-size:15px;
      line-height:1.58;
      font-weight:650;
      letter-spacing:-0.02em;
    }
    .dashboard-memo-textarea::placeholder{color:rgba(93,75,0,.35)}
    .dashboard-memo-actions{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:10px;
    }
    .dashboard-memo-save{
      min-height:32px;
      padding:0 2px;
      border:none;
      background:transparent;
      color:#0f7cff;
      font-size:14px;
      font-weight:900;
      letter-spacing:-0.02em;
      display:inline-flex;
      align-items:center;
      gap:7px;
    }
    .dashboard-memo-save:disabled{opacity:.55;cursor:default}
    .dashboard-memo-spinner{
      display:none;
      width:14px;
      height:14px;
      border-radius:999px;
      border:2px solid rgba(15,124,255,.22);
      border-top-color:#0f7cff;
      animation:dashboardMemoSpin .7s linear infinite;
    }
    .dashboard-memo-pad.is-saving .dashboard-memo-spinner{display:inline-block}
    .dashboard-memo-updated{
      min-height:18px;
      font-size:12px;
      line-height:1.35;
      font-weight:800;
      color:#9a7d00;
      text-align:right;
      letter-spacing:-0.02em;
    }
    @keyframes dashboardMemoSpin{to{transform:rotate(360deg)}}

    .panel-icon-wrap{
      display:flex;
      align-items:center;
      gap:10px;
      margin-top:2px;
    }
    .panel-icon{
      width:28px;
      height:28px;
      color:#6e7883;
      flex:0 0 28px;
    }

    .search-wrap{margin:0 0 14px}
    .search-box{
      display:flex;
      align-items:center;
      gap:12px;
      width:min(230px,100%);
      min-height:60px;
      padding:0 18px;
      border:1.5px solid #d9e4ef;
      border-radius:999px;
      background:#fff;
      box-shadow:0 8px 20px rgba(15,23,42,.03);
      transition:width .24s ease, box-shadow .24s ease, border-color .24s ease;
    }
    .search-box:focus-within{
      width:min(100%, 720px);
      border-color:#bfdcff;
      box-shadow:0 12px 24px rgba(15,124,255,.08)
    }
    .search-icon{flex:0 0 auto;font-size:18px;color:#7b8794;width:auto}
    .search-input{
      flex:1 1 auto;
      width:100%;
      border:none;
      outline:none;
      background:transparent;
      color:#111318;
      font-size:17px;
      font-weight:800;
      letter-spacing:-0.03em
    }
    .search-input::placeholder{color:rgba(123,135,148,.55);font-weight:600}
    .search-input[contenteditable]{
      min-height:24px;
      display:flex;
      align-items:center;
      cursor:text;
      white-space:nowrap;
      overflow:hidden;
    }
    .search-input[contenteditable]:empty::before{
      content:attr(data-placeholder);
      color:rgba(123,135,148,.55);
      font-weight:600;
      pointer-events:none;
    }

    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 18px}
    .chip-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .filter-chip{
      min-height:36px;padding:0 14px;border-radius:999px;border:1px solid #dbe5ee;background:#fff;
      color:#5d6670;font-size:14px;font-weight:900;letter-spacing:-0.02em;transition:.18s ease
    }
    .filter-chip.active{background:#0f7cff;border-color:#0f7cff;color:#fff;box-shadow:0 10px 20px rgba(15,124,255,.16)}
    .toolbar-meta{font-size:13px;color:#7b8794;font-weight:800;letter-spacing:-0.02em}

    .group{margin:0 0 26px}
    .group-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px;padding:0 2px}
    .group-title{font-size:22px;line-height:1.2;font-weight:900;color:#202227;letter-spacing:-0.04em}
    .group-count{font-size:13px;color:#7b8794;font-weight:900}

    .card-list{display:grid;grid-template-columns:1fr;gap:12px}
    .property-card{border:1px solid var(--line);border-radius:24px;background:#fff;box-shadow:var(--shadow);overflow:hidden}
    .property-card.is-card-refreshing{position:relative}
    .property-card.is-card-refreshing::before{
      content:'';position:absolute;inset:0;z-index:4;background:rgba(255,255,255,.66);backdrop-filter:blur(1px);-webkit-backdrop-filter:blur(1px)
    }
    .property-card.is-card-refreshing::after{
      content:'수정내용 반영중';position:absolute;left:50%;top:50%;z-index:5;transform:translate(-50%,-50%);
      min-height:34px;padding:0 14px 0 38px;border-radius:999px;background:#fff;color:#0f7cff;border:1px solid #cfe2ff;
      box-shadow:0 12px 24px rgba(15,124,255,.16);font-size:12px;font-weight:900;white-space:nowrap
    }
    .property-card.is-card-refreshing .property-main::after{
      content:'';position:absolute;left:calc(50% - 42px);top:50%;z-index:6;width:14px;height:14px;margin-top:-7px;
      border-radius:50%;border:2px solid #cfe2ff;border-top-color:#0f7cff;animation:cardRefreshSpin .72s linear infinite
    }
    @keyframes cardRefreshSpin{to{transform:rotate(360deg)}}
    .property-main{
      display:grid;grid-template-columns:112px 1fr;gap:14px;padding:14px;align-items:start;cursor:default
    }
    .thumb{width:112px;height:112px;border-radius:18px;background:#edf2f7 center/cover no-repeat;overflow:hidden;flex:0 0 112px}
    .property-copy-thumb{
      cursor:pointer;
      -webkit-user-select:none;
      user-select:none;
      -webkit-touch-callout:none;
      touch-action:manipulation;
    }
    .property-edit-link{cursor:pointer}
    .property-edit-link:hover{text-decoration:underline}
    .card-content{min-width:0;display:grid;gap:8px}
    .title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .card-title{
      margin:0;font-size:24px;line-height:1.16;font-weight:900;color:#17191d;letter-spacing:-0.05em;word-break:keep-all
    }
    .status-chip{
      flex:0 0 auto;min-height:24px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:900;
      display:inline-flex;align-items:center;justify-content:center;white-space:nowrap
    }
    .status-chip.visible{background:#eef5ff;color:#0f7cff;border:1px solid #cfe2ff}
    .status-chip.hidden{background:#f3f5f8;color:#7f8792;border:1px solid #dde3ea}
    .address-map-row{display:flex;align-items:flex-start;gap:6px;min-width:0;line-height:1.55}
    .card-address{font-size:15px;line-height:1.55;color:#505862;font-weight:700;word-break:keep-all;min-width:0;flex:1 1 auto}
    .address-map-actions{display:inline-flex;flex-direction:column;align-items:center;gap:3px;flex:0 0 22px;margin-top:1px;margin-left:auto}
    .dashboard-map-btn{
      width:22px;height:22px;border:0;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;
      box-shadow:0 2px 6px rgba(15,23,42,.13);cursor:pointer;line-height:1;padding:0;vertical-align:middle;flex:0 0 22px
    }
    .dashboard-map-btn svg{width:14px;height:14px;display:block}
    .dashboard-map-btn.ddangya-map-btn{background:#f97316}
    .dashboard-map-btn.ddangya-map-btn:hover{background:#ea580c}
    .dashboard-map-btn.naver-map-btn{background:#0b7cff}
    .dashboard-map-btn.naver-map-btn:hover{background:#075fd1}
    .dashboard-map-btn:focus{outline:none;box-shadow:0 0 0 3px rgba(37,99,235,.16)}
    .card-deal-price{
      font-size:15px;
      line-height:1.5;
      font-weight:900;
      color:#ff3c3c;
      letter-spacing:-0.03em;
      word-break:keep-all;
    }
    .card-meta{font-size:13px;line-height:1.5;color:#7b8794;font-weight:800;letter-spacing:-0.02em}
    .card-meta strong{color:#4f5863;font-weight:900}

    .card-bottom{border-top:1px solid #eef2f6;padding:10px 14px 12px;display:grid;gap:10px}
    .action-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .action-left{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
    .mini-btn{
      min-height:34px;padding:0 12px;border-radius:999px;border:1px solid #dce6f1;background:#fff;
      color:#111318;font-size:13px;font-weight:900;letter-spacing:-0.02em
    }
    .mini-btn.visibility-btn{
      min-height:30px;
      padding:0 7px;
      font-size:12px;
      border-radius:999px;
      flex:0 0 auto;
    }
    .mini-btn.blue{border-color:#cfe2ff;background:#eef5ff;color:#0f7cff}
    .mini-btn.gray{border-color:#dde3ea;background:#f4f6f8;color:#6e7782}
    .mini-btn.square{border-radius:10px;padding:0 8px;min-height:34px;font-size:16px;font-weight:800;letter-spacing:-0.03em;display:inline-flex;align-items:center;justify-content:center;gap:2px;white-space:nowrap}
    .mini-btn.edit-square{border-color:#b9dcff;background:#ecf6ff;color:#3a8fe6}
    .mini-btn.memo-square{border-color:#e8dc7e;background:#fff4a8;color:#7a6500}
    .memo-btn-wrap{position:relative;display:inline-flex;align-items:center;overflow:visible;flex:0 0 auto}
    .memo-new-star{position:absolute;top:-2px;right:-7px;z-index:20;color:#1677ff;font-size:12px;line-height:1;font-weight:900;background:transparent;border-radius:0;box-shadow:none;text-shadow:0 0 2px #fff,0 0 2px #fff;pointer-events:none}
    .mini-btn.share-square{border-color:#cde8b0;background:#e9f8d7;color:#5e8d1b}
    .mini-btn.compact{min-height:30px;padding:0 10px;font-size:12px;border-radius:999px;flex:0 0 auto}
    .mini-btn.visibility-text-btn{
      min-height:34px;
      padding:0 4px;
      border:none;
      background:transparent;
      border-radius:0;
      color:#5f6873;
      font-size:16px;
      font-weight:800;
      letter-spacing:-0.03em;
      flex:0 0 auto;
      white-space:nowrap;
    }
    .mini-btn.visibility-text-btn.active-show{
      color:#0f7cff;
    }
    .mini-btn .btn-emoji,
    .mini-btn .btn-text{
      display:inline;
      line-height:1;
    }

    .memo-modal{
      position:fixed;
      inset:0;
      z-index:12160;
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:rgba(17,24,39,.22);
      backdrop-filter:blur(3px);
      -webkit-backdrop-filter:blur(3px);
    }
    .memo-modal.show{display:flex}
    .memo-modal-card{
      width:min(440px, calc(100vw - 28px));
      min-height:320px;
      padding:22px 20px 18px;
      border:1px solid #f1e3a8;
      border-radius:18px;
      background:#fff8bf;
      box-shadow:0 18px 40px rgba(15,23,42,.18);
      display:grid;
      gap:12px;
      transform:rotate(-0.4deg);
    }
    .memo-modal-head{font-size:22px;font-weight:900;color:#6f5a00}
    .memo-textarea{
      width:100%;min-height:220px;resize:vertical;border:none;outline:none;background:transparent;
      color:#5d4b00;font-size:17px;line-height:1.65;font-family:inherit;font-weight:600;
    }
    .memo-textarea::placeholder{color:rgba(93,75,0,.25)}
    .memo-modal-actions{display:flex;justify-content:flex-end;gap:16px}
    .memo-btn{min-height:32px;padding:0 4px;border:none;background:transparent;font-size:15px;font-weight:700;color:#7a6500}
    .memo-btn.primary{color:#0f7cff}

    .property-copy-modal{
      position:fixed;
      inset:0;
      z-index:12170;
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:rgba(15,23,42,.35);
      backdrop-filter:blur(4px);
      -webkit-backdrop-filter:blur(4px);
    }
    .property-copy-modal.show{display:flex}

    function getWriterMetaByCode(code){

    function getTodayDateKey(){
      const now = new Date();
      return [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2,'0'),
        String(now.getDate()).padStart(2,'0')
      ].join('-');
    }

    function getCurrentMonthKeyFromDate(dateKey){
      return text(dateKey).slice(0, 7);
    }

    function formatMonthLabel(monthKey){
      const parts = String(monthKey || '').split('-');
      if(parts.length !== 2) return '';
      return Number(parts[0]) + '.' + parts[1];
    }

    function formatDetailDate(dateKey){
      if(!dateKey) return '날짜 선택';
      const d = new Date(dateKey + 'T00:00:00');
      if(Number.isNaN(d.getTime())) return dateKey;
      const days = ['일','월','화','수','목','금','토'];
      return d.getFullYear() + '.' + (d.getMonth()+1) + '.' + d.getDate() + ' (' + days[d.getDay()] + ')';
    }

    function hasRecentThreadWithin24Hours(dateKey){
      const items = Array.isArray(calendarThreadMap && calendarThreadMap[dateKey]) ? calendarThreadMap[dateKey] : [];
      if(!items.length) return false;
      const now = Date.now();
      const cutoff = now - (24 * 60 * 60 * 1000);
      return items.some(function(item){
        const ts = parseDateValue((item && (item.updatedAt || item.createdAt)) || '');
        return !!ts && ts >= cutoff;
      });
    }


    function escapeAttr(value){
      return String(value == null ? '' : value)
        .replace(/&/g,'&amp;')
        .replace(/"/g,'&quot;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;');
    }

    function scrollCalendarElementToTopOffset(el){
      if(!el) return;
      const rect = el.getBoundingClientRect();
      const absoluteTop = rect.top + window.pageYOffset;
      const targetTop = Math.max(0, absoluteTop - (window.innerHeight * 0.15));
      try{
        window.scrollTo({ top: targetTop, behavior:'smooth' });
      }catch(e){
        window.scrollTo(0, targetTop);
      }
    }

      calendarActiveEditCard = card;

    function deleteCurrentCalendarThread(){
      const writerCode = getUnlockedWriterCode();
      const items = Array.isArray(calendarThreadMap[calendarSelectedDateKey]) ? calendarThreadMap[calendarSelectedDateKey] : [];
      if(!calendarEditingThreadItem) return;
      if(!calendarSelectedDateKey){
        alert('날짜를 먼저 선택하세요.');
        return;
      }
      if(!writerCode){
        alert('작성자 코드가 없습니다.');
        return;
      }
      const targetIndex = items.indexOf(calendarEditingThreadItem);
      if(targetIndex < 0) return;
      const targetItem = items[targetIndex];
      const serverId = getCalendarThreadServerId(targetItem);

      startCalendarInlineLoading();

      const payload = {
        action: 'deleteCalendarThread',
        rowId: serverId,
        writerCode: writerCode
      };

      fetch(CONFIG.adminListUrl, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type':'text/plain;charset=UTF-8' },
        body: JSON.stringify(payload)
      })
      .then(function(res){
        if(!res.ok) throw new Error('기록 삭제 실패: ' + res.status);
        return res.json();
      })
      .then(function(data){
        if(!data || data.ok !== true){
          throw new Error((data && data.message) || '기록 삭제 실패');
        }
        items.splice(targetIndex, 1);
        calendarThreadMap[calendarSelectedDateKey] = items;
        calendarOverviewMap = buildLocalOverviewMapForMonth(calendarCurrentMonth);
        closeCalendarInlineEditor();
        renderCalendarGrid();
        loadCalendarDateDetail(calendarSelectedDateKey);
      })
      .catch(function(err){
        console.error(err);
        alert((err && err.message) ? err.message : '기록 삭제 중 문제가 발생했습니다.');
      })
      .finally(function(){
        stopCalendarInlineLoading();
      });
    }

    function requestCalendarOverview(monthKey, preferAll){
      const payload = { action: 'getCalendarOverview' };
      if(!preferAll && monthKey){
        payload.month = monthKey;
      }

      return fetch(CONFIG.adminListUrl, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type':'text/plain;charset=UTF-8' },
        body: JSON.stringify(payload)
      })
      .then(function(res){
        if(!res.ok) throw new Error('캘린더 불러오기 실패: ' + res.status);
        return res.json();
      });
    }

    function applyCalendarOverviewData(data, monthKey, loadedAll){
      if(!data || data.ok !== true){
        throw new Error((data && data.message) || '캘린더 불러오기 실패');
      }

      calendarCurrentMonth = monthKey || calendarCurrentMonth || getCurrentMonthKeyFromDate(getTodayDateKey());
      calendarCurrentNotice = data.notice || null;
      calendarOverviewMap = {};
      calendarThreadMap = {};
      calendarOverviewLoadedAll = !!loadedAll;

      const rawThreadMap = (data && data.threadsByDate && typeof data.threadsByDate === 'object')
        ? data.threadsByDate
        : {};

      Object.keys(rawThreadMap).forEach(function(dateKey){
        calendarThreadMap[dateKey] = Array.isArray(rawThreadMap[dateKey])
          ? rawThreadMap[dateKey].slice().sort(function(a, b){
              return (parseDateValue((b && (b.updatedAt || b.createdAt)) || '') || 0) - (parseDateValue((a && (a.updatedAt || a.createdAt)) || '') || 0);
            })
          : [];
      });

      (Array.isArray(data.days) ? data.days : []).forEach(function(day){
        const dateKey = text(day.dateKey);
        const localThreads = Array.isArray(calendarThreadMap[dateKey]) ? calendarThreadMap[dateKey] : [];
        calendarOverviewMap[dateKey] = {
          shoppingCount: Number(day.shoppingCount || 0),
          factoryCount: Number(day.factoryCount || 0),
          threadCount: localThreads.length || Number(day.threadCount || 0)
        };
        if(!calendarThreadMap[dateKey]){
          calendarThreadMap[dateKey] = [];
        }
      });

      renderCalendarNotice();
      calendarMonthLabel.textContent = formatMonthLabel(calendarCurrentMonth);
    }

    function loadCalendarOverview(monthKey, preferAll){
      startCalendarInlineLoading();

      return requestCalendarOverview(monthKey, !!preferAll)
      .then(function(data){
        applyCalendarOverviewData(data, monthKey, !!preferAll);
      })
      .catch(function(err){
        if(preferAll){
          return requestCalendarOverview(monthKey, false).then(function(data){
            applyCalendarOverviewData(data, monthKey, false);
          });
        }
        throw err;
      })
      .catch(function(err){
        console.error(err);
        alert((err && err.message) ? err.message : '캘린더 데이터를 불러오지 못했습니다.');
      })
      .finally(function(){
        stopCalendarInlineLoading();
      });
    }

    function getLocalThreadItemsByDate(dateKey){
      const items = Array.isArray(calendarThreadMap[dateKey]) ? calendarThreadMap[dateKey].slice() : [];
      return items.sort(function(a,b){
        return (parseDateValue(b.createdAt) || 0) - (parseDateValue(a.createdAt) || 0);
      });
    }

    function buildLocalOverviewMapForMonth(monthKey){
      const map = {};
      const parts = monthKey.split('-');
      const year = Number(parts[0]);
      const monthIndex = Number(parts[1]) - 1;
      const lastDate = new Date(year, monthIndex + 1, 0);
      const totalDays = lastDate.getDate();

      for(let day = 1; day <= totalDays; day += 1){
        const dateKey = [year, String(monthIndex + 1).padStart(2,'0'), String(day).padStart(2,'0')].join('-');
        map[dateKey] = { shoppingCount:0, factoryCount:0, threadCount:0 };
      }

      rawItems.forEach(function(item){
        const created = parseDateValue(item && item.createdAt);
        if(!created) return;
        const d = new Date(created);
        const dateKey = [d.getFullYear(), String(d.getMonth() + 1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('-');
        if(getCurrentMonthKeyFromDate(dateKey) !== monthKey || !map[dateKey]) return;
        const teamType = detectTeamByListingNumber(item.listingNumber);
        if(teamType === 'shopping') map[dateKey].shoppingCount += 1;
        else if(teamType === 'factory') map[dateKey].factoryCount += 1;
      });

      Object.keys(calendarThreadMap).forEach(function(dateKey){
        if(getCurrentMonthKeyFromDate(dateKey) !== monthKey || !map[dateKey]) return;
        map[dateKey].threadCount = getLocalThreadItemsByDate(dateKey).length;
      });

      return map;
    }

    function renderCalendarGrid(){
      const parts = calendarCurrentMonth.split('-');
      const year = Number(parts[0]);
      const monthIndex = Number(parts[1]) - 1;
      const firstDate = new Date(year, monthIndex, 1);
      const lastDate = new Date(year, monthIndex + 1, 0);
      const firstWeekday = firstDate.getDay();
      const totalDays = lastDate.getDate();
      const todayKey = getTodayDateKey();
      let html = '';

      for(let i = 0; i < firstWeekday; i += 1){
        html += '<div class="calendar-cell is-empty" aria-hidden="true"></div>';
      }

      for(let day = 1; day <= totalDays; day += 1){
        const dateKey = [
          year,
          String(monthIndex + 1).padStart(2,'0'),
          String(day).padStart(2,'0')
        ].join('-');

        const stat = calendarOverviewMap[dateKey] || { shoppingCount:0, factoryCount:0, threadCount:0 };
        const classes = [
          'calendar-cell',
          dateKey === todayKey ? 'is-today' : '',
          dateKey === calendarSelectedDateKey ? 'is-selected' : ''
        ].filter(Boolean).join(' ');

        html += ''
          + '<button type="button" class="' + classes + '" onclick="selectCalendarDate(\'' + dateKey + '\')">'
          +   '<div class="calendar-day-number">' + day + (hasRecentThreadWithin24Hours(dateKey) ? '<span class="calendar-day-star">★</span>' : '') + '</div>'
          +   '<div class="calendar-lines">'
          +     '<div class="calendar-line' + (stat.shoppingCount ? '' : ' zero') + '">상가 ' + stat.shoppingCount + '</div>'
          +     '<div class="calendar-line' + (stat.factoryCount ? '' : ' zero') + '">공장 ' + stat.factoryCount + '</div>'
          +     '<div class="calendar-line' + (stat.threadCount ? '' : ' zero') + '">기록 ' + stat.threadCount + '</div>'
          +   '</div>'
          + '</button>';
      }

      calendarGrid.innerHTML = html;
    }

    function moveCalendarMonth(diff){
      const parts = calendarCurrentMonth.split('-');
      const base = new Date(Number(parts[0]), Number(parts[1]) - 1 + diff, 1);
      const nextMonthKey = [
        base.getFullYear(),
        String(base.getMonth() + 1).padStart(2,'0')
      ].join('-');

      calendarCurrentMonth = nextMonthKey;
      calendarOverviewMap = buildLocalOverviewMapForMonth(nextMonthKey);
      calendarMonthLabel.textContent = formatMonthLabel(nextMonthKey);
      calendarSelectedDateKey = nextMonthKey + '-01';
      renderCalendarGrid();
      loadCalendarDateDetail(calendarSelectedDateKey);
    }

    function selectCalendarDate(dateKey){
      calendarSelectedDateKey = dateKey;
      renderCalendarGrid();
      loadCalendarDateDetail(dateKey);
    }

    function getLocalCalendarPropertiesByDate(dateKey){
      return rawItems
        .filter(function(item){
          const created = parseDateValue(item && item.createdAt);
          if(!created) return false;
          const d = new Date(created);
          const itemDateKey = [
            d.getFullYear(),
            String(d.getMonth() + 1).padStart(2,'0'),
            String(d.getDate()).padStart(2,'0')
          ].join('-');
          return itemDateKey === dateKey;
        })
        .sort(function(a,b){
          return (parseDateValue(b.updatedAt || b.createdAt) || 0) - (parseDateValue(a.updatedAt || a.createdAt) || 0);
        })
        .map(function(item){
          return {
            listingNumber: text(item.listingNumber),
            title: text(item.title),
            address: text(item.address),
            dealType: text(item.dealType),
            price: text(item.price),
            teamType: detectTeamByListingNumber(item.listingNumber),
            heroUrl: text(item.heroUrl),
            createdAt: text(item.createdAt),
            writerName: text(item.lastEditor)
          };
        });
    }

    function formatThreadTime(value){
      const ts = parseDateValue(value);
      if(!ts) return '-';
      const d = new Date(ts);
      return d.getFullYear() + '.'
        + (d.getMonth()+1) + '.'
        + d.getDate() + ' '
        + String(d.getHours()).padStart(2,'0') + ':'
        + String(d.getMinutes()).padStart(2,'0');
    }

    function loadCalendarDateDetail(dateKey){
      calendarCurrentDetail = {
        dateKey: dateKey,
        properties: getLocalCalendarPropertiesByDate(dateKey),
        threads: getLocalThreadItemsByDate(dateKey)
      };
      renderCalendarDetail();
      return Promise.resolve(calendarCurrentDetail);
    }

    function renderCalendarDetail(){
      closeCalendarInlineEditor();
      const detail = calendarCurrentDetail || {};
      const properties = Array.isArray(detail.properties) ? detail.properties : [];
      const threads = Array.isArray(detail.threads) ? detail.threads : [];

      calendarDetailDate.textContent = formatDetailDate(calendarSelectedDateKey) + (hasRecentThreadWithin24Hours(calendarSelectedDateKey) ? ' ★' : '');
      calendarDetailMeta.textContent =
        '상가 ' + properties.filter(function(x){ return x.teamType === 'shopping'; }).length
        + ' · 공장 ' + properties.filter(function(x){ return x.teamType === 'factory'; }).length
        + ' · 기록 ' + threads.length;

      if(!properties.length){
        calendarPropertyList.innerHTML = '<div class="calendar-empty">등록된 매물이 없습니다.</div>';
      }else{
        calendarPropertyList.innerHTML = properties.map(function(item){
          const thumb = item.heroUrl ? "background-image:url('" + escapeAttr(item.heroUrl) + "')" : '';
          const teamLabel = item.teamType === 'shopping' ? '상가' : item.teamType === 'factory' ? '공장' : '-';
          return ''
            + '<div class="calendar-property-item">'
            +   '<div class="calendar-property-thumb" style="' + thumb + '"></div>'
            +   '<div class="calendar-property-body">'

      const writerCode = getUnlockedWriterCode();
      const isInlineEditing = !!(calendarEditingThreadItem && calendarActiveEditCard);
      const inlineTextarea = isInlineEditing ? calendarActiveEditCard.querySelector('.calendar-thread-inline-textarea') : null;
      const content = isInlineEditing ? text(inlineTextarea ? inlineTextarea.value : '') : text(calendarThreadInput.value);

      if(!calendarSelectedDateKey){
        alert('날짜를 먼저 선택하세요.');
        return;
      }
      if(!writerCode){
        alert('작성자 코드가 없습니다.');
        return;
      }
      if(!content){
        alert('내용을 입력하세요.');
        return;
      }

      if(calendarEditingThreadItem && calendarActiveEditCard){
        const textarea = calendarActiveEditCard.querySelector('.calendar-thread-inline-textarea');
        const nextContent = text(textarea ? textarea.value : '');
        if(!nextContent){
          alert('내용을 입력하세요.');
          return;

        const serverId = getCalendarThreadServerId(calendarEditingThreadItem);

        startCalendarInlineLoading();

        fetch(CONFIG.adminListUrl, {

          mode: 'cors',
          headers: { 'Content-Type':'text/plain;charset=UTF-8' },

            action: 'updateCalendarThread',
            rowId: serverId,
            writerCode: writerCode,
            content: nextContent
          })
        })
        .then(function(res){
          if(!res.ok) throw new Error('기록 수정 실패: ' + res.status);
          return res.json();
        })
        .then(function(data){
          if(!data || data.ok !== true){
            throw new Error((data && data.message) || '기록 수정 실패');
          }
          const updatedThread = data && data.thread ? data.thread : null;
          calendarEditingThreadItem.rowId =
            text(updatedThread && updatedThread.rowId) ||
            text(data && data.rowId) ||
            calendarEditingThreadItem.rowId;
          calendarEditingThreadItem.content =
            text(updatedThread && updatedThread.content) ||
            nextContent;
          calendarEditingThreadItem.updatedAt =
            text(updatedThread && updatedThread.updatedAt) ||
            new Date().toISOString();
          calendarEditingThreadItem.createdAt =
            text(updatedThread && updatedThread.createdAt) ||
            calendarEditingThreadItem.createdAt;
          calendarEditingThreadItem.writerName =
            text(updatedThread && updatedThread.writerName) ||
            calendarEditingThreadItem.writerName;
          calendarEditingThreadItem.writerEmoji =
            text(updatedThread && updatedThread.writerEmoji) ||
            calendarEditingThreadItem.writerEmoji;

        })

          console.error(err);
          alert((err && err.message) ? err.message : '기록 수정 중 문제가 발생했습니다.');
        })
        .finally(function(){
          stopCalendarInlineLoading();
        });
        return;

      startCalendarInlineLoading();

      fetch(CONFIG.adminListUrl, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type':'text/plain;charset=UTF-8' },
        body: JSON.stringify({
          action: 'saveCalendarThread',
          dateKey: calendarSelectedDateKey,
          writerCode: writerCode,
          content: content
        })
      })
      .then(function(res){
        if(!res.ok) throw new Error('기록 저장 실패: ' + res.status);
        return res.json();
      })
      .then(function(data){
        if(!data || data.ok !== true){
          throw new Error((data && data.message) || '기록 저장 실패');
        }
        const meta = getWriterMetaByCode(writerCode);
        const serverThread = data && data.thread ? data.thread : null;
        const newThread = {
          rowId:
            text(serverThread && serverThread.rowId) ||
            text(data && data.rowId) ||
            ('LOCAL_' + Date.now()),
          writerCode:
            text(serverThread && serverThread.writerCode) ||
            writerCode,
          writerName:
            text(serverThread && serverThread.writerName) ||
            meta.name,
          writerEmoji:
            text(serverThread && serverThread.writerEmoji) ||
            meta.emoji,
          content:
            text(serverThread && serverThread.content) ||
            content,
          createdAt:
            text(serverThread && serverThread.createdAt) ||
            new Date().toISOString(),
          updatedAt:
            text(serverThread && serverThread.updatedAt) ||
            new Date().toISOString()
        };
        if(!Array.isArray(calendarThreadMap[calendarSelectedDateKey])){
          calendarThreadMap[calendarSelectedDateKey] = [];

        calendarOverviewMap = buildLocalOverviewMapForMonth(calendarCurrentMonth);

        renderCalendarGrid();
        loadCalendarDateDetail(calendarSelectedDateKey);

        console.error(err);
        alert((err && err.message) ? err.message : '기록 저장 중 문제가 발생했습니다.');

    function clearSearchAutofillValue(){
      if(!searchInput) return;
      searchInput.textContent = '';
      searchInput.dataset.returnRestoredSearch = '';
      dashboardReturnSearchTextRestored = false;
      currentKeyword = '';
    }

    function hardLockSearchAutofill(){
      if(!searchInput) return;
      searchInput.setAttribute('contenteditable', 'false');
      searchInput.setAttribute('autocomplete', 'off');
      searchInput.setAttribute('autocorrect', 'off');
      searchInput.setAttribute('autocapitalize', 'off');
      searchInput.setAttribute('spellcheck', 'false');
      if(!searchInput.dataset.userTouched){
        clearSearchAutofillValue();
      }
    }

    function unlockSearchByUserAction(){
      if(!searchInput) return;
      searchInput.dataset.userTouched = '1';
      searchInput.setAttribute('contenteditable', 'true');
      window.setTimeout(function(){
        try{ searchInput.focus(); }catch(e){}
      }, 0);
    }

    if(searchInput){
      hardLockSearchAutofill();

      searchInput.addEventListener('pointerdown', unlockSearchByUserAction);
      searchInput.addEventListener('mousedown', unlockSearchByUserAction);
      searchInput.addEventListener('touchstart', unlockSearchByUserAction, { passive:true });

      searchInput.addEventListener('focus', function(){
        if(!searchInput.dataset.userTouched){
          hardLockSearchAutofill();
          try{ searchInput.blur(); }catch(e){}
        }
      });

      searchInput.addEventListener('blur', function(){
        if(!getSearchText()){
          searchInput.dataset.userTouched = '';
          hardLockSearchAutofill();
        }
      });

      searchInput.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){
          e.preventDefault();
          try{ searchInput.blur(); }catch(err){}
        }
      });

      searchInput.addEventListener('paste', function(e){
        e.preventDefault();
        const pasted = (e.clipboardData || window.clipboardData).getData('text') || '';
        document.execCommand('insertText', false, pasted.replace(/[\r\n\t]+/g, ' '));
      });

      searchInput.addEventListener('input', function(){
        searchInput.dataset.userTouched = '1';
        searchInput.dataset.returnRestoredSearch = '';
        dashboardReturnSearchTextRestored = false;
        currentKeyword = getSearchText().toLowerCase();
        visibleCount = PAGE_SIZE;
        renderDashboard();
      });

      [80, 300, 1000, 1800].forEach(function(delay){
        window.setTimeout(function(){
          if(document.activeElement !== searchInput && !searchInput.dataset.userTouched){
            hardLockSearchAutofill();
          }
        }, delay);
      });

      window.addEventListener('pageshow', function(){
        if(document.activeElement !== searchInput){
          if(dashboardReturnSearchTextRestored && searchInput.dataset.returnRestoredSearch === '1' && (getSearchText() || currentKeyword)){
            searchInput.dataset.userTouched = '1';
            searchInput.setAttribute('contenteditable', 'false');
            return;
          }
          searchInput.dataset.userTouched = '';
          searchInput.dataset.returnRestoredSearch = '';
          hardLockSearchAutofill();
        }
      });
    }

      try{

          method:'POST',
          mode:'cors',
          headers:{ 'Content-Type':'text/plain;charset=UTF-8' },
          body: JSON.stringify({ action:'getDashboardMemo' })
        });
        if(!res.ok) throw new Error('대시보드 메모 조회 실패: ' + res.status);
        const data = await res.json();
        if(!data || data.ok !== true){
          throw new Error((data && (data.message || data.error)) || '대시보드 메모 조회 실패');
        }
        dashboardMemoLoaded = true;
        dashboardMemoUpdatedAt = text(data.updatedAt);

    const MEMO_SEEN_STORAGE_KEY = 'maslow.propertyMemoSeen.v1';
    const MEMO_NEW_WINDOW_MS = 24 * 60 * 60 * 1000;

    function readMemoSeenMap(){
      try{
        const raw = localStorage.getItem(MEMO_SEEN_STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : {};
        return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
      }catch(e){
        return {};
      }
    }

    function writeMemoSeenMap(map){
      try{
        localStorage.setItem(MEMO_SEEN_STORAGE_KEY, JSON.stringify(map || {}));
      }catch(e){}
    }

    function markMemoSeen(listingNumber, memoUpdatedAt){
      const key = text(listingNumber);
      const stamp = text(memoUpdatedAt);
      if(!key || !stamp) return;
      const map = readMemoSeenMap();
      map[key] = stamp;
      writeMemoSeenMap(map);
    }

    function shouldShowMemoNewStar(item){
      if(!item) return false;
      const listingNumber = text(item.listingNumber);
      const stamp = text(item.memoUpdatedAt);
      if(!listingNumber || !stamp) return false;
      const time = Date.parse(stamp);
      if(!Number.isFinite(time)) return false;
      if(Date.now() - time > MEMO_NEW_WINDOW_MS) return false;
      const seen = readMemoSeenMap();
      return text(seen[listingNumber]) !== stamp;

    function startLoadingOverlay(){
      const overlay = document.getElementById('loadingOverlay');
      const textEl = document.getElementById('loadingTypingText');
      if(!overlay || !textEl) return;
      overlay.classList.add('show');
      overlay.setAttribute('aria-hidden','false');
      textEl.textContent = '';
      let i = 0;
      const loadingText = String(currentLoadingText || '자료를 가져오고 있어요!');
      window.clearInterval(loadingTypingTimer);
      loadingTypingTimer = window.setInterval(function(){
        i += 1;
        textEl.textContent = loadingText.slice(0, i);
        if(i >= loadingText.length){
          window.clearInterval(loadingTypingTimer);
        }
      }, 85);
      if(navigator.vibrate){
        navigator.vibrate(12);
        let vibCount = 0;
        window.clearInterval(loadingHapticTimer);
        loadingHapticTimer = window.setInterval(function(){
          vibCount += 1;
          try{ navigator.vibrate(8); }catch(e){}
          if(vibCount >= 5){ window.clearInterval(loadingHapticTimer); }
        }, 520);
      }
    }

      return fetch(CONFIG.adminListUrl, {

        mode: 'cors',

      const key = normalizeListingKey(listingNumber);

    function cssEscapeValue(value){
      const s = String(value || '');
      if(window.CSS && typeof window.CSS.escape === 'function') return window.CSS.escape(s);
      return s.replace(/\\/g, '\\\\').replace(/"/g, '\\"');
    }

    function replaceItemInRawItems(updatedItem){
      const key = text(updatedItem && updatedItem.listingNumber);
      if(!key) return false;
      let replaced = false;
      rawItems = rawItems.map(function(item){
        if(text(item && item.listingNumber) === key){
          replaced = true;
          return updatedItem;
        }
        return item;
      });
      if(!replaced){
        rawItems.push(updatedItem);
      }
      saveDashboardItemsCache();
      return replaced;
    }

    function patchSingleDashboardCard(updatedItem){
      const key = normalizeListingKey(updatedItem && updatedItem.listingNumber);
      if(!key) return;
      replaceItemInRawItems(updatedItem);
      patchDashboardCardInPlace(key);
    }

    function updateRawItemFieldsByListingNumber(listingNumber, fields){
      const key = normalizeListingKey(listingNumber);
      if(!key) return null;
      let updated = null;
      rawItems = rawItems.map(function(item){
        if(normalizeListingKey(item && item.listingNumber) === key){
          updated = Object.assign({}, item, fields || {}, { listingNumber: text(item && item.listingNumber) || key });
          return updated;
        }
        return item;
      });
      if(updated){
        saveDashboardItemsCache();
      }
      return updated;
    }

    function patchDashboardCardInPlace(listingNumber){
      const key = normalizeListingKey(listingNumber);
      if(!key) return;
      const card = findCardElementByListingNumber(key);
      const item = getItemByListingNumber(key);
      if(card && item){
        card.outerHTML = buildCard(item);
      }

    function isFullDashboardItemPayload(value){
      if(!value || typeof value !== 'object') return false;
      return !!(
        text(value.listingNumber) &&
        text(value.title) &&
        (text(value.address) || text(value.price) || text(value.createdAt) || text(value.photoUrlsJson))
      );
    }

    function patchCardFromMutationResponse(listingNumber, data, fallbackFields){
      const key = normalizeListingKey(listingNumber);
      const serverItem = data && (data.item || data.updatedItem || data.property);
      if(isFullDashboardItemPayload(serverItem)){
        patchSingleDashboardCard(normalizeItem(serverItem));
        return getItemByListingNumber(key);
      }
      const updated = updateRawItemFieldsByListingNumber(key, fallbackFields || {});
      patchDashboardCardInPlace(key);
      return updated;
    }

    function refreshReturnedEditedCardIfNeeded(){
      if(dashboardReturnedCardRefreshInFlight) return;

      const request = readDashboardSaveRequest();
      const returnState = dashboardReturnState || readDashboardReturnState();
      const targetListingNumber = normalizeListingKey((request && request.listingNumber) || (returnState && returnState.listingNumber));
      if(!targetListingNumber || !request || normalizeListingKey(request.listingNumber) !== targetListingNumber) return;

      dashboardReturnedCardRefreshInFlight = true;
      setCardRefreshing(targetListingNumber, true);
      fetchLatestPropertyListOnly()
        .then(function(data){
          const items = Array.isArray(data && data.items) ? data.items : [];
          const found = items.find(function(item){
            return text(item && item.listingNumber) === targetListingNumber;
          });
          if(found){
            patchSingleDashboardCard(normalizeItem(found));
          }else{
            setCardRefreshing(targetListingNumber, false);
          }
          clearDashboardSaveRequest();
        })
        .catch(function(err){
          console.error(err);
          setCardRefreshing(targetListingNumber, false);
        })
        .finally(function(){
          dashboardReturnedCardRefreshInFlight = false;
        });
    }

    function parseDateValue(value){
      const s = text(value);
      if(!s) return null;
      const t = new Date(s).getTime();
      return Number.isNaN(t) ? null : t;
    }

    function formatDateGroup(value){
      const ts = parseDateValue(value);
      if(!ts) return '날짜 미확인';
      const d = new Date(ts);
      const days = ['일','월','화','수','목','금','토'];
      return d.getFullYear() + '.' + (d.getMonth()+1) + '.' + d.getDate() + ' (' + days[d.getDay()] + ')';
    }

    function formatUpdatedMeta(item){
      if(!text(item.updatedAt)) return '수정 -';
      const ts = parseDateValue(item.updatedAt);
      if(!ts) return '수정 -';
      const d = new Date(ts);
      const stamp = d.getFullYear() + '.' + (d.getMonth()+1) + '.' + d.getDate() + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const editor = text(item.lastEditor);
      return '수정 ' + stamp + (editor ? ' (' + escapeHtml(editor) + ')' : '');
    }

    function formatDealPrice(item){
      var dealType = text(item.dealType);
      var price = text(item.price);
      if(dealType && price) return escapeHtml(dealType + ' / ' + price);
      if(dealType) return escapeHtml(dealType);

      if(activeFilters.deal){

        result = result.filter(function(item){ return item.status === 'visible' || item.status === 'show' || item.status === '공개'; });
      }else if(activeFilters.status === 'hidden'){
        result = result.filter(function(item){ return !(item.status === 'visible' || item.status === 'show' || item.status === '공개'); });

      if(activeFilters.sort === 'updated'){
        result = result.slice().sort(function(a,b){

        document.head.appendChild(script);
      });
      return dashboardBjdongCodesPromise;

    function normalizeDashboardBjdongText(value){
      let text = String(value || '').trim();
      text = text.replace(/\([^)]*\)/g, ' ');
      text = text.replace(/\[[^\]]*\]/g, ' ');
      text = text.replace(/,/g, ' ');
      text = text.replace(/\s+/g, ' ').trim();
      text = text.replace(/^전북\s+/, '전북특별자치도 ');
      text = text.replace(/^전라북도\s+/, '전북특별자치도 ');
      text = text.replace(/^전북특별자치도\s*전북특별자치도\s+/, '전북특별자치도 ');
      text = text.replace(/([가-힣]+시)([가-힣]+구)(\s|$)/g, '$1 $2$3');
      return text.replace(/\s+/g, ' ').trim();
    }

    function parseDashboardJibunAddress(address){
      const clean = normalizeDashboardBjdongText(address);
      const matches = [];
      const re = /(산\s*)?(\d+)(?:\s*-\s*(\d+))?/g;
      let match;
      while((match = re.exec(clean))){
        matches.push({ index: match.index, text: match[0], mountain: !!match[1], main: match[2], sub: match[3] || '0' });
      }
      if(!matches.length) return null;
      const lot = matches[matches.length - 1];
      const legalName = clean.slice(0, lot.index).replace(/(?:번지|일원|필지|외)\s*$/g, '').trim();
      if(!legalName || !lot.main) return null;
      return { legalName: legalName, mountain: lot.mountain, main: lot.main, sub: lot.sub };
    }

    function findDashboardBjdongCode(legalName){
      const codes = Array.isArray(window.BJDONG_CODES) ? window.BJDONG_CODES : [];
      const target = normalizeDashboardBjdongText(legalName);
      let found = codes.find(function(row){ return normalizeDashboardBjdongText(row && row.name) === target; });
      if(found && found.code) return String(found.code);
      found = codes
        .filter(function(row){
          const name = normalizeDashboardBjdongText(row && row.name);
          return name && (target === name || target.indexOf(name + ' ') === 0 || name.indexOf(target + ' ') === 0);
        })
        .sort(function(a,b){ return String(b.name || '').length - String(a.name || '').length; })[0];
      return found && found.code ? String(found.code) : '';
    }

    function buildDashboardPnuFromAddress(address){
      const parsed = parseDashboardJibunAddress(address);
      if(!parsed) return '';
      const code = findDashboardBjdongCode(parsed.legalName);
      if(!/^\d{10}$/.test(code)) return '';
      const main = String(parsed.main || '').padStart(4, '0');
      const sub = String(parsed.sub || '0').padStart(4, '0');
      if(!/^\d{4}$/.test(main) || !/^\d{4}$/.test(sub)) return '';
      return code + (parsed.mountain ? '2' : '1') + main + sub;
    }

        const res = await fetch(CONFIG.adminListUrl, {
          method: 'POST',
          mode: 'cors',
          headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
          body: JSON.stringify(payload)
        });
        if(!res.ok) throw new Error('매물 복사 실패: ' + res.status);

        const data = await res.json();
        if(!data || data.ok !== true){
          throw new Error((data && (data.message || data.error)) || '매물 복사 실패');
        }

        const newListingNumber = text(data.newListingNumber);
        if(!newListingNumber){
          throw new Error('새 매물번호를 받지 못했습니다.');
        }

        location.href = CONFIG.adminEditUrl + '?listingNumber=' + encodeURIComponent(newListingNumber);
      }catch(err){
        console.error(err);
        alert((err && err.message) ? err.message : '매물 복사 중 문제가 발생했습니다.');
      }finally{
        isCopyingProperty = false;
        stopLoadingOverlay();
      }
    }

    function openPropertyMemoModal(listingNumber){
      const item = getItemByListingNumber(decodeURIComponent(String(listingNumber || '')));
      if(!item){
        alert('매물을 찾지 못했습니다.');
        return;
      }
      propertyMemoEditingItem = item;
      if(shouldShowMemoNewStar(item)){
        markMemoSeen(item.listingNumber, item.memoUpdatedAt);
        patchDashboardCardInPlace(item.listingNumber);
      }
      if(propertyMemoTextarea) propertyMemoTextarea.value = text(item.memo);
      if(propertyMemoModal) propertyMemoModal.classList.add('show');
      if(!propertyMemoHistoryArmed){
        history.pushState({ propertyMemoModal: true }, '');
        propertyMemoHistoryArmed = true;
      }
      setTimeout(function(){
        try{
          propertyMemoTextarea.focus();
          propertyMemoTextarea.setSelectionRange(propertyMemoTextarea.value.length, propertyMemoTextarea.value.length);
        }catch(e){}
      }, 40);
    }

    function closePropertyMemoModal(fromPopstate){
      if(propertyMemoModal) propertyMemoModal.classList.remove('show');
      propertyMemoEditingItem = null;
      if(propertyMemoHistoryArmed){
        propertyMemoHistoryArmed = false;
        if(!fromPopstate){
          history.back();
        }
      }
    }

    async function savePropertyMemo(){
      const item = propertyMemoEditingItem;
      const writerCode = getUnlockedWriterCode();
      if(!item){
        alert('수정할 매물을 찾지 못했습니다.');
        return;
      }
      if(!writerCode){
        alert('작성자 코드가 없습니다.');
        return;
      }
      const listingNumber = text(item.listingNumber);
      const memo = text(propertyMemoTextarea ? propertyMemoTextarea.value : '');
      currentLoadingText = '메모를 저장하고 있어요!';
      startLoadingOverlay();
      try{
        const res = await fetch(CONFIG.adminListUrl, {
          method:'POST',
          mode:'cors',
          headers:{ 'Content-Type':'text/plain;charset=UTF-8' },
          body: JSON.stringify({
            action:'updatePropertyMemo',
            listingNumber: listingNumber,
            memo: memo,
            writerCode: writerCode
          })
        });
        if(!res.ok) throw new Error('메모 저장 실패: ' + res.status);
        const data = await res.json();
        if(!data || data.ok !== true){
          throw new Error((data && (data.message || data.error)) || '메모 저장 실패');
        }
        const updatedMemoAt = text(data.memoUpdatedAt) || text(item.memoUpdatedAt);
        item.memo = memo;
        item.updatedAt = text(data.updatedAt) || new Date().toISOString();
        item.memoUpdatedAt = updatedMemoAt;
        patchCardFromMutationResponse(listingNumber, data, {
          memo: memo,
          updatedAt: item.updatedAt,
          memoUpdatedAt: updatedMemoAt
        });
        closePropertyMemoModal();
      }catch(err){
        console.error(err);
        alert((err && err.message) ? err.message : '메모 저장 중 문제가 발생했습니다.');
      }finally{
        stopLoadingOverlay();
      }
    }

    async function sharePreview(listingNumber){
      const decoded = decodeURIComponent(String(listingNumber || ''));
      const item = getItemByListingNumber(decoded);
      const url = buildPreviewUrl(decoded);
      const title = text(item && item.title) || '매물 공유';
      const shareText = title + '\n' + (text(item && item.address) || '');
      try{
        if(navigator.share){
          await navigator.share({
            title: title,
            text: shareText,
            url: url
          });
          return;
        }
        if(navigator.clipboard && navigator.clipboard.writeText){
          await navigator.clipboard.writeText(url);
          alert('공유 링크를 복사했습니다. 카카오톡에 붙여넣어 주세요.');
          return;
        }
        window.prompt('공유 링크를 복사하세요.', url);
      }catch(err){
        if(err && err.name === 'AbortError') return;
        console.error(err);
        try{
          window.prompt('공유 링크를 복사하세요.', url);
        }catch(e){}
      }
    }


    function renderDashboard(){
      const filtered = applyFilter(rawItems);
      const totalCount = filtered.length;
      const visibleItems = filtered.slice(0, visibleCount);

      toolbarMeta.textContent = '전체 ' + totalCount + '건';

      if(!totalCount){
        const emptyMeta = getTeamMeta(currentTeamFilter);
        dashboardRoot.innerHTML = '<div class="empty">' + escapeHtml(emptyMeta.empty) + '</div>';
        return;
      }

      const groups = groupItems(visibleItems);
      const hasMore = totalCount > visibleCount;

      dashboardRoot.innerHTML =
        groups.map(function(group){
          return ''
            + '<section class="group">'
            +   '<div class="group-head">'
            +     '<div class="group-title">' + escapeHtml(group.title) + '</div>'
            +     '<div class="group-count">' + group.items.length + '건</div>'
            +   '</div>'
            +   '<div class="card-list">' + group.items.map(buildCard).join('') + '</div>'
            + '</section>';
        }).join('')
        + (hasMore
            ? '<div class="more-wrap"><button class="more-btn" type="button" onclick="loadMoreItems()">더보기</button></div>'
            : '');
    }

    window.loadMoreItems = function(){
      visibleCount += PAGE_SIZE;
      renderDashboard();
    };

    function unlockWithPassword(){
      const pw = String(lockInput.value || '').trim();
      const matched = PASSWORD_MAP[pw];
      if(!matched){
        lockError.textContent = '비밀번호가 올바르지 않습니다.';
        return;
      }
      unlockedUserName = matched;
      localStorage.setItem(CONFIG.authStorageKey, matched);
      updateGreeting();
      lockOverlay.style.display = 'none';
      loadDashboardMemo();
      fetchAdminItems();
    }

    lockBtn.addEventListener('click', unlockWithPassword);
    lockInput.addEventListener('keydown', function(e){
      if(e.key === 'Enter') unlockWithPassword();
    });

    if(localStorage.getItem(CONFIG.authStorageKey)){
      unlockedUserName = localStorage.getItem(CONFIG.authStorageKey) || '';
      updateGreeting();
      lockOverlay.style.display = 'none';
      const restoredDashboard = restoreDashboardFromReturnState();
      loadDashboardMemo();
      if(restoredDashboard){
        refreshReturnedEditedCardIfNeeded();
      }else{
        fetchAdminItems();
      }
    }

    window.addEventListener('pageshow', function(){
      checkReturnedEditedCardOnPageshow();
    });

    window.openPreview = function(listingNumber){
      startLoadingOverlay();
      const url = buildPreviewUrl(listingNumber);
      window.open(url, '_blank');
      window.setTimeout(stopLoadingOverlay, 900);
    };

    window.editItem = function(listingNumber){
      const decodedListingNumber = normalizeListingKey(listingNumber);
      saveDashboardReturnState(decodedListingNumber);
      location.href = CONFIG.adminEditUrl + '?listingNumber=' + encodeURIComponent(decodedListingNumber);
    };
    window.safeEditItemPointerDown = safeEditItemPointerDown;
    window.safeEditItemClick = safeEditItemClick;

    window.markVisible = function(listingNumber){
      setPropertyStatus(listingNumber, 'visible');
    };

    window.markHidden = function(listingNumber){
      setPropertyStatus(listingNumber, 'hidden');
    };

    window.togglePropertyStatus = function(listingNumber, nextStatus){
      setPropertyStatus(listingNumber, nextStatus);
    };
    window.startPropertyCopyLongPress = startPropertyCopyLongPress;
    window.clearPropertyCopyLongPress = clearPropertyCopyLongPress;
    window.handlePropertyThumbPointerUp = handlePropertyThumbPointerUp;
    window.handlePropertyThumbClick = handlePropertyThumbClick;
    window.openPropertyCopyConfirmModal = openPropertyCopyConfirmModal;
    window.closePropertyCopyConfirmModal = closePropertyCopyConfirmModal;
    window.confirmPropertyCopyFromModal = confirmPropertyCopyFromModal;
    window.openPropertyInvisibleConfirmModal = openPropertyInvisibleConfirmModal;
    window.closePropertyInvisibleConfirmModal = closePropertyInvisibleConfirmModal;
    window.confirmPropertyInvisibleFromModal = confirmPropertyInvisibleFromModal;
    window.copyPropertyItem = copyPropertyItem;
    window.openPropertyMemoModal = openPropertyMemoModal;
    window.closePropertyMemoModal = closePropertyMemoModal;
    window.savePropertyMemo = savePropertyMemo;
    window.openDashboardDdangyaMap = openDashboardDdangyaMap;
    window.openDashboardNaverMap = openDashboardNaverMap;
    window.sharePreview = sharePreview;

    document.getElementById('channelModal').addEventListener('click', function(e){
      if(e.target === this) closeChannelModal();
    });

    window.addEventListener('keydown', function(e){
      if(e.key === 'Escape'){
        if(isCalendarModalOpen()){
          closeCalendarModal();
          return;
        }
        closeChannelModal();
        closePropertyCopyConfirmModal();
        closePropertyMemoModal();
      }
    });

    window.addEventListener('popstate', function(){
      if(isPropertyMemoModalOpen()){
        closePropertyMemoModal(true);
        return;
      }
      if(isChannelModalOpen()){
        closeChannelModal(true);
        return;
      }
      if(isCalendarModalOpen()){
        closeCalendarModal(true);
      }
    });

    updateGreeting();
    updateTeamTogglePanel();
  </script>
</body>
</html>
